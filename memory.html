<!-- memory.html -->
<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#050814" />
<meta name="description" content="私人记忆档案（加密，仅站主可见）" />
<title>私人记忆档案 · 新模学习</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23bc141b'/%3E%3Cpath d='M20 12h18l10 10v30H20z' fill='%23f7e6bd'/%3E%3Cpath d='M38 12v10h10' fill='%23e3b23c'/%3E%3C/svg%3E" />
<script>
/* 统一锁定深空科技深色主题，移除浅色/深色切换。 */
document.documentElement.setAttribute('data-theme', 'dark');
</script>
<link rel="stylesheet" href="./assets/css/memory.css" />
<script defer src="./vault-data.js"></script>
<script defer src="./assets/js/crypto-gateway.js"></script>
<script defer src="./assets/js/markdown-lite.js"></script>
<script defer src="./assets/js/vendor/three.min.js"></script>
<script defer src="./assets/js/memory-files.js"></script>
<script defer src="./assets/js/memory-graph.js?v=20261127gc2"></script>
<script defer src="./assets/js/memory-graph-3d.js?v=20261127gc2"></script>
<script defer src="./assets/js/memory-graph-view.js?v=20261125e"></script>
<script defer src="./assets/js/memory-app.js"></script>
<link rel="stylesheet" href="./assets/css/memory-graph.css?v=20261125e" />
</head>
<body>

<!-- ============================ 解锁视图 ============================ -->
<div id="unlock-view" class="unlock-wrap">
  <div class="unlock-card">
    <div class="unlock-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="11" rx="2"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        <circle cx="12" cy="15.5" r="1.3" fill="currentColor" stroke="none"></circle>
      </svg>
    </div>
    <h1>私人记忆档案</h1>
    <p class="unlock-sub">内容已在本机加密 · 输入站主口令后在此设备解密查看</p>

    <div class="unlock-field">
      <label for="pmv-pass">站主口令</label>
      <input id="pmv-pass" type="password" autocomplete="off" autocapitalize="off"
             spellcheck="false" placeholder="请输入站主口令" aria-label="站主口令" />
    </div>
    <button id="pmv-unlock" type="button">解锁档案</button>
    <p id="pmv-error" class="err" role="alert" aria-live="polite"></p>

    <p class="unlock-tip">
      口令只在本标签页临时保存：刷新不用重输，关闭标签即失效。<br />
      点右上角「锁定」可立即清除。输错不会保存，可放心重试。
    </p>
  </div>
</div>

<!-- ============================ 主体视图（默认直接进入宇宙视图，零列表闪现） ============================ -->
<div id="app-view" class="pmv-app is-graph-active is-booting" hidden>
  <header class="pmv-header">
    <div class="pmv-header-inner">
      <div class="pmv-brand">
        <span class="pmv-brand-star" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="m12 2 2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 8.4l6.1-.8z"></path>
          </svg>
        </span>
        <strong>私人记忆档案</strong>
      </div>
      <div class="pmv-tools">
        <span id="pmv-meta" class="pmv-meta"></span>
        <button id="pmv-graph-btn" class="pmv-btn pmv-graph-btn" type="button" aria-label="回到宇宙图谱视图">◉ 图谱</button>
        <button id="pmv-nav-toggle" class="pmv-btn pmv-nav-toggle" type="button" aria-label="展开目录">目录</button>
        <button id="pmv-lock" class="pmv-btn" type="button" aria-label="锁定档案">锁定</button>
      </div>
    </div>
  </header>

  <!-- ===================== 宇宙 / 2D 记忆图谱主视图 ===================== -->
  <div id="pmv-graph-view" class="mg-view">
    <div class="mg-toolbar">
      <div class="mg-legend" id="mg-legend"></div>
      <div class="mg-actions">
        <div class="mg-mode" id="mg-mode" role="group" aria-label="图谱视图与目录">
          <button type="button" class="mg-mode-btn is-active" data-mode="universe" aria-pressed="true">宇宙</button>
          <button type="button" class="mg-mode-btn" data-mode="plane" aria-pressed="false">平面 2D</button>
          <button type="button" class="mg-mode-btn mg-mode-action" id="mg-dir-btn" data-action="directory" aria-expanded="false" aria-controls="pmv-dir-overlay">目录</button>
        </div>
        <span class="mg-hint">拖动旋转宇宙 · 滚轮缩放观银河全景 · 点击天体/虫洞看详情 · 双击/R 复位</span>
        <button id="mg-reset" class="pmv-btn" type="button">重置视角</button>
      </div>
    </div>

    <div class="mg-stage" id="mg-stage">
      <div class="mg-edge-vignette" id="mg-edge-vignette" aria-hidden="true"></div>
      <div class="mg-loading" id="mg-loading">正在构建宇宙视图…</div>
    </div>

    <!-- 右侧玻璃覆盖层 1：节点详情（不挤占画布宽度） -->
    <aside class="mg-detail mg-glass-overlay" id="mg-detail" role="dialog" aria-modal="false" aria-labelledby="mg-detail-title" tabindex="-1" hidden>
      <div class="mg-drawer-handle" aria-hidden="true"></div>
      <button class="mg-detail-close" id="mg-detail-close" type="button" aria-label="关闭详情">×</button>
      <div class="mg-detail-cat" id="mg-detail-cat"></div>
      <h2 id="mg-detail-title"></h2>
      <div class="mg-detail-meta" id="mg-detail-meta"></div>
      <div class="mg-detail-body" id="mg-detail-body"></div>
      <div class="mg-files">
        <div class="mg-files-head">
          <strong>节点文件</strong>
          <span class="mg-files-tip">仅存本机浏览器，不上传</span>
        </div>
        <label class="mg-upload">
          <input type="file" id="mg-file-input" multiple hidden />
          <span>＋ 添加文件</span>
        </label>
        <div class="mg-file-list" id="mg-file-list"></div>
      </div>
    </aside>
  </div>

  <!-- ===================== 右侧玻璃覆盖层 2：档案目录与同层正文阅读（初始隐藏防闪现） ===================== -->
  <div id="pmv-dir-overlay" class="pmv-shell mg-dir-overlay mg-glass-overlay is-initial-hidden" data-dir-pane="list" role="dialog" aria-modal="false" aria-labelledby="mg-dir-title" tabindex="-1" hidden>
    <div class="mg-drawer-handle" aria-hidden="true"></div>
    <div class="mg-dir-head" id="mg-dir-head">
      <button type="button" class="mg-dir-back" id="mg-dir-back" aria-label="返回目录列表" hidden>← 返回列表</button>
      <div class="mg-dir-heading">
        <strong class="mg-dir-title" id="mg-dir-title">档案目录</strong>
        <span class="mg-dir-count" id="mg-dir-count"></span>
      </div>
      <button type="button" class="mg-detail-close mg-dir-close" id="mg-dir-close" aria-label="关闭目录浮层">×</button>
    </div>

    <div class="mg-dir-scroll" id="mg-dir-scroll">
      <aside id="pmv-side" class="pmv-side">
        <input id="pmv-search" type="search" placeholder="搜索标题或内容…" aria-label="搜索档案" />
        <nav id="pmv-nav" class="pmv-nav" aria-label="档案分类导航"></nav>
      </aside>

      <main class="pmv-main" id="pmv-main-pane">
        <h1 id="pmv-doc-title"></h1>
        <div id="pmv-doc-body"></div>
      </main>

      <aside class="pmv-toc" aria-label="本页目录">
        <div class="pmv-toc-title">本页目录</div>
        <nav id="pmv-toc-list"></nav>
      </aside>
    </div>
  </div>
</div>

<div id="pmv-toast" class="toast" role="status" aria-live="polite"></div>

<!-- 全站弹入式公告（由 deploy/inject_site_notice.py 注入） -->
<script defer src="assets/js/site-notice.js"></script>
</body>
</html>
