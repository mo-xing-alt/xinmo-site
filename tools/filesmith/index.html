    <meta name="robots" content="noindex, nofollow" />

    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="FileSmith - 在浏览器本地完成文件格式转换与批量文件名转换，文件不上传服务器。"
    />
    <title>FileSmith · 本地文件工坊</title>
    <script>
      // 在首屏渲染前应用主题，避免闪屏
      (function () {
        try {
          var saved = localStorage.getItem('filesmith-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-Ptu-f1gX.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CsbZAzV9.css">

    <!-- 资源仓库返回导航（沿用站内其它工具页的样式） -->

      .repo-back{position:fixed;left:18px;bottom:18px;z-index:99999;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;background:rgba(17,26,44,.86);color:#f2f6ff;text-decoration:none;font:500 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 6px 22px rgba(0,0,0,.22);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);transition:transform .18s ease,background .18s ease}
      .repo-back:hover{transform:translateY(-2px);background:rgba(31,48,80,.94);color:#fff;text-decoration:none}
