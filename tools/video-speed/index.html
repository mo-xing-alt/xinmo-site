<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="本地视频多倍速播放器：1–100 倍速，文件不上传，全部在浏览器本地播放。" />
<title>视频多倍速播放器 · xinmo.work</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f9c7c'/%3E%3Cpath d='M24 18l24 14-24 14z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="../../assets/css/site.css" />
<script>
  try {
    var saved = localStorage.getItem('xinmo-theme');
    document.documentElement.setAttribute('data-theme', saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  } catch (e) {}
</script>
<!-- 访问控制守卫 -->
<script src="../../assets/js/auth-config.js"></script>
<script src="../../assets/js/guard.js"></script>
<style>
  .vs-wrap { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 26px 0 70px; }
  .vs-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .vs-brand { display: flex; align-items: center; gap: 10px; }
  .vs-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #0f9c7c, #4f6bed); }
  .vs-brand strong { display: block; font-size: 15px; color: var(--heading); line-height: 1.2; }
  .vs-brand small { display: block; font-size: 11px; letter-spacing: 2px; color: var(--muted); }
  .vs-back { font-size: 12.5px; color: var(--muted); border: 1px solid var(--border); padding: 7px 12px; border-radius: 999px; }
  .vs-back:hover { color: var(--accent); border-color: var(--accent); }

  .vs-drop { border: 2px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface); padding: 54px 22px; text-align: center; transition: border-color .2s, background .2s, transform .2s; }
  .vs-drop.drag { border-color: var(--teal); background: var(--teal-soft); transform: scale(1.005); }
  .vs-drop h1 { margin: 0 0 6px; font-size: 20px; color: var(--heading); }
  .vs-drop p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .vs-drop small { display: block; margin-top: 16px; color: var(--muted); font-size: 11.5px; }
  .vs-pick { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 11px; padding: 12px 20px; color: #fff; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, #0f9c7c, #2f7f6a); box-shadow: 0 8px 22px rgba(15, 156, 124, .26); }
  .vs-pick:hover { filter: brightness(1.06); }

  .vs-player { position: relative; margin-top: 4px; border-radius: var(--radius); overflow: hidden; background: #000; box-shadow: var(--shadow-lg); }
  .vs-player video { display: block; width: 100%; max-height: 62vh; background: #000; }
  .vs-ctrls { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 26px 12px 10px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.72)); }
  .vs-ctrls button { border: 0; background: rgba(255,255,255,.14); color: #fff; width: 34px; height: 34px; border-radius: 9px; cursor: pointer; display: grid; place-items: center; flex: none; }
  .vs-ctrls button:hover { background: rgba(255,255,255,.26); }
  .vs-ctrls button svg { width: 17px; height: 17px; }
  .vs-time { font-size: 11.5px; font-variant-numeric: tabular-nums; opacity: .9; flex: none; }
  .vs-seek { flex: 1; accent-color: #38d9a9; cursor: pointer; min-width: 60px; }

  .vs-panel { margin-top: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 20px 16px; }
  .vs-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .vs-big { font-size: 44px; line-height: 1; font-weight: 700; color: var(--heading); letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .vs-big em { font-style: normal; font-size: 20px; color: var(--muted); margin-left: 2px; }
  .vs-eff { font-size: 12px; color: var(--muted); text-align: right; }
  .vs-eff b { color: var(--teal); font-size: 14px; }
  .vs-badge { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 999px; background: var(--amber-soft); color: #b8730a; font-size: 10.5px; vertical-align: 1px; }
  :root[data-theme="dark"] .vs-badge { color: #ffc45c; }

  .vs-range { width: 100%; margin: 16px 0 10px; accent-color: var(--teal); cursor: pointer; }
  .vs-presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .vs-presets button { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); padding: 7px 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .vs-presets button:hover { border-color: var(--teal); color: var(--teal); }
  .vs-presets button.on { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); font-weight: 600; }

  .vs-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .vs-row label { display: inline-flex; align-items: center; gap: 6px; }
  .vs-num { width: 78px; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 13px; }
  .vs-row input[type="checkbox"] { accent-color: var(--teal); width: 15px; height: 15px; }
  .vs-tip { margin: 14px 0 0; font-size: 11.5px; line-height: 1.8; color: var(--muted); }
  .vs-tip kbd { display: inline-block; padding: 1px 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; background: var(--surface-2); font-size: 10.5px; color: var(--text); }
  .vs-meta { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); word-break: break-all; }
  [hidden] { display: none !important; }
  @media (max-width: 560px) {
    .vs-big { font-size: 34px; }
    .vs-ctrls { padding: 22px 8px 8px; gap: 6px; }
    .vs-ctrls button { width: 30px; height: 30px; }
  }
</style>
</head>
<body>
<main class="vs-wrap">
  <div class="vs-top">
    <div class="vs-brand">
      <span class="vs-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="m10 8 6 4-6 4Z" fill="currentColor" stroke="none"/></svg>
      </span>
      <span><strong>视频多倍速播放器</strong><small>1–100× · 本地播放</small></span>
    </div>
    <a class="vs-back" href="../../index.html">← 返回资源仓库</a>
  </div>

  <section class="vs-drop" id="dropzone">
    <h1>把视频拖进来</h1>
    <p>或者点下面的按钮选一个本地视频，1–100 倍速随便调。</p>
    <button class="vs-pick" id="pickBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>
      选择视频文件
    </button>
    <input id="fileInput" type="file" accept="video/*" hidden />
    <small>文件只在浏览器本地播放，不会上传到任何服务器。</small>
  </section>

  <section class="vs-player" id="player" hidden>
    <video id="video" playsinline preload="metadata"></video>
    <div class="vs-ctrls">
      <button id="playBtn" type="button" title="播放 / 暂停 (空格)">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <span class="vs-time" id="curTime">0:00</span>
      <input class="vs-seek" id="seek" type="range" min="0" max="1000" value="0" step="1" />
      <span class="vs-time" id="durTime">0:00</span>
      <button id="muteBtn" type="button" title="静音 (M)">
        <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      </button>
      <button id="fsBtn" type="button" title="全屏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
      </button>
    </div>
  </section>

  <section class="vs-panel" id="panel" hidden>
    <div class="vs-head">
      <div class="vs-big"><span id="speedVal">1</span><em>×</em></div>
      <div class="vs-eff">实际生效：<b id="effVal">1.0×</b><span class="vs-badge" id="compBadge" hidden>跳帧补偿</span></div>
    </div>

    <input class="vs-range" id="speedRange" type="range" min="1" max="100" step="0.5" value="1" />
    <div class="vs-presets" id="presets"></div>

    <div class="vs-row">
      <label>精确倍速 <input class="vs-num" id="speedNum" type="number" min="1" max="100" step="0.5" value="1" /></label>
      <label><input id="loopChk" type="checkbox" /> 循环</label>
      <label><input id="muteChk" type="checkbox" /> 静音</label>
      <label><input id="pitchChk" type="checkbox" checked /> 保留音调</label>
    </div>

    <p class="vs-tip">
      浏览器原生上限约 <b id="maxNative">16</b>×，超过的部分自动用「跳帧补偿」逼近目标倍速。
      快捷键：<kbd>空格</kbd> 播放/暂停 · <kbd>←</kbd><kbd>→</kbd> 快退/快进 5 秒 · <kbd>↑</kbd><kbd>↓</kbd> 调速 · <kbd>M</kbd> 静音 · <kbd>L</kbd> 循环。
    </p>
    <p class="vs-meta" id="meta"></p>
  </section>
</main>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var video = $('#video');
  var player = $('#player');
  var dropzone = $('#dropzone');
  var panel = $('#panel');
  var fileInput = $('#fileInput');
  var speedRange = $('#speedRange');
  var speedNum = $('#speedNum');
  var speedVal = $('#speedVal');
  var effVal = $('#effVal');
  var compBadge = $('#compBadge');
  var presetsBox = $('#presets');
  var curTime = $('#curTime');
  var durTime = $('#durTime');
  var seek = $('#seek');
  var playIcon = $('#playIcon');
  var muteIcon = $('#muteIcon');
  var meta = $('#meta');

  var PRESETS = [1, 1.5, 2, 3, 4, 8, 16, 32, 64, 100];
  var STORE = 'xinmo-video-speed';
  var requested = 1;
  var maxNative = 16;
  var compTimer = null;
  var objectURL = null;

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  function fmt(t) {
    if (!isFinite(t) || t < 0) return '0:00';
    var s = Math.floor(t % 60), m = Math.floor(t / 60) % 60, h = Math.floor(t / 3600);
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(s).padStart(2, '0');
  }

  function detectMaxNative() {
    var prev = video.playbackRate;
    var max = 16;
    try {
      video.playbackRate = 100;
      max = video.playbackRate || 16;
    } catch (e) {}
    try { video.playbackRate = prev; } catch (e) {}
    return Math.max(1, Math.min(100, max));
  }

  function stopComp() {
    if (compTimer) { clearInterval(compTimer); compTimer = null; }
    compBadge.hidden = true;
  }

  function syncPreset() {
    Array.prototype.forEach.call(presetsBox.children, function (b) {
      b.classList.toggle('on', Math.abs(parseFloat(b.dataset.rate) - requested) < 0.001);
    });
  }

  function applyRate(rate, save) {
    requested = clamp(Number(rate) || 1, 1, 100);
    speedVal.textContent = requested % 1 ? requested.toFixed(1) : String(requested);
    speedRange.value = requested;
    speedNum.value = requested;
    syncPreset();

    var native = Math.min(requested, maxNative);
    try { video.playbackRate = native; } catch (e) {}
    var eff = video.playbackRate || native;
    effVal.textContent = eff.toFixed(1) + '×';

    stopComp();
    if (requested > eff + 0.05) {
      compBadge.hidden = false;
      compTimer = setInterval(function () {
        if (video.paused || video.ended) return;
        var extra = (requested - (video.playbackRate || 1)) * 0.1;
        if (extra <= 0.001) return;
        var dur = video.duration;
        if (isFinite(dur) && dur > 0) {
          video.currentTime = Math.min(dur - 0.05, video.currentTime + extra);
        } else {
          video.currentTime += extra;
        }
      }, 100);
    }

    if (save !== false) {
      try { localStorage.setItem(STORE, String(requested)); } catch (e) {}
    }
  }

  function setPitch(on) {
    video.preservesPitch = on;
    video.webkitPreservesPitch = on;
    video.mozPreservesPitch = on;
  }

  function updatePlayIcon() {
    playIcon.innerHTML = video.paused
      ? '<path d="M8 5v14l11-7z"/>'
      : '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  }

  function updateMuteIcon() {
    muteIcon.innerHTML = (video.muted || video.volume === 0)
      ? '<path d="M11 5 6 9H3v6h3l5 4Z"/><path d="m16 9 5 6M21 9l-5 6"/>'
      : '<path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>';
    $('#muteChk').checked = video.muted;
  }

  function loadFile(file) {
    if (!file) return;
    if (!/^video\//.test(file.type) && !/\.(mp4|webm|ogg|ogv|mov|m4v|mkv|avi)$/i.test(file.name)) {
      alert('请选择视频文件（mp4 / webm / mov / mkv 等）');
      return;
    }
    if (objectURL) URL.revokeObjectURL(objectURL);
    objectURL = URL.createObjectURL(file);
    video.src = objectURL;
    dropzone.hidden = true;
    player.hidden = false;
    panel.hidden = false;
    meta.textContent = file.name + ' · ' + (file.size / 1024 / 1024).toFixed(1) + ' MB';
    video.load();
    video.addEventListener('loadedmetadata', function onMeta() {
      video.removeEventListener('loadedmetadata', onMeta);
      maxNative = detectMaxNative();
      $('#maxNative').textContent = maxNative.toFixed(0);
      durTime.textContent = fmt(video.duration);
      meta.textContent = file.name + ' · ' + (file.size / 1024 / 1024).toFixed(1) + ' MB' +
        (isFinite(video.duration) ? ' · ' + fmt(video.duration) : '');
      applyRate(requested, false);
    });
    applyRate(requested, false);
  }

  // 预设档位
  presetsBox.innerHTML = PRESETS.map(function (v) {
    return '<button type="button" data-rate="' + v + '">' + v + '×</button>';
  }).join('');
  presetsBox.addEventListener('click', function (e) {
    var b = e.target.closest('[data-rate]');
    if (b) applyRate(parseFloat(b.dataset.rate));
  });

  speedRange.addEventListener('input', function () { applyRate(parseFloat(this.value)); });
  speedNum.addEventListener('change', function () { applyRate(parseFloat(this.value) || 1); });

  $('#pickBtn').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { loadFile(this.files && this.files[0]); });
  dropzone.addEventListener('click', function (e) {
    if (e.target.closest('#pickBtn')) return;
    fileInput.click();
  });

  ['dragenter', 'dragover'].forEach(function (ev) {
    dropzone.addEventListener(ev, function (e) { e.preventDefault(); dropzone.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    dropzone.addEventListener(ev, function (e) { e.preventDefault(); dropzone.classList.remove('drag'); });
  });
  dropzone.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });

  // 播放控制
  function togglePlay() {
    if (!video.src) { fileInput.click(); return; }
    if (video.paused) video.play().catch(function () {}); else video.pause();
  }
  $('#playBtn').addEventListener('click', togglePlay);
  video.addEventListener('click', togglePlay);
  video.addEventListener('play', updatePlayIcon);
  video.addEventListener('pause', updatePlayIcon);

  $('#muteBtn').addEventListener('click', function () { video.muted = !video.muted; });
  video.addEventListener('volumechange', updateMuteIcon);
  $('#muteChk').addEventListener('change', function () { video.muted = this.checked; });

  $('#loopChk').addEventListener('change', function () { video.loop = this.checked; });
  $('#pitchChk').addEventListener('change', function () { setPitch(this.checked); });

  $('#fsBtn').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
    else if (player.requestFullscreen) player.requestFullscreen().catch(function () {});
  });

  // 进度
  video.addEventListener('timeupdate', function () {
    if (!isFinite(video.duration) || video.duration <= 0) return;
    seek.value = String(Math.round(video.currentTime / video.duration * 1000));
    curTime.textContent = fmt(video.currentTime);
  });
  seek.addEventListener('input', function () {
    if (!isFinite(video.duration) || video.duration <= 0) return;
    video.currentTime = parseFloat(this.value) / 1000 * video.duration;
  });
  video.addEventListener('loadedmetadata', function () {
    durTime.textContent = fmt(video.duration);
    curTime.textContent = '0:00';
    updateMuteIcon();
    updatePlayIcon();
  });
  video.addEventListener('ended', updatePlayIcon);

  // 键盘
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    var k = e.key;
    if (k === ' ') { e.preventDefault(); togglePlay(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 5); }
    else if (k === 'ArrowRight') { e.preventDefault(); video.currentTime = Math.min(video.duration || 0, video.currentTime + 5); }
    else if (k === 'ArrowUp') { e.preventDefault(); applyRate(requested + 1); }
    else if (k === 'ArrowDown') { e.preventDefault(); applyRate(requested - 1); }
    else if (k === '[') { e.preventDefault(); applyRate(requested - 1); }
    else if (k === ']') { e.preventDefault(); applyRate(requested + 1); }
    else if (k.toLowerCase() === 'm') { e.preventDefault(); video.muted = !video.muted; }
    else if (k.toLowerCase() === 'l') { e.preventDefault(); $('#loopChk').checked = !video.loop; video.loop = !video.loop; }
  });

  // 初始化
  var savedSpeed = 1;
  try { savedSpeed = parseFloat(localStorage.getItem(STORE)) || 1; } catch (e) {}
  maxNative = detectMaxNative();
  $('#maxNative').textContent = maxNative.toFixed(0);
  setPitch(true);
  applyRate(clamp(savedSpeed, 1, 100), false);
  updatePlayIcon();
  updateMuteIcon();
})();
</script>
</body>
</html>
