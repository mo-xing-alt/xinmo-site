<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="上传资料 · xinmo.work 资源仓库" />
<title>上传资料 · xinmo.work</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f6bed'/%3E%3Cpath d='M17 19h30v9H17zm0 17h21v9H17z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./assets/css/site.css" />
<link rel="stylesheet" href="./assets/css/upload.css" />
<script>
  try {
    var saved = localStorage.getItem('xinmo-theme');
    document.documentElement.setAttribute('data-theme', saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  } catch (e) {}
</script>
</head>
<body>
<main class="up-wrap">
  <div class="up-card">
    <div class="up-head-row">
      <a class="up-brand" href="./index.html" aria-label="返回首页">
        <span class="up-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M7 8h18v5H7zM7 17h13v5H7z" fill="currentColor"/><path d="M7 26h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span>
        <span><strong>xinmo.work</strong><small>资源仓库</small></span>
      </a>
      <a class="up-back" href="./index.html">← 返回首页</a>
    </div>

    <h1>往仓库里放点东西</h1>
    <p class="up-lead">当前登录：<b id="who">—</b>。<br />
      可以传图片、压缩包、文档，也可以直接贴一段文字；只登记一个外部链接也可以。</p>

    <div class="up-tabs" role="tablist" aria-label="提交方式">
      <button class="up-tab active" type="button" role="tab" aria-selected="true" data-tab="file">上传资料</button>
      <button class="up-tab" type="button" role="tab" aria-selected="false" data-tab="link">只登记链接</button>
    </div>

    <!-- ============ 上传资料（文件 + 文字） ============ -->
    <section id="panel-file" role="tabpanel">
      <form id="uploadForm" autocomplete="off">
        <div class="field">
          <label for="uTitle">资料标题 <span class="req">*</span></label>
          <input id="uTitle" type="text" required maxlength="120" placeholder="例如：信息安全复习提纲 + 历年卷" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="uKind">资料类型</label>
            <select id="uKind">
              <option value="auto">自动判断</option>
              <option value="study">学习资料 / 笔记</option>
              <option value="image">图片 / 截图</option>
              <option value="archive">压缩包</option>
              <option value="doc">文档 / 表格 / PDF</option>
              <option value="other">其他</option>
            </select>
          </div>
          <div class="field">
            <label for="uSubtitle">一句话说明</label>
            <input id="uSubtitle" type="text" maxlength="160" placeholder="例如：共 6 份，含答案" />
          </div>
        </div>

        <div class="field">
          <label for="uDesc">详细简介</label>
          <textarea id="uDesc" maxlength="2000" placeholder="简单说说里面有什么、怎么用。"></textarea>
        </div>

        <div class="field">
          <label>文件（可多选，也可以直接把文件拖进来）</label>
          <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖入文件">
            <div class="dz-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
            </div>
            <div class="dz-main">把文件拖到这里，或点击选择</div>
            <div class="dz-sub">图片 / 压缩包 / 文档都行 · 单个最大 50MB · 最多 30 个 · 也可以直接 Ctrl+V 粘贴截图</div>
            <button class="dz-pick" type="button" id="pickBtn">选择文件</button>
            <input id="fileInput" type="file" multiple hidden />
          </div>
          <ul class="file-list" id="fileList"><li class="empty-tip">还没选文件。只提交文字也可以，跳过这里即可。</li></ul>
          <p class="file-summary" id="fileSummary"></p>
        </div>

        <div class="field">
          <label for="uNote">文字内容（可选）</label>
          <textarea id="uNote" class="note" maxlength="20000" placeholder="笔记、步骤说明、代码片段都可以直接贴在这里；没有文件时，这里至少要写点东西。"></textarea>
        </div>

        <button class="up-btn" type="submit" id="uSubmit">上传资料</button>
        <div class="bar" id="uBar"><i id="uBarFill"></i></div>
        <p class="progress" id="uProgress"></p>
        <p class="gate-msg" id="uMsg" role="alert" aria-live="polite"></p>
      </form>

      <div class="done-box" id="doneBox" hidden>
        <div class="done-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5 11-11"/></svg></div>
        <h2>上传成功</h2>
        <p id="doneText">资料已经收进仓库，首页马上就能看到。</p>
        <div class="done-actions">
          <a class="up-btn" href="#" id="doneLink" style="display:inline-flex;align-items:center">查看资料页</a>
          <button class="up-back" type="button" id="againBtn">再传一份</button>
        </div>
      </div>
    </section>

    <!-- ============ 只登记链接 ============ -->
    <section id="panel-link" role="tabpanel" hidden>
      <form id="submitForm" autocomplete="off">
        <div class="field">
          <label for="fName">资源名称 *</label>
          <input id="fName" type="text" required maxlength="80" placeholder="例如：图片批量改名工具" />
        </div>
        <div class="field">
          <label for="fUrl">资源链接 *</label>
          <input id="fUrl" type="url" required inputmode="url" spellcheck="false" placeholder="https://example.com/my-tool" />
        </div>
        <p class="up-hint">链接可以直接指向你的网页工具、网盘分享页或 GitHub 仓库；请确认对方打开无需登录。</p>
        <div class="field">
          <label for="fDesc">简介</label>
          <textarea id="fDesc" maxlength="500" placeholder="简单说说它是干什么的、怎么用。"></textarea>
        </div>

        <button class="up-btn" type="submit" id="submitBtn">提交链接</button>
        <p class="progress" id="progress"></p>
        <p class="gate-msg" id="msg" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <div class="up-foot">
      <a href="./index.html">← 返回首页</a>
      <span>提交即表示你愿意把它分享给其他受邀朋友。</span>
    </div>
  </div>
</main>

<!-- 访问控制守卫：未登录会被跳到登录页 -->
<script src="./assets/js/auth-config.js"></script>
<script src="./assets/js/guard.js"></script>
<!-- Supabase 配置（publishable key 可公开，权限由 RLS 控制） -->
<script src="./assets/js/supabase-config.js"></script>
<script src="./assets/js/upload-files.js"></script>
<script src="./assets/js/submit.js"></script>
<script>
  // 选项卡切换
  (function () {
    var tabs = document.querySelectorAll('.up-tab');
    var panels = { file: document.getElementById('panel-file'), link: document.getElementById('panel-link') };
    Array.prototype.forEach.call(tabs, function (tab) {
      tab.addEventListener('click', function () {
        var name = tab.dataset.tab;
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t === tab;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', String(on));
        });
        Object.keys(panels).forEach(function (k) { panels[k].hidden = k !== name; });
      });
    });
  })();
</script>
</body>
</html>
