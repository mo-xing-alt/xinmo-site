<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="提交资源 · xinmo.work 资源仓库" />
<title>提交资源 · xinmo.work</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f6bed'/%3E%3Cpath d='M17 19h30v9H17zm0 17h21v9H17z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./assets/css/site.css" />
<script>
  try {
    var saved = localStorage.getItem('xinmo-theme');
    document.documentElement.setAttribute('data-theme', saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  } catch (e) {}
</script>
<style>
  .up { min-height: 100dvh; display: grid; place-items: start center; padding: 40px 18px 80px; }
  .up-card { width: min(680px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 34px 30px 26px; }
  .up-brand { display: flex; align-items: center; gap: 11px; margin-bottom: 6px; }
  .up-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg,#4f6bed,#7a4fd0); }
  .up-brand strong { font-size: 15px; color: var(--heading); }
  .up-brand small { display: block; font-size: 11px; letter-spacing: 2px; color: var(--muted); }
  .up h1 { margin: 14px 0 4px; font-size: 21px; color: var(--heading); }
  .up-lead { margin: 0 0 22px; font-size: 13px; line-height: 1.8; color: var(--muted); }
  .up-lead b { color: var(--text); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 7px; }
  .field input, .field textarea { width: 100%; padding: 11px 13px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 14px; outline: 0; transition: border-color .2s, box-shadow .2s; font-family: inherit; }
  .field textarea { min-height: 96px; resize: vertical; }
  .field input:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .up-btn { width: 100%; height: 48px; margin-top: 10px; border: 0; border-radius: 11px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; background: linear-gradient(135deg,#4f6bed,#6c54df); box-shadow: 0 8px 22px rgba(79,107,237,.26); transition: transform .18s, filter .18s; }
  .up-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .up-btn:disabled { opacity: .6; cursor: wait; transform: none; }
  .progress { min-height: 18px; margin: 12px 0 0; font-size: 12px; color: var(--muted); }
  .gate-msg { min-height: 20px; margin: 8px 0 0; font-size: 12.5px; color: #c23c3c; }
  .gate-msg.ok { color: #1f9d5b; }
  .up-foot { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11.5px; line-height: 1.8; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .up-foot a { color: var(--accent); text-decoration: none; }
  .up-hint { font-size: 11.5px; line-height: 1.7; color: var(--muted); margin: -6px 0 14px; }
</style>
</head>
<body>
<main class="up">
  <div class="up-card">
    <div class="up-brand">
      <span class="up-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M7 8h18v5H7zM7 17h13v5H7z" fill="currentColor"/><path d="M7 26h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span>
      <span><strong>xinmo.work</strong><small>资源仓库</small></span>
    </div>
    <h1>提交资源</h1>
    <p class="up-lead">登录账号：<b id="who">—</b>。<br />
      填好名称、链接和一句简介，提交后会立刻出现在首页资源列表里，方便其他受邀朋友取用。</p>

    <form id="submitForm" autocomplete="off">
      <div class="field">
        <label for="fName">资源名称 *</label>
        <input id="fName" type="text" required maxlength="80" placeholder="例如：图片批量改名工具" />
      </div>
      <div class="field">
        <label for="fUrl">资源链接 *</label>
        <input id="fUrl" type="url" required inputmode="url" spellcheck="false" placeholder="https://example.com/my-tool" />
      </div>
      <p class="up-hint">链接可以直接指向你的网页工具、网盘分享页或 GitHub 仓库；请确认对方打开无需登录。</p>
      <div class="field">
        <label for="fDesc">简介</label>
        <textarea id="fDesc" maxlength="500" placeholder="简单说说它是干什么的、怎么用。"></textarea>
      </div>

      <button class="up-btn" type="submit" id="submitBtn">提交资源</button>
      <p class="progress" id="progress"></p>
      <p class="gate-msg" id="msg" role="alert" aria-live="polite"></p>
    </form>

    <div class="up-foot">
      <a href="./index.html">← 返回首页</a>
      <span>提交即表示你愿意把它分享给其他受邀朋友。</span>
    </div>
  </div>
</main>

<!-- 访问控制守卫：未登录会被跳到登录页 -->
<script src="./assets/js/auth-config.js"></script>
<script src="./assets/js/guard.js"></script>
<!-- Supabase 配置（publishable key 可公开，权限由 RLS 控制） -->
<script src="./assets/js/supabase-config.js"></script>
<script src="./assets/js/submit.js"></script>
</body>
</html>
