<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="description" content="受邀访问 · 新模学习" />
<title>受邀访问 · 新模学习</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23bc141b'/%3E%3Cpath d='m32 12 5.8 12.1 13.2 1.9-9.6 9.2 2.4 13.1L32 42l-11.8 6.3 2.4-13.1-9.6-9.2 13.2-1.9Z' fill='%23f7e6bd'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./assets/css/site.css" />
<script>
  try {
    var saved = localStorage.getItem('xinmo-theme');
    document.documentElement.setAttribute('data-theme', saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  } catch (e) {}
</script>
<style>
  .gate { min-height: 100dvh; display: grid; place-items: center; padding: 32px 20px; }
  .gate-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 38px 32px 30px; }
  .gate-brand { display: flex; align-items: center; gap: 11px; margin-bottom: 26px; }
  .gate-mark { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #7c0b10; background: radial-gradient(circle at 32% 28%, #fff3d0 0%, #e3b23c 46%, #b8862a 100%); box-shadow: 0 4px 12px rgba(94,7,11,.18); }
  .gate-mark svg { width: 22px; height: 22px; }
  .gate-brand strong { font-size: 15px; color: var(--heading); }
  .gate-brand small { display: block; font-size: 11px; letter-spacing: 2px; color: var(--muted); }
  .gate h1 { margin: 0 0 6px; font-size: 21px; color: var(--heading); }
  .gate-lead { margin: 0 0 24px; font-size: 13px; line-height: 1.8; color: var(--muted); }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 7px; }
  .field input { width: 100%; height: 46px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 14px; outline: 0; transition: border-color .2s, box-shadow .2s; }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 62px; }
  .pw-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; padding: 6px 8px; min-width: 46px; min-height: 36px; }
  .gate-btn { width: 100%; height: 46px; margin-top: 8px; border: 0; border-radius: 11px; color: #fff; font-size: 14px; font-weight: 600; letter-spacing: 2px; cursor: pointer; background: linear-gradient(135deg,#c8151d,#8c0f14); box-shadow: 0 8px 22px rgba(200,21,29,.26); transition: transform .18s, filter .18s; }
  .gate-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .gate-btn:disabled { opacity: .6; cursor: wait; transform: none; }
  .gate-msg { min-height: 20px; margin: 12px 0 0; font-size: 12.5px; color: #c23c3c; }
  .gate-foot { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 11.5px; line-height: 1.8; color: var(--muted); }
  .gate-foot a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .gate-foot a:hover { text-decoration: underline; }

  :root {
    --bg: #fbf9f6; --surface: #ffffff; --surface-2: #f8f1ea;
    --border: #ece2d7; --border-strong: #e2d3c3;
    --text: #24211d; --heading: #1b1917; --muted: #7d7469;
    --accent: #bc141b; --accent-2: #9c1016; --accent-soft: #fdecea;
  }
  :root[data-theme="dark"] {
    --bg: #140d0c; --surface: #1e1413; --surface-2: #271a18;
    --border: rgba(255,235,220,.10); --border-strong: rgba(255,235,220,.18);
    --text: #f0e2d9; --heading: #fdf3ec; --muted: #b39c90;
    --accent: #ff6b5f; --accent-2: #ffa38f; --accent-soft: rgba(255,107,95,.14);
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: 4px; z-index: 2;
    background: linear-gradient(90deg, #7c0b10, #c8151d 40%, #e3b23c 70%, #c8151d);
  }
  .gate-card { border-top: 3px solid #bc141b; }
  .gate h1 { font-family: "Songti SC", "STSong", "SimSun", serif; letter-spacing: 3px; }
</style>
</head>
<body>
<main class="gate">
  <div class="gate-card">
    <div class="gate-brand">
      <span class="gate-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M7 8h18v5H7zM7 17h13v5H7z" fill="currentColor"/><path d="M7 26h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span>
      <span><strong>新模学习</strong><small>XINMO STUDY · 学以报国</small></span>
    </div>
    <h1>受邀访问</h1>
    <p class="gate-lead">这里存放的是私人整理的领域知识与工具。输入账号与密码即可进入，登录后 7 天内无需重复输入；还没有账号可以先注册。</p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">账号</label>
        <input id="username" name="username" type="text" inputmode="text" autocapitalize="off" spellcheck="false" required placeholder="站主告知的账号" />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="密码" />
          <button class="pw-toggle" type="button" id="pwToggle">显示</button>
        </div>
      </div>
      <button class="gate-btn" type="submit" id="submitBtn">进入仓库</button>
      <p class="gate-msg" id="msg" role="alert" aria-live="polite"></p>
    </form>
    <div class="gate-foot">还没有账号？<a href="./register.html">注册一个</a>；早期账号仍由站主线下告知。<br />本页不提供找回或改密入口，请勿在此输入你在其他网站使用的密码。</div>
  </div>
</main>
<script src="./assets/js/auth-config.js"></script>
<script src="./assets/js/auth-core.js"></script>
<script src="./assets/js/supabase-config.js"></script>
<script src="./assets/js/members.js"></script>
<script>
(function () {
  'use strict';
  // 防点击劫持：GitHub Pages 无法设置 X-Frame-Options，这里用 JS 兜底；被 iframe 嵌入时跳到顶层。
  try {
    if (window.top !== window.self) { window.top.location = window.self.location.href; return; }
  } catch (e) { document.documentElement.style.display = 'none'; }
  // Web Crypto 只在安全上下文可用；http 访问时先切到 https，避免输入密码后才报错
  if ((!window.crypto || !crypto.subtle) && location.protocol === 'http:') {
    location.replace('https://' + location.host + location.pathname + location.search + location.hash);
    return;
  }
  var form = document.getElementById('loginForm');
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  var pwd = document.getElementById('password');
  var cfg = window.XINMO_ACCESS;

  document.getElementById('pwToggle').addEventListener('click', function () {
    var show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    this.textContent = show ? '隐藏' : '显示';
  });

  function say(text) { msg.textContent = text; }
  function readyBtn() { btn.disabled = false; btn.textContent = '进入仓库'; }
  function fail(text) { say(text); readyBtn(); }

  // 登录失败限速：15 分钟窗口内累计失败次数，次数越多延迟越长，≥5 次进入 60 秒冷却。
  var FAIL_KEY = 'xinmo_login_fails';
  var FAIL_WINDOW = 15 * 60 * 1000;
  var COOLDOWN_SEC = 60;

  function readFails() {
    try {
      var raw = JSON.parse(localStorage.getItem(FAIL_KEY) || 'null');
      if (!raw || typeof raw.n !== 'number' || typeof raw.ts !== 'number') return { n: 0, ts: 0 };
      if (!isFinite(raw.n) || raw.n < 0 || !isFinite(raw.ts)) return { n: 0, ts: 0 };
      if (Date.now() - raw.ts > FAIL_WINDOW) return { n: 0, ts: 0 };
      return { n: Math.floor(raw.n), ts: raw.ts };
    } catch (e) { return { n: 0, ts: 0 }; }
  }
  function writeFails(n, ts) {
    try { localStorage.setItem(FAIL_KEY, JSON.stringify({ n: n, ts: ts })); } catch (e) {}
  }
  function clearFails() {
    try { localStorage.removeItem(FAIL_KEY); } catch (err) {}
  }
  function failDelay(n) {
    if (n >= 5) return 5000;
    if (n >= 3) return 1500;
    return 350;
  }
  // 冷却期间禁用提交按钮与输入框，倒计时结束恢复
  function startCooldown(seconds) {
    var userEl = document.getElementById('username');
    var left = Math.max(1, Number(seconds) || COOLDOWN_SEC);
    btn.disabled = true;
    btn.textContent = '请稍候…';
    pwd.disabled = true;
    if (userEl) userEl.disabled = true;
    function tick() {
      if (left <= 0) {
        pwd.disabled = false;
        if (userEl) userEl.disabled = false;
        readyBtn();
        say('账号或密码不正确。');
        return;
      }
      say('账号或密码不正确。尝试次数过多，请 ' + left + ' 秒后再试');
      left -= 1;
      setTimeout(tick, 1000);
    }
    tick();
  }
  function onAuthFail() {
    var rec = readFails();
    var n = rec.n + 1;
    var ts = rec.n === 0 ? Date.now() : rec.ts;
    writeFails(n, ts);
    btn.disabled = true;
    btn.textContent = '校验中…';
    setTimeout(function () {
      if (n >= 5) { startCooldown(COOLDOWN_SEC); return; }
      fail('账号或密码不正确。');
      pwd.select();
    }, failDelay(n));
  }

  if (!cfg || !cfg.accounts || !cfg.accounts.length) {
    say('站主尚未设置访问账号，请稍后再来。');
    btn.disabled = true;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!cfg || !cfg.accounts || !cfg.accounts.length) { fail('站主尚未设置访问账号。'); return; }
    if (!window.crypto || !crypto.subtle) {
      fail('当前不是安全连接，请改用 https 打开本站。');
      return;
    }
    btn.disabled = true;
    btn.textContent = '校验中…';
    say('');
    var user = document.getElementById('username').value;
    var pass = pwd.value;
    function enterSite(name, key, days) {
      clearFails();
      var exp = Date.now() + (days || 7) * 86400000;
      try {
        // 同时保存账号名（统一小写去空格，供署名与进度同步）与派生密钥 k（仅存本机，不进日志）
        localStorage.setItem('xinmo_access', JSON.stringify({ t: cfg.gate, u: name.trim().toLowerCase(), exp: exp, k: key }));
      } catch (err) {
        fail('浏览器禁止了本地存储，请允许本站保存数据后重试。');
        return;
      }
      var target = new URLSearchParams(location.search).get('next');
      var dest = './index.html';
      if (target) {
        try {
          var u = new URL(target, location.href);
          if (u.origin === location.origin && u.pathname.indexOf('login.html') === -1) dest = u.href;
        } catch (err) {}
      }
      location.replace(dest);
    }

    // 本地哈希没通过时，再试「自助注册」通道（Supabase）。
    // 关键：若这个名字属于早期线下分配的账号，绝不走远程通道，
    // 避免有人注册同名账号、用自己的密码顶掉老账号。
    function tryRegistered(user, pass) {
      var M = window.XinmoMembers;
      if (!M) { onAuthFail(); return; }
      M.isLegacyName(user).then(function (legacy) {
        if (legacy) { onAuthFail(); return; }
        return M.login(user, pass).then(function (r) {
          if (r.ok) { enterSite(user, r.key, cfg.sessionDays); return; }
          if (r.reason === 'insecure') { fail('当前不是安全连接，请改用 https 打开本站。'); return; }
          if (r.reason === 'uninitialized' || r.reason === 'network') {
            fail('暂时无法连接账号服务，请稍后重试；早期账号请确认账号与密码。');
            return;
          }
          onAuthFail();
        });
      }).catch(function () { onAuthFail(); });
    }

    window.XinmoAuth.verify(user, pass, cfg).then(function (r) {
      if (!r.ok) {
        if (r.reason === 'insecure') { fail('当前不是安全连接，请改用 https 打开本站。'); return; }
        tryRegistered(user, pass);
        return;
      }
      enterSite(user, r.key, r.days || cfg.sessionDays || 7);
    }).catch(function () {
      fail('校验失败，请刷新页面重试。');
    });
  });
})();
</script>
</body>
</html>
