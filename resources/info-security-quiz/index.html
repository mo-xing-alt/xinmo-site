<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>信息安全题库 · 随机答疑</title>
<style>
:root{
  --bg:#0b1220;
  --bg2:#0f1a2e;
  --card:rgba(255,255,255,.055);
  --card-border:rgba(255,255,255,.09);
  --text:#e8eefb;
  --muted:#8fa3c0;
  --accent:#38d9a9;
  --accent-2:#4dabf7;
  --wrong:#ff6b81;
  --right:#38d9a9;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1100px 700px at 15% -10%,rgba(77,171,247,.16),transparent 60%),
    radial-gradient(900px 600px at 100% 0%,rgba(56,217,169,.12),transparent 55%),
    linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  padding:28px 18px 40px;
}
.app{width:100%;max-width:820px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(77,171,247,.28),rgba(56,217,169,.28));
  border:1px solid rgba(255,255,255,.12);font-size:18px}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.5px}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.icon-btn{background:none;border:1px solid var(--card-border);color:var(--muted);
  padding:8px 14px;border-radius:10px;font-size:12px;cursor:pointer;transition:.2s}
.icon-btn:hover{color:var(--text);border-color:rgba(255,255,255,.25)}
.panel{
  background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:26px;backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.28);
}
.hidden{display:none !important}
.hero h2{font-size:22px;margin:0 0 8px;font-weight:600}
.hero p{color:var(--muted);font-size:13.5px;line-height:1.7;margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--card-border);border-radius:13px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:4px}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.good b{color:var(--accent)}
.stat.bad b{color:var(--wrong)}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px;border-radius:13px;border:1px solid transparent;cursor:pointer;
  font-size:14.5px;font-family:inherit;transition:transform .15s,box-shadow .2s,background .2s;
}
.btn-main{background:linear-gradient(135deg,rgba(56,217,169,.9),rgba(56,196,217,.9));color:#04231b;font-weight:600}
.btn-main:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(56,217,169,.25)}
.btn-ghost{background:rgba(255,255,255,.045);border-color:var(--card-border);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.btn-ghost:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn small{font-size:11.5px;opacity:.75;font-weight:400}
.mini{display:flex;gap:18px;justify-content:center;margin-top:18px}
.mini button{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit}
.mini button:hover{color:var(--text)}
.empty-tip{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}

/* quiz */
.q-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.badge{font-size:11px;padding:4px 9px;border-radius:20px;background:rgba(77,171,247,.15);
  color:#9ccaff;border:1px solid rgba(77,171,247,.25);white-space:nowrap}
.badge.mode-wrong{background:rgba(255,107,129,.14);color:#ffa9b6;border-color:rgba(255,107,129,.28)}
.counter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;margin-bottom:22px}
.bar>i{display:block;height:100%;width:0;border-radius:4px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .35s ease}
.source{font-size:11.5px;color:var(--muted);margin-bottom:10px;letter-spacing:.3px}
.stem{font-size:16.5px;line-height:1.75;margin:0 0 20px;letter-spacing:.2px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;
  padding:13px 15px;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,.035);border:1px solid var(--card-border);
  color:var(--text);font-size:14px;line-height:1.65;font-family:inherit;
  transition:background .16s,border-color .16s,transform .12s;
}
.opt:hover:not(.locked){background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);transform:translateX(2px)}
.opt-key{flex:0 0 24px;height:24px;border-radius:8px;display:grid;place-items:center;
  font-size:12.5px;font-weight:600;background:rgba(255,255,255,.08);color:#b9c7de;margin-top:2px}
.opt.right{border-color:rgba(56,217,169,.55);background:rgba(56,217,169,.1)}
.opt.right .opt-key{background:var(--right);color:#04231b}
.opt.wrong{border-color:rgba(255,107,129,.55);background:rgba(255,107,129,.1)}
.opt.wrong .opt-key{background:var(--wrong);color:#2a060b}
.opt.locked{cursor:default}
.feedback{display:flex;align-items:center;gap:9px;margin-top:16px;font-size:13.5px;min-height:20px}
.feedback.ok{color:var(--right)}
.feedback.no{color:var(--wrong)}
.feedback .ans{color:var(--text)}
.explain{margin-top:14px;border:1px solid rgba(255,107,129,.28);background:rgba(255,107,129,.055);
  border-radius:14px;padding:15px 16px;animation:slideIn .25s ease}
.ex-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.ex-badge{font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(255,107,129,.2);
  color:#ffb3bf;border:1px solid rgba(255,107,129,.32);white-space:nowrap}
.ex-ans{font-size:13px;font-weight:600;color:var(--text);line-height:1.6}
.ex-row{margin:9px 0;font-size:13.5px;line-height:1.8;color:#d5e1f2}
.ex-row b{font-weight:600;margin-right:6px;color:var(--accent-2)}
.ex-row.extend b{color:var(--accent)}
.ex-tags{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.6}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.next{background:linear-gradient(135deg,rgba(77,171,247,.9),rgba(56,217,169,.9));color:#04212b;
  border:none;padding:12px 22px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:transform .15s,box-shadow .2s,opacity .2s}
.next:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(77,171,247,.28)}
.next:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.hint{font-size:11.5px;color:var(--muted)}
/* done */
.done-wrap{text-align:center;padding:14px 0 6px}
.ring{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(56,217,169,.18),transparent 70%);border:1px solid rgba(56,217,169,.35);font-size:34px}
.done-wrap h2{font-size:20px;margin:0 0 6px}
.done-wrap p{color:var(--muted);font-size:13px;margin:0 0 22px}
.done-stats{display:flex;justify-content:center;gap:28px;margin-bottom:24px}
.done-stats div{font-size:12px;color:var(--muted)}
.done-stats b{display:block;font-size:20px;color:var(--text);margin-bottom:3px}
@media (max-width:600px){
  body{padding:18px 14px 30px}
  .panel{padding:20px 17px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stem{font-size:15.5px}
  .opt{font-size:13.5px;padding:12px 13px}
  header{margin-bottom:16px}
  h1{font-size:15px}
  .footer{flex-direction:column-reverse;align-items:stretch}
  .next{width:100%;padding:13px}
  .hint{text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">🛡️</div>
      <div>
        <h1>信息安全题库 · 随机答疑</h1>
        <div class="sub" id="subline">CISP 补充 A 卷 / 精选 300 题 / 补充 B 卷</div>
      </div>
    </div>
    <button class="icon-btn" id="homeBtn">首页</button>
  </header>

  <!-- 首页 -->
  <section class="panel hero" id="homeView">
    <h2>随机抽题，即刻判断</h2>
    <p>从题库中随机抽取题目，答过的题不会重复出现；答错的题会自动收进错题本，并当场展开正确答案与精讲。</p>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>题库总数</span></div>
      <div class="stat"><b id="sSeen">0</b><span>已练习</span></div>
      <div class="stat bad"><b id="sWrong">0</b><span>错题</span></div>
      <div class="stat good"><b id="sRate">—</b><span>正确率</span></div>
    </div>
    <div class="actions">
      <button class="btn btn-main" id="startRandom"><span id="startRandomLabel">开始随机练习</span><small id="startRandomMeta"></small></button>
      <button class="btn btn-ghost" id="startWrong"><span>错题重练</span><small id="wrongMeta">暂无错题</small></button>
    </div>
    <div class="mini">
      <button id="resetWrong">清空错题本</button>
      <button id="resetAll">重置全部进度</button>
    </div>
    <div class="empty-tip" id="homeTip"></div>
  </section>

  <!-- 答题 -->
  <section class="panel hidden" id="quizView">
    <div class="q-top">
      <div style="display:flex;gap:8px;align-items:center">
        <span class="badge" id="modeBadge">随机练习</span>
        <span class="counter" id="qCounter">1 / 404</span>
      </div>
      <span class="counter" id="qScore"></span>
    </div>
    <div class="bar"><i id="progressBar"></i></div>
    <div class="source" id="qSource"></div>
    <p class="stem" id="qStem"></p>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explain hidden" id="explain"></div>
    <div class="footer">
      <span class="hint" id="hint">键盘 A–D 或 1–4 选答案，回车下一题</span>
      <button class="next" id="nextBtn" disabled>下一题</button>
    </div>
  </section>

  <!-- 完成 -->
  <section class="panel hidden" id="doneView">
    <div class="done-wrap">
      <div class="ring">🎯</div>
      <h2 id="doneTitle">本轮完成</h2>
      <p id="doneText"></p>
      <div class="done-stats">
        <div><b id="doneRight">0</b>答对</div>
        <div><b id="doneWrong">0</b>答错</div>
        <div><b id="doneRate">—</b>正确率</div>
      </div>
      <div class="actions">
        <button class="btn btn-main" id="againBtn"><span>继续随机练习</span><small></small></button>
        <button class="btn btn-ghost" id="doneHome"><span>返回首页</span><small></small></button>
      </div>
    </div>
  </section>
</div>

<script>
const DATA = [{"stem":"软件存在漏洞和缺陷是不可避免的,实践中常使用软件缺陷密度(Defectm/KL0C)来衡量软件的安全性，假设某大软件共有296 万行源代码,总共被检测出145 个缺陷,则可以计算出其软件缺陷密度值是()","options":[{"k":"A","t":"0.00049"},{"k":"B","t":"0.049"},{"k":"C","t":"0.49"},{"k":"D","t":"49"}],"answer":"B","src":"A卷·补充100题","srcNum":1,"id":"q000","analyze":"缺陷密度＝缺陷数除以千行代码数（KLOC）。296万行＝2960 KLOC，145÷2960≈0.049个/KLOC。A把万行误当千行再重复相除，C、D是换算时小数点位置错误，量级均不符Defects/KLOC的定义。","expand":"缺陷密度是软件安全度量的经典指标，反映已检出缺陷的相对数量，不等于漏洞数。与MTBF（平均无故障时间）、MTTR（平均修复时间）对比记忆。计算口诀：先把行数折成千行，再以缺陷数相除，结果通常在零点零几到几个之间。","tags":["软件安全","安全工程与项目管理"]},{"stem":"GB/T18336《信息技术安全性评估准则》是测评标准类中的重要标准，该标准定义了保护轮期(ProtectionProfile.PP)和安全目标(Security Target.ST)的评估准则，提出了评估保证级(Evaluation Aanurane Level，EAL)，其评估保证级共分为()个递增的评估保证等级。","options":[{"k":"A","t":"4"},{"k":"B","t":"5"},{"k":"C","t":"6"},{"k":"D","t":"7"}],"answer":"D","src":"A卷·补充100题","srcNum":2,"id":"q001","analyze":"GB/T 18336等同采用ISO/IEC 15408（CC），其评估保证级EAL自EAL1至EAL7，共7个逐级递增等级；EAL1为功能测试，EAL7为形式化验证并含设计与测试验证。A、B、C的4、5、6级是把其他分级体系的级数误植过来。","expand":"CC由三部分组成：简介与一般模型、安全功能要求、安全保证要求；EAL1～EAL7依次为功能测试、结构测试、方法学测试与检查、系统设计测试与复查、半形式化设计与测试、半形式化设计验证、形式化验证。注意与GB/T 20274信息系统安全保障评估框架区分。","tags":["信息安全标准与法规","安全工程与项目管理"]},{"stem":"Gery McGraw 博士及其合作者提出BSI 软件安全应由三根支柱来支撑。这三个支柱是","options":[{"k":"A","t":"源代码审核、风险分析和渗透测试"},{"k":"B","t":"应用风险管理、软件安全接触点和安全知识"},{"k":"C","t":"威胁建模、渗透测试和软件安全接触点"},{"k":"D","t":"威胁建模、源代码审核和模糊测试"}],"answer":"B","src":"A卷·补充100题","srcNum":3,"id":"q002","analyze":"McGraw提出的BSI（Build Security In）三支柱为应用风险管理、软件安全接触点和安全知识，故选B。A、C、D都把威胁建模、代码审计、渗透测试、模糊测试等技术手段混作支柱，这些属SDL中的具体方法而非支柱框架。","expand":"三支柱记忆：风险要管、接触点要建、知识要沉淀。对比：SSE-CMM与CMMI评过程能力成熟度；OWASP Top 10是风险清单；威胁建模（STRIDE）是识别方法；代码审计与渗透测试是验证手段。","tags":["软件安全","安全工程与项目管理"]},{"stem":"国际标准化组织(Intermtional Organization for Standardization.ISO)对信息安全的定义为()","options":[{"k":"A","t":"保护信息和信息系续不被未经授权的访问、使用、泄露、修改和破坏，为信息和信息系统提供保密性、完整性可用性、可控性和不可否认性"},{"k":"B","t":"信息安全，有时编写为InfoSec，是防止未经授权的访网、使用、被露、中断、修改、检查、记录成破坏信息的做法。它是一个可以用于任何形式数据(例如电子、物理)的通用术语"},{"k":"C","t":"在既定的密级条件下，网络与信息系统抵御意外事件或恶意行为的能力，这些事件和行为将威胁所存储或传输的数据以及经由这些网络和系统所提供的服务的可用性、真实性、完整性和机密性"},{"k":"D","t":"为数据处理系统建立和采取技术、管理的安全保护，保护计算机硬件、软件、数据不因偶然的或恶意的原因而受到破坏、更改、泄露"}],"answer":"D","src":"A卷·补充100题","srcNum":4,"id":"q003","analyze":"D是ISO对信息安全的经典定义：为数据处理系统建立并采取技术与管理两方面的安全保护，使硬件、软件、数据不因偶然或恶意原因遭破坏、更改、泄露。A是我国常用的五性表述，B为通俗化解释，C是网络与信息系统安全视角，均非ISO原文。","expand":"信息安全属性演进：CIA三性→加入可控性、不可否认性（五性）→再到真实性、可靠性。易混：信息安全（保护信息与系统）、网络安全（保护网络承载与服务）、网络空间安全（含内容与社会域），三者范围层层扩大。","tags":["信息安全标准与法规","信息安全管理体系"]},{"stem":"对信息安全事件的分级参考下列三个要素:信息系统的重要程度、系统损失和社会影响。依据信息系统的重要程度对信息系统进行划分，不属于正确划分级别的是()。","options":[{"k":"A","t":"特别重要信息系统"},{"k":"B","t":"重要信息系统"},{"k":"C","t":"一般信息系统"},{"k":"D","t":"关键信息系统"}],"answer":"D","src":"A卷·补充100题","srcNum":5,"id":"q004","analyze":"依据信息系统重要程度，划分为特别重要信息系统、重要信息系统、一般信息系统三类，并与社会影响、系统损失共同构成事件分级要素。D的“关键信息系统”不在该划分中，是把“关键信息基础设施”概念误套到分级级别上。","expand":"事件分四级：特别重大（Ⅰ）、重大（Ⅱ）、较大（Ⅲ）、一般（Ⅳ），常对应红橙黄蓝。易混：等级保护对象分一至五级（五级为专控保护）；关键信息基础设施是保护对象类别，不是事件分级级别。","tags":["应急响应","等级保护"]},{"stem":"恢复时间目标(Recovery Time Objective , RTO)和恢复点目标(Recovery Point Objective, RPO)是业务连续性和灾难恢复工作中的两个重要指标，随着信息系统越来越重要和信息技术越来越先进，这两个指标的数值越来越小。小华准备为其工作的信息系统拟定RTO 和RPO 指标，则以下描述中。正确的是()。","options":[{"k":"A","t":"RTO 可以为0，RPO 也可以为0"},{"k":"B","t":"RTO 可以为0，RPO 不可以为0"},{"k":"C","t":"RTO 不可以为0，RPO 可以为0"},{"k":"D","t":"RTO 不可以为0，RPO 也不可以为0"}],"answer":"A","src":"A卷·补充100题","srcNum":6,"id":"q005","analyze":"RTO是业务恢复可容忍的最长时间，RPO是最多可容忍的数据丢失量。采用双活、同步复制与零丢失架构时，两者均可等于或趋近0，故A正确。B、C、D均把二者视作必有下限的指标，属概念误解。","expand":"RTO管“停多久”，RPO管“丢多少”，前者对应业务连续性与冗余切换，后者对应备份与复制策略。关系：RTO≤MTD（最大可容忍中断时间）；RPO＝0需同步复制，RTO＝0需双活或热备，指标越小投入越高。","tags":["业务连续性与灾难恢复"]},{"stem":"为了保障系统安全，某单位需要对其跨地区大型网络实时应用系统进行渗透测试，以下关于渗透测试过程的说法不正确的是()。","options":[{"k":"A","t":"由于在实际渗透测试过程中存在不可预知的风险，所以测试前要提醒用户进行系统和数据备份，以便出现问题时可以及时恢复系统和数据"},{"k":"B","t":"渗透测试从“逆向”的角度出发，测试软件系统的安全性，其价值在于可以测试软件在实际系统中运行时的安全状况"},{"k":"C","t":"渗透测试应当经过方案制定、信息收集、漏洞利用、完成渗透测试报告等步骤"},{"k":"D","t":"为了深入发掘该系统存在的安全威胁，应该在系统正常业务运行高峰期进行渗透测试"}],"answer":"D","src":"A卷·补充100题","srcNum":7,"id":"q006","analyze":"D错在测试时机。渗透测试具破坏性，应避开业务高峰、选低谷期实施，并取得书面授权、做好备份与回退。A说备份必要、B说渗透测试从“逆向”验证实际运行安全状况、C列出的方案—收集—利用—报告流程，均正确。","expand":"渗透测试与漏洞扫描区别：扫描是自动化“发现”，面广；渗透是人工“验证可利用性”，深且有风险。流程：授权与范围界定—情报收集—威胁建模—漏洞分析—渗透攻击—后渗透—报告与清理。禁止越界与留后门。","tags":["软件安全","网络安全"]},{"stem":"小李在检查公司对外服务网站的源代码时，发现程序在发生诸如没有找到资源、数据库连接错误、写临时文件错误等问题时，会将详细的错误原因在结果页面上显示出来。从安全角度考虑，小李决定修改代码，将详细的错误原因都隐藏起来，在页面上仅仅告知用户“抱歉，发生内部错误!”。请问，这种处理方法的主要目的是()。","options":[{"k":"A","t":"避免缓冲区溢出"},{"k":"B","t":"安全处理系统异常"},{"k":"C","t":"安全使用临时文件"},{"k":"D","t":"最小化反锁信息"}],"answer":"D","src":"A卷·补充100题","srcNum":8,"id":"q007","analyze":"把详细错误原因隐藏、只返回统一友好提示，属最小化反馈信息，可避免报错暴露数据库结构、路径、组件版本等情报。A缓冲区溢出、C临时文件是具体漏洞类型，B仅为笼统描述，均不能准确概括该做法的目的。","expand":"对应CWE-209错误信息泄露与OWASP“安全配置错误”。原则：对外友好提示，对内详细日志，且日志本身不得记录口令、密钥、身份证号等敏感数据。与“异常安全处理”区分：后者防崩溃与绕过检查，前者防信息外泄。","tags":["软件安全"]},{"stem":"王工是某单位的系统管理员。他在某次参加了单位组织的风险管理工作时。根据任务安排。他依据已有的资产系表，逐个分析可能危害这些资产的主体、动机、途径等多种因素，分析这些因素出现及造成损失的可能性大乐产为其赋值。请问，他这个工作属于下面要一个阶段的工作()","options":[{"k":"A","t":"资产识别并赋值"},{"k":"B","t":"脆弱性识别并赋值"},{"k":"C","t":"威胁识别并赋值"},{"k":"D","t":"确认已有的安全措施并赋值"}],"answer":"C","src":"A卷·补充100题","srcNum":9,"id":"q008","analyze":"题干为依资产清单分析可能危害资产的主体、动机、途径等因素，并评估其发生可能性与损失，正是威胁识别并赋值。A资产识别在前置已完成（已有资产清单），B针对自身弱点，D针对措施有效性，均与描述不符。","expand":"风险评估四要素：资产、威胁、脆弱性、已有安全措施。风险≈威胁可能性×脆弱性严重程度×资产价值。识别顺序：资产→威胁→脆弱性→措施→风险计算。易混：脆弱性是自身弱点，威胁是外部可能施加的伤害。","tags":["风险评估"]},{"stem":"2016 年10 月21 日，美国东部地区发生大规模断网事件，此次事件是由于美国主要DNS 服务商Dyn遭遇大规模DDos 攻击所致，影响规模惊人，对人们生产生活造成严重影响。DDoS 攻击的主要目的是破坏系统的()","options":[{"k":"A","t":"保密性"},{"k":"B","t":"可用性"},{"k":"C","t":"不可否认性"},{"k":"D","t":"抗抵赖性"}],"answer":"B","src":"A卷·补充100题","srcNum":10,"id":"q009","analyze":"DDoS以海量流量或连接耗尽带宽、连接数与应用资源，使合法用户无法获得服务，直接破坏可用性，故选B。Dyn被攻击导致大量网站无法解析，正是可用性受损典型。A对应泄露，C、D对应否认操作行为，与流量洪泛无关。","expand":"CIA三性对应：DDoS打可用性、嗅探窃取打保密性、篡改打完整性。攻击分流量型、协议型、应用层型（CC）。防护：流量清洗与CDN、Anycast、限速与连接数限制、SYN Cookie、黑洞路由。","tags":["网络安全"]},{"stem":"某社交网站的用户点击了该网站上的一个广告。该广告含有一个跨站脚本，会将他的浏览器定向到旅游网文旅游网站则了他的社交网络信息。虽然该用户没有主动访问该旅游网站，但旅游网站已经截获了他的社交网信息(还有他的好友们的信息)，于是犯罪分子便可以躲藏在社交网站的广告后面，截获用户的个人信息宁。这种向Web 页面插入恶意html 代码的攻击方式称为()","options":[{"k":"A","t":"分布式拒绝服务攻击"},{"k":"B","t":"跨站脚本攻击"},{"k":"C","t":"SQL 注入攻击"},{"k":"D","t":"缓冲区溢出攻击"}],"answer":"B","src":"A卷·补充100题","srcNum":11,"id":"q010","analyze":"题干明确“向Web页面插入恶意HTML代码”并借站点信任在用户浏览器执行脚本、窃取社交信息，属跨站脚本攻击XSS。A是流量耗尽，C是通过SQL语句操纵数据库，D是内存越界覆盖，均无“在页面注入并执行脚本”的特征。","expand":"XSS分反射型、存储型、DOM型。防御核心：输出编码与上下文转义、输入校验、CSP、Cookie加HttpOnly与SameSite。易混：CSRF借已登录身份伪造请求，不注入脚本；SQL注入针对数据库解析，防御用参数化查询。","tags":["软件安全","网络安全"]},{"stem":"有关能力成熟度模型(CMM)，错误的理解是()。","options":[{"k":"A","t":"CMM 的思想不关注结果，而是强调了过程的控制，过程如果是高质量的，结果通常会是高质量的"},{"k":"B","t":"CMM 的思想来源于项目管理、质量管理和过程管理"},{"k":"C","t":"CMM 是一种衡量工程实施能力的方法，是一种面向工程过程的方法"},{"k":"D","t":"CMM 是建立在统计过程控制理论基础上的，它基于这样一个假设，即“生产过程的高质量和在过程中组织实施的成熟性可以低成本地生产出高质量产品”"}],"answer":"A","src":"A卷·补充100题","srcNum":12,"id":"q011","analyze":"A错。CMM恰恰关注结果，但主张过程决定结果——高质量过程稳定产出高质量产品，故“不关注结果”表述颠倒。B说明思想来源，C指出其面向工程过程的能力度量属性，D概括其统计过程控制假设，均正确。","expand":"CMM五级：初始级、可重复级、已定义级、已管理级、优化级，核心是过程决定质量。衍生CMMI分阶段式与连续式。与SSE-CMM区分：后者是系统安全工程过程能力模型，能力级别为0～5共6级。","tags":["安全工程与项目管理"]},{"stem":"操作系统用于管理计算机资源，控制整个系统运行，是计算机软件的基础。操作系统安全是计算、网络及信息系统安全的基础。一般操作系统都提供了相应的安全配置接口。小王新买了一台计算机，开机后首先对自带的Windows 操作系统进行配置。他的主要操作有:(1)关团不必要的服务和端口;(2)在“本地安全策略”中配置账号策略、本地策略、公钥策略和IP 安全策略;(3)备份敏感文件，禁止建立空连接，下载最新补丁;(4)关闭审核策略，开启口令策略，开启账户策略。这些操作中错误的是()。","options":[{"k":"A","t":"操作(1)，应该关闭不必要的服务和所有端口"},{"k":"B","t":"操作(2)，在“本地安全策略”中不应该配置公钥策略，而应该配置私钥策略"},{"k":"C","t":"操作(3)，备份敏感文件会导致这些文件遭到窃取的几率增加"},{"k":"D","t":"操作(4)，应该开启审核策略"}],"answer":"D","src":"A卷·补充100题","srcNum":13,"id":"q012","analyze":"错误在操作(4)：关闭审核策略。审核用于记录登录、特权使用、对象访问与策略变更，是事后审计追踪依据，应开启。A“关闭所有端口”、B认为公钥策略不该配置、C认为备份增加失窃风险，这些“纠正”理由本身也不成立。","expand":"Windows加固清单：最小化服务与端口、强口令与账户锁定、开启审核、禁用匿名与空连接、及时补丁、最小权限、启用主机防火墙并集中日志。原则：关闭不必要的而非关闭全部，业务必需端口应保留并加固。","tags":["操作系统安全"]},{"stem":"某集团公司根据业务需要，在各地分支机构部署前置机，为了保证安全，集团总部要求前置机开放日志共享，由总部服务器采集进行集中分析，在运行过程中发现攻击者也可通过共享从前置机中提取日志，从而导致部分敏感信息泄露，根据降低攻击面的原则，应采取以下哪项处理措施()","options":[{"k":"A","t":"由于共享导致了安全问题，应直接关闭日志共享，禁止总部提取日志进行分析"},{"k":"B","t":"为配合总部的安全策略，会带来一定的安全问题，但不影响系统使用，因此接受此风险"},{"k":"C","t":"日志的存在就是安全风险，最好的办法就是取消日志，通过设置让前置机不记录日志"},{"k":"D","t":"只允许特定的IP 地址从前置机提取日志，对日志共享设置访问密码且限定访问的时间"}],"answer":"D","src":"A卷·补充100题","srcNum":14,"id":"q013","analyze":"降低攻击面是收敛暴露范围而非取消功能。D以限定源IP、共享口令与访问时段，既保留日志集中采集又限制可访问者，属正确处置。A取消日志丧失审计能力，B消极接受风险，C更破坏追溯，均不可取。","expand":"攻击面收敛：白名单、最小服务、最小权限、访问控制列表、网络分段、关闭默认共享。原则是“必要功能保留并加固，非必要一律关闭”。日志可改由Syslog over TLS、只读共享加SMB签名或专网采集，替代匿名共享。","tags":["网络安全","操作系统安全"]},{"stem":"北京某公司利用SSE-CMM 对其自身工程队伍能力进行自我改善，其理解正确的是()。","options":[{"k":"A","t":"系统安全工程能力成熟度模型(SSE-CMM)定义了6 个能力级别，当工程队伍不能执行一个过程域中的基本实践时，该过程域的过程能力是0 级"},{"k":"B","t":"达到SSE-CM 最高级以后，工程队伍执行同一个过程，每次执行的结果质量必须相同"},{"k":"C","t":"系统安全工程能力成熟度模型(SSE-CMM)定义了3 个风险过程:评价威胁，评价脆弱性，评价影响"},{"k":"D","t":"SSE-QM 强调系统安全工程与其他工程学科的区别性和独立性"}],"answer":"A","src":"A卷·补充100题","srcNum":15,"id":"q014","analyze":"SSE-CMM能力级别为0～5共6级，0级即未实施，过程域基本实践无法执行时为0级，A正确。B错，高级别只表示过程稳定可控，不保证每次结果完全相同；C错，风险过程还包括评估安全风险；D错，其强调与其他工程学科集成。","expand":"SSE-CMM含11个过程域，分工程类、项目类、组织类；风险过程为评估威胁、评估脆弱性、评估影响、评估安全风险。基本实践BP衡量过程实施，通用实践GP衡量制度化。与ISO 27001（建管理体系并认证）性质不同。","tags":["安全工程与项目管理","信息安全标准与法规"]},{"stem":"由于Internet 的安全问题日益突出，基于TCP/IP 协议，相关组织和专家在协议的不同层次设计了相应的安全通信协议，用来保障网络各层次的安全。其中，属于或依附于传输层的安全协议是()。","options":[{"k":"A","t":"PP2P"},{"k":"B","t":"L2TP"},{"k":"C","t":"SSL"},{"k":"D","t":"IPSec"}],"answer":"C","src":"A卷·补充100题","srcNum":16,"id":"q015","analyze":"SSL（及其继任TLS）位于应用层与传输层之间，为HTTP等应用提供加密与身份认证，是最典型的传输层安全协议，故选C。IPSec工作在网络层，L2TP属链路层隧道，A项PP2P为PPTP（链路层）的误写，层次均不符。","expand":"分层记忆：链路层PPTP/L2TP，网络层IPSec（AH/ESP、传输与隧道两模式、IKE协商），传输层SSL/TLS，应用层SSH、PGP、HTTPS。SSL握手用非对称算法协商会话密钥，再用对称算法加密数据，兼用MAC保完整性。","tags":["网络安全","密码学"]},{"stem":"以下哪项的行为不属于违反国家保密规定的行为()","options":[{"k":"A","t":"将涉密计算机、涉密存储设备接入互联网及其他公共信息网络"},{"k":"B","t":"通过普通邮政等无保密措施的渠道传递国家秘密载体"},{"k":"C","t":"在私人交往中涉及国家秘密"},{"k":"D","t":"以不正当手段获取商业秘密"}],"answer":"D","src":"A卷·补充100题","srcNum":17,"id":"q016","analyze":"D不属于违反国家保密规定。商业秘密受反不正当竞争法、刑法保护，以不正当手段获取构成侵犯商业秘密，侵害的是权利人私益，而非国家保密法保护的国家秘密。A、B、C均直接指向国家秘密的违规存储、传递与言谈。","expand":"《保守国家秘密法》禁止：非涉密载体存储国家秘密、涉密设备连互联网、无保密措施渠道传递、私自留存复制、私人交往与通信中涉及国家秘密。区分国家秘密（法定定密）、商业秘密（权利人秘密）、工作秘密（内部管理）。","tags":["信息安全标准与法规"]},{"stem":"关于计算机取证描述不正确的是()","options":[{"k":"A","t":"计算机取证是使用先进的技术和工具，按照标准规程全面地检查计算机系统，以提取和保护有关计算机犯罪的相关证据的活动"},{"k":"B","t":"取证的目的包括:通过证据查找策事者、通过证据推断犯罪过程、通过证据判断受害者损失程度及收集证据提供法律支持"},{"k":"C","t":"电子证据是计算机系统运行过程中产生的各种信息记录及存储的电子化资料及物品。对于电子证据，取证工作主要围绕两方面进行:证据的获取和证据的保护"},{"k":"D","t":"计算机取证的过程可以分为准备、保护、提取、分析和提交5 个步骤"}],"answer":"C","src":"A卷·补充100题","srcNum":18,"id":"q017","analyze":"C表述不准确。电子证据是系统生成、存储、传输的电子化记录，不包括“物品”这类实体物证；取证也不止获取与保护两面，还含固定保全、分析鉴定与提交。A的定义、B的目的、D的准备—保护—提取—分析—提交五步均正确。","expand":"取证核心是证据的完整性、连续性与可追溯性：原件不外借、操作留记录、哈希可复核、镜像做分析。常用手段：写保护器、只读镜像、时间线分析、日志与内存取证。与“应急响应”区别：取证面向法律证明，响应面向止损恢复。","tags":["安全事件与取证"]},{"stem":"在某信息系统的设计中，用户登录过程是这样的:(1)用户通过HTTP 协议访问信息系统:(2)用户在登录页面输入用户名和口令:(3)信息系统在服务器端检查用户名和密码的正确性，如果正确，则鉴别完成。可以出，这个鉴别过程属于()。","options":[{"k":"A","t":"单向鉴别"},{"k":"B","t":"双向鉴别"},{"k":"C","t":"三向鉴别"},{"k":"D","t":"第三方鉴别"}],"answer":"A","src":"A卷·补充100题","srcNum":19,"id":"q018","analyze":"该过程只有服务器校验用户名口令，即服务器鉴别用户，用户未鉴别服务器，属单向鉴别，故选A。双向鉴别需双方相互验证，三向鉴别在双向基础上再由用户回送服务器挑战值，第三方鉴别依赖可信第三方（如Kerberos的KDC）。","expand":"鉴别三要素：你知道什么（口令）、你拥有什么（令牌/证书）、你是什么（生物特征）。口令经HTTP明文传输易被嗅探，应改用HTTPS；口令存储不宜用SHA-1，应用bcrypt、PBKDF2等加盐慢哈希。","tags":["身份鉴别"]},{"stem":"以下关于检查评估和自评估说法错误的是()。","options":[{"k":"A","t":"信息安全风险评估分自评估、检查评估两形式。应以检查评估为主，自评估和检查评估相互结合、互为补充"},{"k":"B","t":"检查评估可以依据相关标准的要求，实施完整的风险评估，也可以在自评估实施的基础上，对关键环节或重点内容实施抽样评估"},{"k":"C","t":"信息安全风险评估应贯穿于网络和信息系统建设运行的全过程"},{"k":"D","t":"自评估只能由组织自身发起并实施，对信息系统及其管理进行风险评估活动"}],"answer":"A","src":"A卷·补充100题","srcNum":20,"id":"q019","analyze":"A错误。风险评估应以自评估为主、检查评估为辅，二者结合互补，而非“以检查评估为主”。B说检查评估可独立实施亦可抽样复核，C强调贯穿建设运行全过程，D界定自评估由组织自身发起，均符合规范要求。","expand":"自评估由组织自身或委托机构实施，重在常态化、自主性；检查评估由主管部门或专委会组织，带监督检查性质。依据GB/T 20984，风险评估贯穿规划、设计、建设、运行、废弃全生命周期，并需定期复评。","tags":["风险评估","信息安全标准与法规"]},{"stem":"小张新购入了一台安装了Windows 操作系统的笔记本电脑。为了提升操作系统的安全性，小张在Windowa 系统中的-本地安全策略中，配置了四类安全策略，账号策略、本地策略、公份策略和IP 安全策略。那么该操作于操作系统安全配置内容中的()。","options":[{"k":"A","t":"关闭不必要的服务"},{"k":"B","t":"关闭不必要的端口"},{"k":"C","t":"制定安全策略"},{"k":"D","t":"查看日志记录"}],"answer":"C","src":"A卷·补充100题","srcNum":22,"id":"q020","analyze":"账号策略、本地策略、公钥策略、IP安全策略正是本地安全策略的四个组成，整体属于制定安全策略，故选C。A关闭服务、B关闭端口是单项加固动作，D查看日志属审计检查，题干所配对象是策略集合而非单一加固操作。","expand":"本地安全策略四部分：账户策略（口令复杂度、锁定、Kerberos）、本地策略（审核、用户权限分配、安全选项）、公钥策略（证书与EFS）、IP安全策略。加固顺序：账户口令→开启审核→服务端口→补丁→日志集中。","tags":["操作系统安全"]},{"stem":"有关系统安全工程-能力成熟度模型(SSE-CM)，错误的理解是()","options":[{"k":"A","t":"SSE-CMM 要求实施组织与其他组织相互作用，如开发方、产品供应商、集成商和咨询服务商等"},{"k":"B","t":"SSE-CMM 可以使安全工程成为一个确定的、成熟的和可度量的科目。"},{"k":"C","t":"基于SSE-CMM 的工程是独立工程，与软件工程、硬件工程、通信工程等分别规划实施"},{"k":"D","t":"SSE-CMM 覆盖整个组织的活动，包括管理、组织和工程活动等，而不仅仅是系统安全的工程活动"}],"answer":"C","src":"A卷·补充100题","srcNum":23,"id":"q021","analyze":"C错误。SSE-CMM强调安全工程与软件、硬件、通信等其他工程学科相互集成、协同实施，而非各自独立规划。A指出需与开发方、供应商、集成商等交互，B说其使安全工程确定可度量，D说覆盖管理、组织与工程活动，均正确。","expand":"SSE-CMM三域：风险过程、工程过程、保证过程，11个过程域、6个能力级别（0～5）。其与ISO 27001最大差别在于评价“工程过程能力成熟度”，而非建立管理体系并通过认证审核。","tags":["安全工程与项目管理"]},{"stem":"关于Wi-Fi 联盟提出的安全协议WPA 和WPA2 的区别，下面描述正确的是()。","options":[{"k":"A","t":"WPA 是有线局域安全协议，而WPA2 是无线局域网协议"},{"k":"B","t":"WPA 是适用于中国的无线局域安全协议，而WPA2 是适用于全世界的无线局域网协议"},{"k":"C","t":"WPA 没有使用密码算法对接入进行认证，而WPA2 使用了密码算法对接入进行认证"},{"k":"D","t":"WPA 是依照802. 11i 标准草案制定的，而WPA2 是依照802. 11i 正式标准制定的"}],"answer":"D","src":"A卷·补充100题","srcNum":24,"id":"q022","analyze":"WPA依802.11i草案制定，用TKIP+MIC过渡以兼容旧硬件；WPA2依802.11i正式标准，强制AES-CCMP，故选D。A把WPA说成有线协议错误，B按地域划分无依据，C称WPA不做认证错误，二者均含认证与加密机制。","expand":"无线安全演进：WEP（RC4静态密钥，已破解）→WPA（TKIP动态密钥）→WPA2（AES-CCMP）→WPA3（SAE抗字典攻击）。认证分PSK个人模式与802.1X企业模式。注意WAPI是我国提出的无线标准，采用三元鉴别。","tags":["网络安全","密码学"]},{"stem":"二十世纪二十年代，德国发明家亚瑟谢尔比乌斯(arthur Scherbius)发明了Enigma 密码机，按照密码学发展历史阶段划分，这个阶段属于()。","options":[{"k":"A","t":"古典密码阶段。这一阶段的密码专家常常靠直觉和技巧来设计密码，而不是凭借推理和证明，常用的密码运算方法包括替代方法和置换方法"},{"k":"B","t":"近代密码发展阶段。这一阶段开始使用机械代替手工计算，形成了机械式密码设备和更进一步的机电密码设备"},{"k":"C","t":"现代密码学的早期发展阶段。这一阶段以香农的论文“保密系统的通信理论”(“The Communication Theory of Secret Systems”)为理论基础，开始了对密码学的科学探索"},{"k":"D","t":"现代密码学的近期发展阶段。这一阶段以公钥密码思想为标志，引发了密码学历史上的革命性的变革，同时，众多的密码算法开始应用于非机密单位和商业场合"}],"answer":"B","src":"A卷·补充100题","srcNum":25,"id":"q023","analyze":"Enigma是机电式密码机，靠转轮实现多表代换，标志密码技术由手工进入机械与机电阶段，属近代密码发展阶段，故选B。A古典阶段是手工替代与置换，C以1949年香农论文为标志，D以1976年公钥思想为标志，年代均不符。","expand":"四阶段记忆：古典（手工替代/置换，凯撒、维吉尼亚）→近代（机械机电，Enigma）→现代（香农信息论，DES等对称算法）→当代（公钥密码RSA、ECC）。Enigma由波兰与英国图灵团队借助Bombe机破译。","tags":["密码学"]},{"stem":"以下关于项目的含义，理解错误的是()。","options":[{"k":"A","t":"项目是为达到特定的目的、使用一定资源、在确定的期间内、为特定发起人而提供独特的产品、服务或成果而进行的一次性努力"},{"k":"B","t":"项目有明确的开始日期，结束日期由项目的领导者根据项目进度来随机确定"},{"k":"C","t":"项目资源指完成项目所需要的人、财、物等"},{"k":"D","t":"项目目标要遵守SMART 原则，即项目的目标要求具体(Specific)、可测量(Measurable)、需相关方的一致同意(Agree to)、现实(Realistic)、有一定的时限(Time-oriented)"}],"answer":"B","src":"A卷·补充100题","srcNum":26,"id":"q024","analyze":"B错误。项目有明确起点与终点，结束日期由范围、工期与资源约束决定并经批准，不能由领导者随机确定。A给出项目定义要素，C界定项目资源，D的SMART原则表述，均符合项目管理通识。","expand":"项目与运营区别：项目一次性、独特、有明确起止；运营重复、持续。SMART：具体、可测量、可达成、相关、有时限。三约束为范围、时间、成本，与质量相互制约，是信息安全项目立项、验收与审计的基础。","tags":["安全工程与项目管理"]},{"stem":"以下关于Web 传输协议、服务端和客户端软件的安全问题说法不正确的是()。","options":[{"k":"A","t":"HTTP 协议主要存在明文传输数据、弱验证和缺乏状态跟踪等方面的安全问题"},{"k":"B","t":"HTTP 协议缺乏有效的安全机制，易导致拒绝服务、电子欺骗、嗅探等攻击"},{"k":"C","t":"Cookie 是为了辨别用户身份，进行会话跟踪而存储在用户本地终端上的数据，用户可以随意查看存储在Cookie 中的数据，但其中的内容不能被修改"},{"k":"D","t":"针对HTP 协议存在的安全问题，使用HTTPS 具有较高的安全性，可以通过证书来验证服务器的身份，并为浏览器和服务器之间的通信加密"}],"answer":"C","src":"A卷·补充100题","srcNum":27,"id":"q025","analyze":"C错误。Cookie存于客户端，用户既可查看也可通过浏览器设置或本地工具修改、伪造，这正是Cookie被篡改与会话劫持的根源，应设HttpOnly、Secure并签名。A的HTTP明文与弱鉴别、B的DoS欺骗嗅探、D的HTTPS作用均描述正确。","expand":"HTTP三大缺陷：明文传输、无状态、弱身份验证。防护：全站HTTPS、会话令牌随机化并绑定、HttpOnly与SameSite、输入输出校验。HTTPS只解决传输安全，不防XSS、CSRF与钓鱼站点伪造证书。","tags":["网络安全","软件安全"]},{"stem":"小李在某单位是负责信息安全风险管理方面工作的部门领导,主要负责对所在行业的新人进行基本业务素质培训.一次培训的时候,小李主要负责讲解风险评估方法.请问小李的所述论点中错误的是哪项()","options":[{"k":"A","t":"风险评估方法包括:定性风险分析、定量风险分析以及半定量风险分析"},{"k":"B","t":"定性风险分析需要凭借分析者的经验和直觉或者业界的标准和惯例，因此具有随意性"},{"k":"C","t":"定量风险分析试图在计算风险评估与成本效益分析期间收集的各个组成部分的具体数字值，因此更具客观性"},{"k":"D","t":"半定量风险分析技术主要指在风险分析过程中综合使用定性和定量风险分析技术对风险要素的赋值方式，实现对风险各要素的度量数值化"}],"answer":"B","src":"A卷·补充100题","srcNum":28,"id":"q026","analyze":"B错误。定性分析虽依赖经验、直觉与行业惯例，但须遵循既定标准与流程以保证结论一致可比，不能称为随意。A列出定性、定量、半定量三类，C说定量基于具体数值更具客观性，D说半定量以赋值使要素可度量，均正确。","expand":"定性：专家评审、德尔菲、头脑风暴，快但主观；定量：ALE＝SLE×ARO，精确但数据难得；半定量：按等级赋分综合，如GB/T 20984的相乘法与矩阵法。实务以半定量为主，配定性校准。","tags":["风险评估"]},{"stem":"以下关于网络安全设备说法正确的是()。","options":[{"k":"A","t":"防火墙既能实现内外网物理隔离，又能实现内外网逻辑隔离"},{"k":"B","t":"安全隔离与信息交换系统也称为网闸,需要信息交换时,同一时间可以和两个不同安全级别的网络连接"},{"k":"C","t":"入侵检测系统的主要作用是发现并报告系统中未授权或违反安全策略的行为"},{"k":"D","t":"虚拟专用网是在公共网络中。利用隧道技术，建立一个永久、安全的通信网络"}],"answer":"C","src":"A卷·补充100题","srcNum":29,"id":"q027","analyze":"C正确，IDS通过特征匹配与异常检测发现并报告未授权行为或违反安全策略的事件。A错，防火墙只能逻辑隔离，物理隔离须网闸或专网；B错，网闸同一时刻仅连接一个网络；D错，VPN是逻辑临时安全通道，并非永久网络。","expand":"设备辨析：防火墙管访问控制与逻辑隔离，网闸做物理隔离加摆渡，IDS旁路告警，IPS串联阻断，UTM多功能合一，SOC集中运营。互补关系：防火墙“防”、IDS“察”、IPS“察而后断”。","tags":["网络安全"]},{"stem":"若一个组织声称自己的ISMS 符合IS0/IEC 27001 或GB/T22080 标准要求，其信息安全控制措施通常需要在资产管理方面实施常规控制，资产管理包含对资产负责和信息分类两个控制目标。信息分类控制的目标是为了确保信息受到适当级别的保护，通常采取以下哪项控制措施()","options":[{"k":"A","t":"资产清单"},{"k":"B","t":"资产责任人"},{"k":"C","t":"资产的可接受使用"},{"k":"D","t":"分类指南、信息的标记和处理"}],"answer":"D","src":"A卷·补充100题","srcNum":30,"id":"q028","analyze":"信息分类控制目标对应分类指南、信息标记与处理，即制定分级规则、按级标记并规定使用与处置要求，故选D。A资产清单、B资产责任人、C可接受使用均属“资产责任”控制目标下的措施，不能直接实现分级保护。","expand":"ISO/IEC 27001:2013附录A含14个控制域、35个控制目标、114项措施；2022版重构为4大主题93项。资产管理对应A.8，分“资产责任”（清单、责任人、可接受使用、归还）与“信息分类”（指南、标记、处理）。","tags":["信息安全管理体系"]},{"stem":"具有行政法律责任强制力的安全管理规定和安全制度包括()(1)安全事件全故)制度2)安全等级保护制度(3)信息系统安全监控(4)安全专用产品销许可证制度","options":[{"k":"A","t":"1，2，4"},{"k":"B","t":"2，3"},{"k":"C","t":"2，3，4"},{"k":"D","t":"1，2，3"}],"answer":"A","src":"A卷·补充100题","srcNum":31,"id":"q029","analyze":"具行政强制力的安全管理制度为安全事件（事故）报告制度、计算机信息系统安全等级保护制度、安全专用产品许可证制度，即(1)(2)(4)，故选A。(3)信息系统安全监控属技术防护与运营手段，不是行政法律制度，凡含(3)的选项均排除。","expand":"我国信息安全法制层次：法律（网络安全法、数据安全法、密码法、个人信息保护法）、行政法规（计算机信息系统安全保护条例）、部门规章（等级保护管理办法、商用密码管理条例）。等级保护、许可、事件报告均为强制性要求。","tags":["信息安全标准与法规","等级保护"]},{"stem":"老王是一名企业信息化负责人，由于企业员工在浏览网页时总导致病毒感染系统，为了解决这一问题，老王求信息安全员给出解决措施，信息安全员给出了四条措施建议，老王根据多年的信息安全管理经验，认为其中不太适合推广，你认为是哪条措施()","options":[{"k":"A","t":"采购防病毒网关并部署在企业互联网出口中,实现对所有浏览网页进行检测,阻止网页中的病毒进入内网"},{"k":"B","t":"采购并统一部署企业防病毒软件，信息化管理部门统一进行病毒库升级，确保每台计算机都具备有效的病毒检测和查杀能力"},{"k":"C","t":"制定制度禁止使用微软的IE 浏览器上网，统一要求使用Chrome 浏览器"},{"k":"D","t":"组织对员工进行一次上网行为安全培训，提高企业员工在互联网浏览时的安全意识"}],"answer":"C","src":"A卷·补充100题","srcNum":32,"id":"q030","analyze":"C不宜推广。以行政手段禁用某款浏览器并强制统一，既难覆盖全部终端与业务兼容性，也挡不住其他途径的病毒进入，属一刀切且不可持续。A边界网关拦马、B统一防病毒并集中升级、D安全意识培训，均为有效且可落地的组合措施。","expand":"病毒防护分层：边界（防病毒网关、邮件过滤）、终端（防病毒＋补丁＋HIPS）、行为（培训与禁用非必要外设）、管理（制度、应急与溯源）。浏览器安全应靠版本更新、插件管控与策略加固实现，而非禁用一个品牌。","tags":["恶意代码","信息安全管理体系"]},{"stem":"关于信息安全管理体系(Information Security Management Systems,ISMS)，下面描述错误的是()。","options":[{"k":"A","t":"信息安全管理体系是组织在整体或特定范围内建立信息安全方针和目标，以及完成这些目标所用方法的体系，包括组织架构、方针、活动、职责及相关实践要素"},{"k":"B","t":"管理体系(Management Systems)是为达到组织目标的策略、程序、指南和相关资源的框架，信息安全管理体系是管理体系思想和方法在信息安全领域的应用"},{"k":"C","t":"概念上，信息安全管理体系有广义和狭义之分，狭义的信息安全管理体系是指按照IS027001 标准定义的管理体系，它是一个组织整体管理体系的组成部分"},{"k":"D","t":"同其他管理体系一样，信息安全管理体系也要建立信息安全管理组织机构、健全信息安全管理制度、构建信息安全技术防护体系和加强人员的安全意识等内容"}],"answer":"D","src":"A卷·补充100题","srcNum":33,"id":"q031","analyze":"D错误。ISMS是管理体系，核心是方针、目标、组织职责、程序文件与PDCA持续改进，而“构建技术防护体系”属具体控制措施与技术实现，不属管理体系自身构成。A定义、B管理体系内涵、C广义狭义划分，均表述正确。","expand":"ISO/IEC 27001要求组织环境、领导作用、策划、支持、运行、绩效评价、改进七章，并附附录A控制措施。ISMS文件通常含安全方针、适用范围、风险评估与处置报告、适用性声明SoA、程序文件与记录。","tags":["信息安全管理体系"]},{"stem":"Kerberos 协议是一种集中访问控制协议,它能在复杂的网络环境中,为用户提供安全的单点登录服务。单点登录是指用户在网络中进行一次身份认证,便可以访问其授权的所有网络资源，而不再需要其他的身份认证过程,实质是消息M 在多个应用系统之间的传递或共享.其中消息M 是指以下选项中的()。","options":[{"k":"A","t":"安全凭证"},{"k":"B","t":"用户名"},{"k":"C","t":"加密密钥"},{"k":"D","t":"会话密钥"}],"answer":"A","src":"A卷·补充100题","srcNum":34,"id":"q032","analyze":"单点登录中在多个应用系统间传递共享的消息M是安全凭证（票据、令牌或断言），凭它证明已完成认证，故选A。B用户名仅标识不含认证结论；C、D的密钥属密码材料，泄露危害更大，且不是跨系统传递的身份凭证。","expand":"Kerberos流程：AS发TGT→TGS发服务票据→访问服务，票据含会话密钥与时间戳，靠对称加密和时钟同步防重放。同类凭证还有SAML断言、OAuth令牌、CAS ticket。SSO风险集中于凭证窃取，需短时效、绑定与加密传输。","tags":["身份鉴别","访问控制"]},{"stem":"下列我国哪一个政策性文件明确了我国信息安全保障工作的方针和总体要求以及加强信息安全保障工作的主要原则()","options":[{"k":"A","t":"《关于加强政府信息系统安全和保密管理工作的通知》"},{"k":"B","t":"《中华人民共和国计算机信息系统安全保护条例》"},{"k":"C","t":"《国家信息化领导小组关于加强信息安全保障工作的意见》"},{"k":"D","t":"《关于开展信息安全风险评估工作的意见》"}],"answer":"C","src":"A卷·补充100题","srcNum":35,"id":"q033","analyze":"该文件为中办发〔2003〕27号《国家信息化领导小组关于加强信息安全保障工作的意见》，确立“积极防御、综合防范”方针与总体要求，故选C。A偏政府系统保密管理，B是1994年行政法规，D专指风险评估，均不承担确立总体方针职能。","expand":"政策脉络：2003年27号文确立方针原则→2004年《关于开展信息安全风险评估工作的意见》→2016年《网络安全法》→2019年GB/T 22239等级保护2.0。记忆：27号文是我国信息安全保障工作的纲领性文件。","tags":["信息安全标准与法规","信息安全管理体系"]},{"stem":"以下关于威胁建模流程步骤说法不正确的是()。","options":[{"k":"A","t":"威胁建模主要流程包括四步:确定建模对象、识别威胁、评估威胁和消减威胁"},{"k":"B","t":"评估威胁是对威胁进行分析,评估被利用和攻击发生的概率,了解被攻击后资产的受损后果,并计算风险"},{"k":"C","t":"消减威胁是根据威胁的评估结果，确定是否要消除该威胁以及消减的技术措施，可以通过重新设计直接消除威胁，或设计采用技术手段来消减威胁"},{"k":"D","t":"识别威胁是发现组件或进程存在的威胁,它可能是恶意的,也可能不是恶意的,威胁就是漏洞"}],"answer":"D","src":"A卷·补充100题","srcNum":36,"id":"q034","analyze":"D错误，把威胁等同于漏洞。威胁是可能损害资产的潜在主体或事件，有恶意也有非恶意；脆弱性才是资产自身可被利用的弱点，威胁“利用”脆弱性方产生风险。A的流程、B的评估内容、C的消减思路均表述正确。","expand":"威胁建模常用STRIDE（仿冒、篡改、否认、信息泄露、拒绝服务、提权），辅以攻击树与数据流图。四步：确定建模对象→识别威胁→评估威胁（可能性×影响）→消减威胁（消除、缓解、转移、接受）。","tags":["软件安全","风险评估"]},{"stem":"某商贸公司信息安全管理员考虑到信息系统对业务影响越来越重要，计划编制本单位信息安全应急响应预案在向主管领导写报告时，他列举了编制信息安全应急响应预案的好处和重要性，在他罗列的四条理由中，其中不适合为理由的一条是（）","options":[{"k":"A","t":"应急预案是明确关键业务系统信息安全应急响应相挥体系和工作机制的重要方式"},{"k":"B","t":"应预案是提高应对网络和信息系统突发事件能力,减少突发事件造成的损失和危害,保障信息系统运行平稳、安全、有序、高效的手段"},{"k":"C","t":"编制应急预案是国家网络安全法对所有单位的强制要求，因此必须建设"},{"k":"D","t":"应急预案是保障单位业务系统信息安全的重要措施"}],"answer":"C","src":"A卷·补充100题","srcNum":37,"id":"q035","analyze":"C不适合。《网络安全法》仅要求网络运营者、关键信息基础设施运营者制定应急预案并演练，并非对所有单位无差别强制；以错误的法律强制口径作为理由，反而削弱说服力。A机制、B能力与减损、D保障作用，均属正当理由。","expand":"相关条款：第二十一条等级保护、第二十五条应急预案与事件处置、第五十九条罚则；CII另适用《关键信息基础设施安全保护条例》。预案要素含组织指挥、分级响应、处置流程、报告通报、演练与评审改进。","tags":["应急响应","信息安全标准与法规"]},{"stem":"在某次信息安全应急响应过程中，小王正在实施如下措施:消除或阻断攻击源、找到并消除系统的脆弱性/漏洞、修改安全策略、加强防范措施、格式化被感染恶意程序的介质等。请问，按照PDCERF 应急响应方法，这些工作应处于以下哪个阶段)","options":[{"k":"A","t":"准备阶段"},{"k":"B","t":"检测阶段"},{"k":"C","t":"遏制阶段"},{"k":"D","t":"根除阶段"}],"answer":"D","src":"A卷·补充100题","srcNum":39,"id":"q036","analyze":"属根除阶段。消除或阻断攻击源、修补被利用漏洞、修改安全策略、加强防范、格式化被感染介质，均意在清除威胁根源、防止复发，故选D。A为事前准备，B为发现研判，C为限制扩散与损失，与题干动作层次不同。","expand":"PDCERF六阶段：准备、检测、遏制、根除、恢复、跟踪总结。遏制重止损隔离，根除重断根加固。与NIST SP 800-61的四大阶段（准备、检测分析、遏制根除恢复、事后活动）可对照理解。","tags":["应急响应"]},{"stem":"关于对信息安全事件进行分类分级管理的原因描述不正确的是().","options":[{"k":"A","t":"信息安全事件的种类很多，产重程度也不尽相同，其响应和处理方式也应各不相同"},{"k":"B","t":"对信息安全事件进行分类和分级管理，是有效防范和响应信息安全事件的基础"},{"k":"C","t":"能够使事前准备、事中应对和事后处理的各项相关工作更具针对性和有效性"},{"k":"D","t":"我国早期的计算机安全事件的应急响应工作主要包括计算机病毒防范和“千年虫”问题的解决，关于网络安全应急响应的起步最早"}],"answer":"D","src":"A卷·补充100题","srcNum":41,"id":"q037","analyze":"D不是分类分级管理的原因，而是对我国应急响应历史的叙述，且“起步最早”表述失真——早期以病毒防范与千年虫为主，恰说明当时网络安全应急尚在起步。A说明事件多样需差异响应，B、C说明其基础地位与针对性作用，均为正确原因。","expand":"事件可按有害程序、网络攻击、信息破坏、信息泄露、设施故障、灾害性事件分类；按特别重大、重大、较大、一般分级。分级结果决定响应级别、资源投入、通报范围与演练要求。","tags":["应急响应"]},{"stem":"某集团公司信息安全管理员根据领导安排制定了下一年度的培训工作计划，提出了四大培训任务和目标，关于这四个培训任务和目标，作为主管领导，以下选项中不合理的是()","options":[{"k":"A","t":"由于网络安全上升到国家安全的高度，网络安全必须得到足够的重视。因此安排了对集团公司下属单位的总经理(一把手)的网络安全法培训"},{"k":"B","t":"对下级单位的网络安全管理岗人员实施全面安全培训，建议通过CISP 培训以确保人员能力得到保障"},{"k":"C","t":"对其他信息化相关人员(网络管理员、软件开发人员)也进行安全基础培训，使相关人员对网络安全有所了解"},{"k":"D","t":"对全体员工安排信息安全意识及基础安全知识培训，实现全员信息安全意识教育"}],"answer":"C","src":"A卷·补充100题","srcNum":42,"id":"q038","analyze":"C不合理。对网络管理员、软件开发人员等信息化岗位人员，仅做基础培训、使之“有所了解”远不足够，应按岗位开展专业培训，如运维加固、安全编码、CISP/CISP-DSG等。A一把手法规培训、B管理岗系统培训、D全员意识教育定位恰当。","expand":"培训分层：全员重意识与常识、岗位人员重专业技能、管理层重法规责任与决策、决策层重战略与投入。培训须有考核评估并常态化，配合演练与通报，避免一次性运动式教育。CISP属国家注册资质培训，适合安全管理岗位而非泛泛普及。","tags":["信息安全管理体系"]},{"stem":"金女士经常通过计算机在互联网上购物，从安全角度看，下面哪项是不好的操作习惯()","options":[{"k":"A","t":"使用专用上网购物用计算机，安装好软件后不要对该计算机上的系统软件、应用软件进行升级"},{"k":"B","t":"为计算机安装具有良好声誉的安全防护软件，包括病毒查杀、安全检查和安全加固方面的软件"},{"k":"C","t":"在IE 的配置中，设置只能下载和安装经过签名的、安全的ActiveX 控件"},{"k":"D","t":"在使用网络浏览器时，设置不在计算机中保留网络历史记录和表单数据"}],"answer":"A","src":"A卷·补充100题","srcNum":43,"id":"q039","analyze":"A是不良习惯。系统与应用软件不升级意味着漏洞长期不修补，木马、勒索可轻易利用已公开漏洞入侵，正确做法是及时安装补丁并保持更新。B安装防护软件、C限制未签名ActiveX控件、D不保留历史与表单数据，均为有效防护。","expand":"个人安全上网要点：及时打补丁、使用正版并开自动更新、核对HTTPS地址与证书、不点陌生链接附件、独立账户与强口令、敏感操作用专用设备。控件签名限制是IE时代做法，现多用浏览器沙箱与最小权限。","tags":["操作系统安全","恶意代码"]},{"stem":"在国家标准GB/T 20274.1-2006《信息安全技术信息系统安全保障评估框架第一部分:简介和一般模型》中，信息系统安全保障模型包含哪几个方面?()","options":[{"k":"A","t":"保障要素、生命周期和运行维护"},{"k":"B","t":"保障要素、生命周期和安全特征"},{"k":"C","t":"规划组织、生命周期和安全特征"},{"k":"D","t":"规划组织、生命周期和运行维护"}],"answer":"B","src":"A卷·补充100题","srcNum":44,"id":"q040","analyze":"GB/T 20274.1-2006的安全保障模型由保障要素、生命周期与安全特征三方面构成：要素覆盖技术、管理、人员，生命周期贯穿规划至废弃，安全特征即保密性、完整性、可用性等，故选B。A、C、D混入了“运行维护”“规划组织”等阶段概念。","expand":"该系列：20274.1简介与一般模型，其余分部细化保障要素与能力级别评估。与GB/T 18336（CC，面向IT产品与系统的安全保证）区分：20274面向整个信息系统的安全保障能力评估。","tags":["信息安全标准与法规","安全工程与项目管理"]},{"stem":"某信息安全公司的团队对某款名为“红包快抢”的外挂进行分析，发现此外挂是一个典型的木马后门，使黑客能够获得受害者电脑的访问权。该后门程序为了达到长期驻留在受害者的计算机中，通过修改注册表启动项来达到后门程序随受害者计算机系统启动而启动。为防范此类木马后门的攻击，以下做法无用的是()。","options":[{"k":"A","t":"不下载、不执行、不接收来历不明的软件或文件"},{"k":"B","t":"修改用户名和口令"},{"k":"C","t":"不随意打开来历不明的邮件，不浏览不健康不正规的网站"},{"k":"D","t":"安装反病毒软件和防火墙，安装专门的木马防治软件"}],"answer":"B","src":"A卷·补充100题","srcNum":45,"id":"q041","analyze":"B无防范作用。木马靠注册表启动项实现自启动，攻击者已获访问权，仅修改本机用户名口令既不阻断驻留也不能清除后门，改后仍会被窃取凭证。A断源、C防诱饵、D用反病毒与木马专杀检测清除，均属有效防范。","expand":"后门排查点：注册表Run/RunOnce、服务、计划任务、启动文件夹、WMI订阅、映像劫持。处置：断网取证→查杀清除→删除启动项→重置口令凭证→必要时重装加固。随机进程名属免杀手段，不能凭进程名判断安全。","tags":["恶意代码","操作系统安全"]},{"stem":"若一个组织声称自己的ISMS 符合ISO/IEC27001 或GB/T22080 标准要求,其信息安全控制措施通常需要在物理和环境安全方面实施常规控制。物理和环境安全领域包括安全区域和设备安全两个控制目标。安全区域的控制目标是防止对组织场所和信息的未授权物理访问、损坏和干扰，关键或敏感的信息及信息处理设施应放在安全区域内,并受到相应保护,该目标可以通过以下控制措施来实现,不包括哪一项()","options":[{"k":"A","t":"物理安全边界、物理入口控制"},{"k":"B","t":"办公室、房间和设施的安全保护，外部和环境威胁的安全防护"},{"k":"C","t":"通信安全、合规性"},{"k":"D","t":"在安全区域工作，公共访问、交接区安全"}],"answer":"C","src":"A卷·补充100题","srcNum":46,"id":"q042","analyze":"C不包括。通信安全（网络安全管理、信息传输安全）与合规性（法律法规符合、记录保护）属其他控制域，不属安全区域控制措施。A物理边界与入口控制、B办公场所与外部环境威胁防护、D区域内工作与交接区管理，均为安全区域内容。","expand":"ISO 27001物理与环境安全含“安全区域”与“设备安全”两目标：安全区域管人（边界、入口、陪同、交接区），设备安全管物（放置、供电、布线、维护、离场、清屏）。易混：通信安全属通信与运行管理域。","tags":["物理与环境安全","信息安全管理体系"]},{"stem":"常见的访问控制模型包括自主访问控制模型、强制访问控制模型和基于角色的访问控制模型等。下面描述中错误的是()。","options":[{"k":"A","t":"从安全性等级来看，这三个模型安全性从低到高的排序是自主访问控制模型、强制访问控制模型和基于角色的访问控制模型"},{"k":"B","t":"自主访问控制是一种广泛应用的方法，资源的所有者(往往也是创建者)可以规定谁有权访问它们的资源，具有较好的易用性和可扩展性"},{"k":"C","t":"强制访问控制模型要求主体和客体都有一个固定的安全属性，系统用该安全属性来决定一个主体是否可以访问某个客体。该模型具有一定的抗恶意程序攻击能力，适用于专用或安全性要求较高的系统"},{"k":"D","t":"基于角色的访问控制模型的基本思想是根据用户所担任的角色来决定用户在系统中的访问权限，该模型便于实施授权管理和安全约束，容易实现最小特权、职责分离等各种安全策略"}],"answer":"A","src":"A卷·补充100题","srcNum":47,"id":"q043","analyze":"A错误。三模型不能简单按低到高线性排序：DAC授权分散、安全性最低；MAC基于强制安全标记、抗恶意程序，安全性最高；RBAC以角色授权，优势在管理效率与策略表达，并非“最高”。B、C、D对各自特点描述准确。","expand":"DAC：主体可自主授权（ACL、能力表），权限易扩散；MAC：BLP模型“不上读、不下写”保机密，Biba模型保完整性；RBAC：用户—角色—权限三级映射，可承载最小特权与职责分离；另有ABAC按属性动态决策。","tags":["访问控制"]},{"stem":"PDC 循环又叫戴明环，是管理学常用的一种模型。关于PDCA 四个字母，下面理解错误的是（）。","options":[{"k":"A","t":"P 是Prepare，指准备，包括明确对象、方法，制定活动规划"},{"k":"B","t":"D 是Do，指实施、月体运作，实现计划中的内容"},{"k":"C","t":"c 是Check，指检查、总结执行计划的结果，明确效果，找出问题"},{"k":"D","t":"A 是Act 或Adjut.指改进、完善和处理,对总结检查的结果进行处理。对成功的经验加以肯定,并予以标准化,总结失败的教训并加以重视,对没有解决的问题，应该交给下一个PDCA 环解决"}],"answer":"A","src":"A卷·补充100题","srcNum":48,"id":"q044","analyze":"A错误。PDCA的P是Plan（计划），指确定目标、分析现状、制定计划与方案，“准备”只是通俗引申而非原义。B的Do实施、C的Check检查、D的Act处置改进（标准化成功经验、遗留问题转入下一循环）表述均正确。","expand":"戴明环核心是计划—实施—检查—处置的闭环上升与持续改进，是ISO 27001、ISO 9001等管理体系的通用框架。易混：PDCERF是应急响应六阶段，PDCA是管理改进循环，二者层级不同但可嵌套。","tags":["信息安全管理体系"]},{"stem":"小华在某电子商务公司工作。某天他在查看信息系统设计文档时，发现其中标注该信息系统的RPO(恢复点目标)指标为3 小时，请同这意味着()。","options":[{"k":"A","t":"该信息系统发生重大信息安全事件后，工作人员应在3 小时内到位，完成问题定位和应急处理工作"},{"k":"B","t":"该信息系统发生重大信息安全事件后，工作人员应在3 小时内完成应急处理工作，并恢复对外运行"},{"k":"C","t":"若该信总系统发生重大信息安全事件，工作人员在完成处置和灾难恢复工作后，系统至多能丢失3 小时的业务类"},{"k":"D","t":"若该信息系统发生重大信息安全事件，工作人员在完成处置和灾难恢复工作后，系统运行3 小时后能恢复全部数"}],"answer":"C","src":"A卷·补充100题","srcNum":49,"id":"q045","analyze":"RPO指可容忍的数据丢失上限，3小时即灾难后最多丢失最近3小时的业务数据，故选C。A、B描述的是响应到场与恢复运行的时限，属RTO范畴；D把RPO曲解为恢复后再过3小时才恢复全部数据，逻辑不成立。","expand":"RPO对应备份与复制频率（增量间隔应≤RPO），RTO对应冗余切换时间（切换应≤RTO）。指标越小成本越高，需在业务影响分析BIA中权衡。SLE/ALE算损失，RTO/RPO定恢复要求，属不同维度。","tags":["业务连续性与灾难恢复"]},{"stem":"随机进程名称是恶意代码迷惑管理员和系统安全检查人员的技术手段之一，以下对于随机进程名技术。描述正确的是()。","options":[{"k":"A","t":"随机进程名技术虽然每次进程名都是随机的，但是只要找到了进程名称，就找到了恶意代码程序本身"},{"k":"B","t":"恶意代码生成随机进程名称的目的是使进程名称不固定，因为杀毒软件是按进程名称进行病毒进程查杀，"},{"k":"C","t":"恶意代码使用随机进程名是通过生成特定格式的进程名称，使进程管理器中看不到恶意代码的进程"},{"k":"D","t":"随机进程名技术每次启动时随机生成恶意代码进程名称，通过不确定的进程名称使自己不容易被发现真实的恶意代码程序名称。"}],"answer":"D","src":"A卷·补充100题","srcNum":50,"id":"q046","analyze":"D正确。该类木马每次启动随机生成进程名，使管理员与安全检查人员无法凭固定进程名识别查杀，从而延长潜伏期。A误以为找到进程名即找到程序本体；B错误归因于杀软按名查杀；C称进程不可见也错，进程仍在列表中可见。","expand":"恶意代码隐藏手段：进程、文件、服务名伪装，进程注入，Rootkit，多进程互护，加壳混淆，白利用，无文件攻击。检测转向行为与内存取证：哈希与签名、父进程链、外联地址、启动项异常、Autoruns排查。","tags":["恶意代码"]},{"stem":"小王在学为定最风险评站方法后，快定试着为单位机房计算火灾的风险大小、假设单位机房的总价值为400 万元人民币、桑露系数(Exposure Factor,6F)是25%，年度发生率(Annualined Rate of Oecurrence, ARO)为0.2、那么小王计算的年度预期损失(Annualined Loss xpectancy，ALE)应该是()、","options":[{"k":"A","t":"100 万元人民币"},{"k":"B","t":"400 万元人民币"},{"k":"C","t":"20 万元人民币"},{"k":"D","t":"180 万元人民币"}],"answer":"C","src":"A卷·补充100题","srcNum":51,"id":"q047","analyze":"ALE＝SLE×ARO，SLE＝资产价值×暴露系数＝400×25%＝100万元，故ALE＝100×0.2＝20万元，选C。A混淆SLE与ALE，B未乘任何系数，D把两系数相乘后再叠加，均为公式误用。","expand":"公式链：AV资产价值→EF暴露系数→SLE＝AV×EF单次预期损失→ARO年发生率→ALE＝SLE×ARO年度预期损失。据此比较安全措施经济性：措施带来的ALE降低额大于投入成本即可行。","tags":["风险评估"]},{"stem":"应急响应是信息安全事件管理的重要内容、基于应急响应工作的特点和事件的不规则性，事先制定出事件应急响应方法和过程，有助于一个组织在事件发生时院止混乱的发生成是在混配状态中迅速恢复控制，将损失和负面影响降到最低，应急响应方法和过程并不是唯一的，一种被广为按受的应急响应方法是将应急响应管理过程分为6 个阶段，为准备>检测>送制>根除>>快复>跟踪总结，请问下列说法有关于信息安全应急响应管理过程错误的是","options":[{"k":"A","t":"确定重要资产和风险，实施针对风险的防护措施是信息安全应想响应规划过程中最关健的步理"},{"k":"B","t":"在检测阶段，首先要进行监测、报告及信息收集"},{"k":"C","t":"遏制措施可能会因为事件的类别和级别不同而完全不同。常见的遏制措施有:完全关闭所有系统、拔掉网线等"},{"k":"D","t":"应按照应急响应计划中事先制定的业务恢复优先顺序和恢复步骤，顺次恢复相关的系统"}],"answer":"C","src":"A卷·补充100题","srcNum":52,"id":"q048","analyze":"C表述不当。遏制以控制扩散、保留现场为目标，常见做法是隔离受影响网段、限制连接、修改边界策略、拔网线或禁用账户；“完全关闭所有系统”会扩大业务中断并破坏取证条件，不是普遍适用的遏制措施。A、B、D符合响应要求。","expand":"六阶段动作：准备（预案工具演练）、检测（监测报告研判）、遏制（隔离止损）、根除（清马补漏）、恢复（按优先级恢复并验证）、跟踪总结（复盘改进）。遏制应遵循最小必要干预，先评估影响范围再动手。","tags":["应急响应"]},{"stem":"某购物网站开发项目经过需求分析进入系统设计阶段，为了保证用户帐户的安全，项目开发人员决定用户登录时除了用户名口令认证方式外，还加入基于数字证书的身份认证功能，同时用户口令使用SHA-1 算法加密后存放在后台数据库中，请问以上安全设计遵循的是哪项安全设计原则()","options":[{"k":"A","t":"最小特权原则"},{"k":"B","t":"职责分离原则织"},{"k":"C","t":"深防御原则"},{"k":"D","t":"最少共享机制原则"}],"answer":"C","src":"A卷·补充100题","srcNum":53,"id":"q049","analyze":"口令与数字证书双因素认证，叠加口令加盐哈希存储，多层设防，属纵深防御（深防御）原则，故选C。A最小特权关注权限最小化，B职责分离关注不相容职责分设，D最少共享机制关注减少共用通道与资源，均不描述多层防护。","expand":"安全设计原则：最小特权、职责分离、纵深防御、最少共享机制、默认拒绝、失败安全、完全中介、开放设计。口令存储演进：明文→MD5→加盐SHA-1→bcrypt/PBKDF2/Argon2，SHA-1已不宜用于凭证保护。","tags":["软件安全","身份鉴别"]},{"stem":"在信息安全险管理过程中，背景建立是实施工作的第一步、下面哪项理解是错误的().","options":[{"k":"A","t":"背景建立的依据是国家、地区或行业的相关政策、法律、法规和标准，以及机构的使命、信息系统的业务目标和特性"},{"k":"B","t":"背景建立阶段应识别需要保护的资产、面临的威胁以及存在的脆弱性，并分别赋值，同时确认已有的安全措施，形成需要保护的资产清单"},{"k":"C","t":"背景建立阶段应调查信息系统的业务目标、业务特性、管理特性和技术特性，形成信息系统的描述报告求报告"},{"k":"D","t":"背景建立阶段应分析信息系统的体系结构和关健要索，分析信息系统的安全环境和要求，形成信息系统的安全要"}],"answer":"B","src":"A卷·补充100题","srcNum":54,"id":"q050","analyze":"B错误。识别需保护资产、面临威胁与脆弱性并赋值、确认已有措施，属风险评估的风险识别与分析环节，不是背景建立内容。A给出背景建立依据，C、D说明应调查业务与管理技术特性、分析体系结构与安全要求，均属背景建立。","expand":"GB/T 20984步骤：背景建立→风险识别（资产、威胁、脆弱性、已有措施）→风险分析（可能性×影响）→风险评价（定级）→风险处置（规避、降低、转移、接受）。背景建立产出系统描述报告与安全需求报告。","tags":["风险评估"]},{"stem":"超文本传输协议(HyperText Transfer Protocol，HTTP)是互联网上广泛使用的一种网络协议。下面哪种协议基于HTIP 并结合SSL 协议，具各用户鉴别和通信数据加密等功能()、","options":[{"k":"A","t":"HTTP 1.0 协议"},{"k":"B","t":"HTTP 1.1 协议"},{"k":"C","t":"HTTPS 协议"},{"k":"D","t":"HTTPD 协议"}],"answer":"C","src":"A卷·补充100题","srcNum":55,"id":"q051","analyze":"HTTPS即HTTP over SSL/TLS，兼具证书验证服务器身份与通信加密，故选C。HTTP/1.0与1.1只改进连接复用、缓存与主机头等，本身无加密与鉴别能力；D的HTTPD是Web服务守护进程名称，并非协议。","expand":"HTTPS默认443端口，经CA证书链验证服务器身份，握手协商会话密钥后用对称算法加密传输。局限：不防客户端被控、不防站点本身恶意，也不等于合规，仍需HSTS、证书固定、安全配置与版本加固。","tags":["网络安全","密码学"]},{"stem":"“统一威胁管理”是将防病毒、入侵检测和防火墙等安全需求统一管理，目前市场上已经出现了多种此类安全设备，这里“统一威胁管理”常常被简称为()。","options":[{"k":"A","t":"UTM"},{"k":"B","t":"FW"},{"k":"C","t":"IDS"},{"k":"D","t":"SOC"}],"answer":"A","src":"A卷·补充100题","srcNum":56,"id":"q052","analyze":"统一威胁管理简称UTM，将防火墙、防病毒、入侵检测防御、反垃圾邮件等集成于一体，故选A。B的FW仅指防火墙，C的IDS仅指入侵检测，D的SOC是安全运营中心/管理平台，均非统一威胁管理的缩写。","expand":"UTM与NGFW区别：UTM强调多功能集成、适合中小场景；NGFW强调应用识别、用户识别与内容检测的深度融合。相关缩写：IDS/IPS、WAF、VPN、SIEM（安全信息与事件管理）、SOC（安全运营中心）。","tags":["网络安全"]},{"stem":"以下关于Windows 操作系统身份标识与签别，说法不正确的是().","options":[{"k":"A","t":"本地安全授权机构(LSA)生成用户账户在该系统内唯一的安全标识符(SID)"},{"k":"B","t":"用户对鉴别信息的操作，如更改密码等都通过一个以Administrator 权限运行的服务“Security Account Manager”来实现"},{"k":"C","t":"Windows 操作系统远程登录经历了SMB 签别机制、LM 签别机制、NTLM 鉴别机制、Kerberos 签别体系等阶段"},{"k":"D","t":"完整的安全标识符(SID)包括用户和组的安全描述，48 比特的身份特权、修订版本和可变的验证值"}],"answer":"B","src":"A卷·补充100题","srcNum":57,"id":"q053","analyze":"B错误。SAM是以SYSTEM权限运行的账户数据库服务，并非以Administrator权限运行；若以管理员权限运行，其数据库早可被直接读取窃取。A关于LSA生成SID、C关于鉴别机制演进、D关于SID组成，表述基本正确。","expand":"Windows鉴别演进：SMB共享口令→LM（DES，易破解）→NTLM（挑战响应，可中继）→Kerberos（域环境，票据加时间戳）。SID形如S-1-5-21-域标识-相对标识符，LSA负责本地安全策略与访问令牌生成。","tags":["操作系统安全","身份鉴别"]},{"stem":"王工是某单位的系统管理员，他在某次参加了单位组织的风险管理工作时，发现当前案例中共有两个重要资产:资产A1 和资产2:其中资产A1 面临两个主要威胁:威胁T1 和威胁T2;而资产A2 面临一个主要胁:威胁T3:威胁T1 可以利用的资产A1 存在的两个脆弱性:脆弱性V1 和脆弱性V2:威胁T2可以利用的资产A1 存在的三个脆弱性，脆弱性V3、脆弱性V4 和脆弱性V5:威胁T3 可以利用的资产A2存在的两个脆性:脆弱性V6 和脆弱性V7. 根据上述条件，请问:使用相乘法时，应该为资产A1 计算几个风险值()","options":[{"k":"A","t":"2"},{"k":"B","t":"3"},{"k":"C","t":"5"},{"k":"D","t":"6"}],"answer":"C","src":"A卷·补充100题","srcNum":58,"id":"q054","analyze":"相乘法中每个“威胁—脆弱性”配对构成一个风险值。资产A1上T1可利用V1、V2得2个，T2可利用V3、V4、V5得3个，合计5个，故选C。A只数威胁个数，B只数T2的脆弱性，D把A2的V6、V7也计入，均不符。","expand":"相乘法：风险值由资产价值、威胁可能性、脆弱性严重程度综合，按“资产×威胁×脆弱性”三元组逐一配对计算再汇总。矩阵法则两两要素构造矩阵取交点。前提是先完成资产、威胁、脆弱性识别与赋值。","tags":["风险评估"]},{"stem":"以下有关系统工程说法错误的是()。","options":[{"k":"A","t":"系统工程不属于基本理论，也不属于技术基础，它研究的重点是方法论"},{"k":"B","t":"系统工程的目的是实现总体效果最优化，即从复杂问题的总体入手，认为总体大于各部分之和，各部分虽然存在不足，但总体可以优化"},{"k":"C","t":"系统工程只需使用定量分析的方法，通过建立实际对象的数学模型，应用合适的优化算法对模型求解，解决实际问题"},{"k":"D","t":"霍尔三维结构将系统工程整个活动过程分为前后紧密衔接的7 个阶段和7 个步骤"}],"answer":"C","src":"A卷·补充100题","srcNum":59,"id":"q055","analyze":"C错误。系统工程既用定量分析（建模、优化求解），也须结合定性分析（专家判断、经验类比），是定性定量相结合的方法论，单靠数学模型难以处理复杂系统。A的学科定位、B的总体大于部分之和、D的霍尔三维结构均正确。","expand":"霍尔三维结构：时间维7阶段（规划、方案、研制、生产、安装、运行、更新）、逻辑维7步骤（问题定义、目标确定、方案综合、系统分析、优化、决策、实施）、知识维各专业学科。对比切克兰德软系统方法论重共识与人类活动。","tags":["安全工程与项目管理"]},{"stem":"某单位根据业务需要准备立项开发一个业务软件，对于软件开发安全投入经费研讨时开发部门和信息中心就发生了分歧，开发部门认为开发阶段无需投入，软件开发完成后发现问题后再针对性的解决，比前期安全投入要成本更低;信息中心则认为应在软件安全开发阶段投入，后期解决代价太大，双方争执不下，作为信息安全专家，请选择对软件开发安全投入的准确说法()","options":[{"k":"A","t":"双方的说法都正确,需要根据具体情况分析是开发阶段投入解决问题还是在上线后再解决问题费用更低"},{"k":"B","t":"双方的说法都错误，软件安全问题在任何时候投入解决都可以，只要是一样的问题，解决的代价相同"},{"k":"C","t":"信息中心的考虑是正确的，在软件开发需求分析阶段开始考虑安全问题，总体经费投入比软件运行后的费用要低"},{"k":"D","t":"软件开发部门的说法是正确的，因为软件出现安全问题后更清楚问题所在，安排人员进行代码修订更简单，因此费用更低"}],"answer":"C","src":"A卷·补充100题","srcNum":60,"id":"q056","analyze":"C正确。安全投入越早越省：需求分析阶段即引入安全需求与设计约束，改动成本最低；上线后修复需改代码、回归测试、停机与应急处置，代价成倍增加，且可能已造成数据泄露。A以“依情况”取消结论，B否认阶段差异，D方向相反。","expand":"修复成本随阶段递增的经验规律：需求1倍→设计3倍→编码5倍→测试10倍→上线后数十倍。落地：安全需求入规格、威胁建模与安全设计评审、安全编码规范、代码审计与渗透测试、上线前安全验收、SDL/DevSecOps。","tags":["软件安全","安全工程与项目管理"]},{"stem":"某单位门户网站开发完成后，测试人员使用模糊测试进行安全性测试，以下关于模糊测试过程的说法正确的是()","options":[{"k":"A","t":"模拟正常用户输入行为，生成大量数据包作为测试用例"},{"k":"B","t":"数据处理点、数据通道的入口点和可信边界点往往不是测试对象"},{"k":"C","t":"监测和记录输入数据后程序正常运行的情况"},{"k":"D","t":"深入分析网站测试过程中产生崩溃或异常的原因，必要时需要测试人员手工重现并分析"}],"answer":"D","src":"A卷·补充100题","srcNum":61,"id":"q057","analyze":"D正确。模糊测试以异常畸形输入触发崩溃与异常，须对崩溃、挂起做原因分析，必要时人工复现定位，方能转为可修复漏洞。A错，其基于变异或生成异常数据而非模拟正常输入；B错，入口点与信任边界正是重点对象；C错，应关注异常而非正常运行。","expand":"模糊测试要素：种子语料与变异策略、插桩与覆盖率引导、崩溃监测（ASAN、调试器）、可复现性。与渗透测试（人工定向利用）、代码审计（白盒静态）区别。常用工具AFL、libFuzzer、Burp Intruder。","tags":["软件安全"]},{"stem":"我国等级保护政策发展的正确顺序是()。1 等级保护相关政策文件颁布2 计算机系统安全保护等级划分思想提出3 等级保护相关标准发布4 网络安全法将等级保护制度作为基本国策5 等级保护工作试点","options":[{"k":"A","t":"12345"},{"k":"B","t":"23154"},{"k":"C","t":"25134"},{"k":"D","t":"12435"}],"answer":"C","src":"A卷·补充100题","srcNum":62,"id":"q058","analyze":"正确顺序是先有等级划分思想（1994年条例确立分等级保护思路），再开展试点，随后颁布政策性文件（2003年27号文等），继而发布配套标准，最后由2017年《网络安全法》将其上升为基本制度，即25134。A、D把政策文件排在试点和标准之前，B把标准与法律的先后颠倒，均不符合实际脉络。","expand":"记忆主线：思想（1994年《计算机信息系统安全保护条例》）—试点（1998至2000年公安部试点）—文件（2003年中办27号文、2004年公通字66号）—标准（GB 17859、GB/T 22239等）—法律（网络安全法第21条）。规律是政策先于标准、标准先于立法。","tags":["等级保护","信息安全标准与法规"]},{"stem":"<国家信息化领等小组关于加强信息安全保障工作的意见》中办发[2003127 号明的了我国信息安全保障工作的()、加强信息安全保障工作的()、需要重点加强的信息安全保障工作。27 号文的重大意义是，它标志着我医信息安全保障工作有了、我国最近十余年的信息安全保障工作都是围绕此政策性文件来()的、促进了我国()的各项工作。","options":[{"k":"A","t":"方针;主要原则，总体纲领;展开和推进:信息安全保障建设总体要求:"},{"k":"B","t":"总体要求:主要原则;展开;信息安全保障建设"},{"k":"C","t":"方针和总体要求:主要原则;总体纲领:展开和推进;信息安全保障建设"},{"k":"D","t":"总体要求:主要原则;总体纲领;展开;信息安全保建设"}],"answer":"C","src":"A卷·补充100题","srcNum":63,"id":"q059","analyze":"27号文明确了我国信息安全保障工作的方针和总体要求、加强工作的主要原则以及需要重点加强的领域，标志着信息安全保障工作有了总体纲领，此后十余年工作围绕其展开和推进，促进了信息安全保障建设。C项五个空位全部对应，其余选项把方针、纲领、展开等要素错位或缺项。","expand":"中办发〔2003〕27号提出积极防御、综合防范的方针，确立谁主管谁负责、谁运营谁负责原则，并部署等级保护、风险评估、应急响应等基础工作。配套文件有公通字〔2004〕66号实施意见，是等级保护与ISMS落地的政策源头。","tags":["信息安全标准与法规","等级保护"]},{"stem":"Linux 系统的安全设置主要从磁盘分区、账户安全设置、禁用危险服务、远程登录安全、用户鉴别安全、审计策略、保护root 账户、使用网络防火墙和文件权限操作共10 个方面来完成。小张在学习了Linux 系统安全的相关知识后，分试为自己计算机上的Linux 系统进行安全配置。下列选项是他的部分操作，其中不合理的是()。","options":[{"k":"A","t":"编辑文件/etc/passwd，检查文件中用户1D，禁用所有用户ID=0 的用户"},{"k":"B","t":"编辑文件/etc/ssh/sshd_config，将PermitRootLogin 设置为no"},{"k":"C","t":"编辑文件/ete/pam.d/systemauth ，设置auth required pam_tally.so onerrufail deny 6 unlock_time-300"},{"k":"D","t":"编辑文件/etc /profile，设置TMOUT-600"}],"answer":"A","src":"A卷·补充100题","srcNum":64,"id":"q060","analyze":"/etc/passwd中UID为0的账户除root外多为后门账户，若禁用所有UID=0的用户会连同root一并停用，导致系统无法正常管理，故A不合理。B禁止root远程登录、C用pam_tally限制失败次数并锁定、D设置TMOUT超时，都是常规的账户与鉴别加固措施。","expand":"加固十方面可归纳为分区、账户、服务、远程登录、鉴别、审计、root保护、防火墙、文件权限。排查要点是找出UID=0却非root的账户并锁定而非删除；/etc/passwd只存账户信息，口令存于/etc/shadow。原则是先保证root可用，再收缩其暴露面。","tags":["操作系统安全"]},{"stem":"某单位在一次信息安全风险管理活动中，风险评估报告提出服务器的FIP 服务存在高风险漏洞。随后该单位在风险处理时选择了安装FTP 服务洞补丁程序并加固FTP 服务安全措施，请问该措施属于哪种风险处理方式","options":[{"k":"A","t":"风险降低"},{"k":"B","t":"风险规避"},{"k":"C","t":"风险转移"},{"k":"D","t":"风险接受"}],"answer":"A","src":"A卷·补充100题","srcNum":65,"id":"q061","analyze":"安装补丁、加固服务配置直接消除了脆弱性，使威胁难以利用，属于降低风险发生的可能性，即风险降低。风险规避是放弃业务或功能，风险转移依靠保险、外包等手段，风险接受是不处理并承担残余风险。题干仍保留FTP服务，只是使其更安全，因此只能是降低。","expand":"四类处置对照：降低（补丁、加固、加密）、规避（停用功能、下线业务）、转移（保险、外包、合同条款）、接受（残余风险在可接受范围内）。口诀：业务还在只是更安全是降低，业务不做了是规避，让别人承担是转移，记录备案不处理是接受。","tags":["风险评估"]},{"stem":"关子ARP 欺骗原理和防范措施,下面理解错误的是().","options":[{"k":"A","t":"ARP 欺骗是指攻击者直接向受害者主机发送错误的ARP 应答报文,使得受害者主机将错误的硬件地址映射关系有入到ARP 缓存中,从而起到冒充主机的目的"},{"k":"B","t":"单纯利用ARP 欺骗攻击时,ARP 欺骗通常影响的是内部子网，不能跨越路由实施攻击"},{"k":"C","t":"解决ARP 欺骗的一个有效方法是采用“静态”的ARP 缓存,如果发生硬件地址的更改,则需要人工更新缓存"},{"k":"D","t":"彻底解决ARP 欺骗的方法是避免使用ARP 协议和ARP 缓存，直接采用IP 地址和其他主机进行连接"}],"answer":"D","src":"A卷·补充100题","srcNum":67,"id":"q062","analyze":"ARP负责IP到MAC的解析，以太网主机通信离不开ARP缓存，取消ARP而直接以IP地址连接在二层网络中无法实现，故D错误。A是ARP欺骗的典型原理，B正确，ARP报文不跨路由只影响本地子网，C的静态绑定加人工维护是有效缓解手段。","expand":"常见防护包括静态ARP绑定、ARP防护网关或动态ARP检测、交换机端口安全、划分VLAN缩小广播域。注意区分缓解与根除：静态绑定可防欺骗但维护成本高，目前没有完全免疫的方案，还需配合监测发现异常MAC变更。","tags":["网络安全"]},{"stem":"由于频繁出现软件运行时被照客远程攻击获取数据的现象，某软件公司准备加强软件安全开发管理，在下面做法中，对于解决问题没有直接帮助的是()。","options":[{"k":"A","t":"要求所有的开发人员参加软件安全意识培调"},{"k":"B","t":"要求规范软件编码，并制定公司的安全编码准则"},{"k":"C","t":"要求增加软件安全测试环节，尽早发现软件安全问题"},{"k":"D","t":"要求用windows10 系统做开发"}],"answer":"D","src":"A卷·补充100题","srcNum":68,"id":"q063","analyze":"威胁源自软件自身漏洞被远程利用，对策应落在意识培训、安全编码规范、安全测试与评审等开发过程控制上，A、B、C都直接作用于漏洞的产生与发现环节。改用Windows 10开发环境只是换平台，对运行时被远程攻击的防护无直接因果关系，故D没有直接帮助。","expand":"这与把安全内建到开发过程的BSI思想一致：安全要求应嵌入需求、设计、编码、测试、部署各阶段，而非依赖更换工具或平台。常见措施还有威胁建模、代码审计、SDL和DevSecOps、第三方组件管理。判断题技巧：措施必须作用于漏洞产生或利用链条。","tags":["软件安全","安全工程与项目管理"]},{"stem":"下列关于软件安全开发中的BSI(Baild Security In)系列模型说法错误的是O","options":[{"k":"A","t":"BSI 含义是指将安全内建到软件开发过程中，而不是可有可无，更不是游离于软件开发生命周期之外"},{"k":"B","t":"软件安全的三根支柱是风险管理、软件安全触点和安全知识"},{"k":"C","t":"软件安全触点是软件开发生命周期中一套轻量缓最优工程化方法，它提供了从不同角度保障安全的行为方式"},{"k":"D","t":"BSI 系列模型强调安全测试的重要性，要求安全测试贯穿整个开发过程及软件生命周期"}],"answer":"D","src":"A卷·补充100题","srcNum":69,"id":"q064","analyze":"BSI把安全内建到软件开发过程中，三根支柱是风险管理、软件安全触点与安全知识，安全触点是一套轻量可裁剪的工程化方法，故A、B、C正确。BSI强调将安全活动嵌入各阶段，而不是以安全测试贯穿全程为核心，D把重点归于测试，与纯测试驱动的做法混淆。","expand":"对比：ISO 27001关注组织体系，SDL按阶段固化安全活动并配工具，BSI强调触点式轻量落地。三支柱记忆：风险管理定做什么，安全触点定怎么做，安全知识定凭什么做。安全测试只是其中一环，不能替代需求与设计阶段的安全分析。","tags":["软件安全","安全工程与项目管理"]},{"stem":"关于信息安全应急响应管理过程措述不正确的是()。","options":[{"k":"A","t":"基于应急响应工作的特点和事件的不规则性，事先制定出事件应急响应方法和过程，有助于一个组织在事件发生时阻止混乱的发生或是在混乱状态中迅速恢复控制，将损失和负面影响降至最低"},{"k":"B","t":"应急响应方法和过程并不是唯一的"},{"k":"C","t":"一种被广为接受的应念响应方法是将应急响应管理过程分为准备、检测、遏制、根除、恢复和跟踪总结6 个阶段"},{"k":"D","t":"一种被广为接受的应急响应方法是将应急响应管理过程分为准备、检测、遏制、根除、恢复和跟踪总结6 个阶段，这6 个阶段的响应方法一定能确保事件处理的成功"}],"answer":"D","src":"A卷·补充100题","srcNum":70,"id":"q065","analyze":"六阶段划分即准备、检测、遏制、根除、恢复、跟踪总结，是广为接受的通用方法，能规范处置、控制损失，但事件成因复杂，任何流程都不能确保处置成功，D用一定能确保属绝对化表述，故不正确。A说明预案的必要性，B说明方法多样性，C的划分本身正确。","expand":"记忆PDCERF：准备、检测、遏制、根除、恢复、总结。要点是遏制先于根除以避免破坏证据，总结阶段输出改进项并回写预案。对照NIST四阶段：预备、检测分析、遏制根除恢复、事后活动。流程保证有序，不保证结果，这是重要考点。","tags":["应急响应"]},{"stem":"按照我国信息安全等级保护的有关政策和标准，有些信息系统只需要自主定级、自主保护，按照要求向公安机关备案即可，可以不需要上级或主管部门来测评和检查。此类信息系续应属于()","options":[{"k":"A","t":"零级系统"},{"k":"B","t":"一级系统"},{"k":"C","t":"二级系统"},{"k":"D","t":"三级系统"}],"answer":"C","src":"A卷·补充100题","srcNum":71,"id":"q066","analyze":"按等级保护政策，一级系统自主定级、自主保护并向公安机关备案；二级系统同样自主定级、自主保护并接受备案与监督检查，一般不需上级或主管部门测评检查；三级以上才需主管部门审核、定期测评。题干描述的情形对应二级系统，故选C。","expand":"记忆：一级自主定级保护备案，二级备案加公安机关监督检查，三级主管部门审批并每年测评，四级强制测评严格监管。定级要素为受侵害客体加侵害程度。二级多见于一般业务系统，三级多为涉及社会秩序与公共利益的重要系统。","tags":["等级保护","信息安全标准与法规"]},{"stem":"由于密码技术都依赖于密钥，因此密钥的安全管理是崔码技术应用中非常重要的环节，下列关于密钥管理说法错误的是()。","options":[{"k":"A","t":"科克霍夫在《军事密码学》中指出系统的保密性不依载于对加密体制或算法的保密，而依赖于密钥"},{"k":"B","t":"在保密通信过程中，通信双方可以一直使用之前用过的会话密钥，不影响安全性"},{"k":"C","t":"带钥管理需要在安全策略的指导下处理密钥生命周期的整个过程，包括产生、存储、备份、分配、更新、撤销等"},{"k":"D","t":"在保密通信过程中，通信双方也可利用DiffieHellnan 协议协商出会话密钥进行保密通信"}],"answer":"B","src":"A卷·补充100题","srcNum":72,"id":"q067","analyze":"会话密钥应一次一密、用完即弃，长期重复使用会扩大暴露面，一旦泄露既解密历史通信又危及后续通信，故B错误。A是柯克霍夫原则，保密依赖密钥而非算法；C是密钥全生命周期管理；D的Diffie-Hellman可用于协商会话密钥，均正确。","expand":"密钥生命周期：产生、存储、备份、分配、使用、更新、撤销、销毁。要点是加密密钥与密钥加密密钥分层保护，会话密钥短周期更换，主密钥离线保存。对比：柯克霍夫原则讲算法可公开，密钥管理讲密钥必须严格保密。","tags":["密码学","信息安全管理体系"]},{"stem":"一个信息管理系统通常会对用户进行分组并实施访问控制。例如，在一个学校的教务系统中，教师能够录入学生的考试成绩，学生只能查看自己的分数，而学校教务部门的管理人员能够对课程信息、学生的选课信息等内容进行修改，下列选项中，对访问控制的作用的理解错误的是()。","options":[{"k":"A","t":"对经过身份鉴别后的合法用户提供所有服务"},{"k":"B","t":"拒绝非法用户的非授权访问请求"},{"k":"C","t":"在用户对系统资源提供最大限度共享的基础上，对用户的访问权进行管理"},{"k":"D","t":"防止对信息的非授权改和滥用"}],"answer":"A","src":"A卷·补充100题","srcNum":73,"id":"q068","analyze":"访问控制是在身份鉴别之后按策略限制主体对客体的操作，若对已鉴别用户提供所有服务，等于取消授权控制，故A错误。B拒绝非授权访问、C在最大共享基础上管理权限、D防止非授权篡改与滥用，都是访问控制的应有之义。","expand":"三要素为主体、客体、访问权限（读、写、执行、删除等）。与身份鉴别的关系：鉴别解决你是谁，授权解决你能做什么。模型谱系：DAC以ACL和能力表实现，MAC含BLP保机密、Biba保完整，RBAC以角色承载最小特权与职责分离。","tags":["访问控制","身份鉴别"]},{"stem":"小赵是某大学计算机科学与技术专业的毕业生，在前往一家大型企业应聘时，面试经理要求他给出该企业信息系统访问控制模型的设计思路。如果想要为一个存在大最用户的信息系统实现自主访问控制功能，在以下选项中，从时间和资源消耗的角度，下列选项中他应该采取的最合适的模型或方法是()。","options":[{"k":"A","t":"访问控制列表(ACL)"},{"k":"B","t":"能力表（CL）"},{"k":"C","t":"BLP 模型"},{"k":"D","t":"Biba 模型"}],"answer":"A","src":"A卷·补充100题","srcNum":74,"id":"q069","analyze":"自主访问控制中ACL以客体为中心记录谁能访问该资源，用户量大时便于按资源授权、查询与审计，整体开销可控；能力表以主体为中心，用户多则条目规模膨胀且全局撤销困难。BLP、Biba属强制访问控制，不符合自主访问控制要求，故选ACL。","expand":"对比：ACL是客体视角，适合用户多、按资源查权限；能力表是主体视角，适合客体多、访问频繁需快速判定。DAC的弱点是权限可被客体属主转授造成扩散，MAC由系统统一标注安全级，更严格但灵活性差，实践中常混合使用。","tags":["访问控制"]},{"stem":"以下关于灾鸡恢复和数据备份的理解，说法正确的是()","options":[{"k":"A","t":"增量备份是备份从上次完全各份后更断的全部数据文件"},{"k":"B","t":"依据具备的灾难恢复资源程度的不同，灾难恢复能力分为7 个等级"},{"k":"C","t":"数报备份按数据类型划分可以划分为操作系统备份和数据库备份"},{"k":"D","t":"使用差分备份数据恢复时只需最后一次的标准备份，如果每天都有大量数据变化，差分备份工作非常费时"}],"answer":"D","src":"A卷·补充100题","srcNum":75,"id":"q070","analyze":"差分备份记录自上次完全备份以来所有变化的数据，恢复时只需最近一次完全备份加最近一次差分备份，步骤少；但每天都要比对全量变化，数据量大时备份非常耗时，D正确。A混淆了增量与差分，B说灾难恢复能力分7级而国标为6级，C按数据类型应分为数据、系统、应用等备份。","expand":"记忆：完全备份全量且恢复快；增量备份只备上次任意备份后的变化，备份快但恢复需逐链回放；差分备份备上次完全备份后的全部变化，备份慢但恢复只需两份。灾难恢复能力国家标准分6级：基本支持、数据备份、数据处理、系统切换、实时切换、灾难自动接管。","tags":["业务连续性与灾难恢复"]},{"stem":"规范的实施流程和文档管理，是信息安全风险评估能否取得成果的重要基础，某单位在实施风险评估时，按照规范形成了若干文档，其中下面()中的文档应属于风险评估中“风险要素识别一阶段输出的文档。","options":[{"k":"A","t":"《风险评估方案》，主要包括本次风险评估的目的、范围、目标、评估步、经费预算和进度安持等内容"},{"k":"B","t":"《风险评估方法和工具列表》，主要包括拟用的风险评估方法和测试评估工八等内容"},{"k":"C","t":"《风险评估准则要求》、主要包括现有风险评估参考标准、采用的风险分析方法、资产分类标准等内容"},{"k":"D","t":"《已有安全措施列表》，主要包括经检查确认后的已有技术和管理各方面安全措施等内容"}],"answer":"D","src":"A卷·补充100题","srcNum":76,"id":"q071","analyze":"风险要素识别阶段的输出是对资产、威胁、脆弱性和已有安全措施的识别结果，《已有安全措施列表》正属此阶段产物。A的评估方案、B的方法与工具列表、C的准则要求都是在准备阶段确定的输入性文件，用于指导后续评估，不是要素识别的输出。","expand":"流程记忆：准备（目的范围、团队、方法与准则）—要素识别（资产、威胁、脆弱性、已有措施）—风险分析（可能性乘影响）—风险评价（与准则比较）—处置与监控。文档与阶段的对应关系是解此类题的关键线索。","tags":["风险评估"]},{"stem":"以下关于互联网协议安全(Internet Protocol Security,IPsec)协议说法错误的是()。","options":[{"k":"A","t":"在传送模式中，保护的是IP 负载"},{"k":"B","t":"验证头协议(Authentication Head，N)和P 封装安全载荷协议(Encapsulating Security Payload,ESP)都能以传输模式和隧道模式工作"},{"k":"C","t":"在随道模式中，保护的是整个互联网协议(Internet Protocol，IP)包，包括IP 头"},{"k":"D","t":"IPsec 仅能保证传输数据的可认证性和保密性。"}],"answer":"D","src":"A卷·补充100题","srcNum":78,"id":"q072","analyze":"AH提供数据源认证与完整性但不提供机密性，ESP可加密可认证；两者均有传输模式与隧道模式，传输模式保护IP负载，隧道模式保护整个IP包含原IP头，故A、B、C正确。IPsec还能提供抗重放并与安全关联、访问控制配合，D的仅能二字以偏概全。","expand":"记忆：AH为认证头，只保真不保密；ESP为封装安全载荷，可加密可认证。传输模式用于主机到主机，隧道模式用于网关到网关即VPN。配套协议为IKE协商安全关联，SAD与SPD决定处理方式，抗重放依靠序列号窗口。","tags":["网络安全","密码学"]},{"stem":"目前，信息系统面临外部攻击者的恶意攻击威胁，从威胁能力和掌握资源分，这些或胁可以按照个人威胁、组织威胁和国家威胁三个层面划分，则下面选项中属于组织威胁的是()。","options":[{"k":"A","t":"喜欢恶作剧、实现自我挑战的娱乐型黑客"},{"k":"B","t":"实施犯罪、获取非法经济利益网络犯罪团伙"},{"k":"C","t":"搜集政治、军事、经济等情报信息的情报机构"},{"k":"D","t":"巩固战略优势，执行军事任务、进行目标破坏的信息作战部队"}],"answer":"B","src":"A卷·补充100题","srcNum":79,"id":"q073","analyze":"按威胁能力与资源分三层：个人层是娱乐型黑客，组织层是有分工与资源的犯罪团伙、商业间谍，国家层是情报机构与信息作战部队。B的网络犯罪团伙以获取非法经济利益为目的且有组织分工，属组织威胁；A属个人，C、D动用国家资源属国家威胁。","expand":"记忆：个人看兴趣与炫技，组织看利益与分工，国家看战略与情报。防御侧重不同：个人威胁靠基线加固与补丁，组织威胁靠监测响应与情报共享，国家威胁需纵深防御与供应链安全。APT通常归入组织或国家层面。","tags":["风险评估","网络安全"]},{"stem":"某电子商务网站在开发设计时，使用了威胁建模方法来分析电子商务网站所面临的威胁。STRIDE 是微软SDL 中提出的威胁建模方法，将威胁分为六类，为每一类威胁提供了标准的消减措施，Spoofing 是STRIDE 中欺骗类的威，以下威胁中哪个可以归入此类威胁(()","options":[{"k":"A","t":"网站竞争对手可能雇佣攻击者实施DDoS 攻击，降低网站访问速度"},{"k":"B","t":"网站使用使用http 协议进行浏览等操作，未对数据进行加密，可能导致用户传输信息泄露，例如购买的商品金额等"},{"k":"C","t":"网站使用使用http 协议进行浏览等操作，无法确认数据与用户发出的是否一致，可能数据被中途篡改"},{"k":"D","t":"网站使用用户名、密码进行登录验证，攻击者可能会利用弱口令或其他方式获得用户密码，以该用户身份登录修改用户订单等信息"}],"answer":"D","src":"A卷·补充100题","srcNum":80,"id":"q074","analyze":"STRIDE六类为欺骗、篡改、抵赖、信息泄露、拒绝服务、权限提升。冒用用户名密码并以他人身份登录属身份假冒，对应Spoofing。A是拒绝服务，B是信息泄露，C是数据篡改，均不属欺骗类威胁，故选D。","expand":"口诀：假冒、篡改、抵赖、泄密、拒绝服务、提权。对应消减措施：多因子认证防假冒，签名与完整性校验防篡改，日志与审计防抵赖，加密防泄露，限流与冗余防拒绝服务，最小权限防提权。威胁建模通常配合数据流图与信任边界。","tags":["软件安全","安全工程与项目管理"]},{"stem":"保护-检测-响应(Protection-Detection-Response，PDR)模型是()工作中常用的模型，其思想是承认()中漏洞的存在，正视系统面临的()，通过采取适度防护、加强()、落实对安全事件的响应、建立对威胜的防护来保障系统的安全。","options":[{"k":"A","t":"信息系统;信息安全保障:威胁;检测工作"},{"k":"B","t":"信息安全保障;信息系统;检测工作;威胁信危安全保障;信息系统;威助;检测工作"},{"k":"C","t":"信息安全保障;信息系统; 威胁;检测工作"},{"k":"D","t":"信息安全保障; 威胁; 信息系统; 检测工作"}],"answer":"C","src":"A卷·补充100题","srcNum":81,"id":"q075","analyze":"PDR即保护、检测、响应，是信息安全保障工作常用模型：承认信息系统存在漏洞，正视系统面临的威胁，通过适度防护、加强检测、落实响应并建立对威胁的防护来保障安全。C项四空依次为信息安全保障、信息系统、威胁、检测工作，语义与模型完全吻合。","expand":"演进脉络：PDR、P2DR加策略、P2DR2加恢复、IATF纵深防御。要点：保护是基础，检测是保护失效时的补救，响应决定损失大小，三者需由安全策略统一牵引。与PDRR的区别在于是否把恢复单独强调为独立能力。","tags":["安全工程与项目管理","信息安全管理体系"]},{"stem":"数据库的安全很复杂,往往需要考虑多种安全策略,才可以更好地保护数捌库的安全，以下关于数据库常用的安用户的工作全策略理解不正确的题()","options":[{"k":"A","t":"最小特权数则，是让用户可以合法的存取或能改数据库的前提下，分配最小的特权，使得这些信息恰好能够完成用户的工作"},{"k":"B","t":"最大共享策略,在保证数据库的完整性,保密性和可用性的前提下,最大程度地共享数据库中的信息"},{"k":"C","t":"粒度最小策略,将数据库中的数据项进行划分,粒度越小,安全级别越高,在实际中需要选择最小粒度"},{"k":"D","t":"按内容存取控制策略,不同权限的用户访问数据库的不同部分"}],"answer":"B","src":"A卷·补充100题","srcNum":82,"id":"q076","analyze":"最大共享是安全约束下的目标而非独立策略，须由最小特权、粒度控制等具体手段支撑，选项把它理解为可以最大限度共享数据，弱化了完整性、保密性前提，与最小特权原则冲突，故理解不正确。A的最小特权、C的粒度权衡、D的按内容存取控制均正确。","expand":"数据库安全分系统层账户认证、数据层视图与行级权限及字段加密、审计层、备份恢复层。策略配套为最小特权、最大共享、粒度适当、按内容控制。判断技巧：凡出现无条件最大化共享、或粒度越细越好的绝对化表述，通常即为错误项。","tags":["访问控制"]},{"stem":"若一个组织声称自己的1SMS 符合1S0/1BC 27001 成GB/T220B0 标准要求，其信息安全控制措施通常在以下方面实施常规控制，以下哪个选项的内容不属于常规控制措施的范围","options":[{"k":"A","t":"信息安全方针、信息安全组织、资产管理"},{"k":"B","t":"人力资源安全、物理和环境安全、通信安全"},{"k":"C","t":"安全采购、开发与维护、合规性"},{"k":"D","t":"安全事件管理、供应商关系、业务安全性审计"}],"answer":"D","src":"A卷·补充100题","srcNum":83,"id":"q077","analyze":"ISO/IEC 27001附录A常规控制覆盖安全方针、组织、资产管理、人力资源、物理和环境、通信与运行、访问控制、系统获取开发维护、事件管理、业务连续性、符合性等。D中供应商关系、业务安全性审计等提法与标准控制域划分不符，且掺杂了非该域内容，故不属于常规控制范围。","expand":"附录A十一域记忆：方针、组织、资产、人力、物理、通信与运行、访问控制、系统获取开发维护、事件管理、业务连续性、符合性。新版ISO/IEC 27001:2022把控制项重组为组织、人员、物理、技术四类共93项，答题需注意版本差异。","tags":["信息安全管理体系"]},{"stem":"关于《网络安全法》域外适用效力的理解，以下哪项是错误的()","options":[{"k":"A","t":"当前对于境外的网络攻击，我国只能通过向来源国采取抗议。"},{"k":"B","t":"对于来自境外的网络安全威胁我国可以组织技术力量进行监测、防御和处置"},{"k":"C","t":"对于来自境外的违法信息我国可以加以断传播"},{"k":"D","t":"对于来自境外的网络攻击我国可以追究其法律责任"}],"answer":"A","src":"A卷·补充100题","srcNum":84,"id":"q078","analyze":"网络安全法规定，对来自境外的网络安全威胁，我国可组织技术力量监测、防御和处置，对境外违法信息可阻断传播，对境外网络攻击可依法追究法律责任。A称只能向来源国抗议，实质放弃了法律赋予的处置与追责手段，故错误。","expand":"法条要点：第2条明确适用于境内网络的建设、运营、维护、使用与监管；第75条对境外机构、组织、个人攻击关键信息基础设施等行为可依法追责，并可采取冻结财产或其他必要制裁措施。域外效力体现为可监测、可处置、可追责三层。","tags":["信息安全标准与法规","网络安全"]},{"stem":"数据在进行传输前，需要由协议栈自上而下对数据进行封装。TCP/IP 协议中,数据封装的顺序是()","options":[{"k":"A","t":"传输层、网络接口层、互联网络层"},{"k":"B","t":"传输层、互联网络层、网络接口层"},{"k":"C","t":"互联网络层、传输层、网络接口层"},{"k":"D","t":"互联网络层、网络接口层、传输层"}],"answer":"B","src":"A卷·补充100题","srcNum":86,"id":"q079","analyze":"发送方数据自上而下封装：应用层交传输层加TCP或UDP头，再交互联网络层加IP头，最后交网络接口层加帧头帧尾，故顺序为传输层、互联网络层、网络接口层，B正确。A把接口层置于网络层之前，C、D把网络层排在传输层之前，均违背分层封装规律。","expand":"记忆：封装自上而下逐层加头，解封装自下而上逐层去头。传输层用端口标识进程，网络层用IP标识主机，接口层用MAC标识网卡。排错思路：跨网不通查路由与IP，同网不通查MAC与ARP，能通但服务不可用查传输层端口。","tags":["网络安全"]},{"stem":"若一个组织声称自己的ISMS 符合1S0/1BC27001 成GB/T22080 标准要求，其信息安全控制措施通常需要在符合性方面实施常规控制，符合性常规控制这一领域不包括以下哪项控制目标()","options":[{"k":"A","t":"符合法律要求"},{"k":"B","t":"符合安全策略和标准以及技术符合性"},{"k":"C","t":"信息系统审核考虑"},{"k":"D","t":"访问控制的业务要求、用户访问管理"}],"answer":"D","src":"A卷·补充100题","srcNum":88,"id":"q080","analyze":"符合性控制域目标包括符合法律与合同要求、符合安全策略与标准、技术符合性检查以及信息系统审计考虑。访问控制的业务要求和用户访问管理属访问控制域内容，其控制目标为按业务需求管控访问，不在符合性域，故D不属于。","expand":"记域抓关键词：出现法律、合同、知识产权、记录保护、审计可归符合性；出现注册注销、权限分配、特权管理、移动办公归访问控制。注意审计虽涉及记录检查，传统上归运行安全，新版标准则将其放入技术控制组。","tags":["信息安全管理体系"]},{"stem":"随着信息技术的不断发展，信息系统的重要性也越来越突出，而与此同时，发生的信息安全事件也越来越多。综合分析信息安全问题产生的根源，下面描述正确的是()，","options":[{"k":"A","t":"信息系统自身存在脆弱性是根本原因。信息系统越来越重要,同时自身在开发、部署和使用过程中存在的脆弱性,导致了诸多的信息安全事件发生。因此,杜绝脆弱性的存在是解决信息安全问题的根本所在"},{"k":"B","t":"信息系统面临诸多黑客的威胁，包括恶意攻击者和恶作剧攻击者。信息系统应用越来越广泛，接触信息系统的人越多，信息系统越可能遭受攻击。因此，避免有恶意攻击可能的人接触信息系统就可以解决信息安全问题"},{"k":"C","t":"信息安全问题产生的根源要从内因和外因两个方面分析，因为信息系统自身存在脆弱性，同时外部又有威胁源，从而导致信息系统可能发生安全事件。因此，要防范信息安全风险，需从内外因同时着手"},{"k":"D","t":"信息安全问题的根本原因是内因、外因和人三个因素的综合作用，内因和外因都可能导致安全事件的发生，但最重要的还是人的因素，外部攻击者和内部工作人员通过远程攻击、本地破坏和内外勾结等手段导致安全事件发生。因此，对人这个因素的防范应是安全工作重点"}],"answer":"C","src":"A卷·补充100题","srcNum":89,"id":"q081","analyze":"安全事件是内因即系统自身脆弱性与外因即外部威胁源共同作用的结果，二者缺一不可，防范必须内外因同时着手，C正确。A把杜绝脆弱性当作根本出路并不现实，B主张隔离所有可能攻击者既不可行也忽视内外勾结，D片面强调人的因素而否定技术脆弱性的作用。","expand":"风险等于威胁、脆弱性与影响的组合，任一为零则无风险。对应措施：降威胁靠监测、情报与法律手段，减脆弱性靠补丁、加固与安全开发，降影响靠备份、冗余与应急。内外因分析是风险评估与安全保障体系设计的理论起点。","tags":["风险评估","信息安全管理体系"]},{"stem":"即使最好用的安全产品也存在()。结果，在任何的系统中散手最终都能够找出一个被开发出的漏洞。一种有效的对策是在敌手和它的目标之间配备多种()。每一种机制都应包括()两种手段。","options":[{"k":"A","t":"安全机制:安全缺陷;保护和检测"},{"k":"B","t":"安全缺陷;安全机制:保护和检测"},{"k":"C","t":"安全缺陷;保护和检测:安全机制"},{"k":"D","t":"安全缺陷;安全机制:外边和内部"}],"answer":"B","src":"A卷·补充100题","srcNum":90,"id":"q082","analyze":"题意是再好的安全产品也存在安全缺陷，敌手终能找到漏洞，有效对策是在敌手与目标之间配备多种安全机制，每种机制都应包含保护与检测两种手段。B的三个空位依次为安全缺陷、安全机制、保护和检测，与语义吻合；其余选项把机制、缺陷与手段错位。","expand":"这体现纵深防御思想：单一机制必被突破，需多层异构机制叠加并配合检测。保护降低事件发生概率，检测缩短发现时间并限制损失，二者互为补充。相关模型有PDR与IATF，基本假设是没有绝对安全，只有可管理的风险。","tags":["安全工程与项目管理","网络安全"]},{"stem":"某贸易公司的0A 系统由于存在系统漏洞，被攻击者上传了木马病毒并删除了系统中的数据，由于系统备份是每周六进行一次，事件发生时间为周三，因此导致该公司三个工作日的数据丢失并使得0A 系统在随后两天内无法访问，影响到了与公司有业务往来部分公司业务。在事故处理报告中，根据GB/Z 20986-2007《信息安全事件分级分类指南》，该事件的准确分类和定级应该是()","options":[{"k":"A","t":"有害程序事件特别重大事件( I 级)"},{"k":"B","t":"信息破坏事件重大事件(II 级)"},{"k":"C","t":"有害程序事件较大事件(III 级)"},{"k":"D","t":"信息破坏事件一般事件(IV 级)"}],"answer":"D","src":"A卷·补充100题","srcNum":91,"id":"q083","analyze":"攻击者上传木马并删除数据，核心后果是数据被破坏、业务中断两天、影响部分往来单位，按GB/Z 20986-2007属信息破坏事件；影响范围有限、未造成严重社会影响，故定级为一般事件即Ⅳ级。A、C把类别归为有害程序事件，B的重大高估了影响程度。","expand":"分级看三维度：影响对象、影响程度、影响范围；级别为Ⅰ特别重大、Ⅱ重大、Ⅲ较大、Ⅳ一般。分类七类：有害程序、网络攻击、信息破坏、信息内容安全、设备设施故障、灾害性事件、其他。口诀是先定结果类别，再定影响级别。","tags":["安全事件与取证","应急响应"]},{"stem":"从Linux 内核2.1 版开始，实现了基于权能的特权管理机制，实现了对超级用户的特权分割，打破了UNIX/LINUX 操作系统中超级用户/普通用户的概念，提高了操作系统的安全性。下列选项中，对特权管理机制的理解错误的是()","options":[{"k":"A","t":"普通用户及其shell 没有任何权能，而超级用户及其shel1 在系统启动之初拥有全部权能"},{"k":"B","t":"系统管理员可以剥夺和恢复超级用户的某些权能"},{"k":"C","t":"进程可以放弃自己的菜的权地"},{"k":"D","t":"当普通用户的某些操作设计特权操作时，仍然通过setuld 实现"}],"answer":"B","src":"A卷·补充100题","srcNum":92,"id":"q084","analyze":"权能是进程级属性，超级用户特权被分割为多个权能，普通用户及shell无权能，root启动时拥有全部权能，进程可主动放弃自己的权能，且放弃后不能自行恢复，需重新exec获得。B称管理员可剥夺并恢复超级用户的某些权能，把权能当作可任意恢复的账户属性，不符机制。","expand":"关键权能示例：CAP_NET_RAW用于原始套接字，CAP_SYS_ADMIN用于系统管理，CAP_SETUID用于改身份。查看用getcap与capsh，设置用setcap，文件能力存于扩展属性。与setuid的区别：后者使整个进程成为root，权能只授予最小必要特权。","tags":["操作系统安全"]},{"stem":"以下哪项制度或标准被作为我国的一项基础制度加以推行，并且有一定强制性，其实施的主要目标是提高我国信息和信息系统安全建设的整体水平，重点保障基础信息网络和重要信息系统的安全。()","options":[{"k":"A","t":"信息安全管理体系(ISMS)"},{"k":"B","t":"信息安全等级保护"},{"k":"C","t":"NIST SP800"},{"k":"D","t":"IS0 270000 系列"}],"answer":"B","src":"A卷·补充100题","srcNum":93,"id":"q085","analyze":"信息安全等级保护由政策与法律确立，是我国推行的一项基础制度并具强制性，目标是提高国家信息与信息系统安全建设整体水平，重点保障基础信息网络和重要信息系统，B正确。ISMS与ISO 27000系列是自愿性管理体系标准，NIST SP800属美国标准体系，均无我国基础制度地位。","expand":"法规依据为网络安全法第21条；配套标准有GB 17859划分准则、GB/T 22239基本要求、GB/T 22240定级指南、GB/T 25070设计要求、GB/T 28448测评要求。与分级保护的区别：等级保护管非涉密网络，分级保护管涉密信息系统。","tags":["等级保护","信息安全标准与法规"]},{"stem":"小牛在对某公司的信息系统进行风险评估后，因考虑到该业务系统中部分涉及金融交易的功能模块风险太高，他建议该公司以放弃这个功能模块的方式来处理该风险。请问这种风险处置的方法是()。","options":[{"k":"A","t":"降低风险"},{"k":"B","t":"规避风险"},{"k":"C","t":"转移风险"},{"k":"D","t":"放弃风险"}],"answer":"B","src":"A卷·补充100题","srcNum":94,"id":"q086","analyze":"直接放弃高风险功能模块，等于改变业务或技术方案使风险载体不再存在，属风险规避。降低风险是保留功能并加固，转移靠保险或外包，放弃风险并非标准术语，国家标准表述为规避。因此应选规避而非降低，故选B。","expand":"四类处置对照：降低靠补丁、加固、加密；规避靠停用功能、更换技术路线；转移靠保险、外包、合同约定；接受是记录残余风险并持续监控。规避常伴随业务损失，需结合业务影响分析与风险准则权衡，不可滥用。","tags":["风险评估"]},{"stem":"部署互联网协议安全虚拟专用网(Internet Protocol Security Virtual Private Network, IPsec VPN)时，以下说法正确的是().","options":[{"k":"A","t":"配置MD5 安全算法可以提供可靠地数据加密"},{"k":"B","t":"配置AES 算法可以提供可靠的数据完整性验证"},{"k":"C","t":"部署IPsec VPN 网络时,需要考虑IP 地址的规划,尽量在分支节点使用可以聚合的IP 地址段,来减少IPsec 安全关联(Security Authentication,SA)资源的消耗"},{"k":"D","t":"报文验证头协议(Authentication Header，AH)可以提供数据机密性"}],"answer":"C","src":"A卷·补充100题","srcNum":95,"id":"q087","analyze":"IPsec按安全关联逐条匹配策略，分支节点使用可聚合的地址段，可用少量SA覆盖大范围网段，减少SA资源消耗与配置量，C正确。MD5是散列算法不能加密数据，AES提供加密而非完整性验证，AH不含机密性，故A、B、D均错误。","expand":"算法分工：加密用AES、3DES、SM4；完整性用SHA系列与HMAC；密钥协商用IKE结合DH。AH只认证不加密，ESP可加密可认证；传输模式护负载，隧道模式护整包。规划要点是地址段聚合、NAT穿越处理、兴趣流精确匹配。","tags":["网络安全","密码学"]},{"stem":"私有IP 地址是一段保留的IP 地址。只使用在局域网中，无法在Internet 上使用。关于私有地址，下面描述正确的是()。","options":[{"k":"A","t":"A 类和B 类地址中没有私有地址，C 类地址中可以设置私有地址"},{"k":"B","t":"A 类地址中没有私有地址，B 类和C 类地址中可以设置私有地址"},{"k":"C","t":"A 类、B 类和C 类地址中都可以设置私有地址"},{"k":"D","t":"A 类、B 类和C 类地址中都没有私有地址"}],"answer":"C","src":"A卷·补充100题","srcNum":96,"id":"q088","analyze":"RFC1918规定三类私有地址段：A类10.0.0.0/8、B类172.16.0.0/12、C类192.168.0.0/16，故A、B、C三类都设有私有地址，C正确。A称A、B类无私有地址，B称仅B、C类有，D称三类都没有，均与地址分配规定不符。","expand":"记忆：10段为A类1个/8，172.16至172.31为B类合并为/12，192.168为C类共256个/16。私有地址不可在公网路由，须经NAT转换。另有169.254.0.0/16链路本地、127.0.0.0/8回环、224及以上组播与保留地址。","tags":["网络安全"]},{"stem":"PKI 的主要理论基础是()","options":[{"k":"A","t":"对称密码算法"},{"k":"B","t":"公钥密码算法"},{"k":"C","t":"量子密码"},{"k":"D","t":"摘要算法"}],"answer":"B","src":"A卷·补充100题","srcNum":97,"id":"q089","analyze":"PKI以公钥密码体制为基础，由CA签发数字证书把公钥与身份绑定，实现密钥分发、身份认证、不可否认与完整性保护，故理论基础是公钥密码算法。对称密码无法解决密钥分发与不可否认问题，量子密码尚未构成PKI基础，摘要算法只提供完整性。","expand":"PKI组成：CA、RA、证书库、密钥备份与恢复、CRL或OCSP、终端实体。对比：对称密码速度快但密钥分发难、不可否认弱；公钥密码解决分发与签名但速度慢，实践中采用公钥协商密钥、对称加密数据的混合体制。","tags":["密码学","身份鉴别"]},{"stem":"你是单位安全主管，由于微软刚发布了数个系统漏洞补丁，安全运维人员给出了针对此批漏洞修补的四个建议方案，请选择其中一个最优方案执行()","options":[{"k":"A","t":"由于本次发布的数个漏洞都属于高危漏洞,为了避免安全风险,应对单位所有的服务器和客户端尽快安装补丁"},{"k":"B","t":"本次发布的漏洞目前尚未出现利用工具，因此不会对系统产生实质性危害，所以可以先不做处理"},{"k":"C","t":"对于重要的服务，应在测试环境中安装并确认补丁兼容性问题后再在正式生产环境中部署"},{"k":"D","t":"对于服务器等重要设备，立即使用系统更新功能安装这批补丁，用户终端计算机由于没有重要数据，由终端自行升级"}],"answer":"C","src":"A卷·补充100题","srcNum":98,"id":"q090","analyze":"补丁应先评估后分发：对重要业务系统先在测试环境验证兼容性并回归，再上生产，可兼顾安全与业务连续性，C最优。A全量立即安装可能引发兼容性故障甚至业务中断，B以尚无利用工具为由不处理忽视泄露风险，D对服务器直接更新且放任终端，风险最大。","expand":"补丁管理流程：资产与漏洞梳理、风险评估与优先级排序、测试验证、灰度发布、全量部署、验证与回滚。判断技巧是安全与可用性平衡，关键系统遵循先测试、后灰度、可回滚；无补丁时用虚拟补丁、访问控制、加强监测作为补偿。","tags":["信息安全管理体系","网络安全"]},{"stem":"某网络安全公司基于网络的实时入侵检测技术，动态监测来自于外部网络和内部网络的所有访问行为。当检测到来自内外网络针对或通过防火墙的攻击行为，会及时响应，并通知防火墙实时阻断攻击源，从而进一步提高了系统的抗攻击能力，更有效地保护了网络资源，提高了防御体系级别。但入侵检测技术不能实现以下哪种功能()。","options":[{"k":"A","t":"检测并分析用户和系统的活动"},{"k":"B","t":"核查系统的配置澜洞，评估系统关键资源和数据文件的完整性"},{"k":"C","t":"防止IP 地址欺骗"},{"k":"D","t":"识别违反安全策略的用户活动，检测系统的作用只能发现问题，无法解决问题。"}],"answer":"C","src":"A卷·补充100题","srcNum":99,"id":"q091","analyze":"IDS的职能是监测与发现：检测分析用户和系统活动、核查配置与文件完整性、识别违反策略的行为并告警。它旁路部署只读流量，不具备阻断能力，也无力防止IP地址欺骗，后者需靠静态ARP绑定、入口过滤等手段，故C不是IDS能实现的功能。","expand":"IDS与IPS区别：IDS旁路检测只告警，IPS串联可丢弃报文。HIDS看主机日志与文件完整性，NIDS看网络流量特征。局限有误报漏报、加密流量难检测、自身易受攻击。部署点通常在防火墙后、DMZ、内网主干与关键子网。","tags":["网络安全","恶意代码"]},{"stem":"某IT 公司针对信息安全事件已经建立了完善的预案，在年度企业信息安全总结会上，信息安全管理员对今应急预案工作做出了四个总结，其中有一项总结工作是错误，作为企业的CSO，请你指出存在问题的是哪个总结","options":[{"k":"A","t":".公司制定的应急演练流程包括应急事件通报”确定应急事件优先级、应急响应启动实施、应急响应时间后期维、更新现有应急预案五个阶段，流程完善可用"},{"k":"B","t":"公司应急预案包括了基础环境类、业务系统类、安全事件类和其他类，基本覆盖了各类应急事件类型"},{"k":"C","t":"公司应急预案对事件分类依据GB/220986-2007《信息安全技术信息安全事件分类分级指南》，分为4个级别，预案符合国家相关标准"},{"k":"D","t":"公司成立了信息安全应急响应组织，该组织由业务和技术人员组成，划分成应急响应领导小组、技术保障小专家小组、实施小组和日常运行小组，D 是针对应急组织的，不是针对预案的。"}],"answer":"D","src":"A卷·补充100题","srcNum":100,"id":"q092","analyze":"题干要找应急预案工作中的错误总结，D讲的是应急响应组织架构，即领导小组、技术保障与专家小组、实施小组、日常运行小组，属组织建设内容而非预案本身，与题干指向不符。A的演练流程、B的预案分类覆盖、C依据GB/Z 20986分级，均属预案工作的合理总结。","expand":"预案体系通常分综合预案、专项预案、现场处置方案；内容含适用范围、组织职责、监测预警、响应分级与流程、保障措施、恢复与总结。演练分桌面推演、功能演练、全面演练。评审要点是可执行性、接口清晰、资源到位。","tags":["应急响应"]},{"stem":"自2004 年1 月起,各有关部门在申报信息安全国家标准计划项目时,必须经由以下哪个组织提出工作情况,协调一致后由该组织申报。","options":[{"k":"A","t":"全国通信标准化技术委员会(TC485)"},{"k":"B","t":"全国信息安全标准化技术委员会(TC260)"},{"k":"C","t":"中国通信标准化协会(CA)"},{"k":"D","t":"网络与信息安全技术工作委员会"}],"answer":"B","src":"精选300题","srcNum":1,"id":"q093","analyze":"全国信息安全标准化技术委员会即TC260，是我国信息安全标准化的归口组织，自2004年起有关部门申报信息安全国家标准计划项目须先经其协调并提出意见，一致后由其申报，B正确。TC485归口通信标准，CCSA是行业协会，网络与信息安全技术工作委员会不是统一申报口。","expand":"记组织：TC260对应ISO/IEC JTC1 SC27，负责信息安全标准；TC485负责通信标准；CCSA为中国通信标准化协会。标准层级还有GB强制、GB/T推荐、GB/Z指导性技术文件之分。等级保护配套的GB/T 22239、GB/T 22240均由其归口。","tags":["信息安全标准与法规"]},{"stem":"安全管理体系,国际上有标准( Information technology Security tech nformation systems)(ISO/IEC 27001-2013),而我国发布了《信息技术信息安全管理体系要求》(GBT 22080-2008)请问,这两个标准的关系是","options":[{"k":"A","t":"IDT(等同采用),此国家标准等同于该国际标准,仅有或没有编辑性修改"},{"k":"B","t":"EQV(等效采用),此国家标准等效于该国家标准,技术上只有很小差异"},{"k":"C","t":"AEQ(等效采用),此国家标准不等效于该国家标准"},{"k":"D","t":"没有采用与否的关系,两者之间版本不同,不应直接比较"}],"answer":"D","src":"精选300题","srcNum":2,"id":"q094","analyze":"GB/T 22080-2008对应的是ISO/IEC 27001:2005（修改采用），题干所列ISO/IEC 27001:2013是改版后的国际标准，两者版本不同，条款结构与控制项均已变化，不能直接判定等同或等效，故D正确。A、B、C的结论都建立在同一版本前提之上。","expand":"采用程度标识：IDT等同采用、MOD修改采用、NEQ非等效。GB/T 22080-2008为修改采用2005版；2013版发布后我国另行转化，2022版又将控制项重组为四类93项。比较标准务必先对齐版本号，再看采用关系。","tags":["信息安全标准与法规","信息安全管理体系"]},{"stem":"“cc”标准是测评标准类的重要标准,从该标准的内容来看,下面哪项内容是针对具体的被测评对象描述了该对象的安全要求及其相关安全功能和安全措施,相当于从厂商角度制定的产品或系统实现方案","options":[{"k":"A","t":"评估对象(TOE)"},{"k":"B","t":"保护轮廊(PP)"},{"k":"C","t":"安全目标(ST）"},{"k":"D","t":"评估保证级(EAL)"}],"answer":"C","src":"精选300题","srcNum":3,"id":"q095","analyze":"CC标准中安全目标即ST由开发者针对具体评估对象编写，描述该对象的安全要求、安全功能与保障措施及实现方案，相当于厂商视角的实现声明。保护轮廓即PP描述同类产品共性的安全需求，是用户或社区视角，二者区别正是本题考点，故选ST。","expand":"CC分三部分：简介与一般模型、安全功能要求、安全保证要求；保证级为EAL1至EAL7。记忆：PP是要什么，需求侧且可复用；ST是怎么给，供给侧且针对具体TOE；TOE是被测评对象本身；EAL是保证等级而非文档。","tags":["信息安全标准与法规","安全工程与项目管理"]},{"stem":"信息安全等级保护分级要求,第三级适用正确的是","options":[{"k":"A","t":"适用于一般的信息和信息系统,其受到破坏后,会对公民、法人和其他组织的权益有一定影响,但不危害国家安全、社会秩序、经济建设和公共利益"},{"k":"B","t":"适用于一定程度上涉及国家安全、社会秩序、经济建设和公共利益的一般信息和信息系统,其受到破坏后,会对国家安全、社会秩序、经济建设和公共利益造成一定损害"},{"k":"C","t":"适用于涉及国家安全、社会秩序、经济建设和公共利益的信息和信息系统,其受到破坏后会对国家安全、社会秩序、经济建设和公共利益造成较大损害"},{"k":"D","t":"适用于涉及国家安全、社会秩序、经济建设和公共利益的重要信息和信息系统的核心子系统,其受到破坏后,会对国家安全、社会秩序、经济建设和公共利益造成特别严重"}],"answer":"B","src":"精选300题","srcNum":4,"id":"q096","analyze":"定级按受侵害客体与侵害程度两维判断：一级只涉及公民、法人权益且不危害国家安全与社会公共利益；二级涉及范围与损害程度略有上升；三级则涉及国家安全、社会秩序、经济建设和公共利益，受破坏后造成较大损害。对照选项，B落在三级这一档，A属最低级，C、D的程度表述已越至四级及以上。","expand":"两维定级法：先看系统承载业务影响的对象，公民法人、社会秩序与公共利益、国家安全；再看损害程度，一般、严重、特别严重。三级即重要系统加较大损害，需备案、测评与主管部门检查；二级为一般系统加一定损害。定级过高增加合规成本，过低则不合规。","tags":["等级保护"]},{"stem":"下面对国家秘密定級和范围的描述中,哪项不符合《保守国家秘密法》要求:","options":[{"k":"A","t":"国家秘密及其密级的具体范围,由国家保密工作部门分别会同外交、公安、国家安全和其他中央有关机关规定"},{"k":"B","t":"各级国家机关、单位对所产生的国家秘密事项,应当按照国家秘密及其密级具体范围的规定确定密级"},{"k":"C","t":"对是否属于国家机密和属于何种密级不明确的事项,可由各单位自行参考国家要求确定和定级,然后报国家保密工作部门确定"},{"k":"D","t":"对是否属于国家秘密和属于何种密级不明确的事项。由国家保密工作部门,省、自治区、直辖市的保密工作部门。省、自治区政府所在地的市和经国务院批准的较大的市的保密工作部门或者国家保密工作部门审定的机关确定。"}],"answer":"C","src":"精选300题","srcNum":5,"id":"q097","analyze":"《保守国家秘密法》规定，国家秘密及其密级具体范围由保密工作部门会同外交、公安、国家安全等中央机关规定；机关单位对产生的秘密事项按范围确定密级；对是否属于国家秘密或何种密级不明确的，应报保密工作部门或有权审定机关确定。C让单位先自行定级再上报，违背定密程序，故不符合。","expand":"要点：定密主体与程序明确，权限不得下放，不明确事项须先报告后确定。保密期限一般不超过十年，特殊情况可延长；密级分绝密、机密、秘密。与相关法区别：保密法管国家秘密，数据安全法管数据分类分级，二者对象不同。","tags":["信息安全标准与法规"]},{"stem":"为了保障网络安全,维护网络空间主权和国家安全、社会公共利益,保护公民、法人和其他组织的合法权益,促进经济社会信息化健康发展,加强在中华人民共和国境内建设、运营、维护和使用网络,以及网络安全的监督管理。2015 年6 月,第十二届全国人大常委会第十五次会议初次审议了一部法律草案,并于7 月6 日起在网上全文公布,向社会公开征求意见,这部法律是","options":[{"k":"A","t":"《中华人民共和国保守国家秘密法》"},{"k":"B","t":"《中华人民共和国网络安全法》"},{"k":"C","t":"《中华人民共和国国家安全法》"},{"k":"D","t":"《中华人民共和国互联网安全法》"}],"answer":"B","src":"精选300题","srcNum":6,"id":"q098","analyze":"题干所述立法目的为维护网络空间主权和国家安全、社会公共利益，保护合法权益，促进经济社会信息化健康发展，且2015年6月提请审议、7月公开征求意见，正是《网络安全法》草案，该法2016年11月通过、2017年6月施行。保密法与国家安全法不是该草案，我国也无互联网安全法。","expand":"立法脉络：2015年草案、2016年11月7日通过、2017年6月1日施行；配套有2021年《数据安全法》《个人信息保护法》与《关键信息基础设施安全保护条例》。考点：网络安全法确立网络运营者义务、等级保护、关键信息基础设施保护与实名制等制度。","tags":["信息安全标准与法规","网络安全"]},{"stem":"为了进一步提高信息安全的保障能力和防护水平,保障和促进信息化建设的健康发展,公安部等四部门联合发布《关于信息安全等级保护工作的实施意见》(公通字[2004166 号),对等级保护工作的开展提供宏观指导和约東。明确了等级保护工作的基本内容、工作要求和实施计划,以及各部门工作职责分工等。关于该文件,下面理解正确的是","options":[{"k":"A","t":"该文件是一个由部委发布的政策性文件,不属于法律文件。"},{"k":"B","t":"该文件适用于2004 年的等级保护工作。其内容不能约束到2005 年及之后的工作。"},{"k":"C","t":"该文件是一个总体性指导文件,规定了所有信息系统都要纳入等级保护定级范围"},{"k":"D","t":"该文件适用范围为发文的这四个部门,不适用于其他部门和企业等单位"}],"answer":"A","src":"精选300题","srcNum":7,"id":"q099","analyze":"公通字〔2004〕66号由公安部等四部门联合发布，明确等级保护的基本内容、工作要求、实施计划与部门分工，属政策性与规范性文件，不是法律、行政法规，故A正确。B错在文件可长期指导后续工作，C错在所有系统都纳入定级，D错在适用范围覆盖全国相关单位。","expand":"效力层级：法律即网络安全法，高于行政法规即计算机信息系统安全保护条例，高于部门规章与规范性文件如公通字66号，高于国家标准如GB/T 22239。政策文件虽非法律，但可作为执法与合规依据，效力低于法律法规。","tags":["信息安全标准与法规","等级保护"]},{"stem":"分组密码算法是一类十分重要的密码算法,下面描述中,错误的是","options":[{"k":"A","t":"分组密码算法要求输入明文按组分成固定长度的块"},{"k":"B","t":"分组密码算法每次计算得到固定长度的密文输出块"},{"k":"C","t":"分组密码算法也称为序列密码算法"},{"k":"D","t":"常见的DES、IDEA 算法都属于分组密码算法"}],"answer":"C","src":"精选300题","srcNum":8,"id":"q100","analyze":"分组密码把明文按固定长度分组，用同一密钥逐组变换为等长密文块，DES与IDEA都是典型分组算法，故A、B、D正确。序列密码即流密码按位或字节产生密钥流逐位加密，是与分组密码并列的体制，因此分组密码也称序列密码的说法错误，选C。","expand":"对比：分组密码如DES、AES、IDEA、SM4按块处理，长消息需工作模式如ECB、CBC、CFB、OFB、CTR；序列密码如RC4、A5、ZUC按位流处理，速度快适合实时通信。常见参数：DES分组64位密钥56位，AES分组128位。","tags":["密码学"]},{"stem":"密码学是网络安全的基础,但网络安全不能单纯依靠安全的密码算法,密码协议也是网络安全的个重要组成部分。下面描述中,错误的是","options":[{"k":"A","t":"在实际应用中,密码协议应按照灵活性好、可扩展性高的方式制定,不要限制和框住所有的执行步骤,有些复杂的步骤可以不明确处理方式"},{"k":"B","t":"密码协议定义了两方或多方之间为完成某项任务而制定的一系列步骤,协议中的每个参与方都必须了解协议,且按步骤执行"},{"k":"C","t":"根据密码协议应用目的的不同,参与该协议的双方可能是朋友和完全信任的人,也可能是敌人和互相完全不信任的人"},{"k":"D","t":"密码协议( cryptographic protoco1),有时也称安全协议( securityprot oco1)是使用密码学完成某项特定的任务并满足安全需求,其目的是提供安全服务"}],"answer":"A","src":"精选300题","srcNum":9,"id":"q101","analyze":"密码协议是两方或多方为完成特定安全任务而按约定步骤执行的序列，参与方须共同理解并逐步执行，参与者可能是朋友也可能是互不信任的对手。协议要求步骤明确、无歧义、可验证，A主张不明确处理方式并保持灵活，违背协议确定性要求，故错误。","expand":"设计要点：步骤明确、消息可鉴别、抗重放靠随机数与时间戳、密钥新鲜性。常见协议有SSL或TLS、IPsec与IKE、Kerberos、SSH。典型缺陷包括重放、反射、中间人、类型混淆。协议本身应可形式化验证，与具体实现缺陷要分开。","tags":["密码学","网络安全"]},{"stem":"美国计算机协会(ACM)宣布将2015 年的ACM 奖授予给Whitfield Diffiic 和Artfield 下面哪项工作是他们的贡献","options":[{"k":"A","t":"发明并第一个使用c 语言"},{"k":"B","t":"第一个发表了对称密码算法思想"},{"k":"C","t":"第一个发表了非对称密码算法思想"},{"k":"D","t":"第一个研制出防火墙"}],"answer":"C","src":"精选300题","srcNum":10,"id":"q102","analyze":"2015年ACM图灵奖授予Whitfield Diffie与Martin Hellman，表彰其1976年提出公钥密码即非对称密码思想及Diffie-Hellman密钥交换，开创现代密码学新方向。C语言由Dennis Ritchie发明，对称密码古已有之，防火墙与二人无关，故A、B、D不对。","expand":"记忆：1976年《New Directions in Cryptography》提出公钥密码概念与DH密钥交换，1977年Rivest、Shamir、Adleman实现RSA。DH本身只协商密钥不加密数据，且易受中间人攻击，需证书或预共享密钥认证。","tags":["密码学"]},{"stem":"虚拟专用网络(VPN)通常是指在公共网络中利用隧道技术,建立一个临时的、安全的网络。这里的字母P 的正确解释是","options":[{"k":"A","t":"speciall- purpose,特定的、专用用途的"},{"k":"B","t":"Proprietary,专有的、专卖的"},{"k":"C","t":"Private,私有的、专有的"},{"k":"D","t":"specific,特种的、具体的"}],"answer":"C","src":"精选300题","srcNum":11,"id":"q103","analyze":"VPN即Virtual Private Network，其中P取自Private，意为私有的、专用的，指在公用网络上构建逻辑专用的安全网络，故C正确。special-purpose、Proprietary、specific均非VPN名称中的词义，属于形近干扰项，不能作为解释。","expand":"VPN三要素为隧道技术即封装加密、身份认证、访问控制。常见实现：IPsec VPN工作在网络层，SSL VPN在应用层，MPLS VPN由运营商提供。易混点：VLAN是局域网二层隔离，不等于VPN，虚拟指逻辑链路而非独占物理线路。","tags":["网络安全"]},{"stem":"为防范网络欺诈确保交易安全,网银系统首先要求用户安全登录,然后使用“智能卡￫短信证模式进行网上转账等交易。在此场景中用到下列哪些鉴别方法?","options":[{"k":"A","t":"实体“所知”以及实体“所有”的鉴别方法"},{"k":"B","t":"实体“所有”以及实体“特征”的鉴别方法"},{"k":"C","t":"实体“所知”以及实体“特征”的鉴别方法"},{"k":"D","t":"实体“所有”以及实体“行为”的鉴别方法"}],"answer":"A","src":"精选300题","srcNum":12,"id":"q104","analyze":"安全登录使用用户名与口令，属实体所知的鉴别；智能卡是用户持有的物理载体，短信验证码发送至用户持有的手机，均属实体所有。题干未使用指纹、人脸等生理特征，也未使用步态、击键等行为特征，故对应的只有所知与所有，选A。","expand":"三类鉴别：所知是口令、PIN、密语；所有是智能卡、U盾、令牌、手机；特征是指纹、人脸、声纹、虹膜。多因子认证要求不同类型叠加，同类叠加两个口令不算多因子。行为特征如击键节奏多用于持续认证，不属本题场景。","tags":["身份鉴别"]},{"stem":"实体身份鉴别一般依据以下三种基本情况或这三种情况的组合:实体所知的鉴别方法、实体所有的鉴别方法和基于实体特征的鉴别方法。下面选项中属于实体特征的鉴别方法是","options":[{"k":"A","t":"将登录口令设置为出生日期"},{"k":"B","t":"通过询问和核对用户的个人隐私信息来鉴"},{"k":"C","t":"使用系统定制的、在本系统专用的Ic 卡进行鉴别"},{"k":"D","t":"通过扫脸和识别用户的脸部信息来鉴别"}],"answer":"D","src":"精选300题","srcNum":13,"id":"q105","analyze":"实体特征鉴别依据用户固有的生理或行为特征，扫脸识别脸部信息属生理特征，D正确。A把口令设为出生日期仍属所知方法，B询问隐私信息属知识性核对，归入所知，C使用本系统专用IC卡属所有方法，三者都不是特征鉴别。","expand":"对比记忆：所知是知道什么，如口令与密语；所有是持有什么，如卡与令牌；特征是是什么，如指纹、人脸、虹膜、声纹。易错点是把隐私问答误判为特征，实为知识型。特征鉴别需关注误识率与拒识率的平衡。","tags":["身份鉴别"]},{"stem":"在信息系统中,访问控制是重要的安全功能之一。他的任务是在用户对系统资源提供最大限度共享的基础上,对用户的访问权限进行管理,防止对信息的非授权篡改和滥用。访问控制模型将实体划分为主体和客体两类,通过对主体身份的识别来限制其对客体的访问权限。下列选项中,对主体、客体和访问权限的描述中错误的是","options":[{"k":"A","t":"对文件进行操作的用户是一种主体"},{"k":"B","t":"主体可以接受客体的信息和数据,也可能改变客体相关的信息"},{"k":"C","t":"访问权限是指主体对客体所允许的操作"},{"k":"D","t":"对目录的访问权可分为读、写和拒绝访问"}],"answer":"D","src":"精选300题","srcNum":15,"id":"q106","analyze":"访问权限是主体对客体允许的操作集合；对文件操作的用户是主体，主体可读取并改变客体信息，故A、B、C正确。对目录的访问权通常分为读、写、执行即进入，拒绝访问是ACL中的拒绝项而非权限类别，把它与读写并列属于概念混淆，故D错误。","expand":"UNIX权限位：r读、w写、x执行；对目录而言x表示可进入穿越，r表示可列目录，w表示可增删条目。ACL中允许与拒绝是授权决定而非权限类型。记忆：主体主动、客体被动，权限是操作集合，授权是主体、客体与操作的组合。","tags":["访问控制"]},{"stem":"小赵是某大学计算机科学与技术专业的毕业生,在前往一家大型企业应聘时,面试经理要求他给出该企业信息系统访问控模型的设计思路。如果想要为一个存在大量用户的信息系统实现自主访问控制功能,在以下选项中,从时间和资源消耗的角度,下列选项中他应该采取的最合适的模型或方法是","options":[{"k":"A","t":"访问控制列表(ACL)"},{"k":"B","t":"能力表(CL)"},{"k":"C","t":"BLP 模型"},{"k":"D","t":"Biba 模型"}],"answer":"A","src":"精选300题","srcNum":16,"id":"q107","analyze":"用户量大的系统做自主访问控制时，ACL以资源为索引记录授权名单，新增用户只在其需访问的资源上追加条目，授权、查询与审计都直观，时间与存储开销更优。能力表以主体为索引，用户多则条目规模随用户与客体乘积增长，全局撤销困难。BLP与Biba属强制访问控制，不符合自主要求。","expand":"对比：ACL查询某资源谁能访问更快，能力表查询某人能访问什么更快。选型口诀：用户多、资源相对少选ACL；客体多、访问频繁需快速判定选能力表。DAC风险是权限可转授，MAC靠标签规则，安全性高但灵活性低。","tags":["访问控制"]},{"stem":"强制访问控制是指主体和客体都有一个固定的安全属性,系统用该安全属性来决定一个主体是否可以访问某个客体,具有较高的安全性。适用于专用或对安全性要求较高的系统,强制访问控制模型有多种模型,如BLP、Biba、clark- Wilson 和chinesc 等。小李自学了BLP 模型,并对该模型的特点进行了总结。以下4 种对BLP 模型的描述中,正确的是","options":[{"k":"A","t":"BLP 模型用于保证系统信息的机密性,规则是向上读,向下写”"},{"k":"B","t":"BLP 模型用于保证系统信息的机密性,规则是“向下读,向上写”"},{"k":"C","t":"BLP 模型用于保证系统信息的完整性,规则是“向上读,向下写"},{"k":"D","t":"BLP 模型用于保证系统信息.的完整性,规则是“向下读,向上写"}],"answer":"B","src":"精选300题","srcNum":17,"id":"q108","analyze":"BLP模型面向机密性，以简单安全性与星特性约束信息流向：主体只能读安全级不高于自己的客体，即向下读；只能写安全级不低于自己的客体，即向上写。故B正确，A方向颠倒，C、D把模型目标误作完整性，完整性由Biba模型保障。","expand":"口诀：BLP保保密，下读上写不泄密；Biba保完整，上读下写不污染。星特性防止高密级信息流向低密级，但会带来调用受限问题，实践中以可信主体或多级安全设备缓解。Clark-Wilson侧重完整性与职责分离。","tags":["访问控制"]},{"stem":"访问控制方法可分为自主访问控制、强制访问控制和基于角色的访问控制,他们具有不同的特点和应用场景。如果需要选择一个访问控制方法,要求能够支持最小特权原则和职责分离原则,而且在不同的系统配置下可以具有不同的安全控制,那么在下列选项中,能够满足以上要求的选项是","options":[{"k":"A","t":"自主访问控制"},{"k":"B","t":"强制访问控制"},{"k":"C","t":"基于角色的访问控制"},{"k":"D","t":"以上选项都可以"}],"answer":"C","src":"精选300题","srcNum":18,"id":"q109","analyze":"基于角色的访问控制以角色承载权限、以用户分配角色，天然支持最小特权即按岗授权与职责分离即互斥角色，并可按系统配置灵活调整角色与授权关系，C正确。DAC权限由属主自主转授，难以统一职责分离；MAC依赖固定标签，配置刚性、灵活性不足。","expand":"RBAC要素为用户、角色、权限、会话，并支持角色继承与角色约束如互斥与基数限制。对比：DAC灵活但易扩散，MAC严格但僵硬，RBAC兼顾管理效率与合规要求，适合按岗位划分的组织。标准模型分RBAC0至RBAC3四个层次。","tags":["访问控制"]},{"stem":"关于Wi-FI 联盟提出的安全协议WPA 和WPA2 的区别,下面描述正确的是","options":[{"k":"A","t":"WPA 是有线局域安全协议,而WPA2 是无线局域网协议"},{"k":"B","t":"WPA 是适用于中国的无线局域安全协议,而WPA2 适用于全世界的无线局域网协议"},{"k":"C","t":"WPA 没有使用密码算法对接入进行认证,而WPA2 使用了密码算法对接入进行认证"},{"k":"D","t":"WPA 是依照802.111 标准草案制定的,而WPA2 是依照802.111 正式标准制定的"}],"answer":"D","src":"精选300题","srcNum":19,"id":"q110","analyze":"WPA是Wi-Fi联盟依据802.11i草案推出的过渡
