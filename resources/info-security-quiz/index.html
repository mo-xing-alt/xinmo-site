m":"关于信息安全管理体系的作用,下面理解错误的是","options":[{"k":"A","t":"对内而言,由助于建立起文档化的信息安全管理规范,实现有法”可依,有章可循,有据可査"},{"k":"B","t":"对内而言,是一个光花钱不挣钱的事情,需要组织通过其他方面收入来弥补投入"},{"k":"C","t":"对外而言,有助于使各利益相关方对组织充满信心"},{"k":"D","t":"对外而言,能起到规范外包工作流程和要求,帮助界定双方各自信息安全责任"}],"answer":"B","src":"B卷·补充100题","srcNum":13,"id":"q363","analyze":"ISMS通过体系化控制降低风险损失、满足合规、增强相关方信任，不能简单视为“只花钱不挣钱”。A内部形成文档化规范，做到有章可循、有据可查；C对外增强信心；D规范外包并界定双方责任，均属作用。B否定其价值，为错误理解。","expand":"ISMS价值：合规（网络安全法、等保）、风险成本下降、业务连续性、招投标与供应链信任、声誉与品牌。可用“避免损失＝事件概率×损失额”衡量收益。技巧：凡把管理体系建设描述为“纯成本、无收益”的选项，通常即为错误项。","tags":["信息安全管理体系"]},{"stem":"随机进程名称是悉意代码迷惑管理员和系统安全检査人员的技术手段之一,以下对于随机进程名技术,描述正确的是","options":[{"k":"A","t":"随机进程名技术虽然每次进程名都是随机的,但是只要找到了进程名称,就找到了恶意代码程序本身"},{"k":"B","t":"恶意代码生成随机进程名称的目的是使进程名称不固定,因为杀毒软件是按照进程名称进行病毒进程査杀"},{"k":"C","t":"恶意代码使用随机进程名是通过生成特定格式的进程名称,使进程管理器中看不到恶意代码的进程"},{"k":"D","t":"随机进程名技术每次启动时随机生成恶意代码进程名称,通过不固定的进程名称使自己不容易被发现真实的恶意代码程序名称"}],"answer":"D","src":"B卷·补充100题","srcNum":14,"id":"q364","analyze":"随机进程名技术在每次启动时随机生成进程名称，使进程名不固定，从而不易被管理员发现并与真实程序名对应，D描述准确。A错误在于进程名只是外壳，找到名字不等于找到程序本体；B错在杀毒软件主要依据特征与行为而非进程名；C错在进程仍然可见。","expand":"恶意代码隐藏手法还包括：进程注入、傀儡进程、Rootkit隐藏、服务名伪装（如svch0st.exe）、数字签名伪造、无文件攻击。查杀依据是文件特征、内存特征、行为链与签名。技巧：进程名可伪造，文件路径、签名、父进程、网络外联更可靠。","tags":["恶意代码","操作系统安全"]},{"stem":"某商贸公司信息安全管理员考虑到信息系统对业务影响越来越重要,计划编制本单位信息安全应急响应预案,在向主管领导写报告时,他列举了编制信息安全应急响应预案的好处和重要性,在他罗列的四条理由中,其中不适合作为理由的一条是","options":[{"k":"A","t":"应急预案是明确关键业务系统信息安全应急响应只会体系和工作机制的重要方式"},{"k":"B","t":"应急预案是提高应对网络和信息系统突发事件能力,减少突发事件造成的损失和危害,保障信息系统运行平稳、安全、有序、高效的手段"},{"k":"C","t":"编制应急预案是国家网络安全法对所有单位的强制要求,因此必须建设"},{"k":"D","t":"应急预案是保障单位业务系统信息安全的重要措施"}],"answer":"C","src":"B卷·补充100题","srcNum":15,"id":"q365","analyze":"《网络安全法》要求网络运营者制定网络安全事件应急预案，主要义务主体是网络运营者，尤其关键信息基础设施运营者，并非对所有单位一律强制。A机制体系、B能力与减损、D业务保障均为合理理由；C把适用范围扩大为“所有单位”，不宜作为立项理由。","expand":"《网络安全法》第二十五条：网络运营者应制定网络安全事件应急预案，及时处置漏洞、病毒、攻击等风险；CII运营者还应定期演练。配套标准：GB/Z 20986事件分类分级、GB/T 20985事件管理指南。技巧：法条常限定主体范围，遇“所有单位”需警惕。","tags":["应急响应","信息安全标准与法规"]},{"stem":"老王是一名企业信息化负责人,由于企业员工在浏览网页时总导致病毒感染系统,为了解决这一问题,老王要求信息安全员给出解决措施,信息安全员给出了四条措施建议,老王根据多年的信息安全管理经验,认为其中一条不太适合推广,你认为是哪条措施)。","options":[{"k":"A","t":"采购防病毒网关并部署在企业互联网出口中,实现对所有浏览网页进行检测,组织网页中的病毒进入内网"},{"k":"B","t":"采购并统一部署企业防病毒软件,信息化管理部门统一进行病毒库升升级,确保每台计算机都具备有效的病毒检测和査杀能力"},{"k":"C","t":"制定制度禁止使用微软的IE 测览器上网,统一要求使用Chrome 浏览器"},{"k":"D","t":"组织对员工进行一次上网行为安全培训,提高企业员工在互联网浏览时的安全意识"}],"answer":"C","src":"B卷·补充100题","srcNum":16,"id":"q366","analyze":"网页感染源于挂马页面、漏洞利用与恶意下载。A出口部署防病毒网关可拦截恶意内容，B统一部署防病毒软件并集中升级保证终端查杀能力，D培训提升员工辨识能力，均可直接降低风险。C仅禁用某浏览器并强制另一款，既不能阻断挂马，又影响业务兼容，不宜推广。","expand":"网页挂马防护层次：出口网关（防病毒、URL过滤、沙箱）＋终端防病毒与补丁管理＋浏览器安全配置与插件管控＋用户意识培训。技巧：管理措施要可执行、覆盖面广，单纯“禁用某产品”多为治标选项。延伸：插件与未打补丁的浏览器才是挂马高发入口。","tags":["恶意代码","网络安全"]},{"stem":"国际标准化组织( International Organization for Standardization,ISO)对信息安全的定义为","options":[{"k":"A","t":"保护信息和信息系统不被未经授权的访问、使用、泄露、修改和破坏,为信息和信息系统提供保密性完整性、可用性、可控性和不可否认性"},{"k":"B","t":"信息安全,有时缩写为Infosec,是防止未经授权的访问、使用、披露、中断、修改、检査、记录或破坏信息的做法。它是一个可以用于任何形式数据(例如电子、物理)的通用术语"},{"k":"C","t":"在既定的密级条件下,网络与信息系统抵御意外事件或恶意行为的能力,这些事件和行为将威胁所存储或传输的数据以及经由这些网络和系统所提供的服务的可用性、真实性、完整性和机密性"},{"k":"D","t":"为数据处理系统建立和采取技术、管理的安全保护,保护计算机硬件、软件、数据不因偶然的或恶意的原因而受到破坏、更改、泄露"}],"answer":"D","src":"B卷·补充100题","srcNum":18,"id":"q367","analyze":"ISO对信息安全的经典定义是：为数据处理系统建立和采取技术、管理两方面安全保护，保护计算机硬件、软件和数据不因偶然或恶意原因被破坏、更改、泄露，D与之对应。A层次更高并加入可控性与不可否认性，B为泛化定义，C偏等级保护与抗攻击能力描述。","expand":"ISO定义三要点：技术＋管理双手段、硬件＋软件＋数据三对象、偶然＋恶意两原因。国内常扩展为CIA加可控性、不可否认性。易混：GB/T 20984讲风险评估方法，等级保护讲分级保护要求，均非该定义的出处。","tags":["信息安全标准与法规","信息安全管理体系"]},{"stem":"若一个组织声称自己的ISMS 符合ISO/EC27001 或GBT22080 标准要求,其信息安全控制措施通常需要在人力资源安全方面实施常规控制,人力资源安全划分为3 个控制阶段,不包括哪一项","options":[{"k":"A","t":"任用之前"},{"k":"B","t":"任用中"},{"k":"C","t":"任用终止或变化"},{"k":"D","t":"任用后"}],"answer":"D","src":"B卷·补充100题","srcNum":19,"id":"q368","analyze":"ISO/IEC 27001人力资源安全分三阶段：任用之前（背景核查、职责与保密条款）、任用中（培训、职责履行、纪律处理）、任用终止或变化（资产归还、权限收回、保密义务延续）。“任用后”不在标准划分中，故D为不包括项。","expand":"口诀“前—中—变”：前查背景、中管行为、变收权限。终止环节重点为资产归还、访问权撤销、保密义务延续。易混：资产管理域讲信息分类与介质处置，人力资源域讲“人的全周期”。技巧：含“后”的并列选项常为杜撰干扰。","tags":["信息安全管理体系","信息安全标准与法规"]},{"stem":"PDCA 循环又叫戴明环,是管理学常用的一种模型。关于PDCA 四个字母,下面理解错误的是","options":[{"k":"A","t":"P 是Plan,指分析问题,发现问题,确定方针,目标和活动计划"},{"k":"B","t":"D 是do,指实施,具体运作,实现计划中的内容"},{"k":"C","t":"C 是Check,指检査、总结执行计划的结果,明确效果,找出效果"},{"k":"D","t":"A 是Aim,指瞄准问题,抓住安全事件的核心,确定责任"}],"answer":"D","src":"B卷·补充100题","srcNum":20,"id":"q369","analyze":"PDCA中A为Act（处理、改进），即把成功经验标准化、未解决问题转入下一循环；而“Aim瞄准问题、确定责任”并非PDCA含义。P计划、D执行、C检查三项表述基本准确，因此错误的是D。PDCA由戴明推广，亦称戴明环。","expand":"PDCA对应ISMS过程：Plan策划（建立体系、风险评估）、Do实施（运行控制）、Check检查（内审、监视测量）、Act改进（管理评审、纠正措施）。口诀“计—做—查—改”。易混：A常被误读为Aim或Adjust，其本义始终是Action。","tags":["信息安全管理体系"]},{"stem":"规范的实施流程和文档管理,是信息安全风险评估能否取得成果的重要基础。某单位在实施风险评估时,按照规范形成了若干文档,其中,下面)中的文档应属于风险评估中风险要素识别”阶段输出的文档。","options":[{"k":"A","t":"《风险评估方案》主要包括本次风险评估的目的、范围、目标、评估步骤、经费预算和进度安排等内容"},{"k":"B","t":"《风险评估方法和工具列表》主要包括拟用的风险评估方法和测试评估工具等内容"},{"k":"C","t":"《风险评估准则要求》主要包括现有风险评估参考标准、采用的风险分析方法、资产分类标准等内容"},{"k":"D","t":"《已有安全措施列表》,主要包括经检査确认后的已有技术和管理各方面安全措施等内容"}],"answer":"D","src":"B卷·补充100题","srcNum":21,"id":"q370","analyze":"风险要素识别阶段要识别资产、威胁、脆弱性并确认已有安全措施，输出《已有安全措施列表》等文档。A《风险评估方案》、B《方法和工具列表》、C《准则要求》均在准备阶段形成，属评估前的策划，故D正确。","expand":"阶段文档对应：准备—评估方案、方法与工具、准则要求、范围说明；要素识别—资产清单、威胁列表、脆弱性列表、已有措施列表；分析—风险计算表与分析报告；判定—风险等级与处置建议。技巧：见“清单、列表＋要素”多归要素识别。","tags":["风险评估"]},{"stem":"作为单位新上任的CSO,你组织了一次本单位的安全评估工作以了解单位安全现状。在漏洞扫描报告中,你发现了某部署在内网且对内部服务的业务系统存在一个漏洞,对比上一年度的漏洞扫描报告,发现这个漏洞之前已经报告出来,经询问安全管理员得知,这个业务系统开发商已经倒闭,因此无法修复。对于这个问题,你应该如何处理","options":[{"k":"A","t":"向公司管理层提出此问题,要求立即立项重新开发此业务系统,避免单位中存在这样的安全风险"},{"k":"B","t":"既然此问题不是新发现的问题,之前已经存在,因此与自己无关,可以不予理会"},{"k":"C","t":"让安全管理人员重新评估此漏洞存在的安全风险并给出进一步的防护措施后再考虑如何处理"},{"k":"D","t":"让安全管理员找出验收材料看看有没有该业务系统源代码,自己修改解决这个漏洞"}],"answer":"C","src":"B卷·补充100题","srcNum":22,"id":"q371","analyze":"漏洞已无厂商修复，应先量化风险（暴露面、可利用性、影响范围），再选择补偿措施：网络隔离、最小权限、IPS虚拟补丁、WAF与加强监测，故C正确。A重建立项代价过高且非首选，B属失职，D擅改生产代码风险更大且无验收材料依据。","expand":"风险处置四选项：降低（加固或补偿控制）、规避（下线隔离）、转移（保险外包）、接受（记录并审批）。无源码场景常用补偿控制：分区隔离、访问限制、虚拟补丁、行为监测。技巧：先评估再处置，避免“要么不管、要么重建”的极端决策。","tags":["风险评估","应急响应"]},{"stem":"王工是某单位的系统管理员,他在某次参加了单位组织的风险管理工作时,根据任务安排,他依据已有的资产列表,逐个分析可能危害这些资产的主体、动机、威胁途径等多种因素,分析这些因素出现及造成损失的可能性大小,并为其赋值。请问,他这个工作属于下面哪一个阶段的工作","options":[{"k":"A","t":"资产识别并赋值"},{"k":"B","t":"脆弱性识别并赋值"},{"k":"C","t":"威胁识别并赋值"},{"k":"D","t":"确认已有的安全措施并赋值"}],"answer":"C","src":"B卷·补充100题","srcNum":23,"id":"q372","analyze":"题干中“分析危害资产的主体、动机、威胁途径，以及出现频率与造成损失的可能性并赋值”，正是威胁识别与赋值的内容。资产识别针对资产自身属性与价值，脆弱性识别针对系统自身弱点，已有措施识别针对现有控制有效性，均不符。","expand":"四要素：资产（价值）、威胁（发生可能性）、脆弱性（被利用难易度）、已有措施（有效性）。风险值≈资产价值×威胁可能性×脆弱性严重程度。技巧：见“主体、动机、途径、频率”即威胁识别；见“配置缺陷、补丁缺失、弱口令”即脆弱性识别。","tags":["风险评估"]},{"stem":"()第二十三条规定存储、处理国家秘密的就计算机信息系统(以下简称泄密信息系统)按照O 实行分级保护。(0)应当按照国家保密标准配备保密设施、设备。①)、设备应当与涉密信息系统同步规划、同步建设、同步运行(三同步)。涉密信息系统应当按照规定,经0)后,方可投入使用","options":[{"k":"A","t":"《保密法》:涉密程度;涉密信息系统;保密设施;检査合格"},{"k":"B","t":"《国家保密法》涉密程度;涉密系统;保密设施;检査合格"},{"k":"C","t":"《网络保密度;涉密系统;査合格"},{"k":"D","t":"《安全保密度;涉密信息系施:检查合格"}],"answer":"A","src":"B卷·补充100题","srcNum":24,"id":"q373","analyze":"《保守国家秘密法》规定：存储、处理国家秘密的计算机信息系统按涉密程度实行分级保护；应按国家保密标准配备保密设施、设备，并与涉密信息系统同步规划、同步建设、同步运行；经检查合格后方可投入使用。A各项与法条对应，B、C、D在法名或要素上错配。","expand":"涉密系统“三同步”：同步规划、同步建设、同步运行，上线前须经保密检查测评合格。易混：等级保护按五级由公安主导；涉密分级保护按绝密、机密、秘密三级，由保密行政管理部门主导，依据BMB系列国家保密标准。","tags":["信息安全标准与法规","等级保护"]},{"stem":"企业安全架构( Sherwood Applied Business Security Architecture, SABSA)是企业架构的个子集,它定义了0,包括各层级的()、流程和规程,以及它们与整个企业的战略、战术和运营链接的方式,用全面的、严格的方法描述了组成完整的信息安全管理体系(ISMS)所有组件的()。开发企业安全架构的很主要原因是确保安全工作以一个标准化的节省成本的方式与业务实践相结合。架构在抽象层面工作,它提供了一个0。除了安全性之外,这种类型的架构让组织更好的实现の、集成性、易用性、标准化和便于治理性。","options":[{"k":"A","t":"信息安全战略;解决方案;结构和行为:可供参考的框架;互操作性"},{"k":"B","t":"信息安全战略;结构和行为;解决方案;可供参考的框架;互操作性"},{"k":"C","t":"信息安全战略;解决方案;可供参考的框架:;结构和行为;互操作性"},{"k":"D","t":"信息安全战略;可供参考的框架;解决方案:结构和行为;互操作性"}],"answer":"B","src":"B卷·补充100题","srcNum":26,"id":"q374","analyze":"SABSA定义信息安全战略，涵盖各层级的结构、行为、流程与规程及其与企业战略战术运营的链接；用全面严格方法描述组成ISMS各组件的解决方案；架构在抽象层面提供可供参考的框架；并提升互操作性、集成性、易用性与治理性。B顺序正确。","expand":"SABSA常与TOGAF配合：前者给安全架构分层，后者给企业架构方法论。记忆“战略定方向、结构行为定形态、解决方案定落地、框架可参考、互操作可协同”。A把解决方案前置，C与D顺序错乱，均为干扰。","tags":["安全工程与项目管理","信息安全管理体系"]},{"stem":"某贸易公司的OA 系统由于存在系统漏洞,被攻击者上传了木马病毒病删除了系统中的数据,由于系统备份是每周六进行一次,时间发生时间为周三,因此导致该公司三个工作日的数据丢失并使得OA 系统在随后两天内无法访问,影响到了与公司有业务往来部分公司业务。在事故处理报告中,根据GB/z20986-2007《信息安全事件分级分类指南》,该事件的标准分类和定级应该是","options":[{"k":"A","t":"有害程序事件特别重大事件(ｴ级"},{"k":"B","t":"信息破坏事件重大事件(II 级)"},{"k":"C","t":"有害程序事件较大事件(III 级"},{"k":"D","t":"信息破坏事件一般事件(IV 级)"}],"answer":"D","src":"B卷·补充100题","srcNum":27,"id":"q375","analyze":"事件直接后果是业务数据被删除、丢失三个工作日数据，性质属信息破坏事件；影响限于本单位及部分往来业务，未危害社会秩序与公共利益，按GB/Z 20986定级为一般事件（IV级），故D正确。A、C归为有害程序事件，B定为重大事件明显高估。","expand":"GB/Z 20986-2007分七类：有害程序、网络攻击、信息破坏、信息内容安全、设备设施故障、灾害性事件、其他事件；定级四级：特别重大I、重大II、较大III、一般IV。技巧：分类看“手段性质”，定级看“后果与影响范围”。","tags":["安全事件与取证","信息安全标准与法规"]},{"stem":"在PDR 模型的基础上发展成为( Policy- Protection- Detection- Response,PPDR)模型,即策略防护-检测响应。模型的核心是所有的防护、检测、响应都是依据安全策略实施的。在PPDR 模型中,策略指的是信息系统的安全策略,包括访问控制策略、加密通信策略、身份认证策略、备份恢复策略等。策略体系的建立包括安全策略的制定、()等;防护指的是通过部署和采用安全技术来提高网络的防护能力如()、防火墙、入侵检测、加密技术、身份认证等技术检测指的是利用信息安全检测工具,监视、分析、审计网络活动了解判断网络系统的()。检测这一环节,使安全防护从被动防护演进到主动防御是整个模型动态性的体现。主要方法包括实时监控、检测、报警等响应指的是在检测到安全漏洞和安全事件时通过及时的响应措施将网络系统的()调整到风险最低的状态,包括饮复系统功能和数据,启动备份系统等。其主要方法包括关闭服务、跟踪、反击、消除影响等","options":[{"k":"A","t":"评估与执行;访问控制;安全状态安全性"},{"k":"B","t":"评估与执行;安全状态;访问控制;安全性"},{"k":"C","t":"访问控制;评估与执行;安全状态;安全性"},{"k":"D","t":"安全状态;评估与执行;访问控制;安全性"}],"answer":"A","src":"B卷·补充100题","srcNum":28,"id":"q376","analyze":"PPDR即策略、防护、检测、响应，一切活动依策略实施。策略体系含制定、评估与执行；防护举例含访问控制、防火墙、IDS、加密、身份认证；检测用于掌握网络安全状态；响应把系统安全性调整到风险最低状态。A词序与题干完全匹配。","expand":"演进：PDR→P2DR（策略为核心）→PPDR（Policies统辖）。四环联动“策略是纲、防护是盾、检测是眼、响应是手”。易混：检测关注“安全状态”是否偏离，响应关注“安全性”的恢复与止损，二者不可互换。","tags":["网络安全","安全工程与项目管理"]},{"stem":"根据《信息安全等级保护管理办法》、《关于开展信息安全等级保护测评体系建设试点工作的通知》公信安[20091812 号)、关于推动信息安全等级保护()建设和开展()工作的通知(公信安[20101003 号)等文件,由公安部()对等级保护测评机构管理,接受测评机构的申请、考核和定期()对不具备能力的测评机构则","options":[{"k":"A","t":"等级测评;测评体系;等级保护评估中心;能力验证;取消授权"},{"k":"B","t":"测评体系;等级保护评估中心;等级测评;能力验证;取消授权"},{"k":"C","t":"测评体系;等级测评;等级保护评估中心能力验证;取消授权"},{"k":"D","t":"测评体系;等级保护评估中心;能力验证;等级测评;取消授权"}],"answer":"C","src":"B卷·补充100题","srcNum":29,"id":"q377","analyze":"依据公信安[2009]1812号与[2010]1003号等文件，要推动信息安全等级测评体系建设并开展等级测评工作；由公安部等级保护评估中心受理测评机构申请与考核，定期进行能力验证，对不具备能力的机构取消授权。C语序对应，其余选项错位。","expand":"测评机构管理要点：推荐目录制、资质与能力验证、定期监督检查、违规取消授权。配套标准：GB/T 22240定级指南、GB/T 22239基本要求、GB/T 28448测评要求、GB/T 28449测评过程指南。口诀“体系是面、测评是事、中心是管”。","tags":["等级保护","信息安全标准与法规"]},{"stem":"为推动和规范我国信息安全等级保护工作,我国制定和发布了信息安全等级保护工作所需要的一系列标准这些标准可以按照等级保护工作的工作阶段大致分类。下面四个标准中0)提出和规定了不同安全保护等级信息系统的最低保护要求,并按照技术和管理两个方面提出了相关基本安全要求","options":[{"k":"A","t":"GB/T22239-2OO8《信息系统安全等级保护基本要求》"},{"k":"B","t":"GB/T2224 の-208《信息系统安全保护等级定级指南》"},{"k":"C","t":"GB/T25070-2010《信息系统等级保护安全设计技术要求》"},{"k":"D","t":"GB/T28449-2012《信息系统安全等级保护测评过程指南》"}],"answer":"A","src":"B卷·补充100题","srcNum":30,"id":"q378","analyze":"GB/T 22239《信息系统安全等级保护基本要求》提出不同安全保护等级信息系统的最低保护要求，并按技术和管理两方面提出基本安全要求，A正确。B为定级指南，C为安全设计技术要求，D为测评过程指南，均不描述最低保护要求。","expand":"标准族记忆：22240定级（定几级）、22239基本要求（要什么）、25070设计技术要求（怎么设计）、28448测评要求、28449测评过程（怎么测）、25058实施指南。新版为GB/T 22239-2019。技巧：见“最低保护要求＋技术管理两方面”即基本要求。","tags":["等级保护","信息安全标准与法规"]},{"stem":"有关系统安全工程-能力成熟度模型(SSE-CMM)错误的理解是","options":[{"k":"A","t":"SSE-CM 要求实施组织与其他组织相互作用,如开发、产品供应商、集成商和咨询服务商等"},{"k":"B","t":"SSE-CM 可以使安全工程成为一个确定的、成熟的和可度量的科目"},{"k":"C","t":"基于SSE-CM 的工程是独立工程,与软件工程、硬件工程、通信工程等分别规划实施"},{"k":"D","t":"SSE-CM 覆盖整个组织的活动。包括管理、组织和工程活动等,而不仅仅是系统安全的工程活动"}],"answer":"C","src":"B卷·补充100题","srcNum":32,"id":"q379","analyze":"SSE-CMM强调系统安全工程须与软件、硬件、通信等工程过程并行、交互、集成，而非独立分离规划实施，故C错误。A说明需与开发商、供应商、集成商、咨询方相互作用；B说明其使安全工程确定、成熟、可度量；D说明其覆盖管理、组织与工程活动，均正确。","expand":"SSE-CMM（ISO/IEC 21827）以过程域与6个能力级别（0—5）度量安全工程成熟度，强调一体化而非孤立。记忆“不孤立、要集成、可度量、分等级”。易混：CMMI面向一般过程改进，SSE-CMM专指系统安全工程。","tags":["安全工程与项目管理","软件安全"]},{"stem":"根据相关标准,信息安全风险管理可分为背景建立、风险评估、风险处理、批准监督、监控审査和沟通咨询等阶段,按照该框架,文档《风险分析报告》应该属于那个阶段的输出成果","options":[{"k":"A","t":"风险评估"},{"k":"B","t":"风险处理"},{"k":"C","t":"批准监督"},{"k":"D","t":"监控审查"}],"answer":"A","src":"B卷·补充100题","srcNum":33,"id":"q380","analyze":"风险管理六阶段中，风险评估阶段在识别要素后计算并评价风险，输出《风险分析报告》，含风险值与风险等级。风险处理输出处置计划，批准监督形成批准与监督记录，监控审查输出审查报告，故A正确。","expand":"文档链：背景建立—系统描述与安全要求报告；风险评估—风险分析报告；风险处理—处置计划与残余风险报告；批准监督—批准意见与监督记录；监控审查—审查报告；沟通咨询—沟通记录。技巧：含“风险分析、风险值”归风险评估，含“处置、措施”归风险处理。","tags":["风险评估"]},{"stem":"根据《关于开展信息安全风险评估工作的意见》的规定,错误的是","options":[{"k":"A","t":"信息安全风险评估分自评估、检査评估两形式,应以检查评估为主,自评估和检査评估相互结合、互为补充"},{"k":"B","t":"信息安全风险评估工作要按照严密组织、规范操作、讲求科学、注重实效”的原则开展"},{"k":"C","t":"信息安全风险评估应贯穿于网络和信息系统建设运行的全过程"},{"k":"D","t":"开展信息安全风险评估工作应加强信息安全风险评估工作的组织领导"}],"answer":"A","src":"B卷·补充100题","srcNum":34,"id":"q381","analyze":"《关于开展信息安全风险评估工作的意见》明确风险评估分自评估与检查评估两种形式，以自评估为主、检查评估为辅，二者结合、互为补充。A把主次颠倒为“以检查评估为主”，故错误。B的原则表述、C全过程覆盖、D加强组织领导均正确。","expand":"记忆“自评估为主、检查评估为辅”：自评估由运营者自行组织，检查评估由主管部门组织。原则为“严密组织、规范操作、讲求科学、注重实效”。延伸：风险评估应贯穿规划、设计、建设、运行、废弃全生命周期。","tags":["风险评估","信息安全标准与法规"]},{"stem":"即使最好用的安全产品也存在（),结果,在任何的系统中敌手最终都能够找到一个被开发出的漏洞,一种有效的对策是在敌手和它的目标之间配备多种（)每一种机制都应包括()两种手段。","options":[{"k":"A","t":"安全机制;安全缺陷;保护和检测"},{"k":"B","t":"安全缺陷;安全机制;保护和检测"},{"k":"C","t":"安全缺陷;保护和检测;安全机制"},{"k":"D","t":"安全缺陷;安全机制:外边和内部"}],"answer":"B","src":"B卷·补充100题","srcNum":35,"id":"q382","analyze":"任何安全产品都存在安全缺陷，敌手最终能找到被开发出的漏洞；有效对策是在敌手与目标之间配置多种安全机制，每种机制都同时包含保护与检测两种手段。B顺序正确，A、C、D把“缺陷、机制、手段”错位，语义不通。","expand":"该表述体现深度防御思想：产品必有缺陷→叠加多种机制→每层既防又查。纵深防御强调多点、分层、异构，避免单点失效与同源共模故障。可结合IATF“人员、技术、运行”三要素理解保护与检测的互补关系。","tags":["安全工程与项目管理","网络安全"]},{"stem":"有关危害国家秘密安全的行为的法律责任,正确的是","options":[{"k":"A","t":"严重违反保密规定行为只要发生,无论是否产生泄密实际后果,都要依法追究责任;"},{"k":"B","t":"非法获取国家秘密,不会构成刑事犯罪,不需承担刑事责任:"},{"k":"C","t":"过失泄露国家秘密,不会构成刑事犯罪,不需承担刑事责任;"},{"k":"D","t":"承担了刑事责任,无需再承担行政责任和/或其他处分"}],"answer":"A","src":"B卷·补充100题","srcNum":39,"id":"q383","analyze":"保密法及相关规定对严重违反保密规定的行为实行行为追责，不以是否产生实际泄密后果为要件。B非法获取国家秘密可构成犯罪；C过失泄露情节严重同样构成犯罪（刑法第三百九十八条）；D刑事责任与行政、纪律责任可并行，故B、C、D错误。","expand":"保密法律责任三层：刑事（故意或过失泄露国家秘密罪、非法获取国家秘密罪）、行政（处分、处罚）、党纪与单位内部责任，可并处。口诀“严重违规即追责、过失也可入刑、刑行并行不替代”。技巧：含“不需承担、无需再承担”的绝对表述通常错误。","tags":["信息安全标准与法规"]},{"stem":"分布式拒绝服务( Distributed Denial of Service,DDoS)攻击指借助于客户服务器技术,将多个计算机联合起来作为攻击平台,对一个或多个目标发动DDoS 攻击,从而成倍地提高拒绝服务攻击的威力。般来说,DDoS 攻击的主要目的是破坏目标系统的","options":[{"k":"A","t":"保密性"},{"k":"B","t":"完整性"},{"k":"C","t":"可用性"},{"k":"D","t":"真实性"}],"answer":"C","src":"B卷·补充100题","srcNum":40,"id":"q384","analyze":"DDoS以海量请求或流量耗尽目标带宽、连接数或处理资源，使合法用户无法获得服务，直接破坏可用性，故C正确。保密性指信息被未授权获取，完整性指数据被篡改，真实性指身份与来源可信，均非DDoS的主要目的。","expand":"DDoS类型：流量型（UDP Flood、SYN Flood、反射放大）、连接型、应用层（CC攻击）。防护：流量清洗、CDN与Anycast、限速、SYN Cookie。与q352、q397同类：凡“服务中断、不可访问”一律对应可用性。","tags":["网络安全","恶意代码"]},{"stem":"部署互联网协议安全虚拟专用网( nternet Protocol Security Virtual Private NetworkIpsec VPN)时,以下说法正确的是","options":[{"k":"A","t":"配置MD5 安全算法可以提供可靠地数据加密"},{"k":"B","t":"配置AES 算法可以提供可靠的数据完整性验证"},{"k":"C","t":"部署Ipsec VPN 网络是,需要考虑IP 地址的规划,尽量在分支节点使用可以聚合的IP 地址段,来减少Ipsec 安全关联( Security Authentication,SA)资源的消耗"},{"k":"D","t":"报文验证头协议( Authentication Header,AH)可以提供数据机密性"}],"answer":"C","src":"B卷·补充100题","srcNum":41,"id":"q385","analyze":"IPSec中安全关联按安全策略与地址组合建立，分支节点使用可聚合的连续地址段，可用更少策略覆盖更多主机，减少SA数量与资源消耗，C正确。A的MD5是散列算法，用于完整性认证，不作加密；B的AES提供机密性而非完整性；D的AH只认证与完整性，不提供机密性。","expand":"IPSec两协议：AH提供认证与完整性、不加密；ESP可加密并提供认证。算法分工：加密AES/3DES，完整性HMAC-SHA/MD5，密钥交换IKE。口诀“AH只认不密，ESP可密可认”；MD5、SHA属散列，不是加密算法。","tags":["网络安全","密码学"]},{"stem":"对于关键信息基础设施的外延范围,以下哪项是正确的","options":[{"k":"A","t":"关键信息基础设施的认定由国家网信部门确定,网络运营者自身及上级主管部门不能认定"},{"k":"B","t":"关键信息基础设施与等级保护三级以上系统的范围一致,对于等级保护三级以上系统就应纳入关键信息基础设施保护范围"},{"k":"C","t":"关键信息基础设施的具体范围由国务院制定,鼓励网络运营者自愿参照关键信息基础设施保护标准要求开展保护"},{"k":"D","t":"关键信息基础设施只限于公共通信和信息服务、能源、交通、水利、金融、公共服务、电子政务这七个行业,除此以外行业的网络不能认定为关键信息基础设施"}],"answer":"C","src":"B卷·补充100题","srcNum":43,"id":"q386","analyze":"《网络安全法》第三十一条规定关键信息基础设施的具体范围和安全保护办法由国务院制定；未被认定的运营者可自愿参照相关标准加强保护，C正确。A认定并非仅由网信部门确定；B与等保三级范围并不等同；D行业列举后有“以及其他重要行业和领域”，并非封闭七类。","expand":"CII范围覆盖公共通信和信息服务、能源、交通、水利、金融、公共服务、电子政务等重要行业和领域，以及其他一旦遭破坏危害国家安全、国计民生、公共利益的网络设施。认定由保护工作部门依国务院规定执行。口诀“范围国务院定、行业开放列举、等保三级≠CII”。","tags":["信息安全标准与法规","等级保护"]},{"stem":"保护-监测-响应( Protection- Detection- Response, PDR)模型是()工作中常用的模型,其思想是承认()中漏洞的存在,正视系统面临的0),通过采取适度防护、加强()、落实对安全事件的响应、建立对威胁的防护来保障系统的安全。","options":[{"k":"A","t":"信息系统;信息安全保障;威胁;检测工作"},{"k":"B","t":"信息安全保障;信息系统;检测工作;威胁"},{"k":"C","t":"信息安全保障;信息系统;威胁;检测工作"},{"k":"D","t":"信息安全保障;威胁;信息系统;检测工作"}],"answer":"C","src":"B卷·补充100题","srcNum":44,"id":"q387","analyze":"PDR是信息安全保障工作常用模型，其思想是承认信息系统中漏洞的存在，正视系统面临的威胁，通过适度防护、加强检测、落实响应、建立威胁防护来保障安全。C四项与题干逻辑一一对应，A、B、D词序错位。","expand":"PDR三环节：防护（访问控制、加密、防火墙）、检测（IDS、审计、监控）、响应（隔离、恢复、取证）。时间公式Pt>Dt+Rt，即防护时间须大于检测加响应时间才安全。技巧：先定“用于何种工作”，再定“承认什么存在、正视什么”。","tags":["网络安全","安全工程与项目管理"]},{"stem":"某集团公司信息安全管理员根据领导安排制定了下一年度的培训工作计划,他提出了四大培训任务和目标,关于这四个培训任务和目标,作为主管领导,以下选项中优先级最低的是","options":[{"k":"A","t":"由于网络安全上升到国家安全的高度,网络安全必须得到足够的重视,因此安排了对集团公司下属单位的总经理(一把手)的网络安全法培训"},{"k":"B","t":"对下级单位的网络安全管理岗人员实施全面安全培训,建议通过CISP 培训以确保人员能力得到保障"},{"k":"C","t":"对其他信息化相关人员(网络管理员、软件开发人员)也进行安全基础培训,使相关人员对网络安全有所了解"},{"k":"D","t":"对全体员工安排信息安全意识及基础安全知识培训,实现全员信息安全意识教育"}],"answer":"D","src":"B卷·补充100题","srcNum":45,"id":"q388","analyze":"A对一把手开展《网络安全法》培训，决定资源投入与责任落实；B对安全管理岗全面培训，直接支撑体系运行；C对网络管理员、开发人员等关键岗位开展基础培训，影响面广。D全员意识教育虽重要，但相对岗位培训的紧迫性与针对性，优先级最低。","expand":"培训分层：决策层（法规责任与投入）、管理层（体系与制度）、执行层（岗位技能）、全员（意识与规范）。等级保护与ISO 27001均要求分层实施安全教育。技巧：优先级看“风险影响×岗位职责”，决策层缺位会导致体系无资源，通常最高。","tags":["信息安全管理体系","安全工程与项目管理"]},{"stem":"《国家信息化领导小组关于加强信息安全保障工作的意见》中办发【2003】27 号明确了我国信息安全保障工作的(),加强信息安全保障工作的(),需要重点加强的信息安全保障工作,27 号文的重大意义是,安标志着我国信息安全保障工作有了(),我国最近十余年的信息安全保障工作都是围绕此政策性文件而()的渗透了我国()的各项工作。","options":[{"k":"A","t":"方针;主要原则;总体纲领;展开和推进;信息安全保障建设"},{"k":"B","t":"总体要求;总体纲领;主要原则:展开;信息安全保障建设"},{"k":"C","t":"方针和总体要求:主要原则;总体纲领;展开和推进;信息安全保障建设"},{"k":"D","t":"总体要求;主要原则;总体纲领;展开;信息安全保障建设"}],"answer":"D","src":"B卷·补充100题","srcNum":47,"id":"q389","analyze":"中办发[2003]27号《国家信息化领导小组关于加强信息安全保障工作的意见》明确了信息安全保障工作的总体要求与加强该工作的主要原则，并部署了需重点加强的工作；标志我国信息安全保障工作有了总体纲领，此后十余年工作围绕其展开，贯穿信息安全保障建设各方面。D各要素与文意对应。","expand":"27号文确立“积极防御、综合防范”方针，提出“谁主管谁负责、谁运营谁负责”，推动等级保护、风险评估、应急响应、灾难备份等基础工作。记忆：27号文是我国信息安全保障的纲领性文件，与2017年《网络安全法》构成政策到法律的演进。","tags":["信息安全标准与法规","信息安全管理体系"]},{"stem":"老王是某政府信息中心主任,以下哪项是符合《保守国家秘密法》要求的","options":[{"k":"A","t":"老王安排下属小李将损害的涉密计算机的某国外品牌硬盘送到该品牌中国区维修中心维修"},{"k":"B","t":"老王要求下属小张把中心所有计算机贴上密级标志"},{"k":"C","t":"老王每天晚上12 点将涉密计算机连接上互联网更新杀毒软件病毒库"},{"k":"D","t":"老王提出对加密机和红黑电源插座应该与涉密信息系统同步投入使用"}],"answer":"D","src":"B卷·补充100题","srcNum":48,"id":"q390","analyze":"保密法要求涉密信息系统的保密设施、设备与系统同步规划、同步建设、同步运行。加密机与红黑电源隔离插座属保密设施，D符合。A涉密硬盘送境外品牌维修点存在泄密风险；B并非所有计算机都涉密，一律贴密级标志不妥；C涉密机连接互联网属严重违规。","expand":"涉密设备红线：不得连接互联网、不得送非指定单位维修（须本单位或具保密资质单位）、不得使用无线设备与外设。红黑电源隔离插座用于阻断电源线传导泄密。易混：涉密系统与互联网物理隔离是基本原则，“三同步”是建设要求。","tags":["物理与环境安全","信息安全标准与法规"]},{"stem":"为保障信息系统的安全,某经营公众服务系统的公司准备并编制一份针对性的信息安全保障方案,并将编制任务交给了小王,为此,小王决定首先编制出一份信息安全需求描述报告,关于此项工作,下面说法错误的是","options":[{"k":"A","t":"信息安全需求报告应依据该公众服务信息系统的功能设计方案为主要内容来撰写"},{"k":"B","t":"信息安全需求描述报告是设计和撰写信息安全保障方案的前提和依据"},{"k":"C","t":"信息安全需求描述报告应当基于信息安全风险评估结果和有关政策法规和标准的合规性要求得到"},{"k":"D","t":"信息安全需求描述报告的主题内容可以按照技术,管理和工程等方面需求展开编写"}],"answer":"A","src":"B卷·补充100题","srcNum":49,"id":"q391","analyze":"信息安全需求描述报告应基于风险评估结果与政策法规、标准的合规性要求形成，从技术、管理、工程等方面展开，并作为编制安全保障方案的前提与依据，故B、C、D正确。A把系统功能设计方案当主要依据，忽略了风险与合规两大来源，为错误说法。","expand":"需求三个来源：风险评估（风险驱动）、合规要求（法规标准）、业务与安全目标。产出链条：安全需求→安全保障方案→安全措施落地。技巧：功能设计回答“做什么”，安全需求回答“要防到什么程度”，不能以功能设计为主要依据。","tags":["风险评估","安全工程与项目管理"]},{"stem":"一个密码系统至少由明文、密文、加密算法、解密算法和密钥5 部分组成,根据科克霍夫原则，其安全性是由下列哪个选项决定的","options":[{"k":"A","t":"加密算法"},{"k":"B","t":"解密算法"},{"k":"C","t":"加密和解密算法"},{"k":"D","t":"密钥"}],"answer":"D","src":"B卷·补充100题","srcNum":50,"id":"q392","analyze":"科克霍夫原则假定加密算法公开、系统的安全仅取决于密钥的保密，因此安全性由密钥（长度、随机性、管理与分发）决定，D正确。A、B、C均指向算法本身，与“算法可公开、密钥须保密”的前提相违背，属干扰项。","expand":"香农将其表述为“敌手了解系统”。推论：算法须经受公开检验，密钥空间足够大且随机，密钥的生成、分发、存储、更新、销毁成为关键环节。易混：隐蔽式安全依赖算法保密，与科克霍夫原则正好相反。","tags":["密码学"]},{"stem":"由于信息系统的复杂性,因此需要一个通用的框架对其进行解构和描述,然后再基于此框架讨论信息系统的()。在LATF 中,将信息系统的信息安全保障技术层面分为以下四个焦点领域:():区域边界即本地计算环境的外缘;();支持性基础设施,在深度防御技术方案中推荐()原则、()原则。","options":[{"k":"A","t":"网络和基础设施;安全保护问题:本地的计算机环境;多点防御;分层防御"},{"k":"B","t":"安全保护问题:本地的计算机环境;多点防御;网络和基础设施;分层防御"},{"k":"C","t":"安全保护问题;本地的计算机环境;网络和基础设施;多点防御;分层防御"},{"k":"D","t":"本地的计算环境;安全保护问题;网络和基础设施;多点防御;分层防御"}],"answer":"C","src":"B卷·补充100题","srcNum":51,"id":"q393","analyze":"IATF把信息系统安全保障技术分为四个焦点领域：本地计算环境、区域边界（本地计算环境的外缘）、网络和基础设施、支撑性基础设施；深度防御推荐多点防御与分层防御原则。题干先谈“基于框架讨论信息系统的安全保护问题”，故C语序正确。","expand":"四领域口诀“端—边—网—支撑”。深度防御原则：多点防御（多位置部署）、分层防御（纵深多层），并强调人员、技术、运行三要素。易混：区域边界由“本地计算环境的外缘”定义，不是独立于四领域之外的第五项。","tags":["安全工程与项目管理","网络安全"]},{"stem":"以下关于数字签名说法正确的是","options":[{"k":"A","t":"数字签名是在所传输的数据后附加上一段和传输数据毫无关系的数字信息"},{"k":"B","t":"数字签名能够解决数据的加密传输,即安全传输问题"},{"k":"C","t":"数字签名一般采用对称加密机制"},{"k":"D","t":"数字签名能够解决篡改、伪造等安全性问题"}],"answer":"D","src":"B卷·补充100题","srcNum":52,"id":"q394","analyze":"数字签名先用散列生成摘要，再用私钥签名、公钥验签，可发现篡改并确认来源，且具不可否认性，故能解决篡改与伪造问题。A称附加信息与数据无关，实为与摘要强关联；B签名不提供加密传输；C签名基于非对称机制与散列，而非对称加密机制。","expand":"流程：散列→私钥签名→传输→公钥验签。提供完整性、真实性、不可否认性，不提供机密性（机密性靠加密）。口诀“签名管身份与篡改，加密管保密”。易混：签名用私钥、加密用对方公钥，方向相反。","tags":["密码学","身份鉴别"]},{"stem":"以下关于法律的说法错误的是","options":[{"k":"A","t":"法律是国家意志的统一体现,有严密的逻辑体系和效力"},{"k":"B","t":"法律可以是公开的,也可以是“内部”的"},{"k":"C","t":"一旦制定,就比较稳定,长期有效,不允许经常更改"},{"k":"D","t":"法律对违法犯罪的后果由明确规定,是一种“硬约束”"}],"answer":"B","src":"B卷·补充100题","srcNum":53,"id":"q395","analyze":"法律由国家制定并以强制力保证实施，具有统一性、严密逻辑体系、公开性、稳定性，并对违法后果作明确规定，属“硬约束”。B称法律可以是“内部”的，与法律公开性原则相悖，为错误说法。A、C、D均符合法律的基本特征。","expand":"法律特征：国家意志性、规范性、公开性、稳定性、强制性。对比：组织内部制度可内部执行，但不具国家强制力；保密事项由公开的法律规定保密，不存在“秘密法律”。技巧：凡“法律可秘密、可仅内部掌握”的表述必错。","tags":["信息安全标准与法规"]},{"stem":"若一个组织声称自己的ISMS 符合SO/EC27001 或GBT22080 标准要求,其信息安全控制措施通常要在物理和环境安全方面实施规划控制,物理和环境安全领域包括安全区域和设备安全两个控制目标。安全区域的控制目标是防止对组织场所和信息的未授权物理访问、损坏和干扰,关键或敏感的信息以及信息处理设施应放在安全区域内,并受到相应保护,该目标可以通过以下控制措施来实现,下列不包括哪一项","options":[{"k":"A","t":"物理安全边界、物理入口控制"},{"k":"B","t":"办公室、房间和设施的安全保护,外部和环境威胁的安全防护"},{"k":"C","t":"通信安全、合规性"},{"k":"D","t":"在安全区域工作,公共访问、交接区安全"}],"answer":"C","src":"B卷·补充100题","srcNum":57,"id":"q396","analyze":"ISO/IEC 27001物理和环境安全含安全区域与设备安全两个控制目标。安全区域措施包括物理安全边界、物理入口控制、办公室与设施保护、外部环境威胁防护、安全区域内工作、公共访问与交接区安全，A、B、D均属之。C“通信安全、合规性”属其他控制域，故为不包括项。","expand":"设备安全措施另有：设备安置与支撑、电源与布线、维护、移动设备与介质处置、无人值守设备、设备离场。技巧：按控制域归类，凡出现“通信安全、合规性、访问控制”等跨域名称的即为干扰项。物理安全关注“场所与设备”，不涉协议与流程。","tags":["物理与环境安全","信息安全管理体系"]},{"stem":"2016 年10 月2 ィ日,美国东部地区发生大规模断网事件,此次事件是由于美国主要DNS服务.DoS 攻击所致,影响规模惊人,对人们成产生活造成严重影响,DDos 攻击的主要目的是破坏系.","options":[{"k":"A","t":"保密性"},{"k":"B","t":"可用性"},{"k":"C","t":"不可否认性"},{"k":"D","t":"抗抵赖性"}],"answer":"B","src":"B卷·补充100题","srcNum":58,"id":"q397","analyze":"2016年10月美国东部大规模断网由DNS服务商遭DDoS攻击（Mirai僵尸网络）造成，大量网站域名无法解析，攻击通过耗尽服务资源使合法用户无法访问，破坏的是可用性，故B正确。A保密性、C不可否认性、D抗抵赖性均与“服务中断”不对应。","expand":"该事件是物联网僵尸网络典型战例，暴露IoT弱口令风险。防护：DNS冗余与Anycast、流量清洗、IoT设备口令与固件管理。记忆：DDoS、DNS中断、勒索停机均属可用性；注意“不可否认性”与“抗抵赖性”是同义不同译，均为干扰项。","tags":["网络安全","恶意代码"]},{"stem":"以下关于windows 操作系统身份标识与鉴别,说法不正确的是","options":[{"k":"A","t":"本地安全授权机构(SA)生成用户账户在该系统内唯一的安全标识符(SID"},{"k":"B","t":"用户对鉴别信息的操作,如更改密码等都通过一个以Administrator 权限运行的服务“ Security……”来实现"},{"k":"C","t":"Windows 操作系统远程登录经历了SMB 鉴别机制、LM 鉴别机制、NRLM 鉴别机制、Kerberos鉴别体系等阶段"},{"k":"D","t":"完整的安全标识符(SID)包括用户和组的安全描,48 比特的身份特权、修订版本和可变的验证值"}],"answer":"B","src":"B卷·补充100题","srcNum":60,"id":"q398","analyze":"Windows的鉴别信息操作由本地安全授权子系统LSASS承担，并非“以Administrator权限运行的Security服务”，用户改密按其自身权限与策略校验，不依赖管理员权限，故B不正确。A关于SID生成、C关于鉴别机制演进、D关于SID结构均描述基本正确。","expand":"Windows鉴别链：Winlogon→LSASS→SAM或AD，凭据存于SAM或NTDS.dit，认证包支持NTLM与Kerberos。SID结构：修订版本＋48位颁发机构（身份特权）＋可变验证值。演进：SMB→LM→NTLM→NTLMv2→Kerberos。口诀“身份靠SID，认证靠LSASS”。","tags":["操作系统安全","身份鉴别"]},{"stem":"某T 公司针对信息安全事件已经建立了完善的预案,在年度企业信息安全总结会上,信息安全管理员对今年应急预案工作做出了四个总结。其中有一项总结工作是错误,作为企业的CS,请你指出存在问题的是哪个总结?","options":[{"k":"A","t":"公司制定的应急演练流程包括应急事件通报,确定应急事件优先级、应急响应启动实施、应急响应时间后期运维，更新现有应急预案五个阶段。流程完善可用。"},{"k":"B","t":"公司应急预案包括了基础环境类、业务系统类。安全事件类和其他类,基本覆盖了各类应急事件类型。"},{"k":"C","t":"公司应急预案事件分类依据GB/Z20986-2007《信息安全技术信息安全事件分类分级指南》分为7 个基本类。预案符合国家相关标准。"},{"k":"D","t":"公司成立了信息安全应急相应组织。该组织由业务和技术人员组成,划分成应急响应领导小组、技术保障小组、专家小组。实施小组和日常运行小组。"}],"answer":"D","src":"B卷·补充100题","srcNum":61,"id":"q399","analyze":"应急预案组织应形成决策、管理、执行三层：领导小组须由主要负责人挂帅，成员涵盖业务、技术、管理、法务与公关等，并明确各组职责边界。D仅称由业务和技术人员组成，把实施小组与日常运行小组并列造成职责重叠，架构不完整。A、B、C所述的流程、类型覆盖与七类分类均正确。","expand":"应急组织典型构成：应急领导小组（决策）、应急办公室（协调）、技术处置组、业务恢复组、专家咨询组、沟通与法务组。GB/Z 20986-2007将事件分七类、四级。技巧：组织类选项看三点——是否有决策层、职责是否清晰、是否含外部协同。","tags":["应急响应","信息安全管理体系"]},{"stem":"下列关于软件安全开发中的BSI( Build security In)系列模型说法错误的是","options":[{"k":"A","t":"BSL 含义是指将安全内建到软件开发过程中,而不是可有可无,更不是游离于软件开发生命周期之外"},{"k":"B","t":"软件安全的三根支柱是风险管理、软件安全触点和安全知识"},{"k":"C","t":"软件安全触点是软件开发生命周期中一套轻量级最优工程化方法,它提供了从不同角度保障安全的行为方式"},{"k":"D","t":"BSI 系列模型强调安全测试的重要性,要求安全测试贯穿整个开发过程及软件生命周期"}],"answer":"D","src":"B卷·补充100题","srcNum":63,"id":"q400","analyze":"BSI（Build Security In）主张把安全内建到开发过程中，以风险管理、安全触点、安全知识为三大支柱，在各阶段嵌入安全活动。D把BSI理解为“强调安全测试并贯穿全周期”，将安全等同于测试、忽略设计与编码环节，与“内建”理念不符，故错误。","expand":"BSI由美国DHS推动，三支柱：风险管理、安全触点、安全知识；安全触点是一组轻量级工程化实践，按阶段给出“做什么、怎么做”。口诀“内建不等于测出来”。易混：安全测试只是其中一环，BSI更强调尽早介入与源头治理。","tags":["软件安全","安全工程与项目管理"]},{"stem":"由于频繁出现软件运行时被黑客远程攻击获取数据的现象,某软件公司准备加强软件安全开发管理在下面做法中,对于解决问题没有直接帮助的是","options":[{"k":"A","t":"要求所有的开发人员参加软件安全开发知识培训"},{"k":"B","t":"要求规范软件编码,并制定公司的安全编码准则"},{"k":"C","t":"要求开发人员采用瀑布模型进行开发"},{"k":"D","t":"要求邀请专业队伍进行第三方安全性测试,尽量从多角度发现软件安全问题"}],"answer":"C","src":"B卷·补充100题","srcNum":64,"id":"q401","analyze":"频繁被远程攻击获取数据，根源在代码与设计缺陷。A安全开发知识培训、B安全编码准则、D第三方安全测试均可直接提升软件安全性；C仅把开发模型改为瀑布，只改变过程组织方式，不引入任何安全活动，故对解决问题无直接帮助。","expand":"与同类考点一致：开发模型（瀑布、敏捷、迭代）不等于安全实践。安全开发要素：安全需求、威胁建模、安全编码、代码审计、安全测试、漏洞管理。技巧：选项中若只是“更换开发模型”而不含安全活动，即为无直接帮助项。","tags":["软件安全","安全工程与项目管理"]},{"stem":"我国等级保护政策发展的正确顺序是①等级保护相关政策文件颁布②计算机系统安全保护等级划分思想提出③等级保护相关标准发布④网络安全法将等级保护制度作为基本策⑤等级保护工作试点","options":[{"k":"A","t":"①②③④⑤"},{"k":"B","t":"②③①⑤④"},{"k":"C","t":"②⑤①③④"},{"k":"D","t":"①②④③⑤"}],"answer":"C","src":"B卷·补充100题","srcNum":66,"id":"q402","analyze":"发展脉络为：1994年《计算机信息系统安全保护条例》提出等级划分思想（②）→开展等级保护试点（⑤）→发布等级保护政策文件（①）→GB/T 22239等系列标准发布（③）→2017年《网络安全法》将等级保护制度确立为基本制度（④）。故顺序为②⑤①③④，C正确。","expand":"关键节点：1994年国务院147号令（思想起源）；2003年27号文与2004年公通字66号文（政策推进）；2007年四部门《信息安全等级保护管理办法》；2008年标准体系；2017年网络安全法第二十一条（法律升格）。技巧：先思想与试点，再政策与标准，最后法律。","tags":["等级保护","信息安全标准与法规"]},{"stem":"以下哪一个是国际标准化组织?","options":[{"k":"A","t":"ITEF"},{"k":"B","t":"ITU-T"},{"k":"C","t":"ISO"},{"k":"D","t":"NIST"}],"answer":"C","src":"B卷·补充100题","srcNum":67,"id":"q403","analyze":"ISO即International Organization for Standardization，中文为国际标准化组织，制定并发布ISO/IEC 27000系列标准，C正确。A的IETF是互联网工程任务组，负责RFC；B的ITU-T是国际电信联盟电信标准化部门；D的NIST是美国国家标准与技术研究院。","expand":"标准组织速记：ISO（国际标准化组织，27001/27002）、IEC（国际电工委员会，与ISO设联合技术委员会JTC1）、ITU-T（电信标准）、IETF（互联网RFC）、NIST（美国SP 800系列）、TC260（全国信息安全标准化技术委员会，负责GB/T）。易混：27001由ISO与IEC联合发布。","tags":["信息安全标准与法规"]}];
const KEY = 'cisp-quiz-v2';
const byId = Object.fromEntries(DATA.map(q => [q.id, q]));

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    return {
      seen: s.seen || {},
      wrong: s.wrong || {},
      answerCount: s.answerCount || 0,
      correctCount: s.correctCount || 0,
      session: s.session || null
    };
  } catch (e) {
    return { seen: {}, wrong: {}, answerCount: 0, correctCount: 0, session: null };
  }
}
let S = load();
let lastMode = 'random';
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('zh-CN');
const wrongIds = () => Object.keys(S.wrong);
const seenCount = () => Object.keys(S.seen).length;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function show(view) {
  ['homeView', 'quizView', 'doneView'].forEach(v => $(v).classList.toggle('hidden', v !== view));
}

function renderHome() {
  $('sTotal').textContent = fmt(DATA.length);
  $('sSeen').textContent = fmt(seenCount());
  $('sWrong').textContent = fmt(wrongIds().length);
  $('sRate').textContent = S.answerCount ? Math.round(S.correctCount / S.answerCount * 100) + '%' : '—';
  const left = DATA.length - seenCount();
  $('startRandomLabel').textContent = left > 0 ? '开始随机练习' : '开始新一轮练习';
  $('startRandomMeta').textContent = left > 0 ? `剩余 ${fmt(left)} 题未练` : '题库已全部练过';
  const w = wrongIds().length;
  $('wrongMeta').textContent = w ? `${fmt(w)} 题待巩固` : '暂无错题';
  $('startWrong').disabled = w === 0;
  $('homeTip').textContent = S.session && S.session.i < S.session.ids.length
    ? '有一轮练习尚未完成，点击上方按钮可继续。'
    : '';
}

function newSession(mode) {
  let ids;
  if (mode === 'wrong') {
    ids = shuffle(wrongIds());
  } else {
    ids = shuffle(DATA.map(q => q.id).filter(id => !S.seen[id]));
    if (!ids.length) ids = shuffle(DATA.map(q => q.id));
  }
  S.session = { mode, ids, i: 0, right: 0, bad: 0, answered: false, selected: null };
  save();
  renderQuiz();
}

function renderQuiz() {
  const sess = S.session;
  if (!sess || sess.i >= sess.ids.length) { renderDone(); return; }
  const q = byId[sess.ids[sess.i]];
  if (!q) { sess.i++; save(); return renderQuiz(); }
  show('quizView');
  $('modeBadge').textContent = sess.mode === 'wrong' ? '错题重练' : '随机练习';
  $('modeBadge').className = 'badge' + (sess.mode === 'wrong' ? ' mode-wrong' : '');
  $('qCounter').textContent = `${sess.i + 1} / ${sess.ids.length}`;
  $('qScore').textContent = sess.i ? `本轮 ✓${sess.right}  ✗${sess.bad}` : '';
  $('progressBar').style.width = (sess.i / sess.ids.length * 100) + '%';
  $('qSource').textContent = `${q.src} · 原第 ${q.srcNum} 题`;
  $('qStem').textContent = q.stem;

  // 选项按题库原始 A/B/C/D 顺序显示，不再随机重排：
  // 答案字母与精讲解析中的字母引用均以原顺序为准，避免「正确答案 B」
  // 与屏幕上 B 选项内容不一致。题目顺序仍保持随机抽取。
  const box = $('options');
  box.innerHTML = '';
  q.options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.dataset.k = o.k;
    b.innerHTML = `<span class="opt-key">${o.k}</span><span>${escapeHtml(o.t)}</span>`;
    b.onclick = () => pick(o.k);
    box.appendChild(b);
  });

  $('nextBtn').disabled = !sess.answered;
  $('nextBtn').textContent = sess.i === sess.ids.length - 1 ? '查看结果' : '下一题';
  $('hint').textContent = '键盘 A–D 或 1–4 选答案，回车下一题';
  $('feedback').className = 'feedback';
  $('feedback').textContent = '';
  $('explain').classList.add('hidden');
  $('explain').innerHTML = '';
  if (sess.answered) paintAnswer(sess.selected, q);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function paintAnswer(selected, q) {
  const sess = S.session;
  const buttons = [...$('options').children];
  buttons.forEach(b => {
    b.classList.add('locked');
    b.onclick = null;
    const k = b.dataset.k;
    if (k === q.answer) b.classList.add('right');
    if (k === selected && selected !== q.answer) b.classList.add('wrong');
  });
  const fb = $('feedback');
  const ansText = q.options.find(o => o.k === q.answer).t;
  if (selected === q.answer) {
    fb.className = 'feedback ok';
    fb.textContent = '回答正确';
    $('explain').classList.add('hidden');
    $('explain').innerHTML = '';
  } else {
    if (selected) {
      fb.className = 'feedback no';
      fb.innerHTML = `回答错误　正确答案 <span class="ans">${q.answer}. ${escapeHtml(ansText)}</span>`;
    } else {
      fb.className = 'feedback no';
      fb.innerHTML = `本题未作答　正确答案 <span class="ans">${q.answer}. ${escapeHtml(ansText)}</span>`;
    }
    showExplain(q);
  }
  $('nextBtn').disabled = false;
}

function showExplain(q) {
  const el = $('explain');
  const ansText = q.options.find(o => o.k === q.answer).t;
  const tags = (q.tags || []).join(' · ');
  el.innerHTML =
    `<div class="ex-head"><span class="ex-badge">精讲</span>` +
    `<span class="ex-ans">正确答案 ${q.answer}. ${escapeHtml(ansText)}</span></div>` +
    `<div class="ex-row"><b>解析</b><span>${escapeHtml(q.analyze || '暂无解析')}</span></div>` +
    `<div class="ex-row extend"><b>延伸</b><span>${escapeHtml(q.expand || '暂无延伸')}</span></div>` +
    (tags ? `<div class="ex-tags">知识点：${escapeHtml(tags)}</div>` : '');
  el.classList.remove('hidden');
}

function pick(k) {
  const sess = S.session;
  if (!sess || sess.answered) return;
  const q = byId[sess.ids[sess.i]];
  sess.answered = true;
  sess.selected = k;
  S.answerCount++;
  if (k === q.answer) {
    sess.right++;
    S.correctCount++;
    if (sess.mode === 'wrong') delete S.wrong[q.id];
  } else {
    sess.bad++;
    S.wrong[q.id] = (S.wrong[q.id] || 0) + 1;
  }
  S.seen[q.id] = true;
  save();
  paintAnswer(k, q);
  $('qScore').textContent = `本轮 ✓${sess.right}  ✗${sess.bad}`;
}

function nextQuestion() {
  const sess = S.session;
  if (!sess) return renderHome();
  if (!sess.answered) return;
  sess.i++;
  sess.answered = false;
  sess.selected = null;
  save();
  if (sess.i >= sess.ids.length) renderDone(); else renderQuiz();
}

function renderDone() {
  const sess = S.session || { right: 0, bad: 0, ids: [], i: 0, mode: 'random' };
  lastMode = sess.mode;
  const total = sess.right + sess.bad;
  show('doneView');
  $('doneTitle').textContent = sess.mode === 'wrong' ? '错题重练完成' : '本轮练习完成';
  const left = DATA.length - seenCount();
  $('doneText').textContent = sess.mode === 'wrong'
    ? `还剩 ${fmt(wrongIds().length)} 道错题，答对的题已从错题本移除。`
    : (left > 0 ? `题库还剩 ${fmt(left)} 道未练，继续随机抽题吧。` : '整本题库都练过一轮了，可以开始新一轮。');
  $('doneRight').textContent = fmt(sess.right);
  $('doneWrong').textContent = fmt(sess.bad);
  $('doneRate').textContent = total ? Math.round(sess.right / total * 100) + '%' : '—';
  const again = $('againBtn');
  again.innerHTML = sess.mode === 'wrong'
    ? `<span>再练一轮错题</span><small>${fmt(wrongIds().length)} 题</small>`
    : `<span>继续随机练习</span><small>剩余 ${fmt(left)} 题</small>`;
  again.disabled = sess.mode === 'wrong' && wrongIds().length === 0;
  S.session = null;
  save();
}

// 事件绑定
$('startRandom').onclick = () => newSession('random');
$('startWrong').onclick = () => newSession('wrong');
$('nextBtn').onclick = nextQuestion;
$('againBtn').onclick = () => newSession(lastMode);
$('doneHome').onclick = () => { renderHome(); show('homeView'); };
$('homeBtn').onclick = () => { renderHome(); show('homeView'); };
$('resetWrong').onclick = () => {
  if (!wrongIds().length) return;
  if (confirm('确定清空错题本吗？已练记录与统计不会清除。')) {
    S.wrong = {};
    save();
    renderHome();
  }
};
$('resetAll').onclick = () => {
  if (confirm('确定重置全部进度吗？已练记录、错题本、正确率都会清空。')) {
    localStorage.removeItem(KEY);
    S = { seen: {}, wrong: {}, answerCount: 0, correctCount: 0, session: null };
    renderHome();
    show('homeView');
  }
};

document.addEventListener('keydown', e => {
  if ($('quizView').classList.contains('hidden')) return;
  const sess = S.session;
  if (!sess) return;
  const key = e.key.toUpperCase();
  if (!sess.answered) {
    const q = byId[sess.ids[sess.i]];
    const idx = 'ABCD'.indexOf(key);
    const alt = '1234'.indexOf(e.key);
    const byLetter = idx >= 0 ? q.options.find(o => o.k === 'ABCD'[idx]) : null;
    const byNumber = alt >= 0 ? q.options[alt] : null;
    if (byLetter) pick(byLetter.k);
    else if (byNumber) pick(byNumber.k);
    else return;
    e.preventDefault();
  } else if (e.key === 'Enter' || e.key === ' ' || key === 'N') {
    nextQuestion();
    e.preventDefault();
  }
});

// 启动
if (S.session && S.session.i < S.session.ids.length && byId[S.session.ids[S.session.i]]) {
  renderQuiz();
} else {
  S.session = null;
  save();
  renderHome();
  show('homeView');
}
</script>
