"t":"1,2,3,4"},{"k":"D","t":"1,2,3"}],"answer":"A","src":"精选300题","srcNum":151,"id":"q234","analyze":"具有行政法律责任强制力的安全管理制度须由法规或规章设定。安全事件报告制度（1）、安全等级保护制度（2）、安全专用产品销售许可证制度（4）均有行政法规依据，故A正确。信息系统安全监控（3）属技术措施或管理要求，未被设定为强制性行政制度，故含3的C、D与漏项的B均错。","expand":"主要依据：《计算机信息系统安全保护条例》（国务院147号令）确立等级保护、安全专用产品销售许可、案件报告等制度；《网络安全法》进一步确立等级保护、监测预警与事件报告制度。记忆：报告、等级、许可是三项法定制度，监控属手段而非制度。","tags":["等级保护","信息安全标准与法规"]},{"stem":"信息系统建设完成后,的信息系统的运营使用单位应当选择符合国家规定的测评机构进行测评合格后方可投入使用","options":[{"k":"A","t":"二级以上"},{"k":"B","t":"三级以上"},{"k":"C","t":"四级以上"},{"k":"D","t":"五级以上"}],"answer":"A","src":"精选300题","srcNum":152,"id":"q235","analyze":"《信息安全等级保护管理办法》规定，信息系统建设完成后，运营使用单位应选择符合国家规定的测评机构开展等级测评，二级以上系统测评合格后方可投入运行，故A正确。三级、四级系统同样须测评，但法条以“二级以上”为起点表述；不存在“五级以上”的提法，故B、C、D均错。","expand":"测评频度：三级系统每年至少一次，四级系统每半年至少一次，二级系统定期测评；新建二级以上系统上线前必须测评合格。易混：定级备案同样是“二级以上”到公安机关备案，测评合格是“二级以上”方可投入使用，两者是先后环节。","tags":["等级保护"]},{"stem":"为了进一步提供信息安全的保障能力和防护水平,保障和促进信息化建设的健康发展,公安部等四部门联合发布《关于信息安全等级保护工作的实施意见》(公通字[2004166 号),对等级保护工作的开展提供宏观指导和约束,明确了等级保护工作的基本内容、工作要求和实施计划,以及各部门工作职责分工等。关于该文件,下面理解正确的是","options":[{"k":"A","t":"该文件是一个由部委发布的政策性文件,不属于法律文件"},{"k":"B","t":"该文件适用于2004 年的等级保护工作,其内容不能约束到2005 年及之后的工作"},{"k":"C","t":"该文件是一个总体性指导文件,规定所有信息系统都要纳入等级保护定级范围"},{"k":"D","t":"该文件适用范围为发文的这四个部门,不适用于其他部门和企业等单位"}],"answer":"A","src":"精选300题","srcNum":153,"id":"q236","analyze":"公通字〔2004〕66号是公安部、国家保密局等四部门联合发布的政策性指导文件，不属法律、行政法规或部门规章，故A正确。B错在其指导效力可延续至后续年度；C错在并非所有信息系统都必须定级，仅涉及国家安全、社会秩序、公共利益的重要系统强制定级；D错在文件对全国相关工作具有宏观指导约束力。","expand":"等级保护制度沿革：1994年147号令提出概念→1999年等级划分准则→2004年66号文明确内容、要求与分工→2007年43号文《信息安全等级保护管理办法》→2017年《网络安全法》第21条上升为法律义务。判断文件性质看发文机关与文号，“公通字”即部门文件。","tags":["等级保护","信息安全标准与法规"]},{"stem":"CC 标准是目前系统安全认证方面最权威的标准,以下哪一项没有体现CC 标准的先进性?","options":[{"k":"A","t":"结构的开放性,即功能和保证要求都可以在具体的“保户轮廊”和“安全目标”中进一步细化和扩展"},{"k":"B","t":"表达方式的通用性,即给出通用的表达表示"},{"k":"C","t":"独立性,它强调讲安全的功能和保证分离"},{"k":"D","t":"实用性,将CC 的安全性要求具体应用到IT 产品的开发、生产、测试和评估过程中"}],"answer":"C","src":"精选300题","srcNum":154,"id":"q237","analyze":"CC标准的先进性公认体现为：结构开放，功能与保证要求可在PP、ST中细化扩展（A）；表达方式通用统一（B）；实用性强，可直接用于IT产品开发、生产、测试与评估（D）。C把“安全功能要求与安全保证要求的类别划分”说成独立性优势，表述不成立，故C为答案。","expand":"CC即ISO/IEC 15408（GB/T 18336），由安全功能要求SFR、安全保证要求SAR和评估方法三部分构成，功能与保证是“要求类别”划分，而非独立性优势。易混：CC的三类评估对象为PP、ST、TOE；评估保证级EAL1至EAL7共七级。","tags":["信息安全标准与法规","安全工程与项目管理"]},{"stem":"对于数字证书而言,一般采用的是哪个标准?","options":[{"k":"A","t":"ISO/IEC15408"},{"k":"B","t":"802.1"},{"k":"C","t":"GB/T20984"},{"k":"D","t":"X.509"}],"answer":"D","src":"精选300题","srcNum":155,"id":"q238","analyze":"数字证书的格式与内容由ITU-T X.509标准定义，含版本、序列号、签名算法、颁发者、有效期、主体、公钥及CA签名等字段，故D正确。ISO/IEC 15408是CC评估准则，802.1是IEEE局域网体系结构标准，GB/T 20984是信息安全风险评估规范，三者均不规定证书格式。","expand":"X.509有v1、v2、v3三个版本，v3新增密钥用途、CRL分发点等扩展。证书生命周期依赖PKI：CA签发、RA注册审核、CRL或OCSP吊销查询。易混：X.509定证书结构，PKIX（RFC 5280）定互联网使用规范，SSL/TLS用证书实现身份鉴别与密钥交换。","tags":["密码学","身份鉴别"]},{"stem":"在可信计算机系统评估准则( TCSEC)中,下列哪一项是满足强制保护要求的最低级别?","options":[{"k":"A","t":"C2"},{"k":"B","t":"Cl"},{"k":"C","t":"B2"},{"k":"D","t":"B1"}],"answer":"D","src":"精选300题","srcNum":156,"id":"q239","analyze":"TCSEC将系统分为D、C1、C2、B1、B2、B3、A1七级，B级起为强制保护类。B1即标记安全保护，首次要求对主体和客体设置安全标记并实施强制访问控制，是强制保护的最低级别，故D正确。C1、C2属自主保护类；B2在B1基础上增加隐蔽信道防护，级别更高。","expand":"TCSEC四级七等：D最低保护；C自主保护（C1自主安全保护、C2受控访问保护）；B强制保护（B1标记安全保护、B2结构化保护、B3安全域）；A验证保护（A1验证设计）。记忆：C自主、B强制、A验证，B1是强制保护的门槛级别。","tags":["信息安全标准与法规","操作系统安全"]},{"stem":"关于标准,下面哪项理解是错误的","options":[{"k":"A","t":"标准是在一定范围内为了获得最佳秩序,经协商一直制定并由公认机构批准,共同重复使用的种规范性文件。标准是标准化活动的重要成果"},{"k":"B","t":"国际标准是由国家标准组织通过并公开发布的标准。同样是强制性标准,当国家标准和国际标准的条款发生冲突时,应以国际标准条款为准"},{"k":"C","t":"行业标准是针对没有国家标准而又需要在全国某个行业范围内统一的技术要求而制定的标准。同样是强制性标准,当行业标准和国家标准的条款发生冲突时,应以国家标准条款为准"},{"k":"D","t":"行业标准由省、自治区、直辖市标准化行政主管部门制定,并报国务院标准化行政主管部门和国务院有关行政主管部门备案,在公布国家标准之后,该地方标准即应废止"}],"answer":"B","src":"精选300题","srcNum":157,"id":"q240","analyze":"B项错误：国际标准确由国际标准化组织发布，但我国强制性国家标准必须执行，国际标准须经转化采用才具约束力，条款冲突时应以我国国家标准为准，而非以国际标准为准。A为标准定义，C关于行业标准与国家标准冲突的处理正确，D所述实为地方标准的制定与废止规则。","expand":"标准层级：国家标准（GB、GB/T）、行业标准（GA、YD等）、地方标准（DB）、团体标准、企业标准，下级标准不得与上级强制性标准抵触。采标一致性程度分等同IDT、修改MOD、非等效NEQ。易混：国际标准代号ISO、IEC、ITU，区域性标准如EN，均不等于我国标准。","tags":["信息安全标准与法规"]},{"stem":"20054F, RFC4301 (Request for Comments4301 Security Architecture for theInternet Protocol)发布,用以取代原先的RFC2401,该标准建议规定了Psec 系统基础架构,描述如何在IP 层(IPv4IPv6)位流量提供安全业务。请问此类RFC 系列标准建议是由下面哪个组织发布的","options":[{"k":"A","t":"国际标准化组织( International Organization for Standardization,IS0)"},{"k":"B","t":"国际电工委员会( Int erna tio nal Elec trot echnical Commission,IEC)"},{"k":"C","t":"国际电信联盟远程通信标准化组织( ITU Telecommunication Standardization Sector, ITU-T"},{"k":"D","t":"Internet 工程任务组( Internet Engineering Task Force,IETF)"}],"answer":"D","src":"精选300题","srcNum":158,"id":"q241","analyze":"RFC系列文档由IETF（互联网工程任务组）发布，是互联网技术规范的权威载体，RFC 4301定义了IPSec体系结构并取代RFC 2401，故D正确。ISO负责通用国际标准，IEC负责电工电子领域，ITU-T负责电信标准，三者均不发布RFC文档。","expand":"IETF成果先以Internet-Draft草案流转，经评审后以RFC发布，分标准轨道、实验、信息、历史等类别。IPSec核心RFC：4301体系结构、4302 AH、4303 ESP、4306 IKEv2。易混：W3C管Web标准，IEEE管局域网802系列，IETF管IP层及以上协议。","tags":["网络安全","信息安全标准与法规"]},{"stem":"GBT1836《信息技术安全性评估准则》是测评标准类中的重要标准,该标准定义了保护轮廊Protection Proffile,PP)和安全目标( Security Target,ST)的评估准则,提出了评估保证级( Evaluation Assurance Level,EAL),其评估保证级共分为个递增的评估保证等级。","options":[{"k":"A","t":"4"},{"k":"B","t":"5"},{"k":"C","t":"6"},{"k":"D","t":"7"}],"answer":"D","src":"精选300题","srcNum":159,"id":"q242","analyze":"GB/T 18336等同采用CC，将评估保证级EAL划分为EAL1至EAL7共7个递增等级，故D正确。EAL1功能测试、EAL2结构测试、EAL3系统测试与检查、EAL4系统设计测试与复查、EAL5半形式化设计与测试、EAL6半形式化验证、EAL7形式化验证，等级越高保证越强、成本越高。","expand":"EAL是“保证级别”，衡量评估的深度与严格程度，并不代表安全功能强弱，高EAL不等于高安全性。国内常见EAL4增强版，是商用产品较现实的最高保证等级，多用于智能卡、操作系统。易混：EAL级数≠安全级别，功能强度另由SFR决定。","tags":["信息安全标准与法规","安全工程与项目管理"]},{"stem":"关于我国信息安全保障的基本原则,下列说法中不正确的是","options":[{"k":"A","t":"要与国际接轨,积极吸收国外先进经验并加强合作,遵循国际标准和通行做法,坚持管理与技术并重"},{"k":"B","t":"信息化发展和信息安全不是矛盾的关系,不能牺牲一方以保证另一方"},{"k":"C","t":"在信息安全保障建设的各项工作中,既要统筹规划,又要突出重点"},{"k":"D","t":"在国家信息安全保障工作中,要充分发挥国家、企业和个人的积极性,不能忽视任何一方的作用。"}],"answer":"A","src":"精选300题","srcNum":160,"id":"q243","analyze":"我国信息安全保障基本原则包括：坚持积极防御、综合防范；管理与技术并重；正确处理信息化发展与信息安全的关系（B）；统筹规划、突出重点（C）；发挥国家、企业、个人各方积极性（D）。A中“遵循国际标准和通行做法”“与国际接轨”并非我国原则表述，我国强调立足国情、自主可控，故A不正确。","expand":"我国信息安全方针可概括为“积极防御、综合防范”，强调技术与管理并重、安全与发展同步。判断技巧：凡出现“完全照搬国际标准”“放弃自主可控”的表述，多为主旨性错误项。等级保护与政府采购均体现优先采用自主可控产品的要求。","tags":["信息安全标准与法规","信息安全管理体系"]},{"stem":"有关系统工程的特点,以下错误的是","options":[{"k":"A","t":"系统工程研究问题一般采用先决定整体框架,后进入详细设计的程序"},{"k":"B","t":"系统工程的基本特点,是需要把研究对象解构为多个组成部分分别独立研究"},{"k":"C","t":"系统工程研究强调多学科协作,根据研究问题涉及到的学科和专业范围,组成一个知识结构合理的专家体系"},{"k":"D","t":"系统工程研究是以系统思想为指导,采取的理论和方法是综合集成各学科、各领域的理论和方法"}],"answer":"B","src":"精选300题","srcNum":161,"id":"q244","analyze":"系统工程以整体、系统的思想研究问题，强调要素关联与整体涌现性，而非把对象拆成若干部分各自独立研究，后者属还原论方法，故B错误。A的整体框架先行、C的多学科专家协作、D的综合集成方法，均符合系统工程的基本特点。","expand":"系统工程方法论有霍尔三维结构（时间维、逻辑维、知识维）、切克兰德软系统方法、综合集成研讨厅。基本原则：整体性、层次性、相关性、目的性、环境适应性。易混：还原论“分而治之”适合简单系统，系统工程适合复杂巨系统，二者互补而非对立。","tags":["安全工程与项目管理"]},{"stem":"以下说法正确的是","options":[{"k":"A","t":"验收测试是同承建方和用户按照用户使用手册执行软件验收"},{"k":"B","t":"软件测试的目的是为了验证软件功能是否正确"},{"k":"C","t":"监理工程师应按照有关标准审査提交的测试计划,并提出审查意见"},{"k":"D","t":"软件测试计划开始于软件设计阶段,完成于软件开发阶段"}],"answer":"C","src":"精选300题","srcNum":163,"id":"q245","analyze":"监理工程师应依据相关标准审查承建方提交的测试计划并出具审查意见，属其质量控制职责，故C正确。A验收应由建设单位组织、监理协助，依据验收标准而非仅凭用户使用手册；B软件测试目的在于发现缺陷、验证与确认需求，不止验证功能正确；D测试计划应在需求分析阶段编制并贯穿开发全程。","expand":"软件测试层次：单元测试、集成测试、系统测试、验收测试（含确认测试与回归测试）。监理“三控两管一协调”：质量控制、进度控制、投资控制，合同管理与信息管理，组织协调。依据标准为GB/T 19668系列与GB/T 8567文档规范。","tags":["安全工程与项目管理","软件安全"]},{"stem":"在某网络机房建设项目中,在施工前,以下哪一项不属于监理需要审核的内容:","options":[{"k":"A","t":"审核实施投资计划"},{"k":"B","t":"审核实施进度计划"},{"k":"C","t":"审核工程实施人员"},{"k":"D","t":"企业资质"}],"answer":"A","src":"精选300题","srcNum":164,"id":"q246","analyze":"施工前监理审核重点是施工组织设计、实施进度计划（B）、施工人员资格与到位情况（C）、承建单位资质（D）以及施工方案与安全措施等。投资与资金使用计划属建设单位及投资方的财务管理范畴，不是监理开工前审核内容，故A不属于。","expand":"信息系统工程监理覆盖招标、设计、实施、验收各阶段，审核内容可归为“人、机、料、法、环”：人员资质、设备材料、方案工艺、环境条件。监理虽承担投资控制职责，但体现为审核变更与计量支付，而非审核业主的投资计划。","tags":["安全工程与项目管理"]},{"stem":"以下系统工程说法错误的是","options":[{"k":"A","t":"系统工程是基本理论的技术实现"},{"k":"B","t":"系统工程是一种对所有系统都具有普片意义的科学方法"},{"k":"C","t":"系统工程是组织管理系统规划、研究、制造、试验、使用的科学方法"},{"k":"D","t":"系统工程是一种方法论"}],"answer":"A","src":"精选300题","srcNum":165,"id":"q247","analyze":"系统工程是以系统思想为指导的方法论（D），是对各类系统具有普遍意义的科学方法（B），用于组织管理系统的规划、研究、制造、试验和使用（C）。A称“系统工程是基本理论的技术实现”，混淆了方法论与具体技术实现的关系，表述错误，故A为答案。","expand":"系统工程三要素：系统思想（整体观）、系统方法（模型化与最优化）、系统工程过程（需求—分析—综合—评价—决策）。易混：系统工程不是系统科学（理论体系），也不是软件工程（针对软件产品），它提供组织与管理复杂系统的方法框架。","tags":["安全工程与项目管理"]},{"stem":"关于密钥管理,下列说法错误的是","options":[{"k":"A","t":"科克霍夫原则指出算法的安全性不应基于算法的保密,而应基于密钥的安全性"},{"k":"B","t":"保密通信过程中,通信方使用之前用过的会话钥建立会话,不影响通信安全"},{"k":"C","t":"密钥管理需要考虑密钥产生、存储、备份、分配、更新撤销等生命周期过程的每一个环节"},{"k":"D","t":"在网络通信过程中通信双方可利用diffie- hell man 协议商出会话密钥"}],"answer":"B","src":"精选300题","srcNum":166,"id":"q248","analyze":"会话密钥应一次一密，重复使用此前用过的会话密钥会放大密钥暴露风险：旧密钥一旦泄露或被破译，后续通信即可被解密甚至伪造，故B错误。A的柯克霍夫原则、C的密钥全生命周期管理、D的Diffie-Hellman协商，均为正确表述。","expand":"密钥生命周期：生成、存储、分发、使用、更新、备份恢复、归档、销毁、撤销。原则：密钥分级、最小使用、一次一密、双人控制。易混：柯克霍夫原则指算法公开、安全性依赖密钥；Diffie-Hellman只解决密钥分发，不认证身份，易受中间人攻击。","tags":["密码学"]},{"stem":"PDCERF 方法是信息安全应急响应工作中常用的一种方法,它将应急响应分成六个阶段。其中,主要执行如下工作应在哪一个阶段关闭信息系统、和或修改防火墙和路由器的过滤规则,拒绝来自发起攻击的嫌疑主机流量、或封锁被攻破的登录账号等","options":[{"k":"A","t":"准备阶段"},{"k":"B","t":"遏制阶段"},{"k":"C","t":"根除阶段"},{"k":"D","t":"检测阶段"}],"answer":"B","src":"精选300题","srcNum":167,"id":"q249","analyze":"PDCERF六阶段为准备、检测、遏制、根除、恢复、跟踪总结。关闭系统、修改防火墙与路由器过滤规则、阻断攻击源主机流量、封锁被攻破账号，都属于限制事件扩散与影响的遏制措施，故B正确。准备是事前建设，检测是发现确认，根除是清除恶意代码与漏洞。","expand":"PDCERF记忆：P准备、D检测、C遏制、E根除、R恢复、F跟踪。遏制要点是先控制影响面再取证，避免“一拔了之”破坏证据；顺序上遏制先于根除，即先止血再治病。易混：根除针对原因，恢复针对业务，跟踪总结形成改进闭环。","tags":["应急响应"]},{"stem":"在网络信息系统中对用户进行认证识别时,口令是一种传统但仍然使用广泛的方法,口令认证过程中常常使用静态口令和动态口令。下面找描述中错误的是","options":[{"k":"A","t":"所谓静态口令方案,是指用户登录验证身份的过程中,每次输入的口令都是固定、静止不变的"},{"k":"B","t":"使用静态口令方案时,即使对口令进行简单加密或哈希后进行传输,攻击者依然可能通过重放攻击来欺骗信息系统的身份认证模块"},{"k":"C","t":"动态口令方案中通常需要使用密码算法产生较长的口令序列,攻击者如果连续地收集到足够多的历史口令,则有可能预测出下次要使用的口令"},{"k":"D","t":"通常,动态口令实现方式分为口令序列、时间同步以及挑战/应答等几种类型"}],"answer":"C","src":"精选300题","srcNum":168,"id":"q250","analyze":"静态口令每次输入固定不变（A正确），即便加密或哈希后传输，攻击者仍可截获重放欺骗认证模块（B正确）；动态口令实现方式含口令序列、时间同步、挑战应答（D正确）。C错误：动态口令基于单向函数或时间因子，收集历史口令无法推出下一次口令，不可预测正是其安全基础。","expand":"动态口令类型对比：口令序列（一次性口令表逐次使用）、时间同步（TOTP基于时间窗）、挑战应答（异步，抗重放最强）。静态口令防护：加盐哈希存储、TLS传输、限制失败次数、定期更换。易混：动态口令不等于加密口令，核心是一次性有效。","tags":["身份鉴别","密码学"]},{"stem":"Gary Mcgraw 博士及其合作者提出软件安全模型BSI，该模型应由三根支柱来支撑,这三个支柱是","options":[{"k":"A","t":"源代码审核、风险分析和渗透测试"},{"k":"B","t":"应用风险管理、安全接触点和安全知识"},{"k":"C","t":"威胁建模、渗透測试和软件安全接触点"},{"k":"D","t":"威胁建模、源代码审核和模糊測试"}],"answer":"B","src":"精选300题","srcNum":171,"id":"q251","analyze":"BSI由Gary McGraw等提出，三根支柱为应用风险管理、安全接触点、安全知识，故B正确。A把技术手段（代码审核、渗透测试）当作支柱；C、D混入威胁建模、模糊测试等具体活动，均非该模型定义的支柱，属概念层级混淆。","expand":"BSI强调安全内建：风险管理贯穿需求到运维；安全接触点指滥用案例分析、架构风险分析、代码审查、渗透测试等工程实践；安全知识指规范、经验与工具库。易混：与被试模型相似的微软SDL更强调阶段门禁与强制活动，BSI更强调知识与实践结合。","tags":["软件安全","安全工程与项目管理"]},{"stem":"某电子商务网站最近发生了一起安全事件,出现了一个价值1000 元的商品用1 元被买走的情况,经分析是由于设计时出于性能考虑,在浏览时时使用Http 协议,攻击者通过伪造数据包使得向购物车添加商品的价格被修改。利用此漏洞,攻击者将价值1000 元的商品以1 元添加到购物车中,而付款时又没有验证的环节导致以上问题。对于网站的这个问题原因分析及解决措施,最正确的说法应该是?","options":[{"k":"A","t":"该问题的产生是由于使用了不安全的协议导致的,为了避免再发生类似的问题,应对全网站进行安全改造,所有的访问都强制要求使用https"},{"k":"B","t":"该问题的产生是由于网站开发前没有进行如威胁建模等相关工作或工作不到位,没有找到该威胁并采取相应的消减措施"},{"k":"C","t":"该问题的产生是由于编码缺陷,通过对网站进行修改,在进行订单付款时进行商品价格验证就可以解决"},{"k":"D","t":"该问题的产生不是网站的问题,应报警要求寻求警察介入,严惩攻击者即可"}],"answer":"A","src":"精选300题","srcNum":172,"id":"q252","analyze":"根因是购物车使用HTTP明文传输，价格参数可被中间人篡改，付款环节又缺少校验，故全站启用HTTPS可使数据具备机密性与完整性，从传输层根治篡改，A最正确。B威胁建模属事前手段，未触及明文传输根因；C只校验单一字段，其他参数仍可改；D报警不能修复缺陷。","expand":"传输安全要点：HTTPS（TLS）提供加密、完整性校验与服务器身份鉴别，敏感业务应强制跳转并启用HSTS。纵深防御还须服务端对价格、数量等关键字段重新计算校验，不信任客户端提交值。易混：XSS、CSRF属应用层漏洞，与明文传输篡改机理不同。","tags":["网络安全","软件安全"]},{"stem":"某网站在设计时经过了威胁建模和攻击面分析,在开发时要求程序员编写安全的代码,但是在部署时由于管理员将备份存放在Web 目录下导致了攻击者可直接下载备份,为了发现系统中是否存在其他类似问题,以下哪种测试方式是最佳的测试方式","options":[{"k":"A","t":"模糊测试"},{"k":"B","t":"源代码测试"},{"k":"C","t":"滲透测试"},{"k":"D","t":"软件功能测试"}],"answer":"C","src":"精选300题","srcNum":173,"id":"q253","analyze":"问题出在部署配置——备份文件置于Web目录，而非源码逻辑，源代码测试难以覆盖此类环境缺陷；渗透测试以攻击者视角探测运行环境，能发现可未授权访问的文件、目录与配置问题，故C最佳。模糊测试针对输入健壮性，功能测试只验证业务功能，均不适用。","expand":"测试方法适用场景：代码审计查编码缺陷与逻辑漏洞；渗透测试查运行环境、配置与组合利用；模糊测试查输入处理与崩溃；漏洞扫描查已知组件漏洞。判断技巧：缺陷位于“部署配置”层时优先选渗透测试，位于“编码实现”层时优先选源码审计。","tags":["软件安全","风险评估"]},{"stem":"以下哪一项不是常见威胁对应的消减措施:","options":[{"k":"A","t":"假冒攻击可以采用身份认证机制来防范"},{"k":"B","t":"为了防止传输的信息被篡改,收发双方可以使用单向Hash 函数来验证数据的完整性"},{"k":"C","t":"为了防止发送方否认曾经发送过的消息,收发双方可以使用消息验证码来防止抵赖"},{"k":"D","t":"为了防止用户提升权限,可以采用访问控制表的方式来管理权限"}],"answer":"C","src":"精选300题","srcNum":174,"id":"q254","analyze":"假冒攻击用身份认证机制防范（A正确）；单向Hash可验证数据完整性以防篡改（B正确）；提升权限可用访问控制表管理权限（D正确）。C错误：消息验证码MAC由双方共享密钥计算，只能提供完整性与源认证，无法防止发送方抵赖；抗抵赖须使用数字签名。","expand":"安全服务与机制对应：保密性—加密；完整性—Hash、MAC、数字签名；认证性—口令、证书、挑战应答；不可否认性—数字签名与可信时间戳。易混：MAC完整性不等于不可否认；Hash无密钥，只能发现偶发差错，不能抗恶意伪造。","tags":["密码学","网络安全"]},{"stem":"以下关于模糊测试过程的说法正确的是","options":[{"k":"A","t":"模糊测试的效果与覆盖能力,与输入样本选择不相关"},{"k":"B","t":"为保障安全测试的效果和自动化过程,关键是将发现异常进行现场保护记录,系统可能无法恢复异常状态进行后续的测试"},{"k":"C","t":"通过异常样本重视异常,人工分析异常原因,判断是否为潜在的安全漏洞,如果是安全漏洞,就需要进一步分析其危害性、影响范围和修复建议"},{"k":"D","t":"对于可能产生的大量异常报告,需要人工全部分析异常报告"}],"answer":"C","src":"精选300题","srcNum":175,"id":"q255","analyze":"模糊测试的正确做法是：以异常样本复现异常、人工分析原因、判定是否为安全漏洞，若是则进一步评估危害性、影响范围并给出修复建议，故C正确。A错在输入样本选择直接决定路径覆盖与测试效果；B错在应记录现场并保证系统可恢复；D错在异常报告需去重排序，并非全部人工分析。","expand":"模糊测试要素：种子样本与变异策略、覆盖引导（插桩反馈）、异常监控（崩溃、超时、内存错误）、结果分诊。流程可记为生成—执行—监控—复现—分析—修复。易混：模糊测试本质黑盒重健壮性，符号执行偏白盒重路径约束求解。","tags":["软件安全"]},{"stem":"有关危害国家秘密安全的行为,包括:","options":[{"k":"A","t":"严重违反保密规定行为、定密不当行为、公共信息网络运营商及服务商不履行保密义务的行为、保密行政管理部门的工作人员的违法行为"},{"k":"B","t":"严重违反保密规定行为、公共信息,网络运营商及服务商不履行保密义务的行为、保密行政管理部门的工作人员的违法行为,但不包括定密不当行为"},{"k":"C","t":"严重违反保密规定行为、定密不当行为、保密行政管理部门的工作人员的违法行为,但不包括公共信息网络运营商及服务商不履行保密义务的行为"},{"k":"D","t":"严重违反保密规定行为、定密不当行为、公共信息网络运营商及服务商不履行保密义务的行为, 但不包括保密行政管理部门的工作人员的违法行为"}],"answer":"A","src":"精选300题","srcNum":176,"id":"q256","analyze":"危害国家秘密安全的行为包括四类：严重违反保密规定的行为、定密不当的行为、公共信息网络运营商及服务商不履行保密义务的行为、保密行政管理部门工作人员的违法行为，故A正确。B、C、D均以“但不包括”删去其中一类，破坏了法定范围的完整性。","expand":"《保守国家秘密法》法律责任对应四类主体：违规定密者、违规使用与传播者、未履行保密义务的网络运营者、失职渎职的保密行政管理人员，分别承担行政或刑事责任。判断技巧：此类“列举+但不包括”题，凡删减法定类别者即为错误项。","tags":["信息安全标准与法规"]},{"stem":"国务院信息化工作办公室于2004 年7 月份下发了《关于做好重要信息系统灾难备份工作的通知》,该文件中指出了我国在灾备工作原则,下面哪项不属于该工作原则","options":[{"k":"A","t":"统筹规划"},{"k":"B","t":"分组建设"},{"k":"C","t":"资源共享"},{"k":"D","t":"平战结合"}],"answer":"B","src":"精选300题","srcNum":177,"id":"q257","analyze":"2004年国信办《关于做好重要信息系统灾难备份工作的通知》提出的工作原则为统筹规划、资源共享、平战结合、分级建设，B“分组建设”系“分级建设”的形近误写，不属于工作原则，故B正确。A、C、D三项均为文件明确表述的原则。","expand":"灾备原则可记为“统筹、共享、平战、分级”：统筹规划避免重复建设，资源共享提高利用率，平战结合兼顾日常与应急，分级建设按系统重要程度分类实施。易混：信息系统灾难恢复能力分1至6级（GB/T 20988），级别由RTO、RPO与备份方式综合决定。","tags":["业务连续性与灾难恢复"]},{"stem":"小陈学习了有关信息安全管理体系的内容后,认为组织建立信息安全管理体系并持续运行,比起简单地实施信息安全管理,有更大的作用,他总结了四个方面的作用,其中总结错误的是","options":[{"k":"A","t":"可以建立起文档化的信息安全管理规范,实现有“法”可依,有章可循,有据可査"},{"k":"B","t":"可以强化员工的信息安全意识,建立良好的安全作业习惯,培育组织的信息安全企业文化"},{"k":"C","t":"可以增强客户、业务伙伴、投资人对该组织保障其业务平台和数据信息的安全信心"},{"k":"D","t":"可以深化信息安全管理,提高安全防护效果,使组织通过国际标准化组织的IS09001 认证"}],"answer":"D","src":"精选300题","srcNum":178,"id":"q258","analyze":"建立ISMS可形成文档化规范、实现有章可循（A），强化员工安全意识与安全文化（B），增强客户与业务伙伴信心（C）。D错误：ISO/IEC 27001是信息安全管理体系标准，通过认证获得该体系证书；ISO 9001是质量管理体系标准，两者性质与对象不同。","expand":"ISO/IEC 27000族：27001要求（可认证）、27002控制措施实践指南、27003实施指南、27004测量、27005风险评估、27006认证机构要求。ISMS运行主线为PDCA：策划—实施—检查—改进。易混：27001可认证，27002仅指导不可认证。","tags":["信息安全管理体系","信息安全标准与法规"]},{"stem":"不同的信息安全风险评估方法可能得到不同的风险评估结果,所以组织机构应当根据各自的实际情况,选择适当的风险评估方法。下面的描述中,错误的是","options":[{"k":"A","t":"定量风险分析试图从财务数字上对安全风险进行评估,得出可以量化的风险分析结果,以度量风险的可能性和损失量"},{"k":"B","t":"定量风险分析相比定性风险分析能得到准确的数值,所以在实际工作中应使用定量风险分析,而不应选择定性风险分析"},{"k":"C","t":"定性风险分析过程中,往往需要凭借分析者的经验和直接进行,所以分析结果和风险评估团队的素质、经验和知识技能密切相关"},{"k":"D","t":"定性风险分析更具主观性,而定量风险分析更具客观性"}],"answer":"B","src":"精选300题","srcNum":179,"id":"q259","analyze":"定量分析以财务数字量化风险，度量可能性与损失量（A正确）；定性分析依赖经验与专家判断，结论与团队素质经验密切相关（C正确），主观性更强而定量更客观（D正确）。B错误：定量需可靠数据支撑、成本高，实践中应按情势选用定性、定量或半定量方法，不能一概否定定性。","expand":"方法选择：资产价值可量化、历史数据充分时用定量，如年预期损失ALE＝单次损失SLE×年发生频率ARO；数据缺乏、需快速判断时用定性，如风险矩阵、德尔菲法；半定量以等级赋值折中。判断技巧：凡出现“只用某一种方法”的绝对化表述，通常为错误项。","tags":["风险评估"]},{"stem":"Windows 系统中,安全标识符(SID)是标识用户、组和计算机账户的唯一编码,在操作系统内部使用。当授予用户、组、服务或者其他安全主体访问对象的权限时,操作系统会把SID 和权限写入对象的ACI 中,小刘在学习了SID 的组成后,为了现固所学知识,在自己计算机的Windows 操作系统中使whoami/ users 操作査看当前用户的SID。得到的SlID 为S-1-5-21-1534169462-1651380828-111620651-500,下列选项中,关于此SID 的理解错误的是","options":[{"k":"A","t":"前三位S-1-5 表示此SID 是由Windows NT 颁发的"},{"k":"B","t":"第一个子颁发机构是21"},{"k":"C","t":"Windows NTE 的SID 的三个子颁发机构是1534169462、1651380828、11620651"},{"k":"D","t":"此SID 以500 结尾,表示内置guest 账户"}],"answer":"D","src":"精选300题","srcNum":180,"id":"q260","analyze":"SID结构为S-版本号-权威值-子权威值链：S表示标识符，1为版本，5表示由NT权威机构颁发（A正确）；21为第一个子颁发机构，代表计算机或域（B正确）；后三段为该域内相对标识符（C正确）。D错误：结尾500是内置Administrator账户，内置Guest为501。","expand":"常见RID：500 Administrator、501 Guest、512 Domain Admins、513 Domain Users、515 Domain Computers。SID用于ACL标识安全主体且不重复。易混：本地账户与域账户SID前缀不同；重装系统后本地SID会变化，域账户迁移需专用工具。","tags":["操作系统安全","访问控制"]},{"stem":"letc/passwd 文件是Unxlinux 安全的关键文件之一。该文件用于用户登录时校验用户的登录名、加密的口令数据项、用户ID(UID)、默认的用户分组ID(GID)、用户信息、用户登录目录以及登录后使用的shell 程序。某黑客设法窃取了银行账户管理系统的passwd 文件后,发现每个用户的加密的口令数据项都显示为x。下列选项中,对此现象的解释正确的是","options":[{"k":"A","t":"黑客窃取的passwd 文件是假的"},{"k":"B","t":"用户的登录口令经过不可逆的加密算法加密结果为'x"},{"k":"C","t":"加密口令被转移到了另一个文件里"},{"k":"D","t":"这些账户都被禁用了"}],"answer":"C","src":"精选300题","srcNum":181,"id":"q261","analyze":"现代Linux已将口令散列从/etc/passwd迁移到/etc/shadow，passwd第二字段仅保留占位符x，真实口令由shadow保存且仅root可读，故C正确。A与文件真实性无关；B误认为x是加密结果；D账户禁用通常表现为字段为星号或感叹号，并非统一的x。","expand":"/etc/passwd七字段：用户名、口令占位、UID、GID、用户信息、主目录、登录Shell；/etc/shadow九字段：用户名、口令散列、最后修改日、最小间隔、最大间隔、警告天数、失效天数、保留、标志。易混：x表示口令在shadow中，星号或感叹号表示锁定或无口令。","tags":["操作系统安全","身份鉴别"]},{"stem":"Linux 系统的安全设置主要从磁盘分区、账户安全设置、禁用危险服务、远程登录安全、用户鉴别安全、审计策略、保护root 账户、使用网络防火墙和文件权限操作共10 个面来完成。小张在学习了Linux系统安全的相关知识后,尝试为自己计算机上的Linux 系统进行安全配置。下列选项是他的部分操作,其中不合理的是","options":[{"k":"A","t":"编辑文件/etc/ passwd.检査文件中用户ID,禁用所有ID=0 的用户"},{"k":"B","t":"编辑文件/etc/ssh/ sshd config,将Permitrootlogin 设置为no"},{"k":"C","t":"编辑文件/etc/pam,d/ system-auth,设置auth required pam tal1y.so oner=faildeny=unlock time=300"},{"k":"D","t":"编辑文件/etc/ profile,设置TMOUT=600"}],"answer":"A","src":"精选300题","srcNum":183,"id":"q262","analyze":"A不合理：UID为0即root，禁用所有UID为0的账户会直接锁死系统管理权限，正确做法是核查是否存在非root账户被赋予UID 0，发现即整改，确保仅root为0。B禁用root远程登录、C配置登录失败锁定、D设置会话超时，均是合理的加固措施。","expand":"Linux账户加固：核查并清理UID 0账户、锁定无口令账户、限制su、启用sudo最小授权、设置口令有效期、禁止root直接SSH登录。审计命令awk -F: '($3==0)' /etc/passwd可列出UID 0账户。易混：UID与GID为0均为特权，需一并核查。","tags":["操作系统安全","访问控制"]},{"stem":"目前,信息系统面临外部攻击者的悉意攻击威胁,从威胁能力和掌握资源分,这些威胁可以按照个人威胁、组织威胁和国家威胁三个层面划分,则下面选项中属于组织威胁的是","options":[{"k":"A","t":"喜欢恶作剧、实现自我挑战的娱乐型黑客"},{"k":"B","t":"实施犯罪、获取非法经济利益网络犯罪团伙"},{"k":"C","t":"搜集政治、军事、经济等情报信息的情报机构"},{"k":"D","t":"现固战略优势,执行军事任务、进行目标破坏的信息作战部队"}],"answer":"B","src":"精选300题","srcNum":184,"id":"q263","analyze":"威胁按能力与资源分为个人、组织、国家三个层面。B网络犯罪团伙以非法经济利益为目的，具备分工、资金与技术资源，属组织威胁。A娱乐型黑客属个人威胁；C情报机构、D信息作战部队掌握国家资源并服务于国家战略，属国家威胁。","expand":"威胁主体分层：个人（黑客爱好者、脚本小子、违规员工）、组织（犯罪团伙、商业竞争方、恐怖组织）、国家（情报机构、网络部队）。防御强度与响应级别随层级递增，国家层面威胁需国家级监测预警与关键信息基础设施保护支撑。易混：内部人员威胁按动机不同可归入个人或组织层级。","tags":["网络安全","风险评估"]},{"stem":"以下哪种风险被认为是合理的风险","options":[{"k":"A","t":"最小的风险"},{"k":"B","t":"残余的风险"},{"k":"C","t":"未识别的风险"},{"k":"D","t":"可接受的风险"}],"answer":"D","src":"精选300题","srcNum":185,"id":"q264","analyze":"风险管理中，风险处置后仍残留、并经组织评审认为处于可承受范围内的风险称为可接受的风险，故D正确。A“最小的风险”不是规范术语；B残余风险是客观存在，未必经批准被接受；C未识别的风险恰是风险管理要极力避免的盲区，绝不属合理风险。","expand":"风险处置四选项：降低、转移（保险、外包）、规避、接受。可接受风险水平由组织风险准则确定，须经管理层批准并持续监视。易混：残余风险是处置后的“客观剩余量”，可接受风险是经决策“容许保留”的残余风险，前者是状态，后者是决策结果。","tags":["风险评估"]},{"stem":"规划的实施流程和文档管理,是信息安全风险评估能否取得成果的重要基础。某单位在实施风险评估时,按照规范形成了若干文档,其中,下面()中的文档应属于风险评估中风险要素识别”阶段输出的文档","options":[{"k":"A","t":"《风险评估方案》,主要包括本次风险评估的目的、范围、目标、评估步骤、经费预算和进离安排等内容"},{"k":"B","t":"《风险评估方法和工具列表》主要包括拟用的风险评估方法和测试评估工具等内容"},{"k":"C","t":"《风险评估准则要求》,主要包括现有风险评估参考标准、采用的风险分析方法、资产分类标准等内容"},{"k":"D","t":"《已有安全措施列表》,主要包括经检査确认后的已有技术和管理各方面安全措施等内容答"}],"answer":"D","src":"精选300题","srcNum":186,"id":"q265","analyze":"风险要素识别阶段的任务是识别资产、威胁、脆弱性与已有安全措施，故《已有安全措施列表》属该阶段输出（D）。《风险评估方案》含目的、范围、步骤、预算与进度安排，《方法和工具列表》《准则要求》均在准备阶段确定，属规划性文档。","expand":"GB/T 20984流程：准备（确定目标范围、组建团队、制定方案与准则）→要素识别（资产、威胁、脆弱性、已有措施）→风险分析（可能性×影响）→风险评价→处置与沟通。判断技巧：涉“计划、方法、准则、预算”的文档归准备阶段，涉“资产、威胁、脆弱性、措施”的清单归识别阶段。","tags":["风险评估"]},{"stem":"以下关于互联网协议安全( Internet Protocol Security, Ipsec)协议说法错误的是","options":[{"k":"A","t":"在传送模式中,保护的是IP 负载"},{"k":"B","t":"验证头协议( Authentication Head,AH)和IP 圭寸装安全载荷协议( Encapsulating Security Pay load,ESP)都能以传输模式和隧道模式工作"},{"k":"C","t":"在隧道模式中,保护的是整个互联网协议( InternetProtoco1,IP)包,包括IP 头"},{"k":"D","t":"Ipsec 仅能保证传输数据的可认证性和保密性"}],"answer":"D","src":"精选300题","srcNum":187,"id":"q266","analyze":"IPSec传输模式保护IP负载（A正确），隧道模式保护整个IP包含原IP头（C正确）；AH与ESP均可工作于两种模式，AH提供完整性与认证、ESP提供加密与认证（B正确）。D错误：IPSec还可提供抗重放、访问控制及IKE密钥协商，安全服务不止认证与保密。","expand":"IPSec组成：AH（协议号51，认证IP头与负载）、ESP（协议号50，加密加认证）、IKE（UDP 500与4500协商SA）、SA及SPD、SAD。易混：传输模式用于主机到主机，隧道模式用于网关到网关组建VPN；NAT穿越需将ESP封装于UDP。","tags":["网络安全","密码学"]},{"stem":"某个新成立的互联网金融公司拥有10 个与互联网直接连接的P 地址,但是该网络内有15 台个人计算机,这些个人计算机不会同时开机并连接互联网。为解决公司员工的上网问题,公司决定将这10 个互联网地址集中起来使用,当任意一台个人计算机开机并连接网络时,管理中心从这10 个地址中任意取出一个尚未分配的P 地址分配给这个人的计算机。他关机时,管理中心将该地为收回,并重新设置为未分配。可见只要同时打开的个人计算机数量少于或等于可供分配的P 地址,那么每中个人计算机可获取一个IP 地址,并实现与互联网的连接,该公司使用的IP 地址规划方式是","options":[{"k":"A","t":"静态分配地址"},{"k":"B","t":"动态分配地址"},{"k":"C","t":"静态MAT 分配地址"},{"k":"D","t":"端口NAT 分配地址"}],"answer":"B","src":"精选300题","srcNum":188,"id":"q267","analyze":"10个IP地址集中管理，主机开机时由管理中心从未分配地址中取一个分配、关机即回收，属动态分配（DHCP机制），故B正确。静态分配是固定绑定且不回收；静态NAT与端口NAT是把内部地址映射到公网地址或复用端口，题干未涉及地址转换，故A、C、D均不符。","expand":"地址分配方式：静态（手工固定绑定）、动态（DHCP自动分配并管理租期）、自动（无状态或链路本地）。NAT类型：静态NAT一对一、动态NAT地址池映射、NAPT端口复用多对一。易混：本题是地址池“轮转分配”，并未做地址转换，不属NAT。","tags":["网络安全"]},{"stem":"在inux 系统中,下列哪项内容不包含在/ etc/passwd 文件中","options":[{"k":"A","t":"用户名"},{"k":"B","t":"用户口令"},{"k":"C","t":"用户主目录"},{"k":"D","t":"用户登录后使用的SHEL"}],"answer":"B","src":"精选300题","srcNum":189,"id":"q268","analyze":"/etc/passwd七个字段含用户名（A）、UID与GID、用户信息、主目录（C）、登录Shell（D），而口令字段仅以x占位，真实散列存放于/etc/shadow，故“用户口令”不包含在passwd中（B）。A、C、D均为该文件实际包含的内容。","expand":"对比记忆：passwd存账户基本信息且全局可读；shadow存口令散列与有效期策略，仅root可读；group存组与成员；gshadow存组口令。易混：早期Unix把DES加密口令直接写在passwd第二字段，现代系统已拆分，故字段为x即表示口令指向shadow。","tags":["操作系统安全"]},{"stem":"某市环卫局网络建设是当地政府投资的重点项目。总体目标就是用交换式水平布线,由大型的交换机和路由器连通几个主要的工作区域,在各个区域建立通过网络传输到各监控中心。其中对交换机和路由器进行配置是网络安全中的一,和路由器的安全配置,操作错误的是","options":[{"k":"A","t":"保持当前版本的操作系统,不定期更新交换机操作系统补丁"},{"k":"B","t":"控制交换机的物理访问端口,关闭空闲的物理端口"},{"k":"C","t":"带外管理交换机,如果不能实现的话,就可以利用单独的VLAN 号进行带内管理"},{"k":"D","t":"安全配置必要的网络服务,关闭不必要的网络服务"}],"answer":"A","src":"精选300题","srcNum":190,"id":"q269","analyze":"A操作错误：应保持交换机、路由器系统版本为最新稳定版并定期更新补丁，而非“不定期更新”，否则已知漏洞将长期暴露。B关闭空闲物理端口防私接、C采用带外管理或独立VLAN带内管理、D按需开启服务并关闭多余服务，均为正确加固做法。","expand":"网络设备加固要点：及时打补丁、修改默认口令、禁用Telnet改用SSH、关闭CDP等泄露信息协议、关闭未用端口并绑定MAC、管理面与业务面隔离、启用日志与NTP同步、定期备份配置。易混：带外管理走Console或专用管理网，带内管理走业务网但需独立VLAN与ACL保护。","tags":["网络安全","操作系统安全"]},{"stem":"应急响应是信息事件管理的重要内容。基于应急响应工作的特点和事件的不规则性,事先制定出事件应急响应方法和过程,有助于一个组织在事件发生时阻止混乱的发生或是在混乱状态中迅速恢复控制,将损失和负面影响降到最低。应急响应方法和过程并不是唯一的。一种被广为接受的应急响应管理过程分为6个阶段为准备一检测-遏制-根除-恢复-跟踪总结。请问下列说法有关于信息安全应急响应管理过程错误的是","options":[{"k":"A","t":"确定重要资产和风险,实施针对风险的防护措施是信息安全应急响应规划过程中最关键的步骤"},{"k":"B","t":"在检测阶段,首先要进行监测、报告及信息收集"},{"k":"C","t":"遏制措施可能会因为事件的类别和级别不同而完全不同,常见的遏制措施有:完全关闭所有系统拔掉网线"},{"k":"D","t":"应按照应急响应计划中事先制定的业务恢复优先顺序和恢复步骤,顺次恢复相关的系统。"}],"answer":"C","src":"精选300题","srcNum":191,"id":"q270","analyze":"C错误：遏制措施应视事件类别、级别与影响范围分类实施，常见做法是有选择地隔离受影响主机、阻断攻击路径、禁用被攻破账号，而不是“完全关闭所有系统、拔掉网线”，后者会造成业务全面中断并破坏现场证据。A、B、D均符合应急响应管理规范。","expand":"遏制策略三类：完全遏制（隔离网段）、部分遏制（关闭部分服务）、持续监控（暂不阻断以便取证）。选择依据为业务重要性、扩散速度与取证需求，原则是先控制影响面、保全证据、再根除。易混：遏制是限损，根除是清源，恢复是复业。","tags":["应急响应"]},{"stem":"小张新购入了一台安装了words 操作系统的笔记本电脑,为了提升操作系统的安全性,小张在words系统中的“本地安全策略”中配置了四类安全策略:账号策略、本地策略、公钥策略和IP 安全策略,那么该操作属于操作系统安全配置内容中的","options":[{"k":"A","t":"关闭不必要的服务"},{"k":"B","t":"制定操作系统的策略"},{"k":"C","t":"关闭不必要的端口"},{"k":"D","t":"开启审核策略"}],"answer":"B","src":"精选300题","srcNum":192,"id":"q271","analyze":"Windows“本地安全策略”包含账户策略、本地策略、公钥策略和IP安全策略等，属操作系统安全配置中“制定操作系统安全策略”这一环节，故B正确。关闭不必要服务、关闭不必要端口、开启审核策略都是具体配置项，但题干列举的四类策略集合体现的是策略体系的制定。","expand":"Windows安全配置层次：本地安全策略（secpol.msc）、本地组策略（gpedit.msc）、域组策略。账户策略含口令策略与账户锁定策略；本地策略含审核策略、用户权限分配、安全选项。易混：审核策略只是本地策略下的子项，不能概括题干全部四类策略。","tags":["操作系统安全","访问控制"]},{"stem":"随着互联网”概念的普及,越来越多的新兴住宅小区引入了“智能楼宇”的理念,某物业为提供高档次的服务,防止网络主线路出现故障,保证小区内网络服务的可用,稳定、高效,计划通过网络冗余配置的是","options":[{"k":"A","t":"接入互联网时,同时采用不同电信运营商线路,相互备份且互不影响。"},{"k":"B","t":"核心层、汇聚层的设备和重要的接入层设备均应双机设备。"},{"k":"C","t":"规划网络IP 地址,制定网络IP 地址分配策略"},{"k":"D","t":"保证网络带宽和网络设备的业务处理能力具务冗余空间,满足业务高峰期和业务发展需求"}],"answer":"B","src":"精选300题","srcNum":193,"id":"q272","analyze":"网络冗余配置指以设备与链路冗余消除单点故障。B在核心层、汇聚层及重要接入层设备均采用双机冗余，属典型的设备级冗余，故B正确。A是运营商线路备份，D是带宽与处理能力冗余，C是IP地址规划，三者均不属网络冗余配置的核心表述。","expand":"冗余层次：设备冗余（双机热备、集群）、链路冗余（双上行、链路聚合）、线路冗余（多运营商）、机房与供电冗余。可用性由MTBF与MTTR决定，冗余设计缩短故障恢复时间。易混：负载均衡侧重性能分担，冗余侧重故障切换，工程中常与心跳检测组合部署。","tags":["网络安全","业务连续性与灾难恢复"]},{"stem":"下列关于软件安全开发中的BSI( Build Security In)系列模型说法错误的是","options":[{"k":"A","t":"BIS 含义是指将安全内建到软件开发过程中,而不是可有可无,更不是游离于软件开发生命周期之外"},{"k":"B","t":"软件安全的三根支柱是风险管理、软件安全接触点和安全测试"},{"k":"C","t":"软件安全触点是软件开发生命周期中一套轻量级最优工程化方法,它提供了从不同角度保障安全的行为方式"},{"k":"D","t":"BSⅠ系列模型强调应该使用工程化的方法来保证软件安全,即在整个软件开发生命周期中都要确保将安全作为软件的一个有机组成部分"}],"answer":"B","src":"精选300题","srcNum":194,"id":"q273","analyze":"B错误：BSI三根支柱是应用风险管理、软件安全接触点与安全知识，B把“安全知识”替换为“安全测试”，故错误。A对BSI含义的阐释、C对安全接触点作为轻量级工程方法的定位、D对以工程化方法全程保证安全的强调，均符合该模型原意。","expand":"BSI与SDL差异：BSI由Cigital提出，强调知识库与接触点；SDL由微软提出，强调阶段门禁与强制活动，如威胁建模、静态分析、禁用API。共同点是安全前置到需求与设计。易混：渗透测试与模糊测试是验证手段，均非BSI三支柱之一。","tags":["软件安全","安全工程与项目管理"]},{"stem":"访问控制是对用户或用户访问本地或网络上的域资源进行法令一种机制。在Windows2000 以后的操作系统版本中,访问控制是一种双重机制,它对用户的授权基于用户权限和对象许可,通常使用ACL、访问令牌和授权管理器来实现访问控制功能。以下选项中对windows 操作系统访问控制实现方法的理解错误的是","options":[{"k":"A","t":"ACL 只能由管理员进行管理"},{"k":"B","t":"ACL 是对象安全描述的基本组成部分,它包括有权访问对象的用户和级的SID"},{"k":"C","t":"访问令牌存储着用户的SI"},{"k":"D","t":"组信息和分配给用户的权限D、通过授权管理器,可以实现基于角色的访问控制"}],"answer":"A","src":"精选300题","srcNum":195,"id":"q274","analyze":"A错误：ACL由对象所有者即可设置与修改，管理员因持有取得所有权等特权也可管理，并非只有管理员才能管理。B关于ACL是安全描述符组成部分并含用户与组SID的说明、C关于访问令牌存储用户SID、D关于授权管理器实现基于角色访问控制，均正确。","expand":"Windows访问控制三要素：访问令牌（含用户SID、组SID、特权）、安全描述符（含DACL、SACL、所有者）、访问检查（将请求与DACL逐项比对）。DACL管允许与拒绝，SACL管审核。易混：ACL是对象的属性而非主体的凭证，令牌才是主体身份载体。","tags":["访问控制","操作系统安全"]},{"stem":"社会工程学定位在计算机信息安全工作链的一个最脆弱的环节,即人”这个环节上。这些社会工程黑客在某黑客大会上成功攻入世界五百强公司,其中一名自称是CSO 杂志做安全调査,半小时内,攻击者选择了在公司工作两个月安全工程部门的合约雇员,在询问关于工作满意度以及食堂食物质量问题后,雇员开始透露其他信息,包括:操作系统、服务包、杀毒软件、电子邮件及测览器。为对抗此类信息收集和分析,公司需要做的是","options":[{"k":"A","t":"通过信息安全培训,使相关信息发布人员了解信息收集风险,发布信息采取最小化原则"},{"k":"B","t":"减少系统对外服务的端口数量,修改服务旗标"},{"k":"C","t":"关闭不必要的服务,部署防火墙、IDS 等措施"},{"k":"D","t":"系统安全管理员使用漏洞扫描软件对系统进行安全审计"}],"answer":"A","src":"精选300题","srcNum":196,"id":"q275","analyze":"社会工程学利用人的信任与信息泄露，防御核心是意识培训与信息发布最小化：让可接触信息的人员了解信息聚合风险，对外发布遵循最小必要原则，故A正确。B、C、D都是针对系统与网络的技术加固（收敛端口、改旗标、防火墙与IDS、漏洞扫描），对套取信息的人员欺骗无效。","expand":"社会工程学常见手法：虚构身份、钓鱼邮件、尾随进入、翻找废弃资料、以小利套取信息。防御要点：最小信息暴露、身份核验流程、访客与权限管理、员工培训与演练、敏感信息分级。易混：社工库攻击本质是信息聚合，单靠技术加固难以防范。","tags":["网络安全","信息安全管理体系"]},{"stem":"某黑客通过分析和整理某报社记者小张的博客,找到一些有用的信息,通过伪装的新闻线索,诱使其执行木马程序,从而控制了小张的电脑,并以她的电脑为攻击的端口,使报社的局域网全部感染木马病毒,为防范此类社会工程学攻击,报社不需要做的是","options":[{"k":"A","t":"加强信息安全意识培训,提高安全防范能力了解各种社会工程学攻击方法,防止受到此类攻击"},{"k":"B","t":"建立相应的安全相应应对措施,当员工受到社会工程学的攻击,应当及时报告"},{"k":"C","t":"教育员工注重个人隐私保护"},{"k":"D","t":"减少系统对外服务的端口数量,修改服务旗标"}],"answer":"D","src":"精选300题","srcNum":197,"id":"q276","analyze":"题干针对社会工程学攻击——借博客信息与伪装新闻线索诱使执行木马，有效举措是意识培训（A）、建立报告与响应机制（B）、教育员工保护隐私（C）。D收敛对外服务端口、修改服务旗标属技术层防扫描与指纹识别措施，对利用人的欺骗无效，故不需要做的是D。","expand":"社工攻击链：信息收集（公开源与社交平台）→建立信任→诱导操作（点击、运行、透露）→横向渗透。防御三条线：人（培训与演练）、流程（报告与核验）、技术（邮件网关、终端防护、最小权限）。易混：端口与旗标收敛防的是扫描探测，不解决诱骗执行问题。","tags":["网络安全","信息安全管理体系"]},{"stem":"2016 年9 月,一位安全研究人员在Google Cloud IP 上通过扫描,发现了完整的美国路易斯安邦州290万选民数据库。这套数据库中囊括了诸如完整姓名、电子邮箱地址、性别与种族、选民状态、注册日期与编号、正党代名和密码,以防止攻击者利用以上信息进行攻击。","options":[{"k":"A","t":"默认口令"},{"k":"B","t":"字典"},{"k":"C","t":"暴力"},{"k":"D","t":"XSS"}],"answer":"B","src":"精选300题","srcNum":198,"id":"q277","analyze":"大规模选民库泄露含姓名、邮箱、性别、种族、政党等真实个人信息，攻击者可据此构建高质量“字典”（社工库），用于猜测或撞库口令，故B正确。默认口令指设备出厂弱口令，暴力破解是穷举字符组合，XSS是网页脚本注入，均不能解释利用泄露信息构造口令候选的机理。","expand":"口令攻击类型：字典攻击（词表加规则变形，常含社工库）、暴力攻击（穷举字符空间）、掩码混合攻击、撞库（跨站复用同一口令）、密码喷洒（弱口令广撒网低频次）。防护：加盐哈希、强度策略、多因素认证、登录限速与异常检测。","tags":["密码学","身份鉴别"]},{"stem":"基于TCP 的主机在进行一次TcP 连接时简要进行三次握手,请求通信的主机A 要与另一台主机B 建立连接时,A 需要先发一个SYN 数据包向B 主机提出连接请示,B 收到后,回复一个ACK/SYN 确认请示给A主机,然后A 再次回应ACK 数据包,确认连接请求。攻击通过伪造带有虚假源地址的SYN 包给目标主机,使目标主机发送的ACSYN 包得不到确认。一般情况下,目标主机会等一段时间后才会放弃这个连接等待。因此大量虚假SYN 包同时发送到目标主机时,目标主机上就会有大量的连接请示等待确认,当这些未释放的连接请示数量超过目标主机的资源限制时。正常的连接请示就不能被目标主机接受,这种Syn food 攻击属于","options":[{"k":"A","t":"拒绝服务攻击"},{"k":"B","t":"分布式拒绝服务攻击"},{"k":"C","t":"缓冲区溢出攻击"},{"k":"D","t":"SQL 注入攻击"}],"answer":"A","src":"精选300题","srcNum":199,"id":"q278","analyze":"SYN Flood通过伪造源地址的大量SYN包占满目标半连接队列，使正常连接请求无法被接受，属典型拒绝服务攻击，故A正确。题干仅描述单一攻击源持续发包，未涉及多主机协同，故非DDoS；缓冲区溢出是内存越界改写，SQL注入是篡改查询语句，机理均不同。","expand":"DoS与DDoS区别：前者单源直攻，后者借僵尸网络多源放大。SYN Flood防护：启用SYN Cookie、缩短半连接超时、增大backlog队列、部署抗D设备与流量清洗。易混：UDP Flood、Smurf、CC攻击同属拒绝服务族，DDoS常叠加反射放大。","tags":["网络安全","恶意代码"]},{"stem":"小王是某大学计算机科学与技术专业的学生,最近因为生病缺席了几堂信息安全课程,这几次课的内容是自主访问控制与强制访问控制,为了赶上课程进度,他向同班的小李借来课堂笔记,进行自学。而小李在听课时由于经常走神,所以笔记中会出现一些错误。下列选项是小李笔记中关于强制访问控制模型的内容,其中出现错误的选项是","options":[{"k":"A","t":"强制访问控制是指主体和客体都有一个固定的安全属性,系统用该安全属性来决定一个主体是否可以访问某个客体"},{"k":"B","t":"安全属性是强制性的规定,它由安全管理员或操作系统根据限定的规则确定,不能随意修改"},{"k":"C","t":"系统通过比较客体玫主体的安全属性来决定主体是否可以访问客体"},{"k":"D","t":"它是一种对单个用户执行访问控制的过程和措施"}],"answer":"D","src":"精选300题","srcNum":200,"id":"q279","analyze":"强制访问控制MAC中主体与客体均带固定安全标记，系统按规则比较标记决定访问（A、B、C均正确）。D称“对单个用户执行访问控制的过程和措施”，这恰是自主访问控制DAC的特征——由所有者自主授权、按用户身份控制；MAC是系统级、不可绕过的全局策略，故D错误。","expand":"DAC与MAC对比：DAC基于所有者意愿，灵活但权限易被恶意转让；MAC基于安全标记与系统策略，强制且集中。典型模型：BLP（保密性，下读上写）、Biba（完整性，上读下写）、Clark-Wilson。易混：RBAC按角色授权，不依赖标记强制。","tags":["访问控制","操作系统安全"]},{"stem":"信息安全是国家安全的重要组成部分,综合研究当前世界各国信息安全保障工作,下面总结错误的是","options":[{"k":"A","t":"各国普遍将与国家安全、社会稳定和民生密切相关的关键基础设施作为信息安全保障的重点"},{"k":"B","t":"各国普遍重视战略规划工作,逐步发布网络安全战略、政策评估报告、推进计划等文件"},{"k":"C","t":"各国普遍加强国际交流与对话,均同意建立一致的安全保障系统,强化各国安全系统互通"},{"k":"D","t":"各国普遍积极推动信息安全立法和标准规范建设,重视应急响应、安全监管和安全测评"}],"answer":"C","src":"精选300题","srcNum":201,"id":"q280","analyze":"各国普遍将关键基础设施作为信息安全保障重点（A），重视战略规划并发布网络安全战略、评估报告与推进计划（B），推进立法与标准建设并重视应急、监管和测评（D）。C错误：各国依据自身利益与国情制定战略，并不存在建立一致安全保障系统、强化各国系统互通的普遍共识。","expand":"主要国家实践：美国网络空间战略与NIST CSF、欧盟NIS2与GDPR、我国《网络安全法》《数据安全法》《关键信息基础设施安全保护条例》。共同趋势：关基保护、供应链安全、数据跨境治理、人才培养。易混：国际规则协调不等于标准统一，各国均保留监管主权。","tags":["信息安全标准与法规","信息安全管理体系"]},{"stem":"某社交网站的用户点击了该网站上的一个广告。该广告含有一个跨站脚本,会将他的浏览器定向到旅游网站,旅游网站则获得了他的社交网络信息。虽然该用户没有主动访问该旅游网站,但旅游网站已经截获了他的社交网络信息(还有他的好友们的信息),于是犯罪分子便可以躲藏在社交网站的广告后面,截获用户的个人信息了,这种向Web 页面插入恶意htm 代码的攻击方式称为","options":[{"k":"A","t":"分布式拒绝服务攻击"},{"k":"B","t":"跨站脚本攻击"},{"k":"C","t":"SQL 注入攻击"},{"k":"D","t":"缓冲区溢出攻击"}],"answer":"B","src":"精选300题","srcNum":202,"id":"q281","analyze":"题干描述的是在网页中插入恶意HTML或脚本代码，用户浏览时脚本在其浏览器上下文执行，进而跳转并窃取社交网络信息，属跨站脚本攻击XSS，故B正确。DDoS是流量型拒绝服务，SQL注入是向数据库查询注入语句，缓冲区溢出是程序内存越界，均与浏览器端脚本执行不符。","expand":"XSS三类：反射型（URL参数即时回显）、存储型（恶意内容入库、危害最大）、DOM型（前端脚本解析触发）。防护：按上下文输出编码与转义、输入白名单校验、启用CSP、Cookie设HttpOnly。易混：XSS攻击浏览器用户，CSRF冒用用户身份发请求，SQL注入针对数据库。","tags":["软件安全","网络安全"]},{"stem":"模糊测试,也称Fzz 测试,是一种通过提供非预期的输入并监视异常结果来发现软件故障的方法。下面描述正确的是","options":[{"k":"A","t":"模糊测试本质上属于黑盒测试"},{"k":"B","t":"模糊测试本质上属于白盒测试"},{"k":"C","t":"模糊测试有时属于黑盒測试,有时属于白盒测试,取决于其使用的测试方法"},{"k":"D","t":"模糊测试既不属于黑盒測试,也不属于白盒测试"}],"answer":"A","src":"精选300题","srcNum":203,"id":"q282","analyze":"模糊测试向目标提供非预期输入并监视异常结果，不依赖内部代码结构与实现细节，只通过外部接口和输入输出观察行为，本质上属黑盒测试，故A正确。白盒测试须基于源码与内部逻辑结构设计用例；B、C、D的归属描述均不成立。","expand":"测试分类：黑盒（功能、边界值、等价类划分）、白盒（语句、分支、路径覆盖）、灰盒（结合接口与部分内部信息）。模糊测试本质属黑盒，但覆盖引导型模糊测试借助插桩反馈提升路径覆盖，具灰盒特征，考试仍按“本质黑盒”作答。","tags":["软件安全"]},{"stem":"若一个组织声称自己的ISMS 符合SO/=C27001 或GBT22080 标准要求,其信息安全控制措施通常需要在人力资源安全方面实施常规控制,人力资源安全划分为3 个控制阶段,不包括哪一项","options":[{"k":"A","t":"任用之前"},{"k":"B","t":"任用中"},{"k":"C","t":"任用终止或变化"},{"k":"D","t":"任用公示"}],"answer":"D","src":"精选300题","srcNum":204,"id":"q283","analyze":"ISO/IEC 27001（GB/T 22080）的人力资源安全控制分为任用之前、任用之中、任用终止或变化三个阶段，分别覆盖背景核查与聘用条款、培训与安全责任、权限回收与资产归还。D“任用公示”不在标准控制阶段之列，故D为答案。","expand":"三阶段要点：任用前——背景验证、角色与职责、聘用条款；任用中——管理责任、意识教育与培训、纪律处理；终止或变化——责任与权限回收、资产归还、访问权限撤销。易混：物理与环境安全分安全区域与设备安全，资产管理分资产责任与信息分类。","tags":["信息安全管理体系","信息安全标准与法规"]},{"stem":"某信息安全公司的团队对某款名为红包快抢”的外挂进行分析发现此外挂是一个典型的木马后门,使黑客能够获得受害者电脑的访问权,该后门程序为了达到长期驻留在受害者的计算机中,通过修改注册表启动项来达到后门程序随受害者计算机系统启动而启动为防范此类木马的攻击,以下做法无用的是","options":[{"k":"A","t":"不下载、不执行、不接收来历不明的软件和文件"},{"k":"B","t":"不随意打开来历不明的邮件,不浏览不健康不正规的网站"},{"k":"C","t":"使用共享文件夹"},{"k":"D","t":"安装反病毒软件和防火墙,安装专门的木马防范软件"}],"answer":"C","src":"精选300题","srcNum":205,"id":"q284","analyze":"木马防范要点包括不下载不执行来历不明的软件与文件（A）、不打开可疑邮件且不访问不良网站（B）、安装反病毒软件与防火墙及木马专杀工具（D）。C“使用共享文件夹”会扩大文件传播面并为横向移动提供通道，反而增加木马扩散风险，故C为答案。","expand":"木马驻留手法：注册表Run键、启动文件夹、系统服务、计划任务、DLL劫持、映像劫持。排查点：Autoruns核查自启动、进程与网络连接比对、文件完整性校验。易混：共享文件夹是内网横向传播的常见途径，应最小化共享并设置访问控制，绝非防护手段。","tags":["恶意代码","操作系统安全"]},{"stem":"小华在某电子商务公司工作,某天他在査看信息系统没计文档时,发现其中标注该信息系统的RPO(恢复点目标)指标为3 小时。请问这意味着","options":[{"k":"A","t":"该信息系统发生重大安全事件后,工作人员应在3 小时内到位,完成问题定位和应急处理工作"},{"k":"B","t":"该信息系统发生重大安全事件后,工作人员应在3 小时内完整应急处理工作并恢复对外运行"},{"k":"C","t":"该信息系统发生重大安全事件后,工作人员在完成处置和灾难恢复工作后,系统至少能提供3 小时的紧急业务服务能力"},{"k":"D","t":"该信息系统发生重大安全事件后,工作人员在完成处置和灾难恢复工作后,系统至多能丢失3 小时的业务数据"}],"answer":"D","src":"精选300题","srcNum":206,"id":"q285","analyze":"RPO即恢复点目标，指灾难发生后系统可容忍丢失的数据时间跨度。RPO为3小时意味着恢复后最多丢失最近3小时的业务数据，故D正确。A描述的是应急响应到位时间，B描述的是恢复时间RTO，C属业务连续性能力描述，均与RPO定义不符。","expand":"RTO为恢复时间目标，指业务中断到恢复可用的最长时间；RPO为恢复点目标，指可容忍的数据丢失量，以时间衡量。二者决定备份策略：RPO小需高频增量或同步复制，RTO小需热备与快速切换。易混：RTO管“停多久”，RPO管“丢多少”。","tags":["业务连续性与灾难恢复"]},{"stem":"Kerberos 协议是一种集中访问控制协议,他能在复杂的网络环境中,为用户提供安全的单点登录服务。单点登录是指用户在网络中进行一次身份认证,便可以访问其授权的所有网络资源,而不在需要其他的认证过程,实质是消息M 在多个应用系统之间的传递或共享。其中消息M 是指以下选项中的","options":[{"k":"A","t":"安全凭证"},{"k":"B","t":"用户名"},{"k":"C","t":"加密密钥"},{"k":"D","t":"会话密钥"}],"answer":"A","src":"精选300题","srcNum":207,"id":"q286","analyze":"Kerberos单点登录中，用户首次认证后获得票据许可票据与各服务票据，凭票据访问授权资源而无需重复认证，这些在系统间传递共享的消息即安全凭证，故A正确。用户名只是身份标识；加密密钥与会话密钥是凭证内部字段，并非被共享传递的凭证本身。","expand":"Kerberos流程：AS认证发放TGT→TGS凭TGT发放服务票据→访问目标服务；以对称加密与时间戳抗重放，依赖KDC。SSO本质是凭证在应用间传递与信任。易混：TGT与服务票据不同；Kerberos只解决认证不含授权；对时钟同步与KDC可用性依赖强。","tags":["身份鉴别","访问控制"]},{"stem":"若一个组织声称自己的ISMS 符合ISO/IEC27001 或GBT22080 标准要求,其信息安全控制措施通常需要在资产管理方面实施常规控制,资产管理包括对资产负责和信息分类两个控制目标。信息分类控制的目标是为了确保信息受到适当级别的保护,通常采取以下哪项控制措施","options":[{"k":"A","t":"资产清单"},{"k":"B","t":"资产负责人"},{"k":"C","t":"资产的可接受使用"},{"k":"D","t":"分类指南、信息的标记和处理"}],"answer":"D","src":"精选300题","srcNum":208,"id":"q287","analyze":"ISO/IEC 27001资产管理含资产责任与信息分类两个控制目标。信息分类目标要求按信息价值、法律要求与敏感性分级，并配套分类指南、标记与处理规则，故D正确。A资产清单、B资产负责人属资产责任目标，C可接受使用属资产使用管理，均不针对信息分类。","expand":"信息分类常用四级：公开、内部、秘密、机密（或按组织自定）。控制要点：分级指南、标记规则（标签与页眉）、处理规则（存储、传输、销毁）、定期复核与降密。易混：资产清单解决“有什么、谁负责”，信息分类解决“保护到什么程度”。","tags":["信息安全管理体系","访问控制"]},{"stem":"在使用系统安全工程-能力成熟模型(SSE-CMM)对一个组织的安全工程能力成熟度进行测量时,有关测量结果,错误的理解是:","options":[{"k":"A","t":"如果该组织在执行某个特定的过程区域时具备了一个特定级别的部分公共特征时,则这个组织在这个过程区域的能力成熟度未达到此级"},{"k":"B","t":"如果该组织某个过程区域( Process Area,PA)具备了定义标准过程”、“执行已定义的过程两个公共特征,则此过程区域的能力成熟度级别达到3 级充分定义级"},{"k":"C","t":"如果某个过程区域( ProcesPA)包含4 个基本实施( Base Parctices,BP)执行此PA 时执行了3 个BP,则此过程区域能力成熟度级别为0"},{"k":"D","t":"组织在不同的过程区域的能力成熟可能处于不同的级别上"}],"answer":"B","src":"精选300题","srcNum":209,"id":"q288","analyze":"SSE-CMM按公共特征达成情况判定能力级别：仅具备“定义标准过程”与“执行已定义的过程”两个公共特征不足以达到3级，3级充分定义级还须具备“协调安全实施”等特征，故B错误。A关于部分特征未达该级的判断正确，C缺少基本实施则级别为0正确，D各过程域级别可不同亦正确。","expand":"SSE-CMM六级：0未实施、1基本执行、2计划跟踪、3充分定义、4定量控制、5持续改进。级别以过程域为单位判定，须该过程域全部公共特征满足方可定级，呈木桶效应。易混：CMMI评组织整体成熟度，SSE-CMM评过程域能力级别，粒度不同。","tags":["安全工程与项目管理"]},{"stem":"数据流图（DFD）是用来表示系统的功能的工具表示系统的逻辑模型:描述了数据流在系统中流动的情况;它是种功能模型,是常用的进行软件需求分析的图形工具,其基本图形符号是","options":[{"k":"A","t":"输入、输出、外部实体和加工"},{"k":"B","t":"变换、加工、数据流和存储"},{"k":"C","t":"加工数据流、数据存储和外部实体"},{"k":"D","t":"变换、数据存储、加工和数据流"}],"answer":"C","src":"精选300题","srcNum":210,"id":"q289","analyze":"数据流图DFD由四种基本符号构成：加工（处理）、数据流（箭头）、数据存储（数据文件）与外部实体（源点或终点），故C正确。A混入输入输出概念，B与D含“变换”，而变换是结构图中变换型、事务型分析的术语，并非DFD基本图元。","expand":"DFD分层：顶层上下文图仅一个加工，向下分解为0层图与各级子图，须保持父子平衡，即输入输出一致。配套数据字典描述数据流与存储定义。易混：DFD描述数据如何流动，结构图SC描述模块调用关系，E-R图描述数据及其关系。","tags":["软件安全","安全工程与项目管理"]},{"stem":"把瀑布模型和专家系统结合在一起在开发的各个阶段上都利用相应的专家系统来帮助软件人员完成开发工作。","options":[{"k":"A","t":"原型模型"},{"k":"B","t":"螺旋模型"},{"k":"C","t":"基于知识的智能模型"},{"k":"D","t":"喷泉模型"}],"answer":"C","src":"精选300题","srcNum":211,"id":"q290","analyze":"题干强调把瀑布模型与专家系统结合,在各开发阶段调用相应专家系统辅助开发人员,这正是\"基于知识的智能模型\"的定义,它以知识库和推理机支撑各阶段的决策与实现。原型模型重在快速构建可运行原型以澄清需求;螺旋模型以风险分析驱动的迭代;喷泉模型面向对象、阶段重叠无缝。三者均不含专家系统要素,故排除。","expand":"软件过程模型记忆要点:瀑布——线性顺序、文档驱动;原型——需求不清时先做样品;螺旋——四象限、风险驱动、适合大型高风险项目;喷泉——面向对象、迭代无间隙;智能模型——知识库加专家系统。判断技巧:题干出现\"专家系统\"\"知识库\"\"推理\"即选智能模型,出现\"风险分析\"即螺旋。","tags":["安全工程与项目管理","软件安全"]},{"stem":"随着信息安全涉及的范围越来越广,各个组织对信息少全管理的需求来越迫切,越来越多的组织开始尝试使用参考So27001 分绍的SMS 来实施信息安全管理体系,提高组织的信息安全管理能力,关于ISMS,下面描述错误的是","options":[{"k":"A","t":"在组织中,应由信息技术责任部门(如信息中心)制定并颁布信息安全方针,为组织的ISMS 建设指明方向并提供总体物领,明确总体要求"},{"k":"B","t":"组织的管理层应确保SMS 目标和相应的计划得以制定,信息个理目标应明确、可度量,风险管理计划应具体,具备可行性"},{"k":"C","t":"组织的信息安全目标,信息安全方针相要求应传达到全组织范围内,应包括全体员工,同时,也应传达到客户。台作伙伴和供应商等外部各方"},{"k":"D","t":"组织的管理层应全面了解组织所面临的信息安全风险,决定风险可接受级别和风险可接受则,并确认接受相关残余风险"}],"answer":"A","src":"精选300题","srcNum":214,"id":"q291","analyze":"ISO/IEC 27001 要求信息安全方针由最高管理者制定并发布,体现管理层承诺与领导作用,而非由信息中心等信息责任部门制定。A 把制定颁布权下放给技术部门,违背\"领导作用\"条款。B 对应目标可度量;C 对应方针与要求传达到全体员工及外部相关方;D 对应管理层确认风险可接受准则与残余风险,均符合标准。","expand":"ISMS 领导作用要点:方针由最高管理者批准发布;管理者提供资源、任命角色;目标可测量并与方针一致;风险处置及残余风险须管理层批准。易混:信息安全方针是纲领性声明,不等于信息安全策略文件集。判断技巧:凡\"应由某技术部门制定方针\"类表述多为错误项。","tags":["信息安全管理体系","信息安全标准与法规"]},{"stem":"有关项目管理,错误的理解是","options":[{"k":"A","t":"项目管理是一门关于项目资金、时间、人力等资源控制的管理科学"},{"k":"B","t":"项目管理是运用系统的观点、方法、理论,对项目涉及的全部工作进行有效地管理,不受项自资源的约"},{"k":"C","t":"项目管理包括对项目范围、时间成本、质量人力资源、沟通、风险、采购、集成的管理"},{"k":"D","t":"项目管理是系统工程思想针对具体项目的实践应用"}],"answer":"B","src":"精选300题","srcNum":215,"id":"q292","analyze":"项目管理是在范围、时间、成本、质量等约束条件下,运用系统的观点、理论和方法对项目全部工作进行计划、组织、协调与控制,以达成项目目标。B 称\"不受项目资源约束\",与项目管理本质相反——项目之所以需要管理,正因资源有限。A 描述资源控制,C 列举九大知识领域,D 指出其是系统工程思想的实践应用,均正确。","expand":"PMBOK 九大知识领域:范围、时间、成本、质量、人力资源、沟通、风险、采购、干系人。项目三重约束为范围、时间、成本,质量居中平衡。易混:项目管理(管单个项目)≠项目集管理≠项目组合管理。判断技巧:选项出现\"不受约束\"\"资源无限\"等绝对化表述,基本可判为错误项。","tags":["安全工程与项目管理"]},{"stem":"开发软件所需高成本和产品的低质量之间有着尖锐的矛盾,这种现象称作","options":[{"k":"A","t":"软件工程"},{"k":"B","t":"软件周期"},{"k":"C","t":"软件危机"},{"k":"D","t":"软件产生"}],"answer":"C","src":"精选300题","srcNum":216,"id":"q293","analyze":"软件危机指软件开发成本高、进度难以控制、质量低劣、维护困难,与日益增长的需求形成尖锐矛盾,20 世纪60 年代被正式提出并直接催生软件工程。题干\"高成本与低质量之间的尖锐矛盾\"正是其标准定义。软件工程是化解危机的手段;软件周期指生命周期阶段的划分;软件产生不是术语,三项均不描述矛盾本身。","expand":"软件工程三要素:方法、工具、过程。软件生命周期:可行性研究、需求分析、设计、编码、测试、运行维护。易混:软件危机是问题现象,软件工程是解决途径。记忆:1968 年北约会议首次提出\"软件危机\"与\"软件工程\"两个概念。","tags":["软件安全","安全工程与项目管理"]},{"stem":"GB/T20984-2007《信息安全技术信息安全义批详选规范》、对10 个()进行了定义阐述其相关关系,规定了()的原理和()规定了风险评估实施的7 个阶段的具体方法和要求,规定了针对信息系统()5 个阶段风险评估的常见(),给出了风险评估的一般计算方法和相关工具建议。","options":[{"k":"A","t":"风险要素;风险评估;实施流程;生命周期;工作形式"},{"k":"B","t":"风险要素;实施流程;风险评估;生命周期:工作形式C"},{"k":"C","t":"风险要素;生命周期:风险评估;实施流程;工作形式D"},{"k":"D","t":"风险要素;工作形式;风险评估;实施流程:生命周期"}],"answer":"A","src":"精选300题","srcNum":217,"id":"q294","analyze":"GB/T 20984-2007 先对资产、威胁、脆弱性、安全措施、风险等风险要素作出定义并阐明关系,再规定风险评估原理,然后给出风险评估实施流程的7个阶段,并对信息系统生命周期5个阶段规定常见工作形式,最后给出计算方法与工具建议。A 的排列与标准结构完全一致,B、C、D 均打乱了后半段顺序。","expand":"该标准七阶段:准备、要素识别、分析与赋值、结果判定、处置建议、沟通与协商、监控与评审;生命周期五阶段:规划、设计、开发、运维、废弃。易混:GB/T 20984 管风险评估,GB/T 22239 管等级保护基本要求,GB/T 22080 管 ISMS。","tags":["风险评估","信息安全标准与法规"]},{"stem":"王工是某单位的系统管理员,他在某次参加了单位组织的风险管理工作时,根据任务安排,他使用了Nessus 工具来扫描和发现数据库服务器的漏洞,根据风险管理的相关理论,他这个扫描活动属于下面哪个阶段的工作","options":[{"k":"A","t":"风险分析"},{"k":"B","t":"风险要素识"},{"k":"C","t":"风险结果判定"},{"k":"D","t":"风险处理"}],"answer":"B","src":"精选300题","srcNum":218,"id":"q295","analyze":"Nessus 是典型漏洞扫描工具,它发现的是操作系统与数据库的脆弱性(漏洞),属于风险要素识别中的脆弱性识别环节。风险要素识别包括资产识别、威胁识别、脆弱性识别以及已有安全措施确认。风险分析是依据识别结果评估可能性与影响;风险结果判定形成风险等级;风险处理是处置措施,均非扫描阶段。","expand":"风险评估流程记忆:识别(资产→威胁→脆弱性→现有措施)→分析(可能性与影响)→判定(风险值与等级)→处置(降低、转移、规避、接受)。易混:漏洞扫描不等于渗透测试,前者只发现不做利用。判断技巧:凡\"扫描、调查、清点\"均归入要素识别。","tags":["风险评估"]},{"stem":"超文本传输协议(HypertextTransferProtocolHTTP)是互联网上广泛使用的一种网络协议,下面哪种协议基于HTTP 并结合SSL 协议,具备用户鉴别和通信数据加密等功能","options":[{"k":"A","t":"HTTP1.0 协议"},{"k":"B","t":"HTTP1.1 协议"},{"k":"C","t":"HTTPS 协议"},{"k":"D","t":"HTTPD 协议"}],"answer":"C","src":"精选300题","srcNum":219,"id":"q296","analyze":"HTTPS 是在 HTTP 与传输层之间插入 SSL/TLS 安全层,实现服务器(必要时含客户端)身份鉴别、数据加密传输和完整性校验,默认端口443。HTTP1.0 与1.1 均为明文协议,不具备鉴别与加密;HTTPD 是 Web 服务器守护进程名,不是协议。故只有 HTTPS 同时满足题干两项要求。","expand":"HTTPS 即 HTTP+SSL/TLS,提供机密性、完整性、身份鉴别,分别防窃听、防篡改、防冒充,默认443;HTTP 默认80。易混:SSL/TLS 可保护任意应用协议,HTTPS 只保护 HTTP 流量。判断技巧:题干出现\"结合 SSL、鉴别加加密\"即选 HTTPS。","tags":["网络安全","密码学"]},{"stem":"小李在检查公司对外服务网站的源代码时,发现程序在发生诸如没有找到资源、数据庐连接错误、写临时文件错误等问题时,会将详细的错误原因在结果页面上显示出来,从安全角度考虑,小李决定修改代码,将详细的错误原因都隐藏起来,在页面上仅仅告知用户“抱歉,发生内部错误请问这种处理方法的主要目的是","options":[{"k":"A","t":"避免缓冲区溢出"},{"k":"B","t":"安全处理系统异常"},{"k":"C","t":"安全使用临时文件"},{"k":"D","t":"最小化反馈信息"}],"answer":"D","src":"精选300题","srcNum":221,"id":"q297","analyze":"题干要求把资源未找到、数据库连接失败、写临时文件失败等详细错误原因隐藏,统一提示\"发生内部错误\",目的是避免攻击者从报错中获取路径、组件名、库版本等内部信息,即最小化反馈信息。缓冲区溢出靠边界检查与安全函数;安全使用临时文件指安全创建与清理;异常处理是实现过程,不是目的所在,故 B、C 均不贴切。","expand":"最小化反馈遵循\"需要知道\"原则:错误页只给通用提示与错误代号,详情写入内部日志;关闭调试模式与堆栈输出;统一404/500 页面。易混:安全处理系统异常是手段,最小化反馈信息是目标。判断技巧:题干出现\"隐藏详细信息、统一提示\"即选最小化反馈。","tags":["软件安全"]},{"stem":"/etc/ passwd 文件是UN/Linux 安全的关键文件之。该文件用于用户登录时校验用户的登录名、加密的口令数据项、用户ID(UID)、默认的用户分组ID(GID)、用户信息、用户登录目录以及登录后使用的shell i 程序。某黑客设法窃取了银行账户管理系统的passwd 文件后,发现每个用户的加密的口令数据项都显示为X。下列选项中,对此现象的解释正确的是","options":[{"k":"A","t":"黑客窃取的passwd 文件是假的"},{"k":"B","t":"用户的登录口令经过不可逆的加密算法加密结果为“X”"},{"k":"C","t":"加密口令被转移到了另一个文件里"},{"k":"D","t":"这些账户都被禁用了"}],"answer":"C","src":"精选300题","srcNum":222,"id":"q298","analyze":"/etc/passwd 中口令字段显示为 x,表示该账户口令并未存放于此文件,而是迁移到 /etc/shadow(仅 root 可读),这是常见的口令隐藏机制。A 文件为假、B 不可逆加密恰为\"X\"、D 账户被禁用均不符合实际;账户锁定通常在 shadow 口令前加 ! 或 *。","expand":"passwd 含用户名、UID、GID、家目录、登录 shell;shadow 含加密口令与修改时间,权限600。易混:* 或 ! 表示锁定或口令未设,NP 表示无需口令。判断技巧:口令字段为 x 一定是口令外置到 shadow,不是值为 X 的散列。","tags":["操作系统安全","身份鉴别"]},{"stem":"关于信息安全应急响应管理过程描述不正确的是","options":[{"k":"A","t":"基于应急响应工作的特点和事件的不规则性,事先制定出事件应急响应方法和过程,有助于一个组织在事件发生时阻止混乱的发生或是在混乱状态中迅速恢复控制,将损失和负面影响降至最低"},{"k":"B","t":"应急响应方法和过程并不是唯一的"},{"k":"C","t":"一种被广为接受的应急响应方法是将应急响应管理过程分为准备、检测、遏制、根除、恢复和跟踪总结6 个阶段"},{"k":"D","t":"一种校广为接受的应色的应方法是将应色响应管理过程分为准备检刻、遏制、根除、恢复和跟踪总结6 个阶段,这6 个阶段的响应方法一定能确保事件处理的成功"}],"answer":"D","src":"精选300题","srcNum":224,"id":"q299","analyze":"应急响应通常分为准备、检测、遏制、根除、恢复和跟踪总结6个阶段,A 说明事先制定方法可减少混乱、降低损失,B 说明方法并非唯一,C 表述与主流方法一致,均正确。D 错在\"一定能确保事件处理的成功\":该框架只是提高处置效率、控制损失的方法论,结果还受攻击者行为、发现时机和资源条件影响,不存在保证成功。","expand":"记忆 PDCERL:准备(Preparation)、检测(Detection)、遏制(Containment)、根除(Eradication)、恢复(Recovery)、总结(Learning)。易混:遏制是阻断扩散,根除是清除恶意代码与后门,恢复是回到生产状态。判断技巧:含\"必然、一定、保证\"的绝对化表述多为错误项。","tags":["应急响应","信息安全标准与法规"]},{"stem":"随着互联网+概念的普及,越来越多的新兴住宅小区引入了智能楼宇”的理念,某物业为提供高档次的服务,防止网络主线路出现故障,保证小区内网络服务的可用、稳定、高效,计划通过网络冗余配置确保”智能楼宇”系统的正常运转,下列选项中不属于冗余配置的是","options":[{"k":"A","t":"接入互联网时,同时采用不同电信运葦商线路,相互备份且互不影响"},{"k":"B","t":"核心层、汇聚层的设备和重要的接入层设备均应双机热备"},{"k":"C","t":"规划网络IP 地址,制定网络IP 地址分配策略"},{"k":"D","t":"保证网络带宽和网络设备的业务处理能力具备冗余空间,满足业务高峰期和业务发展需要"}],"answer":"C","src":"精选300题","srcNum":228,"id":"q300","analyze":"冗余配置是通过备用链路、设备和容量提升可用性。A 采用不同运营商线路互备,B 核心、汇聚及重要接入设备双机热备,D 带宽与设备处理能力预留冗余空间,均属冗余。C 仅规划 IP 地址并制定分配策略,属网络规划与地址管理,未增加任何备用资源,不能提升抗故障能力,故不属于冗余配置。","expand":"冗余层次:链路冗余、设备冗余、电源冗余、数据冗余、站点冗余。可用性 A=MTBF/(MTBF+MTTR),冗余可缩短恢复时间、提高并联可靠度。易混:冗余(备用资源)、容错(在线并行)、备份(离线副本)三者不同。判断技巧:未增加备用资源的\"规划类\"措施不是冗余。","tags":["网络安全","业务连续性与灾难恢复"]},{"stem":"根据我国信息安全等级保护的有关政策和标准,有些信息系统只需要自主定级、自主保护,按照要向公安机关备案即可,可以不需向上级或主管部门来测评和检査,此类信息系统应属于","options":[{"k":"A","t":"零级系统"},{"k":"B","t":"一级系统"},{"k":"C","t":"二级系统"},{"k":"D","t":"三级系统"}],"answer":"C","src":"精选300题","srcNum":229,"id":"q301","analyze":"按等级保护政策,一级系统由运营使用单位自主定级、自主保护,不需备案与测评;二级系统需自主定级、自主保护并到公安机关备案,一般不需上级主管部门测评检查;三级及以上须备案、测评并接受监督检查。题干\"自主定级、自主保护、备案即可、不需上级测评检查\"正对应二级系统。","expand":"等保五级:一级自主保护、二级指导保护、三级监督保护、四级强制保护、五级专控保护。二级以上须备案,三级以上须测评(现要求至少每年一次),关键信息基础设施从严。易混:备案自二级起,测评自三级起。","tags":["等级保护","信息安全标准与法规"]},{"stem":"20 世纪20 年代,德国发明家亚瑟・谢尔比鸟斯( Auntur scherbius)和理査德,里特( Richard Ritter 发明了ENIGMA 密码机,看密码学发展历史阶段划分,这个阶段属于","options":[{"k":"A","t":"古典密码阶段;这一阶段的密码专家常常靠直觉和技巧来设计密码,而不是推理和证明.常用的密码运算方法包括替代方法和置换方法。"},{"k":"B","t":"近代密码发展阶段。这一阶段开始使用机械代替手工计算,形成了机械式密码设备和更进一步的机电密码设备"},{"k":"C","t":"现代密码学的早起发展阶段。这一阶段以香农的论文“保密系统的通信理论”( the communication theory of secret systems)为理论基础,开始了对密码学的科学探索。"},{"k":"D","t":"现代密码学的近期发展阶段。这一阶段以公钥密码思想为标志,引发了密码学历史上的革命性的变革,同时,众多的密码算法开始应用于非机密单位和商业场合"}],"answer":"B","src":"精选300题","srcNum":231,"id":"q302","analyze":"密码学发展分为三阶段:古典密码靠手工替代与置换,依赖直觉与技巧;近代密码使用机械代替手工、进而机电设备,代表为转轮密码机;现代密码以香农1949 年论文\"保密系统的通信理论\"奠定理论基础,近期又以公钥思想为标志。Enigma 是20 世纪20 年代的机械式转轮密码机,故属近代密码发展阶段。","expand":"四阶段细分:古典(手工)、近代(机械与机电)、现代早期(信息论与对称分组)、现代近期(公钥密码与商用普及)。易混:Enigma 属近代而非古典,DES 属现代早期,RSA 属现代近期。记忆:机械即近代,数学理论即现代,公钥即近期。","tags":["密码学"]},{"stem":"某软件在设计时,有三种用户访问模式,分别是仅管理员可访问,所有合法用户可访问和允许匿名访问请问采用这三种访问模式时,攻击面最高的是","options":[{"k":"A","t":"仅管理员可访问"},{"k":"B","t":"所有合法用户可访问"},{"k":"C","t":"允许匿名访问"},{"k":"D","t":"三种方式都一样"}],"answer":"C","src":"精选300题","srcNum":232,"id":"q303","analyze":"攻击面随暴露对象与可达路径增加而扩大。仅管理员可访问入口最少、可达功能最少,攻击面最小;所有合法用户可访问须先通过认证,暴露面次之;允许匿名访问无需任何身份凭证,任何互联网用户都可触达其接口与功能,可达路径最多,攻击面最高。D 认为三者相同显然错误。","expand":"降低攻击面的手段:减少暴露接口与服务、默认关闭、收敛权限、强制认证、严格输入校验。易混:攻击面是可被触达的入口集合,攻击链是利用步骤,漏洞数是缺陷数量,三者不同。判断技巧:认证门槛越低、可达人群越广,攻击面越大。","tags":["软件安全","访问控制"]},{"stem":"国家科学技术秘密的密级分为绝密级、机密级、密级,以下娜块属于绝密级的描述?","options":[{"k":"A","t":"处于国际先进水平、并且有军事用途或者对经济建设具有重要影响的"},{"k":"B","t":"能够局部及应国家防制和治安实力的"},{"k":"C","t":"我国独有不要自己条件因素制约.能体现民族特色的精华,并且社会效益或者经济效益显著的传统工艺"},{"k":"D","t":"国际领先.并且对国防建设或者经济建设具有特别重大影响的"}],"answer":"D","src":"精选300题","srcNum":234,"id":"q304","analyze":"《科学技术保密规定》按影响程度划分三级。绝密级要求处于\"国际领先\"水平,并且对国防建设或经济建设具有\"特别重大影响\",D 完全符合。A 为国际先进水平、有军事用途或对经济建设有重要影响,属机密级;B 能局部反映国家防御和治安实力,属秘密级;C 为独有传统工艺且效益显著,亦属秘密级情形。","expand":"三密级判断口诀:绝密——国际领先加特别重大;机密——国际先进加重要影响;秘密——局部反映实力或传统工艺。易混:国家秘密三级为绝密、机密、秘密,密级越高管控越严,不得降格定密。判断技巧:抓住\"领先或先进\"\"特别重大或重要\"两组关键词。","tags":["信息安全标准与法规"]},{"stem":"根据《关于加强国家电子政务工程建设项目信息安全风险评估工作的通知》的规定,以下正确的是:","options":[{"k":"A","t":"涉密信息系统的风险评估应按照《信息安全等级保护管理办法》等国家有关保密规定和标准进行"},{"k":"B","t":"非涉密信息系统的风险评估应按照《非涉及国家秘密的信息系统分级保护管理办法》等有关要求进行"},{"k":"C","t":"可委托同一专业机构完成等级测评的风险评估工作,并形成等级测评报告和风险评估报告"},{"k":"D","t":"此通知不要求将“信息安全风险评估作为电子政务项目验收的重要内容"}],"answer":"C","src":"精选300题","srcNum":235,"id":"q305","analyze":"通知确立:涉密信息系统按保密规定和分级保护要求开展风险评估,非涉密系统按等级保护有关要求开展,故 A、B 均张冠李戴;通知明确风险评估是电子政务项目验收的重要内容,D 反述为不要求,错误。C 允许同一专业机构承担等级测评与风险评估并分别形成报告,符合通知精神,故为正确项。","expand":"涉密系统依据 BMB17《涉及国家秘密的信息系统分级保护技术要求》;非涉密系统依据 GB/T 22239 与 GB/T 20984。易混:等级保护管非涉密系统,分级保护管涉密系统。判断技巧:看到\"涉密加等级保护\"或\"非涉密加分级保护\"的搭配必错。","tags":["信息安全标准与法规","风险评估"]},{"stem":"随着金融电子化的发展,全球金融通信网络已出具规模。某金融单位组建的计算机通信网络覆盖全国,有力的促进了该企业各种金融业务的发展。然而网络技术的普及、网络规模规模的延伸,开始逐步让该企业对网络安全提出了更高的要求。为了进一步促进金融电子化的建设,保障金融网络安全运行,该企业经过前期充分的调研分析与论证,实施了防火墙NPN 系统建设项目。防火墙不能实现的安全功能是","options":[{"k":"A","t":"对出入网络的访问行为进行管理和控制"},{"k":"B","t":"过滤出入网络的数据,强化安全策略"},{"k":"C","t":"隐藏内部网络细节"},{"k":"D","t":"评估系统关键资源和数据完整性,识别已知的攻击行为"}],"answer":"D","src":"精选300题","srcNum":236,"id":"q306","analyze":"防火墙工作在网络边界,可实现出入访问行为的管理与控制、数据包过滤以强化安全策略、通过地址转换与代理隐藏内部网络细节。D 所述\"评估关键资源和数据完整性、识别已知攻击行为\"属于入侵检测、主机监控与完整性校验的能力,防火墙不具备内容级特征匹配和完整性评估功能,故为不能实现项。","expand":"防火墙类型:包过滤、状态检测、应用代理、下一代防火墙。易混:防火墙管边界访问控制,IDS/IPS 管入侵检测与阻断,WAF 管 Web 应用攻击,HIDS 管主机行为。判断技巧:涉及\"识别攻击特征、深度检测、完整性校验\"多归 IDS 而非防火墙。","tags":["网络安全"]},{"stem":"GBT18336 的最低级别是","options":[{"k":"A","t":"ELA1"},{"k":"B","t":"ELA3"},{"k":"C","t":"ELA5"},{"k":"D","t":"ELA7"}],"answer":"A","src":"精选300题","srcNum":238,"id":"q307","analyze":"GB/T 18336 等同采用 ISO/IEC 15408(CC 准则),将评估保证级分为 EAL1 至 EAL7 共7个递增等级,EAL1 为功能测试级,是最低级别。EAL3 为方法测试与检查级,EAL5 为半形式化设计与测试级,EAL7 为形式化验证的最高级。故最低级别只能是 EAL1。","expand":"七级要点:EAL1 功能测试;EAL2 结构测试;EAL3 方法测试与检查;EAL4 系统设计测试与评审(商用常见最高);EAL5 半形式化;EAL6 半形式化验证;EAL7 形式化验证。易混:EAL 是保证级而非功能级,级别越高评估成本越高。","tags":["信息安全标准与法规","安全工程与项目管理"]},{"stem":"鉴别是用户进入系统的第一道安全防线。用户登录系统时,和密码就是对用户身份进行鉴别。鉴别通过,即可以实现两的连接。例如,一个用户被服务器鉴别通过后,则被服务器用户,オ可以进行后续访问。鉴别是对信息的一项安全属性该属性属于下列选项中的","options":[{"k":"A","t":"保密性"},{"k":"B","t":"可用性"},{"k":"C","t":"真实性"},{"k":"D","t":"完整性"}],"answer":"C","src":"精选300题","srcNum":240,"id":"q308","analyze":"鉴别用于确认用户所声称的身份是否真实可信,对应信息安全属性中的真实性。保密性针对信息不被未授权泄露;完整性针对不被未授权篡改;可用性针对授权者可按需正常使用。鉴别虽是访问控制的前提,但并不归属于上述三项属性,故 C 正确。","expand":"CIA 三性之外常补充真实性与不可否认性。鉴别手段:口令、令牌、生物特征、数字证书;鉴别方式:单向、双向、第三方。易混:鉴别解决\"你是谁\",授权解决\"你能做什么\",审计解决\"你做过什么\"。","tags":["身份鉴别"]},{"stem":"某银行网上交易系统开发项目在设计阶段分析系统运行过程中可能存在的攻击,请问以下哪一项工作不能降低该系统的受攻击面","options":[{"k":"A","t":"分析系统功能的重要性"},{"k":"B","t":"分析从哪里可以访问这些功能"},{"k":"C","t":"采取合理措施降低特权"},{"k":"D","t":"分析系统应满足的性能要求"}],"answer":"D","src":"精选300题","srcNum":241,"id":"q309","analyze":"降低攻击面即减少可被触达的功能与入口并压缩权限。A 分析功能重要性可裁剪非必要功能;B 分析可达路径可关闭多余暴露;C 降低特权可缩小被利用后的影响,三者都能减小攻击面。D 分析系统性能要求属非功能需求设计,与暴露面、权限无关,不能降低受攻击面。","expand":"攻击面三要素:入口点(接口、端口、协议)、可信边界、特权等级;收敛手段:最小功能、最小服务、最小权限、输入验证、默认安全。易混:性能与可用性设计不等于安全设计。判断技巧:与\"减少暴露、减少权限\"无关的分析工作不能降低攻击面。","tags":["软件安全","访问控制"]},{"stem":"小李和小刘需要为公司新建的信息管理系统设计访问控制方法,他们在讨论中针对采用自主访问控制还是强制访问控制产生了分歧小李认为应该采用自主访问控制的方法,他的观点主要有:(1)自主访问控制可为用户提供灵活、可调整的安全策略,具有较好的易用性和可扩展性;(2)自主访问控制可以抵御木马程序的攻击。小刘认为应该采用强制访问控制的方法,他的观点主要有:(3)强制访问控制中,用户不能通过运行程序来改变他自己及任何客体的安全属性,因为安全性较高;(4)强制访问控制能够保护敏感信息。请问以上四种观点中,正确的是","options":[{"k":"A","t":"观点(1)"},{"k":"B","t":"观点(2)"},{"k":"C","t":"观点(3)"},{"k":"D","t":"观点(4)"}],"answer":"A","src":"精选300题","srcNum":242,"id":"q310","analyze":"观点(1)正确:自主访问控制由客体属主自主授权,策略灵活、易用、易扩展。观点(2)错:DAC 权限可被转授,木马以用户身份运行即可滥用其权限,无法抵御。观点(3)错在因果倒置,MAC 的安全性来自系统强制执行标记策略,且仍存在隐蔽通道。观点(4)片面,MAC 以敏感标记主要保障保密性,并非笼统\"保护敏感信息\"。","expand":"DAC 特点:属主自主授权、灵活但难控、易受木马攻击;MAC 特点:系统统一标记、用户不可逾越、安全性高但管理复杂;BLP 模型是实现 MAC 的经典模型,侧重机密性。易混:访问控制矩阵与 ACL 对应 DAC,安全标签对应 MAC。","tags":["访问控制"]},{"stem":"在国家标准《信息系统安全保障评估框架第部分:简介和一般模型》(GBT202741-2006)中描述了信息系统安全保障模型,下面对这个模型理解错误的是","options":[{"k":"A","t":"该模型强调保护信息系统所创建、传输、存储和处理信息的保密性、完整性和可用性等安全特征不被破坏,从而达到实现组织机构使命的目的"},{"k":"B","t":"该模型是一个强调持续发的动态安全模型即信息系统安全保障应该贯穿于整个信息系统生命周期的全过程"},{"k":"C","t":"该模型强调综合保障的观念,即信息系统的安全保障是通过综合技术、管理、工程和人员的安全保障来实施和实现信息系统的安全保障目标"},{"k":"D","t":"模型将风险和策略作为信息系统安全保障的基础和核心,基干IATF 模型改进,在其基础上增加了人员要素,强调信息安全的自主性"}],"answer":"D","src":"精选300题","srcNum":243,"id":"q311","analyze":"GB/T 20274 的信息系统安全保障模型以使命为起点,强调信息的保密性、完整性和可用性等安全特征不被破坏;强调贯穿信息系统全生命周期的持续动态保障;强调技术、管理、工程和人员四方面综合保障,并以风险和策略为基础。A、B、C 均与标准表述一致。D 称该模型\"强调信息安全的自主性\",标准并无此提法,表述错误。","expand":"GB/T 20274 系列含一般模型、管理保障、技术保障、工程保障、人员保障。易混:GB/T 20274 是保障评估框架,GB/T 18336 是 CC 评估准则,GB/T 20984 是风险评估规范。记忆:使命→信息→信息系统→安全特征→综合保障。","tags":["信息安全标准与法规","信息安全管理体系"]},{"stem":"TCP/IP 协X nternetilr=议是einternet 构成的基础, TCP/IP 通常被认为是一个N 层协议,每层都使用它的下一层所提供的网络服务来完成自己的功能,这里N 应等于","options":[{"k":"A","t":"4"},{"k":"B","t":"5"},{"k":"C","t":"6"},{"k":"D","t":"7"}],"answer":"A","src":"精选300题","srcNum":245,"id":"q312","analyze":"TCP/IP 通常划分为4层:网络接口层、网际层、传输层、应用层,每层使用下一层提供的服务完成自身功能,故 N=4。OSI 参考模型为7层;5层是教材折中模型,即物理、数据链路、网络、传输、应用;TCP/IP 并无6层划分。因此 B、C、D 均不符合。","expand":"OSI 七层:物理、数据链路、网络、传输、会话、表示、应用。TCP/IP 四层对应关系:网络接口层含物理与链路,应用层含会话、表示与应用。易混:OSI 是理论参考模型,TCP/IP 是实际协议族。记忆口诀:物联网传应。","tags":["网络安全"]},{"stem":"在工程实施阶段,以下哪一项不属于监理机构的监理重点:","options":[{"k":"A","t":"督促承建单位严格按照经审批的实施方案进行施工"},{"k":"B","t":"审查承建单位施工人员的身份与资格"},{"k":"C","t":"部署工程实施人员安全管理措施"},{"k":"D","t":"督促承建单位严格遵守业主单位相关安全管理规"}],"answer":"C","src":"精选300题","srcNum":247,"id":"q313","analyze":"监理在实施阶段的重点是质量控制、进度控制、投资控制与合同管理、信息管理及协调,具体包括督促承建单位按经审批的实施方案施工、审查施工人员身份与资格、督促遵守业主单位安全管理规定。C\"部署工程实施人员安全管理措施\"属承建单位自身的安全管理职责,监理只督促检查,不直接部署,故不属于监理重点。","expand":"监理依据:承建合同、安全设计方案、实施方案、实施记录及国家或地方标准;手段:旁站、巡视、平行检验、抽查。易混:监理是第三方监督,承建单位负责实施,业主负责建设管理。判断技巧:凡\"直接部署、直接实施\"的动作多属承建方职责。","tags":["安全工程与项目管理"]},{"stem":"微软提出了striderrepudiation(抵赖)的缩写R,关于此项安全要求,下面说法错误的是","options":[{"k":"A","t":"某用户在登录系统并下载数据后,却声称“我没有下载过数据”,软件系统中的这种威胁属于R 成胁"},{"k":"B","t":"某用户在网络通信中传输完数据后,却声称“这些数据不是我传输的“,软件系统中的这种威胁属于R 威胁"},{"k":"C","t":"对于R 成胁,可以选择使用如强认证、数字签名,安全审计等技术措施来解决"},{"k":"D","t":"对于R 威胁,可以选择使用如隐私保护、过滤、流量控制等技术措施来解决"}],"answer":"D","src":"精选300题","srcNum":248,"id":"q314","analyze":"STRIDE 中的 R 指 Repudiation,即抵赖或否认,指用户否认自己执行过的操作。A 否认下载数据、B 否认传输数据均为典型抵赖场景;C 采用强认证、数字签名与安全审计可形成不可否认证据,正确。D 所列隐私保护、过滤、流量控制对应信息泄露与拒绝服务防护,不能解决抵赖,故错误。","expand":"STRIDE 六类威胁:假冒、篡改、抵赖、信息泄露、拒绝服务、权限提升。对应防护:认证、完整性校验、数字签名与审计、加密、限流与冗余、最小权限。易混:抵赖要靠\"留证据\",信息泄露才靠\"少暴露\"。","tags":["软件安全","安全工程与项目管理"]},{"stem":"Ipsec( IP Security)协议标准的设计目标是在IPv4 和Pv6 环境中为网络层流量提供灵活、透明的安全服务,保护TCP/IP 通信免遭窃听和改,保证数据的完整性和机密性下面选项中哪项描述是错误的","options":[{"k":"A","t":"Ipsec 协议不支持使用数字证书"},{"k":"B","t":"I Psec 协议对于IPv4 和Pv6 网络都是适用的"},{"k":"C","t":"II Psec 有两种工作模式:传输模式和隧道模式"},{"k":"D","t":"Ipsec 协议包括封装安全载荷(ESP)和鉴别头(AH)两种通信保护机制"}],"answer":"A","src":"精选300题","srcNum":250,"id":"q315","analyze":"IPSec 是一组协议套件,包含 AH、ESP、IKE 与密钥管理,可通过 IKE 使用数字证书或预共享密钥完成身份认证与安全协商,故 A\"不支持数字证书\"错误。B 正确,IPSec 同时适用于 IPv4 与 IPv6;C 正确,分传输模式与隧道模式;D 正确,ESP 提供加密与完整性,AH 提供鉴别与完整性。","expand":"AH 只鉴别不加密,提供数据源鉴别与完整性,协议号51;ESP 可加密,提供机密性与完整性,协议号50。传输模式保护上层载荷,隧道模式保护整个 IP 包,用于构建 VPN。易混:IPSec 是网络层协议族,SSL/TLS 位于传输层之上。","tags":["网络安全","密码学"]},{"stem":"某电子商务网站架构设计时,为了避免数据误操作,在管理员进行订单删除时,需要由审核员进行审核后该操作才能生效,这种设计是遵循了以下哪个原则:","options":[{"k":"A","t":"权限分离原则"},{"k":"B","t":"最小特权原则"},{"k":"C","t":"保护最薄弱环节的原则"},{"k":"D","t":"纵深防御的原则"}],"answer":"A","src":"精选300题","srcNum":251,"id":"q316","analyze":"题干把\"删除订单\"与\"审核放行\"分别交给管理员和审核员,任何一方都不能单独完成该敏感操作,属于权限分离(职责分离)原则。最小特权是只授予完成工作所必需的最小权限;保护最薄弱环节强调补齐短板;纵深防御强调多层防护。三者均不描述双人复核机制,故 A 正确。","expand":"权限分离典型场景:双人复核、操作与审核分离、开发与运维分离、密钥分割保管。易混:最小特权管\"权限多少\",权限分离管\"权力分布\",二者常配合使用。判断技巧:出现\"需另一人审核或批准才能生效\"即权限分离。","tags":["访问控制"]},{"stem":"安全漏洞产生的原因不包括以下哪一点","options":[{"k":"A","t":"软件系统代码的复杂性"},{"k":"B","t":"软件系统市场出现的信息不对称现象"},{"k":"C","t":"复杂异构的网络环境"},{"k":"D","t":"攻击者的恶意利用"}],"answer":"D","src":"精选300题","srcNum":252,"id":"q317","analyze":"安全漏洞源于系统自身的设计与实现缺陷及复杂环境:代码规模与复杂度高易出错,厂商与用户之间存在信息不对称使缺陷长期未被发现,复杂异构网络增大交互风险。攻击者的恶意利用是漏洞被触发的外因,不是漏洞产生的原因。A、B、C 均为公认成因,故 D 不属于。","expand":"漏洞成因分类:设计缺陷、实现缺陷、配置错误、管理缺失、供应链引入。易混:漏洞是内生脆弱性,威胁是外部攻击者,风险是可能性与影响组合。判断技巧:题目问\"产生原因\",凡描述攻击者行为的选项属外部因素而非成因。","tags":["软件安全","风险评估"]},{"stem":"某攻击者想通过远程控制软件潜伏在某监控方的Unix 系统的计算机中,如果攻击者打算长时间地远程监控某服务器上的存储的敏感数据,必须要能够清除在监控方计算机中存在的系统日志。否则当监控方査看己的系统日志的时候,就会发现被监控以及访问的痕迹。不属于清除痕迹的方法是","options":[{"k":"A","t":"窃取root 权限修改wtmp/ wtmpxutmpx 和Q1 astro 三个主要日志文件"},{"k":"B","t":"采用干扰手段影响系统防火墙的审计功能"},{"k":"C","t":"保留攻击时产生的临时文件"},{"k":"D","t":"修改登录日志,伪造成功的登录日志,增加审计难度"}],"answer":"C","src":"精选300题","srcNum":255,"id":"q318","analyze":"攻击者要长期潜伏必须清除痕迹:篡改或删除 wtmp、wtmpx、utmp、lastlog 等登录日志,把入侵登录伪装成正常登录;或干扰审计与防火墙日志功能,降低被发现概率。C\"保留攻击时产生的临时文件\"会遗留工具、脚本和时间戳等证据,反而暴露入侵痕迹,不属于清除痕迹的方法。","expand":"Unix 主要日志:wtmp 记录登录历史,utmp 记录当前登录,lastlog 记录各用户最后登录,btmp 记录失败登录,messages 记录系统日志。易混:清痕是删除或篡改证据,反取证是隐藏痕迹属性。判断技巧:凡增加或保留痕迹的行为都不是清痕。","tags":["安全事件与取证","操作系统安全"]},{"stem":"某公司拟建设面向内部员工的办公自动化系统和面向外部客户的营销系统通过公开招标选择M 公司为承建单位并选择了H 监理公司承担该项目的全程监理工作,目前各个应用系统均已完成开发M 公司已经提交了验收申请监理公司需要对A 公司提交的软件配置文件进行审査在以下所提交的文档中哪一项属于开发类文档","options":[{"k":"A","t":"项目计划"},{"k":"B","t":"质量控制计划"},{"k":"C","t":"评审报告"},{"k":"D","t":"需求说明书"}],"answer":"D","src":"精选300题","srcNum":256,"id":"q319","analyze":"软件文档中,开发文档描述开发过程本身,包括可行性研究报告、需求说明书、概要设计与详细设计说明、测试计划及测试分析报告等。项目计划、质量控制计划属管理文档;评审报告属评审与管理记录。故需求说明书属开发类文档。","expand":"文档三类:开发文档(需求、设计、测试)、管理文档(计划、合同、进度、质量记录)、产品文档(用户手册、维护手册、开发手册)。易混:测试计划属开发文档,质量控制计划属管理文档。判断技巧:直接描述\"做什么、怎么做\"的技术文档为开发类。","tags":["安全工程与项目管理"]},{"stem":"在某信息系统的设计中,用户登录过程是这样的(1)用户通过HTP 协议访问信息系统;(2)用户在登录页面输入用户名和口令;(3)信息系统在服务器端检査用户名和密码的正确性,如果正确,则鉴别完成。可以看出,这个鉴别过程属于","options":[{"k":"A","t":"单向鉴别"},{"k":"B","t":"双向鉴别"},{"k":"C","t":"三向鉴别"},{"k":"D","t":"第三方鉴别"}],"answer":"A","src":"精选300题","srcNum":258,"id":"q320","analyze":"流程中只有服务器校验用户名和口令,即一方(服务器)验证另一方(用户)的身份,用户并未验证服务器是否为真,属单向鉴别。双向鉴别要求双方互验,如双向证书或挑战响应;三向鉴别在此基础上增加第三方或时间戳确认;第三方鉴别由 KDC、CA 等可信第三方完成。","expand":"鉴别类型:单向(服务器验用户)、双向(互验,可防冒充服务器)、第三方(经 KDC 或 CA)。典型协议:口令认证、挑战响应、Kerberos、TLS 双向认证。易混:单向鉴别并非不安全,但难以抵御钓鱼与中间人冒充服务端。","tags":["身份鉴别"]},{"stem":"某银行网上交易系统开发项目在设计阶段分析系统运行过程中可能存在的攻击,请问以下拟采取的安全措施中,哪一项不能降低该系统的受攻击面:","options":[{"k":"A","t":"远程用户访问需进行身份管"},{"k":"B","t":"远程用户访问时具有管理员权限"},{"k":"C","t":"关闭服务器端不必要的系统服务"},{"k":"D","t":"当用户访问其账户信息时使用严格的身份认证机制"}],"answer":"B","src":"精选300题","srcNum":259,"id":"q321","analyze":"降低攻击面应减少暴露入口并收敛权限。A 远程访问须先通过身份鉴别、C 关闭服务器端不必要的系统服务、D 访问账户信息采用严格认证,均减少可触达面。B 让远程用户拥有管理员权限,直接放大权限面与被利用后的破坏范围,反而扩大攻击面,故不能降低攻击面。","expand":"最小权限要求按角色授予必需权限;远程访问应遵循最小化、强认证、可审计、可随时回收。易混:攻击面指暴露的入口,权限面指可达能力,两者都要收敛。判断技巧:含\"给远程用户管理员权限\"的选项必为扩大攻击面。","tags":["软件安全","访问控制"]},{"stem":"某银行有5 台交换机连接了大量交易机构的网络,在基于以太网的通信中,计算机A 需要与计算机B通信,A 必须先广播ARP 请求信息“,获取计算机B 的物理地址。每到月底时用户发现该银行网络服务速度极其缓慢。银行经调査发现为了当其中一台交换机收到ARP 请求后,会转发给接收端口以外的其他端口,ARP 请求会被转发到网络中的所有客户机上。为降低网络的带宽消耗,将广播流限制在固定区域内,可以采用的技术是","options":[{"k":"A","t":"VLAN 划分"},{"k":"B","t":"动态分配地址"},{"k":"C","t":"为路由交换设备修改默认口令"},{"k":"D","t":"设立入侵防御系统"}],"answer":"A","src":"精选300题","srcNum":260,"id":"q322","analyze":"ARP 请求在二层广播,交换机收到后向除接收端口外的所有端口转发,广播域越大泛洪越多,带宽被大量消耗。划分 VLAN 可把广播域限制在固定逻辑区域内,显著减少跨区广播流量,故 A 正确。动态分配地址解决地址管理,修改默认口令属设备加固,IPS 用于检测攻击,均不能抑制二层广播扩散。","expand":"抑制广播手段:VLAN 划分、端口隔离、广播风暴抑制、以组播替代广播。易混:冲突域由交换机端口隔离,广播域由 VLAN 隔离。ARP 欺骗防护可用静态 ARP 绑定、ARP 检测与 VLAN 隔离。记忆:限制广播域即 VLAN。","tags":["网络安全"]},{"stem":"以下哪一项不是我国信息安全保障工作的主要目标","options":[{"k":"A","t":"保障和促进信息化发展"},{"k":"B","t":"维护企业和公民的合法权益"},{"k":"C","t":"构建高效的信息传播渠道"},{"k":"D","t":"保护互联网知识产权"}],"answer":"C","src":"精选300题","srcNum":261,"id":"q323","analyze":"我国信息安全保障工作的主要目标包括保障和促进信息化发展,维护国家安全与社会稳定,维护企业和公民的合法权益(其中含知识产权保护)。A、B 直接对应目标,与 D 的权益保护方向一致。C\"构建高效的信息传播渠道\"属信息传播能力与内容产业建设目标,不是信息安全保障工作的目标。","expand":"记忆国家信息化领导小组文件核心:保障和促进信息化发展,维护国家利益,维护企业和公民合法权益。原则侧重\"怎么干\":立足国情以我为主、技术与管理并重、正确处理安全与发展关系、统筹规划突出重点。易混:目标是结果,原则是方法。","tags":["信息安全标准与法规"]},{"stem":"某公司中标了某项软件开发项目后,在公司内部研讨项目任务时,项目组认为之前在VPN 技术方面积累不够,导致在该项目中难以及时完成VPN 功能模块,为解决该问题,公司高层决定接受该项目任务,同时将该VPN 功能模块以合同形式委托另外一家安全公司完成,要求其在指定时间内按照任务需求书完成工作,否则承担相应责任。在该案例中公司高层采用哪种风险处理方式","options":[{"k":"A","t":"风险降低"},{"k":"B","t":"风险规避"},{"k":"C","t":"凤险转移"},{"k":"D","t":"风险接受"}],"answer":"C","src":"精选300题","srcNum":262,"id":"q324","analyze":"公司把自身能力不足的 VPN 模块以合同方式委托外部安全公司完成,并约定按期交付、违约担责,是把该部分技术风险及其后果通过合同转由第三方承担,属风险转移,典型形式还有外包、保险。风险降低是采取措施减少可能性或影响;风险规避是放弃或改变活动;风险接受是承担残余风险。","expand":"风险处置四方式:降低(缓解)、转移(分担)、规避(放弃)、接受(承担)。易混:转移只分担后果,风险本身不消失,组织仍负最终责任。判断技巧:出现\"合同、外包、保险、第三方承担\"即风险转移。","tags":["风险评估","安全工程与项目管理"]},{"stem":"在工程实施阶段,监理机构依据承建合同、安全设计方案、实施方案、实施记录、国家或地方相关标准和技术指导文件,对信息化工程进行安全检査,以验证项目是否实现了项目设计目标和安全等级要求","options":[{"k":"A","t":"功能性"},{"k":"B","t":"可用性"},{"k":"C","t":"保障性"},{"k":"D","t":"符合性"}],"answer":"D","src":"精选300题","srcNum":263,"id":"q325","analyze":"监理依据承建合同、安全设计方案、实施方案、实施记录及国家或地方标准,核查项目是否实现设计目标并达到相应安全等级要求,本质是核对实际建设情况与规定要求是否一致,属符合性检查。功能性关注功能是否实现,可用性关注能否稳定运行,保障性关注支撑能力,均与题干\"验证是否满足要求\"不同。","expand":"等级保护测评即典型的符合性评价:依据 GB/T 22239 逐项核查,结论分为符合、部分符合、不符合。易混:功能性问\"能不能做\",性能问\"做得好不好\",符合性问\"是否按要求做\"。判断技巧:题干出现\"依据标准核查是否满足\"即符合性。","tags":["安全工程与项目管理","等级保护"]},{"stem":"作为信息安全从业人员,以下那种行为违反了CISP 职业道德准则","options":[{"k":"A","t":"抵制通过网络系统侵犯公众合法权益"},{"k":"B","t":"通过公众网络传播非法软件"},{"k":"C","t":"不在计算机网络系统中进行造谣、欺诈、诽谤等活动"},{"k":"D","t":"帮助和指导信息安全同行提开信息安全保障知识和能力"}],"answer":"B","src":"精选300题","srcNum":265,"id":"q326","analyze":"CISP 职业道德要求从业人员遵纪守法、维护公众合法权益、不利用技术从事违法活动、帮助同行提升能力。A 抵制侵权、C 不造谣欺诈诽谤、D 帮助同行提升,均属正面要求。B 通过公众网络传播非法软件,直接违反法律法规与职业操守,是违反准则的行为。","expand":"CISP 道德准则要点:守法、诚信、保密、客观公正、持续学习、维护行业声誉、不得危害公众利益。易混:职业道德是行业自律,法律责任是强制约束,但违反道德常同时构成违法。判断技巧:凡描述\"传播非法软件、未授权测试、泄露客户数据\"即违规。","tags":["信息安全标准与法规"]},{"stem":"小李在学习信息安全管理体系( nformation Socurity Management System,lSMS)的有关知识后,按照自己的理解画了一张图来描述安全管理过程,但是他还存在一个空白处未填写,请帮他选择一个最合适的选项","options":[{"k":"A","t":"监控和反馈ISMS"},{"k":"B","t":"实施和运行ISMS"},{"k":"C","t":"执行和检查ISMS"},{"k":"D","t":"沟通和咨询ISMS"}],"answer":"B","src":"精选300题","srcNum":266,"id":"q327","analyze":"ISO/IEC 27001 按 PDCA 把 ISMS 过程分为:建立 ISMS(规划)、实施和运行 ISMS(执行)、监视和评审 ISMS(检查)、保持和改进 ISMS(处置)。图中空白处承接\"建立\"之后,应为\"实施和运行 ISMS\"。其余选项或为\"监视和评审\"的改写,或根本不是标准阶段名称。","expand":"PDCA 对应:Plan 建立 ISMS,Do 实施和运行,Check 监视和评审,Act 保持和改进。易混:标准表述是\"保持和改进\",不是\"保持和审核\";内部审核属监视和评审中的活动。判断技巧:四个标准阶段名须原样记忆。","tags":["信息安全管理体系"]},{"stem":"规范的实施流程和文档管理,是信息安全风险评估性能否取得成果的重要基础。某单位在实施风险评估时,形成了《风险评估方案》并得到了管理决策层的认可。在风险评估实施的各个阶段中,该《风险评估方案》应是如下()中的输出结果。","options":[{"k":"A","t":"风险评估准备阶段"},{"k":"B","t":"风险要素识别阶段"},{"k":"C","t":"风险分析阶段"},{"k":"D","t":"风险结果判定阶段"}],"answer":"A","src":"精选300题","srcNum":267,"id":"q328","analyze":"风险评估准备阶段的工作包括确定评估目标、范围与依据,组建评估团队,取得管理层支持与授权,并输出《风险评估方案》《评估工作计划》等文件,经管理决策层批准后实施。风险要素识别、风险分析和结果判定均发生在其后,不可能产出该方案,故该方案是准备阶段的输出。","expand":"GB/T 20984 七阶段:准备→要素识别→风险分析→结果判定→处置建议→沟通协商→监控评审。各阶段输出:方案与计划、资产威胁脆弱性清单、风险值、风险等级、处置建议、沟通记录。易混:方案在准备阶段,评估报告在收尾阶段。","tags":["风险评估"]},{"stem":"若一个组织声称自己的ISMS 符合ISO/EC27001 或GB/T22080 标准要求,其信息安全控制措施通常要在物理和环境安全方面实施规划控制,物理和环境安全领域包括安全区域和设备安全两个控制目标。安全区域的控制目标是防止对组织场所和信息的未授权物理访问、损坏和干扰,关键或敏感的信息以及信息处理设施应放在安全区域内,并受到相应保护,该目标可以通过以下控制措施实现,下列不包括哪一项","options":[{"k":"A","t":"物理安全边界、物理入口控制"},{"k":"B","t":"办公室、房间和设施的安全保护,外部和环境威胁的安全防护"},{"k":"C","t":"在安全区域工作,公共访问、交接区安全"},{"k":"D","t":"人力资源安全"}],"answer":"D","src":"精选300题","srcNum":268,"id":"q329","analyze":"ISO/IEC 27001 附录A 物理和环境安全含安全区域与设备安全两个控制目标。安全区域的措施包括物理安全边界、物理入口控制、办公室与房间设施保护、外部和环境威胁防护、在安全区域工作、公共访问与交接区安全,即 A、B、C。D 人力资源安全属\"人员安全\"控制域,不在物理和环境安全范围内。","expand":"附录A 控制域:安全方针、组织安全、人力资源安全、资产管理、访问控制、密码、物理与环境安全、运行安全、通信安全、系统获取开发与维护、供应商关系、事件管理、业务连续、合规性。易混:交接区安全属物理安全,人员审查属人力资源安全。","tags":["物理与环境安全","信息安全管理体系"]},{"stem":"IPV4 协议在设计之初并没有过多地考虑安全问题,为了能够使网络方便地进行互联、互通,仅仅依靠IP 头部的校验和字段来保证IP 包的安全,因此P 包很容易被簊改,并重新计算校验和, I=TR-于1994 年开始制定Psec 协议标准,其设计目标是在IPV4 和PV6 环境中为网络层流量提供灵话、透明的安全服务,保护TTCP/P 通信免遭窃听和纂改,保证数据的完整性和机密性,有效抵御网络攻击,同时保持易用性,下列选项中说法错误的是","options":[{"k":"A","t":"对于IPv4, Ipsec 是可选的,对于IPv6,ISec 是强制实施的"},{"k":"B","t":"Ipsec 协议提供对IP 及其上层协议的保护"},{"k":"C","t":"Ipsec 是一个单独的协议。"},{"k":"D","t":"ISec 安全协议给出了封装安全载荷和鉴别头两种通信保护机制"}],"answer":"C","src":"精选300题","srcNum":269,"id":"q330","analyze":"IPSec 不是单一协议,而是由 AH、ESP、IKE、密钥管理及解释域等构成的一组协议套件,故 C\"是一个单独的协议\"错误。A 正确:IPv4 中 IPSec 为可选,IPv6 中强制实施;B 正确:IPSec 保护 IP 及其上层协议;D 正确:提供封装安全载荷 ESP 与鉴别头 AH 两种通信保护机制。","expand":"IPSec 体系:封装安全载荷 ESP、鉴别头 AH、互联网密钥交换 IKE(ISAKMP 与 Oakley)、加密算法及 DOI。易混:IPSec 是协议族与框架,不是单个协议;SSL/TLS 工作在传输层之上,IPSec 工作在网络层。","tags":["网络安全","密码学"]},{"stem":"在信息系统中,访向控制是重要的安全功能之一。它的任务是在用户对系统资源提供最大限度共享的基础上,对用户的访何权限进行管理,防止对信息的非授权篡改和滥用。访问控制模型将实体划分为主体和客体两类,通过对主体身份的识别来限制其对客体的访问权限。下列选项中,对主体、客体和访问权服的描述中错误的是","options":[{"k":"A","t":"对文件进行操作的用户是一种主体"},{"k":"B","t":"主体可以接收客体的信息和数据,也可能改变客体相关的信息"},{"k":"C","t":"访向权限是指主体对客体所允许的操作"},{"k":"D","t":"对目录的访问权展可分为读、写和柜绝访问"}],"answer":"D","src":"精选300题","srcNum":270,"id":"q331","analyze":"访问控制中主体是发起访问的实体,如用户或进程,A 正确;主体可接收客体信息,也可能改变客体相关信息,B 正确;访问权限指主体对客体所允许的操作,C 正确。D 错误:对文件或目录的访问权限通常分为读、写、执行(目录为搜索),不存在\"拒绝访问\"这一权限类型。","expand":"文件权限三分:读 r、写 w、执行 x;目录权限:r 列目录、w 新建删除、x 进入搜索。易混:拒绝访问是访问控制判定结果,不是权限种类;ACL 中的 deny 条目是策略规则,也不等于权限类型。","tags":["访问控制","操作系统安全"]},{"stem":"小王在学习定风险评估方法后,决定试着为单位机房计算火灾的风险大小假设单位机房的总值为400元人民币,暴漏系数( xposure factor,)是25%,年度发生率annualizd rate of Occurrence.ARO)为0.2 那么小王计算的年度预期损失Annualized Loss Expectancy, ALE)应该是","options":[{"k":"A","t":"100 万元人民"},{"k":"B","t":"400 万元人民币"},{"k":"C","t":"20 万元人民币"},{"k":"D","t":"180 万元人民币"}],"answer":"C","src":"精选300题","srcNum":273,"id":"q332","analyze":"年度预期损失 ALE=资产价值×暴露系数 EF×年度发生率 ARO。代入题干数据:400 万元×25%×0.2=20 万元,故选 C。A 的100 万元遗漏 ARO;B 的400 万元未计入 EF 与 ARO;D 的180 万元无对应算法,属臆造干扰值。","expand":"公式:单次预期损失 SLE=资产价值×EF;ALE=SLE×ARO=资产价值×EF×ARO。易混:EF 是单次事件的损失比例,ARO 是年发生次数,可大于1。判断技巧:先算 SLE 再乘 ARO,并统一题干中的元与万元单位。","tags":["风险评估"]},{"stem":"小王在学习定量风险评估方法后,决定试着为单位机房计算火灾的风险大小。假设单位机房的总价格为200 万元人民币,暴漏系数( Foposurefactor,EF)是25%,年度发生率annualized rate of0 ccurrencearo)为0.1,那么小王计算的年度预期损失Annualized Loss Expectancy, AE)应该是","options":[{"k":"A","t":"5 万元人民币"},{"k":"B","t":"50 万元人民币"},{"k":"C","t":"2.5 万元人民币"},{"k":"D","t":"25 万元人民币"}],"answer":"A","src":"精选300题","srcNum":274,"id":"q333","analyze":"按公式 ALE=资产价值×EF×ARO:200 万元×25%×0.1=5 万元,故选 A。B 的50 万元只算了单次预期损失 SLE;C 的2.5 万元系数不符,算法有误;D 的25 万元同样只是200×25% 的部分结果,未乘年度发生率 ARO,属典型干扰项。","expand":"SLE=资产价值×暴露系数,ALE=SLE×ARO。示例:200 万×25%=50 万为 SLE,再×0.1=5 万为 ALE。易混:很多题目故意把 SLE 设为干扰选项。判断技巧:当 ARO≤1 时,ALE 必定小于 SLE,可据此快速排除。","tags":["风险评估"]},{"stem":"GPT18336《信息技术安全性评估准则》是测评标准中的重要标准,该标准定义了保护轮廓( protectionprofile, pp)和安全目标( security target.st)的评估准则。提出了评估保证级( evaluationassurance evel。eal)期评估保证级共分为()个递增的评估保证等级","options":[{"k":"A","t":"4"},{"k":"B","t":"5"},{"k":"C","t":"6"},{"k":"D","t":"7"}],"answer":"D","src":"精选300题","srcNum":275,"id":"q334","analyze":"GB/T 18336 等同采用 ISO/IEC 15408,将评估保证级 EAL 分为 EAL1 至 EAL7 共7个递增等级,级别越高评估越严格、成本越高,故 D 正确。EAL1 为最低,EAL7 为最高,4、5、6 三个选项的等级数量均与标准不符。","expand":"CC 结构中,PP 是某类产品的保护轮廓,ST 是具体产品的安全目标,评估依据 ST 与所选 EAL 等级实施。易混:功能要求见 CC 第二部分,保证要求见第三部分。记忆:EAL 共七级,EAL4 为常见商用最高等级。","tags":["信息安全标准与法规","安全工程与项目管理"]},{"stem":"某集团公司更具业务需要,在各地分支机构部署前置机,为了保证安全,将集团总部要求前置机开放日志由总部服务器采集进行集中分析,在运行过程中发现攻击者也可通过共享从前置机中提取日志,从而导致部分敏感信息泄露,根椐降低攻击面的原则,应采取以下哪项处理措施?","options":[{"k":"A","t":"由于共享导致了安全问题,应直接关闭日志共享,禁止总部提取日志进行分析"},{"k":"B","t":"为配合总部的安全策略,会带来一定的安全问题,但不能响系统使用,因此接受此风险"},{"k":"C","t":"日志的存在就是安全风险,最好的办法就是取消日志,通过设置让前置机不记录日志"},{"k":"D","t":"只允许特定的P 地址从前置机提取日志,对日志共享设置访问密码且限定访问的时间"}],"answer":"D","src":"精选300题","srcNum":276,"id":"q335","analyze":"降低攻击面应在保留必要功能的前提下收敛暴露范围与权限。A 直接关闭日志共享会削弱集中审计;B 被动接受风险不符合降低原则;C 取消日志等于放弃审计证据,更为危险。D 限定源 IP、设置访问口令并限制访问时段,既满足总部采集需求,又把暴露面压到最小,是正确措施。","expand":"日志安全要点:集中采集、传输加密、访问白名单、最小权限、完整性保护、留存期限合规。易混:降低攻击面不是关闭功能,而是限定\"谁能访问、何时访问、以何种方式访问\"。判断技巧:既保功能又限范围者最优。","tags":["软件安全","访问控制"]},{"stem":"关于我国加强信息安全保障工作的主要原则,以下说法错误的是:","options":[{"k":"A","t":"立足国情,以我为主,坚持技术与管理并重"},{"k":"B","t":"正确处理安全和发展的关系,以安全保发展,在发展中求安全"},{"k":"C","t":"统筹规划,突出重点,强化基础工作"},{"k":"D","t":"全面提高信息安全防护能力,保护公众利益,维护国家安全"}],"answer":"D","src":"精选300题","srcNum":277,"id":"q336","analyze":"我国信息安全保障工作的主要原则包括:立足国情、以我为主,坚持技术与管理并重;正确处理安全与发展的关系,以安全保发展、在发展中求安全;统筹规划、突出重点、强化基础工作等。D\"全面提高防护能力、保护公众利益、维护国家安全\"属工作目标而非原则,故为错误项。","expand":"易混:目标是\"保障发展、维护国家与公众权益\",原则是\"怎么干\"——国情为主、技管并重、安全与发展协调、统筹重点。判断技巧:选项若是结果性表述(提高能力、维护安全)多为目标;若是方法性表述多为原则。","tags":["信息安全标准与法规"]},{"stem":"在使用系统安全工程-能力成熟度模型(SSE -CMM)对一个组织的安全工程能力成熟度进行测量时,正确的理解是","options":[{"k":"A","t":"测量单位是基本实施( base practices,bp)"},{"k":"B","t":"测量单位是通用实施( Generic practices GP"},{"k":"C","t":"测量单位是过程区域( Process Areas,PA)"},{"k":"D","t":"测量单位是公开特征( common features,cf)"}],"answer":"D","src":"精选300题","srcNum":278,"id":"q337","analyze":"SSE-CMM 的结构为:过程区域 PA→目标→公共特征 CF→通用实施 GP 与基本实施 BP。评估时以公共特征为测量单位,判断各过程区域的目标是否达成,进而确定成熟度等级,故 D 正确。BP 是领域基本活动,GP 是制度化通用做法,二者是公共特征下的具体实施,不作测量单位。","expand":"SSE-CMM 五级:非正式执行、计划跟踪、充分定义、量化控制、持续改进。三类过程区域:工程类、项目类、组织类。易混:SSE-CMM 评安全工程能力,CMMI 评软件开发能力,等保测评评系统符合性。","tags":["安全工程与项目管理"]},{"stem":"信息安全管理体系(ISMS)的建设和实施是一个组织的战略性举措。若一个组织声称自己的ISKS 符合1SO/IBC27001 或心BT22080 标准要求,则需实施准要求,则需实施以下ISMS 建设的各项工作,哪不属于ISMS 建设的工作","options":[{"k":"A","t":"规划与建立ISMS"},{"k":"B","t":"实施和运行ISMS"},{"k":"C","t":"监视和评审ISMS"},{"k":"D","t":"保持和审核ISMS"}],"answer":"D","src":"精选300题","srcNum":279,"id":"q338","analyze":"ISO/IEC 27001 的 ISMS 建设四步为:规划与建立 ISMS、实施和运行 ISMS、监视和评审 ISMS、保持和改进 ISMS。A、B、C 均为标准阶段。D\"保持和审核 ISMS\"把\"保持和改进\"与\"审核\"拼接,不是标准阶段名称,故不属于 ISMS 建设的规定工作。","expand":"PDCA 与四步对应:Plan 建立,Do 实施运行,Check 监视评审,Act 保持改进。易混:内部审核与管理评审是\"监视和评审\"中的活动,不能单列为建设阶段。记忆:建立—实施运行—监视评审—保持改进。","tags":["信息安全管理体系"]},{"stem":"一个信息管理系统通常会对用户进行分组并实施访问控制。例如,在一个学校的教务系统中,教师能够录入学生的考试成绩,学生只能査看自己的分数,而学校教务部门的管理人员能够对课程信息、学生的选课信息等内容进行修改。下列选项中,对访问控制的作用的理解错误的是","options":[{"k":"A","t":"经过身份鉴别后的合法用户提供所有服务"},{"k":"B","t":"拒绝非法用户的非授权访问请求"},{"k":"C","t":"在用户对系统资源提供最大限度共享的基础上,对用户的访问权进行管理"},{"k":"D","t":"防止对信息的非授权篡改和滥用"}],"answer":"A","src":"精选300题","srcNum":280,"id":"q339","analyze":"访问控制的作用是在资源最大限度共享的基础上,按最小权限限制主体对客体的操作,拒绝非法用户的非授权请求,防止信息被非授权篡改与滥用,B、C、D 均正确。A 错:通过身份鉴别只说明用户身份合法,并不意味着可访问所有服务,合法用户仍须按授权范围访问。","expand":"鉴别与授权分离:先认证身份,再按角色或属性授权(RBAC/ABAC),最后审计。易混:合法用户不等于全权用户,认证通过不等于获得全部权限。判断技巧:凡\"鉴别通过即获得所有服务或全部权限\"的表述必错。","tags":["访问控制","身份鉴别"]},{"stem":"目前,很多行业用户在进行信息安全产品选项时,均要求产品高通过安全测评。关于信息安全产品测评的意义,下列说法中不正确的是:","options":[{"k":"A","t":"有助于建立和实施信息安全产品的市场准入制度"},{"k":"B","t":"对用户采购信息安全产品,设计、建设、使用和管理安全的信息系统提供科学公正的专业指导"},{"k":"C","t":"对信息安全产品的研究、开发、生产以及信息安全服务的组织提供严格的规范引导和质量监督"},{"k":"D","t":"打破市场垄断,为信息安全产业发展创造一个良好的竞争环境"}],"answer":"D","src":"精选300题","srcNum":281,"id":"q340","analyze":"信息安全产品测评的意义在于:支撑建立和实施产品市场准入制度,为用户采购产品及设计、建设、使用、管理信息系统提供科学公正的专业指导,对产品研发生产与服务组织形成规范引导和质量监督,即 A、B、C。D\"打破市场垄断、创造良好竞争环境\"属产业政策目标,不是产品测评的直接意义。","expand":"我国测评体系:信息安全产品认证(CCRC)、销售许可、等级保护测评、密码产品检测。依据 GB/T 18336 开展 EAL 评估。易混:产品测评评产品,系统测评评系统,服务资质认证评组织能力。","tags":["信息安全标准与法规","安全工程与项目管理"]},{"stem":"IP 地址用来标识不同的网络、子网以及网络中的主机。所谓P 地址规划。是推根据P 编址特点,为所设计的网络中的节点、网络设备分配合适的P 地址。如某个小型网络拥有10 个与互联网直接连接的P 地址,但是该网络内有15 台个人计算机假如这些计算机不会同时开机并连接互联网,那么可以将这10 个互联网地址集中起来使用,当任意一台个人计算机开机并连接网络时,管理中心从这10 个地址中任意抽取个尚未分配的IP 地址分配给这台计算机。他关机时,管理中心将该地址收回,并重新设置为未分配。那么上述的P地址分配方式属于","options":[{"k":"A","t":"动态分配地址"},{"k":"B","t":"静态分配地址"},{"k":"C","t":"NAT 池分配地址"},{"k":"D","t":"端口MT 分配地址"}],"answer":"A","src":"精选300题","srcNum":283,"id":"q341","analyze":"题干描述用10 个公网地址供15 台计算机按需使用:开机时由管理中心分配空闲地址,关机时回收并置为未分配,地址与主机不固定绑定,属动态分配(如 DHCP 动态分配)。静态分配为每台主机固定一个地址;NAT 池是地址转换复用;端口映射属转换技术,均不符合题干。","expand":"IP 分配方式:静态(固定绑定,便于管理与审计)、动态(DHCP,提高利用率)、自动(AutoIP)。易混:动态分配不等于 NAT,NAT 是公私地址转换;地址池只是可用地址集合,不代表分配方式。判断技巧:\"按需分配、用完回收\"即动态。","tags":["网络安全"]},{"stem":"小陈某电器城购买了一台冰箱,并留下了个人姓名、电话和电子邮件地址等信息,第二天他收了一封邮件他中奖的邮件,査看该邮件后他按照提示操作缴纳中奖税款后并没有得到中奖金,再成才得知电器城共没有中奖的活动、在此案例中,下面描述量误的是","options":[{"k":"A","t":"小陈应当注意保护自已的隐私,没有必要告诉别人的信息不要登记和公和给别人"},{"k":"B","t":"小陈钱被偷走了,这类网络犯罪哪案件也应该向公安局报案"},{"k":"C","t":"邮件服务运营高商通过技术手段,可以在一定程度上阻止此类的钓鱼邮件和明哄骗邮件"},{"k":"D","t":"小陈应当向电器城索,追回损失"}],"answer":"D","src":"精选300题","srcNum":285,"id":"q342","analyze":"小陈在商家处留下个人信息后收到诈骗中奖邮件并主动缴税,损失源于自身信息泄露与轻信,电器城并未举办中奖活动,不是侵权主体,故 D\"向电器城索赔\"错误。A 提醒保护个人信息、B 网络诈骗应向公安机关报案、C 邮件服务商可用技术手段拦截钓鱼邮件,三项均正确。","expand":"个人信息保护要点:最小化提供、授权同意、用途限定、妥善保管。钓鱼邮件识别:核对发件域名、不点陌生链接、不向陌生账户转账。易混:民事索赔须有侵权主体与因果关系,被骗应先报案并可申请止付。","tags":["信息安全标准与法规","信息安全管理体系"]},{"stem":"下列选项中,哪个不是我国信息安全保障工作的主要内容","options":[{"k":"A","t":"加强信息安全标准化工作,积极米用“等同采用、修改采用.制定”等多种方式,尽快建立标准体系"},{"k":"B","t":"建立国家信息安全研究中心,加快建立国家急需的信息安全技术体系,实现国家信息安全自主可控目标"},{"k":"C","t":"建设和完善信息安全基础设施,提供国家信息安全保障能力支撑"},{"k":"D","t":"加快信息安全学科建设和信息安全人才培养"}],"answer":"B","src":"精选300题","srcNum":286,"id":"q343","analyze":"我国信息安全保障工作的主要内容包括:加强信息安全标准化工作,采取等同采用、修改采用、自主制定等方式尽快建立标准体系;建设和完善信息安全基础设施,提供保障能力支撑;加快信息安全学科建设和人才培养等。A、C、D 均属其中。B 所列\"建立国家信息安全研究中心、实现自主可控\"并非文件列举的主要工作内容,表述失实。","expand":"工作框架:标准、基础设施(CA、应急、测评)、人才、技术与产业、法律法规、宣传教育。易混:自主可控是发展方向与目标要求,但\"建立国家信息安全研究中心\"不属该文件任务清单。判断技巧:遇到具体机构设置类选项要警惕。","tags":["信息安全标准与法规"]},{"stem":"有关能力成熟度模型(),错误的理解是","options":[{"k":"A","t":"CMM 基本思想是,因为问题是由技术落后引起的所以新技术的运用会在一定程度上提高质量.生产率和利润率"},{"k":"B","t":"CM 的思想来源于项目管理和质量管理"},{"k":"C","t":"CM 是一种衡量工程实施能力的方法,是一种面向工程过程的方法"},{"k":"D","t":"CM 是建立在统计过程控制理论基础上的,它基于这样一个假设,即“生产过程的高质量和在过程中组织实施的成熟性可以低成本地生产出高质量产品"}],"answer":"A","src":"精选300题","srcNum":287,"id":"q344","analyze":"CMM 的核心思想是:软件质量主要取决于开发过程的质量,问题多源于过程管理不善,而非单纯技术落后,仅引入新技术不一定能提高质量、生产率与利润率,故 A 错误。B、C、D 分别说明 CMM 源于项目管理与质量管理、面向工程过程、建立在统计过程控制理论之上,均正确。","expand":"CMM 五级:初始级、可重复级、已定义级、已管理级、优化级。关键词依次为:混乱、经验、规范、量化、持续改进。易混:CMM 评过程能力,CMMI 是集成模型,SSE-CMM 评安全工程能力。","tags":["安全工程与项目管理"]},{"stem":"关于恶意代码的守护程序的功能,以下说法正确的是:","options":[{"k":"A","t":"隐藏恶意代码"},{"k":"B","t":"加大监测力度"},{"k":"C","t":"传播恶意代码"},{"k":"D","t":"监视悉意代码主体程序是否正常"}],"answer":"A","src":"精选300题","srcNum":289,"id":"q345","analyze":"恶意代码通常由主体程序、传播模块、隐藏模块(守护程序)、破坏模块等组成。守护程序的作用是监视主体程序运行状态并采取隐藏、保护、重启动等措施,使恶意代码不被发现和清除,故 A\"隐藏恶意代码\"正确。B 加大监测是对抗手段;D 监视主体只是其实现方式;C 传播由传播模块负责。","expand":"恶意代码功能模块:自启动、传播、隐藏(进程、文件、通信隐藏)、破坏、远程控制。易混:系统正常守护进程与恶意代码守护程序名称相似但目的相反。判断技巧:恶意代码各模块均服务于潜伏与破坏,隐藏是守护程序的核心目的。","tags":["恶意代码"]},{"stem":"某单位门户网站发完成后,测试人员使用模糊测试进行安全性测试,以下关于模糊试过程的说法正确的是","options":[{"k":"A","t":"模拟正常用户输入行为,生成大量数据包作为测试用例"},{"k":"B","t":"数据处理点、数据通道的入口点和可信边界点往往不是测试对象"},{"k":"C","t":"监测和记录输入数据后程序正常运行的情况"},{"k":"D","t":"深入分析网站测试过程中产生崩溃或异常的原因,必要时需要测试人员手工重现并分析"}],"answer":"D","src":"精选300题","srcNum":291,"id":"q346","analyze":"模糊测试向目标输入大量畸形、异常或半有效数据,监测崩溃、异常与内存错误,并深入分析成因,必要时人工重现以定位缺陷,故 D 正确。A 错:模糊测试并非模拟正常输入;B 错:数据处理入口点与可信边界点恰是重点测试对象;C 错:应监测异常与崩溃而非正常运行情况。","expand":"模糊测试流程:识别输入面→构造用例(变异或生成)→执行监控→异常判定→复现与根因分析。易混:模糊测试找缺陷,渗透测试利用漏洞获取权限,代码审计做静态分析。判断技巧:关键词为\"畸形输入、崩溃、异常复现\"。","tags":["软件安全"]},{"stem":"某购物网站开发项目经过需求分析进入系统设计阶段,为了保证用户帐户安全,项目开发人员决定用户登录时除了用户名口令认证方式外,还加入基于数字证书的身份认证功能,同时用户口令使用SHA 一1 算法加密后存放在后台数据库中,请问以上安全设计遵循的是哪项安全设计原则:","options":[{"k":"A","t":"最小特权原则"},{"k":"B","t":"职责分离原则"},{"k":"C","t":"纵深防御原则"},{"k":"D","t":"最少共享机制原贝"}],"answer":"C","src":"精选300题","srcNum":292,"id":"q347","analyze":"系统在口令认证之外增加数字证书认证,并对口令做哈希后存储,形成多层互补防护:一层被突破仍有其他层起作用,符合纵深防御原则。最小特权关注权限最小化;职责分离关注权力分散;最少共享机制关注减少共用资源。题干未涉及权限分配与资源共享,故 C 正确。","expand":"纵深防御层次:物理、网络、主机、应用、数据、管理;常见手段:双因素认证、加密存储、审计、备份。易混:多因素认证是纵深防御的体现,但\"多种方式叠加\"不等于最少共享机制。判断技巧:出现\"多层、互补、冗余\"即纵深防御。","tags":["软件安全","身份鉴别"]},{"stem":"规范的实施流程和文档管理,是信息安全风险评估能否取得成果的重要基础,某单位在实施风险评估时,形成了《待评估信息系统相关设备及资产清单》。在风险评估实施的各个阶段中,该《待评估信息系统相关设备及资产清单》应是如下0)中的输出结果。","options":[{"k":"A","t":"风险评估准备"},{"k":"B","t":"风险要素识别"},{"k":"C","t":"风险分析"},{"k":"D","t":"风险结果判定"}],"answer":"B","src":"精选300题","srcNum":293,"id":"q348","analyze":"风险评估按GB/T 20984分为准备、风险要素识别、风险分析、风险结果判定四个阶段。资产清单是资产识别与赋值的直接产物，属要素识别阶段的输出。准备阶段只形成评估方案、范围与工具准则；风险分析阶段产出风险值计算；结果判定产出风险等级结论，均不产生资产清单。","expand":"记忆GB/T 20984各阶段文档：准备阶段产出《风险评估方案》《方法与工具》《准则要求》；要素识别阶段产出《资产清单》《威胁列表》《脆弱性列表》《已有安全措施列表》；分析阶段产出风险计算表；判定阶段产出风险等级结论。技巧：含“资产/威胁/脆弱性清单”即要素识别，含“风险值/等级”即分析与判定。","tags":["风险评估"]},{"stem":"在实施信息安全风险评估时,需要对资产的价值进行识别、分类和赋值,关于资产价值的评估,以下选项中正确的是","options":[{"k":"A","t":"资产的价值指采购费用"},{"k":"B","t":"资产的价值指维护费用"},{"k":"C","t":"资产的价值与其重要性密切相关"},{"k":"D","t":"资产的价值无法估计"}],"answer":"C","src":"精选300题","srcNum":294,"id":"q349","analyze":"资产价值由资产自身价值与业务对资产的依赖程度共同决定，反映其在保密性、完整性、可用性受损时对组织业务和使命的影响，故与重要性密切相关。A采购费用、B维护费用只是会计成本视角，不能反映业务影响；D称无法估计，与风险评估必须赋值分级的前提相矛盾。","expand":"GB/T 20984要求对资产按保密性、完整性、可用性分别赋值再综合，常用1—5级相对等级而非绝对金额。易混点：资产“成本价值”不等于“业务价值”，前者看购置维护，后者看业务依赖。资产价值越高，同一威胁与脆弱性下风险值越大，处置优先级越高。","tags":["风险评估"]},{"stem":"由于频繁出现软件运行时被黑客远程攻获取数据的现象,某软件公司准备加强软件安全开发管理,在下面做法中,对于解决问题没有直接帮助的是","options":[{"k":"A","t":"要求开发人员采用捷开发型进行开发"},{"k":"B","t":"要求所有的开发人员参加软件安全意识培训"},{"k":"C","t":"要求规范软件编码,并定公司的安全编码准则"},{"k":"D","t":"要求增加软件安全测试环节,早发现软件安全问题"}],"answer":"A","src":"精选300题","srcNum":296,"id":"q350","analyze":"题干问题是软件被远程攻击获取数据，根源在于代码与设计漏洞。B安全意识培训、C安全编码准则可从源头减少缺陷，D增加安全测试能及早发现漏洞，均可直接改善。A仅把开发方式改为敏捷，属过程组织调整，不引入任何安全活动，故无直接帮助。","expand":"软件安全开发主线：安全需求→安全设计（威胁建模）→安全编码→代码审计→安全测试→漏洞管理。瀑布、敏捷、迭代只决定阶段排布方式，不能替代安全活动。技巧：选项中若只是“换开发模型、换工具”而不增加安全活动内容，通常即为无直接帮助项。","tags":["软件安全","安全工程与项目管理"]},{"stem":"软件存在洞和缺陷是不可避免的,实践中常使用软件缺陷密度( Defects/KLOC)来衡量软件的安全性,假设某个软件共有296 万行源代码,总共被检测出145 个缺陷,则可以计算出其软件缺陷密度值是","options":[{"k":"A","t":"0.00049"},{"k":"B","t":"0.049"},{"k":"C","t":"0.49"},{"k":"D","t":"49"}],"answer":"B","src":"精选300题","srcNum":298,"id":"q351","analyze":"缺陷密度＝缺陷数÷千行代码数。296万行即2960 KLOC，145÷2960≈0.049，故B正确。C的0.49是误把“万行”当成“千行”、直接用145÷296所得；A、D则是小数点位数换算错误。计算前统一单位为KLOC是解题关键。","expand":"公式：Defects/KLOC＝缺陷总数÷(代码总行数/1000)。行业经验：高质量软件约0.1—1个/KLOC，商用发布前常控制在0.5以下；CMMI、SSE-CMM均用此类度量评估过程能力。易错：把万行当千行、把密度算成百分比；另注意缺陷密度不等于漏洞密度。","tags":["软件安全","安全工程与项目管理"]},{"stem":"对《网络安全法》中网络运行安全生产影响的攻击行为主要是对以下那个信息安全属性造成影响?","options":[{"k":"A","t":"保密性"},{"k":"B","t":"完整性"},{"k":"C","t":"可用性"},{"k":"D","t":"不可抵赖性"}],"answer":"C","src":"精选300题","srcNum":299,"id":"q352","analyze":"《网络安全法》第三章“网络运行安全”关注网络与系统持续稳定运行。攻击导致业务中断、服务不可用，直接破坏可用性，故C正确。保密性对应信息被未授权获取，完整性对应数据被篡改，不可抵赖性对应否认操作事实，均不是“运行受到影响”的主要表现。","expand":"对应关系速记：中断→可用性，泄露→保密性，篡改→完整性，冒充→真实性，否认→不可抵赖性。DDoS、断电、勒索加密停机归可用性；拖库归保密性；网页篡改归完整性。技巧：先判断后果是“不能用”“被看到”还是“被改动”，再选属性。","tags":["网络安全","信息安全标准与法规"]},{"stem":"TCP/IP 协议族是为实现异构网互联推出的协议规范,具有较好的开放性, internet 是在TCP/P 协议族的基础上构建的。但由于TCP/P 协议族在设计初期过于关注其开放性和便利性,对安全性考虑较少,因此其中很多协议存在安全隐患,例如,攻击者可以利用TCP 协议的三次握手机制实现DS 攻击,也可以通过猜测TCP 会话中的序号来伪造数据包那么上述例子中的情况可能发生在","options":[{"k":"A","t":"应用层"},{"k":"B","t":"传输层"},{"k":"C","t":"网络层"},{"k":"D","t":"链路层"}],"answer":"B","src":"精选300题","srcNum":300,"id":"q353","analyze":"SYN三次握手机制与TCP序号伪造都发生在TCP协议处理过程，TCP属传输层，故B正确。应用层（HTTP、FTP）对应应用漏洞；网络层（IP、ICMP）对应IP欺骗与分片攻击；链路层（ARP、以太网）对应ARP欺骗，均非题干所列机制。","expand":"分层对应典型攻击：链路层ARP欺骗；网络层IP欺骗、ICMP Flood、Smurf；传输层SYN Flood、TCP序号预测、会话劫持；应用层SQL注入、XSS、DNS欺骗。技巧：先定位协议所属层，再看攻击名。TCP初始序号随机化（ISN随机）正是为缓解序号预测。","tags":["网络安全"]},{"stem":"某电子商务网站在开发设计时,使用了威胁建模方法米分析电子商务网站所面临的助SDE足微软SM 中提出的威胁建模方法,将威胁分为六类, Spoofing-是SRD 中欺编类的威胁,以下威胁中哪个可以归入此类威胁?","options":[{"k":"A","t":"网站竟争对手可能雇佣攻击者实施ds 攻击,降低网站访问速度"},{"k":"B","t":"网站使用http 协议进行河览等操作,未对数据进行加密,可能导放用户传输信思露,例如购买的商品金额等"},{"k":"C","t":"网站使用ht 协议进行河览等操作,无法确认数据与用户发出的是否一致,可能数据被中途改"},{"k":"D","t":"网站使用用户名、密码进行登录验证,攻击者可能会利用弱口令其他方式获得用户密码,以该用户身份登录修改用户订单信息"}],"answer":"D","src":"B卷·补充100题","srcNum":1,"id":"q354","analyze":"STRIDE中Spoofing即身份欺骗，指冒充他人身份行事。D中攻击者用弱口令等手段获取密码后，以该用户身份登录并篡改订单，正属身份冒充。A为拒绝服务（D），B为信息泄露（I），C为数据篡改（T），均不属欺骗类威胁。","expand":"STRIDE六类：Spoofing欺骗、Tampering篡改、Repudiation抵赖、Information Disclosure信息泄露、Denial of Service拒绝服务、Elevation of Privilege权限提升。常用于威胁建模并映射防护措施。技巧：看攻击者是否冒充合法主体行事，冒充即S。","tags":["软件安全","安全工程与项目管理"]},{"stem":"关于源代码审核,下列说法正确的是","options":[{"k":"A","t":"源代码市核往往需要大量的时间采用人工市核费时费力,但可以通过多人并行市核来弥补这个缺点"},{"k":"B","t":"源代码审核工具应当以检査源代码的功能是否完整、是否执行正确为主要功能"},{"k":"C","t":"使用代码核王共动化行代吗检和分析,能够大提高软件可性开节省件开发和测试的成本,已经取代了人工审核方式"},{"k":"D","t":"源代码审核是指无需运行被测代码,仅对源代码检査分析,检测并报告源代码中可能胞藏的识和块陷"}],"answer":"D","src":"B卷·补充100题","srcNum":4,"id":"q355","analyze":"源代码审核属静态分析，无需运行被测程序，仅通过人工或工具检查源码，发现并报告可能隐藏的缺陷与漏洞，D表述准确。A称可靠多人并行弥补耗时，忽略了并行难以保证一致性；B把功能完整性作为主要目标，偏离安全审核；C称已取代人工审核，与事实不符。","expand":"静态分析（白盒）与动态测试（黑盒）互补：前者覆盖未执行路径、发现空指针、缓冲区溢出、硬编码口令；后者验证运行时行为。工具误报需人工确认，故“取代人工”不成立。相关实践：代码审计、SAST、同行评审，对应安全编码规范要求。","tags":["软件安全"]},{"stem":"关于(网络安全法》域外适用效力的理解,以下哪项是错的","options":[{"k":"A","t":"当前对于域外的网攻击,我国只能通过向来源国采取抗议"},{"k":"B","t":"对于来自境外的网络安全成胁我国可以组织技术力量进行监测、防御和处置"},{"k":"C","t":"对于米自境外的网络攻击我国可以追究其法律责任"},{"k":"D","t":"对于来自境外的违法信息我国可以加以阻断传播"}],"answer":"A","src":"B卷·补充100题","srcNum":5,"id":"q356","analyze":"《网络安全法》确立域外效力，对境外主体危害我国网络安全的行为可依法追究法律责任，并可组织技术力量监测、防御、处置，对境外违法信息可阻断传播，B、C、D均正确。A称我国只能向来源国抗议，否定了法律赋予的处置与追责权，为错误项。","expand":"依据：《网络安全法》第二条适用范围与第七十五条境外主体责任；《数据安全法》第二条、《个人信息保护法》第三条亦设域外效力。记忆：“监测防御、依法追责、阻断传播”三项皆可；凡“只能抗议、无权处置”的绝对化表述必错。","tags":["信息安全标准与法规"]},{"stem":"信息安全保障技术框架( I nformation Assurance Technical Framework,IATF),目的是为保障政府和工业的()提供了()。信息安全保障技术框架的一个核心思想是()。深度防御战略的三个核心要素;()、技术和运行(亦称为操作","options":[{"k":"A","t":"信息基础设施;技术指南;深度防御;人员"},{"k":"B","t":"技术指南;信息基础设施:深度防御;人员"},{"k":"C","t":"信息基础设施:深度防御:技术指南;人员"},{"k":"D","t":"信息基础设施;技术指南;人员;深度防御"}],"answer":"A","src":"B卷·补充100题","srcNum":6,"id":"q357","analyze":"IATF全称Information Assurance Technical Framework，目的是为保障政府和工业的信息基础设施提供技术指南；核心思想是深度防御；深度防御三要素为人员、技术、运行（操作）。A顺序完全对应，B、C、D将“技术指南”或“人员”错位替换。","expand":"IATF由美国NSA发布（3.1版，2002年），提出深度防御与四个焦点领域：本地计算环境、区域边界、网络与基础设施、支撑性基础设施。三要素口诀“人、技、运”。它与PDR/PPDR、SSE-CMM同属美国信息安全保障体系的理论来源。","tags":["安全工程与项目管理","信息安全标准与法规"]},{"stem":"在信息安全风险管理过程中,背景建立是实施工作的第一步。下面哪项理解是错误的","options":[{"k":"A","t":"背景建立的依据是国家、地区或行业的相关政策、法律、法规和标准,以及机构的使命、信息系统的业务目标和特性"},{"k":"B","t":"背景建立阶段应识别需要保护的资产、面临的威胁以及存在的脆弱性,并分别赋值,同时确认已有的安全措施,形成需要保护的资产清单"},{"k":"C","t":"背景建立阶段应调查信息系统的业务目标,业务特性、管理特性和技术特性,形成信息系统的描述报告"},{"k":"D","t":"背景建立阶段应分析信息系统的体系结构和关键要素,分析信息系统的安全环境和要求,形成信息系统的安全要求报告"}],"answer":"B","src":"B卷·补充100题","srcNum":7,"id":"q358","analyze":"背景建立阶段的任务是确定评估依据与范围边界，调查业务目标与管理技术特性，分析体系结构与安全环境，形成系统描述报告和安全要求报告。B所述识别资产、威胁、脆弱性并赋值、形成资产清单，实为风险评估（要素识别）阶段的工作，故错误。","expand":"风险管理六阶段：背景建立→风险评估→风险处理→批准监督→监控审查→沟通咨询。背景建立“定边界、定要求”，风险评估“识别要素、算风险值”。易混点：资产清单属后者；安全要求报告、系统描述报告属前者。","tags":["风险评估","信息安全管理体系"]},{"stem":"与PDR 模型相比,P2DR 模型则更强调(),即强调系统安全的(),并且以安全检测、()和自适应填充安全间隙为循环来提高()。","options":[{"k":"A","t":"漏洞监测;控制和对抗;动态性;网络安全"},{"k":"B","t":"动态性;控制和对抗;漏洞监测;网络安全"},{"k":"C","t":"控制和对抗:漏洞监测;动态性;网络安全"},{"k":"D","t":"控制和对抗;动态性;漏洞监测:网络安全"}],"answer":"D","src":"B卷·补充100题","srcNum":8,"id":"q359","analyze":"P2DR由策略（Policy）、防护、检测、响应构成，相较PDR更强调“控制和对抗”，强调系统安全的“动态性”，以安全检测、漏洞监测与自适应填充安全间隙形成循环，提升“网络安全”。D四项词序与题干完全吻合，其余选项错位。","expand":"演进：PDR（防护—检测—响应）→P2DR（加入策略为核心）→PPDR（Policies统辖）。动态性体现为检测使防护由被动转为主动。口诀“策略定调、防护挡、检测看、响应补”。易混：P2DR核心是策略，不是人员，也不是审计。","tags":["网络安全","安全工程与项目管理"]},{"stem":"若一个组织生成自己的ISMS 符合SO/=C27001 或GBT22080 标准要求,其信息安全控制实施通畅需要在符合性方面实施常规控制。符合性常规控制这一领域不包括以下哪项控制目标。","options":[{"k":"A","t":"符合法律要求"},{"k":"B","t":"符合安全策略和标准以及技术符合性"},{"k":"C","t":"信息系统审核考虑"},{"k":"D","t":"访问控制的业务要求,用户访问管理"}],"answer":"D","src":"B卷·补充100题","srcNum":10,"id":"q360","analyze":"ISO/IEC 27001（GB/T 22080）附录A“符合性”域的控制目标为：符合法律要求、符合安全策略和标准及技术符合性、信息系统审核考虑。D“访问控制的业务要求、用户访问管理”属访问控制域，故不属于符合性领域。","expand":"27001:2013附录A共14个控制域、35个控制目标：安全策略、组织、人力资源、资产、访问控制、密码、物理与环境、运行、通信、系统获取开发维护、供应商关系、事件管理、业务连续性、符合性。技巧：按控制目标名称归域，跨域项即干扰项。","tags":["信息安全管理体系","信息安全标准与法规"]},{"stem":"随着即时通讯软件的普及使用,即时通讯软件也被恶意代码利用进行传播,以下哪项功能不是恶意代码利用即时通讯进行传播及执行的方式","options":[{"k":"A","t":"利用即时通讯软件的发送功能发送带恶意代码的可执行文件"},{"k":"B","t":"利用即时通讯软件发送制定恶意网页的URL"},{"k":"C","t":"利用即时通软件发送指向恶意地址的程序"},{"k":"D","t":"利用即时通讯发送携带恶意代码的TXT 文档"}],"answer":"D","src":"B卷·补充100题","srcNum":11,"id":"q361","analyze":"即时通讯传播依赖具备执行或跳转能力的载体：可执行文件、恶意网页URL、指向恶意地址的程序，A、B、C均属常见手法。TXT为纯文本，本身不可执行，需用户另存并主动运行，不是即时通讯传播及执行的典型方式，故D为不包括项。","expand":"高危载体还包括压缩包、LNK快捷方式、宏文档（docm/xlsm）、双扩展名文件。防护：禁止可执行扩展名传输、链接与附件沙箱检测、终端EDR监控、关闭自动宏。技巧：判断载体是否具备“被执行、自动跳转”能力，纯文本通常不具备。","tags":["恶意代码","网络安全"]},{"stem":"SABSA 模型包括()它是一个(),它在第一层从安全的角度定义了0)。模型的每一层在抽象方面逐层减少,细节逐层增加,因此,它的层级都是建在其他层之上的,从策略逐渐到几乎和解决方案的()。其思路上创新提出了一个包括战略、概念、设计、实施、度量和审计层次的","options":[{"k":"A","t":"五层;业务需求;分层模型;实施实践;安全链条"},{"k":"B","t":"六层;分层模型;业务需求;实施实践;安全链条;"},{"k":"C","t":"五层:分层模型;业务需求,实施实践;安全链条;"},{"k":"D","t":"六层;分层模型:实施实践;也无需求;安全链条"}],"answer":"B","src":"B卷·补充100题","srcNum":12,"id":"q362","analyze":"SABSA是六层安全架构模型，本身为分层模型；第一层从安全角度定义业务需求；各层抽象递减、细节递增，自策略逐层细化到接近解决方案的实施实践；并形成涵盖战略、概念、设计、实施、度量、审计的“安全链条”。B各项顺序相符。","expand":"SABSA六层：业务需求（上下文）→概念→逻辑/设计→物理/实施→组件/运行→操作/度量审计。与IATF、SSE-CMM并列为安全架构方法论。记忆“六层六环节，业务需求打头，实施实践落地”。易混：SSE-CMM是成熟度模型，不分层。","tags":["安全工程与项目管理","信息安全管理体系"]},{"ste
