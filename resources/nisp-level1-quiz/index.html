<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NISP一级题库 · 402题离线练习</title>
<style>
:root{
  --bg:#0b1220;
  --bg2:#0f1a2e;
  --card:rgba(255,255,255,.055);
  --card-border:rgba(255,255,255,.09);
  --text:#e8eefb;
  --muted:#8fa3c0;
  --accent:#38d9a9;
  --accent-2:#4dabf7;
  --wrong:#ff6b81;
  --right:#38d9a9;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1100px 700px at 15% -10%,rgba(77,171,247,.16),transparent 60%),
    radial-gradient(900px 600px at 100% 0%,rgba(56,217,169,.12),transparent 55%),
    linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  padding:28px 18px 40px;
}
.app{width:100%;max-width:820px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(77,171,247,.28),rgba(56,217,169,.28));
  border:1px solid rgba(255,255,255,.12);font-size:18px}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.5px}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.icon-btn{background:none;border:1px solid var(--card-border);color:var(--muted);
  padding:8px 14px;border-radius:10px;font-size:12px;cursor:pointer;transition:.2s}
.icon-btn:hover{color:var(--text);border-color:rgba(255,255,255,.25)}
.panel{
  background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:26px;backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.28);
}
.hidden{display:none !important}
.hero h2{font-size:22px;margin:0 0 8px;font-weight:600}
.hero p{color:var(--muted);font-size:13.5px;line-height:1.7;margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--card-border);border-radius:13px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:4px}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.good b{color:var(--accent)}
.stat.bad b{color:var(--wrong)}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px;border-radius:13px;border:1px solid transparent;cursor:pointer;
  font-size:14.5px;font-family:inherit;transition:transform .15s,box-shadow .2s,background .2s;
}
.btn-main{background:linear-gradient(135deg,rgba(56,217,169,.9),rgba(56,196,217,.9));color:#04231b;font-weight:600}
.btn-main:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(56,217,169,.25)}
.btn-ghost{background:rgba(255,255,255,.045);border-color:var(--card-border);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.btn-ghost:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn small{font-size:11.5px;opacity:.75;font-weight:400}
.mini{display:flex;gap:18px;justify-content:center;margin-top:18px}
.mini button{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit}
.mini button:hover{color:var(--text)}
.empty-tip{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}

/* quiz */
.q-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.badge{font-size:11px;padding:4px 9px;border-radius:20px;background:rgba(77,171,247,.15);
  color:#9ccaff;border:1px solid rgba(77,171,247,.25);white-space:nowrap}
.badge.mode-wrong{background:rgba(255,107,129,.14);color:#ffa9b6;border-color:rgba(255,107,129,.28)}
.counter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;margin-bottom:22px}
.bar>i{display:block;height:100%;width:0;border-radius:4px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .35s ease}
.source{font-size:11.5px;color:var(--muted);margin-bottom:10px;letter-spacing:.3px}
.stem{font-size:16.5px;line-height:1.75;margin:0 0 20px;letter-spacing:.2px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;
  padding:13px 15px;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,.035);border:1px solid var(--card-border);
  color:var(--text);font-size:14px;line-height:1.65;font-family:inherit;
  transition:background .16s,border-color .16s,transform .12s;
}
.opt:hover:not(.locked){background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);transform:translateX(2px)}
.opt-key{flex:0 0 24px;height:24px;border-radius:8px;display:grid;place-items:center;
  font-size:12.5px;font-weight:600;background:rgba(255,255,255,.08);color:#b9c7de;margin-top:2px}
.opt.right{border-color:rgba(56,217,169,.55);background:rgba(56,217,169,.1)}
.opt.right .opt-key{background:var(--right);color:#04231b}
.opt.wrong{border-color:rgba(255,107,129,.55);background:rgba(255,107,129,.1)}
.opt.wrong .opt-key{background:var(--wrong);color:#2a060b}
.opt.locked{cursor:default}
.feedback{display:flex;align-items:center;gap:9px;margin-top:16px;font-size:13.5px;min-height:20px}
.feedback.ok{color:var(--right)}
.feedback.no{color:var(--wrong)}
.feedback .ans{color:var(--text)}
.explain{margin-top:14px;border:1px solid rgba(255,107,129,.28);background:rgba(255,107,129,.055);
  border-radius:14px;padding:15px 16px;animation:slideIn .25s ease}
.ex-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.ex-badge{font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(255,107,129,.2);
  color:#ffb3bf;border:1px solid rgba(255,107,129,.32);white-space:nowrap}
.ex-ans{font-size:13px;font-weight:600;color:var(--text);line-height:1.6}
.ex-row{margin:9px 0;font-size:13.5px;line-height:1.8;color:#d5e1f2}
.ex-row b{font-weight:600;margin-right:6px;color:var(--accent-2)}
.ex-row.extend b{color:var(--accent)}
.ex-tags{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.6}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.next{background:linear-gradient(135deg,rgba(77,171,247,.9),rgba(56,217,169,.9));color:#04212b;
  border:none;padding:12px 22px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:transform .15s,box-shadow .2s,opacity .2s}
.next:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(77,171,247,.28)}
.next:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.hint{font-size:11.5px;color:var(--muted)}
/* done */
.done-wrap{text-align:center;padding:14px 0 6px}
.ring{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(56,217,169,.18),transparent 70%);border:1px solid rgba(56,217,169,.35);font-size:34px}
.done-wrap h2{font-size:20px;margin:0 0 6px}
.done-wrap p{color:var(--muted);font-size:13px;margin:0 0 22px}
.done-stats{display:flex;justify-content:center;gap:28px;margin-bottom:24px}
.done-stats div{font-size:12px;color:var(--muted)}
.done-stats b{display:block;font-size:20px;color:var(--text);margin-bottom:3px}
@media (max-width:600px){
  body{padding:18px 14px 30px}
  .panel{padding:20px 17px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stem{font-size:15.5px}
  .opt{font-size:13.5px;padding:12px 13px}
  header{margin-bottom:16px}
  h1{font-size:15px}
  .footer{flex-direction:column-reverse;align-items:stretch}
  .next{width:100%;padding:13px}
  .hint{text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
<!-- 访问控制守卫（由 deploy/inject_guard.py 注入） -->
<meta name="robots" content="noindex, nofollow" />
<script src="../../assets/js/auth-config.js"></script>
<script src="../../assets/js/guard.js"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">🛡️</div>
      <div>
        <h1>NISP一级题库 · 402题离线练习</h1>
        <div class="sub" id="subline">NISP 一级模拟题 · 402 道 · 完全离线</div>
      </div>
    </div>
    <button class="icon-btn" id="homeBtn">首页</button>
  </header>

  <!-- 首页 -->
  <section class="panel hero" id="homeView">
    <h2>随机抽题，即刻判断</h2>
    <p>从 NISP 一级 402 道模拟题中随机抽取题目，答过的题不会重复出现；答错的题会自动收进错题本，并当场展开正确答案与精讲。</p>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>题库总数</span></div>
      <div class="stat"><b id="sSeen">0</b><span>已练习</span></div>
      <div class="stat bad"><b id="sWrong">0</b><span>错题</span></div>
      <div class="stat good"><b id="sRate">—</b><span>正确率</span></div>
    </div>
    <p class="sub" id="syncState" style="text-align:center;margin:-6px 0 18px">云同步：仅本机</p>
    <div class="actions">
      <button class="btn btn-main" id="startRandom"><span id="startRandomLabel">开始随机练习</span><small id="startRandomMeta"></small></button>
      <button class="btn btn-ghost" id="startWrong"><span>错题重练</span><small id="wrongMeta">暂无错题</small></button>
    </div>
    <div class="mini">
      <button id="resetWrong">清空错题本</button>
      <button id="resetAll">重置全部进度</button>
    </div>
    <div class="empty-tip" id="homeTip"></div>
  </section>

  <!-- 答题 -->
  <section class="panel hidden" id="quizView">
    <div class="q-top">
      <div style="display:flex;gap:8px;align-items:center">
        <span class="badge" id="modeBadge">随机练习</span>
        <span class="counter" id="qCounter">1 / 402</span>
      </div>
      <span class="counter" id="qScore"></span>
    </div>
    <div class="bar"><i id="progressBar"></i></div>
    <div class="source" id="qSource"></div>
    <p class="stem" id="qStem"></p>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explain hidden" id="explain"></div>
    <div class="footer">
      <span class="hint" id="hint">键盘 A–D 或 1–4 选答案，回车下一题</span>
      <button class="next" id="nextBtn" disabled>下一题</button>
    </div>
  </section>

  <!-- 完成 -->
  <section class="panel hidden" id="doneView">
    <div class="done-wrap">
      <div class="ring">🎯</div>
      <h2 id="doneTitle">本轮完成</h2>
      <p id="doneText"></p>
      <div class="done-stats">
        <div><b id="doneRight">0</b>答对</div>
        <div><b id="doneWrong">0</b>答错</div>
        <div><b id="doneRate">—</b>正确率</div>
      </div>
      <div class="actions">
        <button class="btn btn-main" id="againBtn"><span>继续随机练习</span><small></small></button>
        <button class="btn btn-ghost" id="doneHome"><span>返回首页</span><small></small></button>
      </div>
    </div>
  </section>
</div>

s":["NISP一级","单选题"]},{"stem":"TCP/IP协议族安全性问题随着互联网的发展日益突出，相关组织和专家也对协议进行不断的改善和发展，为不同层次设计了相应的安全通信协议，用于对不同层次的通信进行安全保护，从而形成了由各层次安全通信协议构成的TCP/IP协议族安全架构。以下哪个协议属于链路层（）","options":[{"k":"A","t":"SNMP"},{"k":"B","t":"S/MIME"},{"k":"C","t":"L2TP"},{"k":"D","t":"SSL"}],"answer":"C","src":"NISP一级模拟题","srcNum":25,"id":"n1_025","analyze":"L2TP属于链路层、SNMP属于应用层、S/MIME属于应用层、SSL属于传输层","expand":"","tags":["NISP一级","单选题"]},{"stem":"虚拟专用网络(VPN)是在公用网络上建立虚拟的专用网络的技术。VPN的优势有（）。","options":[{"k":"A","t":"较低的成本"},{"k":"B","t":"具有较高的安全性"},{"k":"C","t":"服务保证"},{"k":"D","t":"以上都是"}],"answer":"D","src":"NISP一级模拟题","srcNum":26,"id":"n1_026","analyze":"VPN技术的主要优势是：较低的成本、具有较高的安全性、服务保证。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下不属于公钥密码的优点的是（）。","options":[{"k":"A","t":"加密速度快、计算简单"},{"k":"B","t":"解决了密钥传递问题"},{"k":"C","t":"大大减少了密钥持有量"},{"k":"D","t":"提供了对称密码技术无法或很难提供的服务（数字签名）"}],"answer":"A","src":"NISP一级模拟题","srcNum":27,"id":"n1_027","analyze":"公钥密码计算复杂、消耗资源大。","expand":"","tags":["NISP一级","单选题"]},{"stem":"强制访问控制模型有多种类型，如BLP、Biba、Clark-willson 和ChineseWall 等。小明学习了BLP模型，并对该模型的特点进行了总结。以下对BLP模型的描述中，错误的是（）。","options":[{"k":"A","t":"BLP模型用于保证系统信息的完整性"},{"k":"B","t":"BLP的自主安全策略中，系统通过比较主体与客体的访问类属性控制主体对客体的访问"},{"k":"C","t":"BLP模型的规则是“向下读，向上写”"},{"k":"D","t":"BLP的强制安全策略使用一个访问控制矩阵表示"}],"answer":"A","src":"NISP一级模拟题","srcNum":28,"id":"n1_028","analyze":"BLP模型是一种强制访问控制模型用以保障机密性，向上写，向下读，自主访问控制模型使用一个访问控制矩阵表示。","expand":"","tags":["NISP一级","单选题"]},{"stem":"关于涉密载体，以下说法错误的是（）","options":[{"k":"A","t":"机密、秘密级涉密载体应当存放在密码文件柜中；"},{"k":"B","t":"绝密级涉密载体应当存放在密码保险柜中"},{"k":"C","t":"涉密计算机应当安装双网卡、一机双网（单位内网、涉密网），且两个网络互相隔离均不与互联网相通"},{"k":"D","t":"涉密载体应存放在涉密办公场所内，涉密办公场所要相对固定和独立，应当安装门禁、视频监控、防盗报警等安防系统，实行封闭管理"}],"answer":"C","src":"NISP一级模拟题","srcNum":29,"id":"n1_029","analyze":"涉密计算机禁止和外网连接","expand":"","tags":["NISP一级","单选题"]},{"stem":"防火墙是一个位于内外网之间的网络安全系统，以下对防火墙作用的描述不正确的是（）。","options":[{"k":"A","t":"抵抗外部攻击"},{"k":"B","t":"阻止所有访问"},{"k":"C","t":"保护内部网络"},{"k":"D","t":"防止恶意访问"}],"answer":"B","src":"NISP一级模拟题","srcNum":30,"id":"n1_030","analyze":"防火墙用来抵抗外部攻击、保护内部网络、防止恶意访问。","expand":"","tags":["NISP一级","单选题"]},{"stem":"二十世纪二十年代，德国发明家亚瑟谢尔比乌斯Enigma密码机。按照密码学发展历史阶段划分，这个阶段属于（）。","options":[{"k":"A","t":"古典密码学阶段"},{"k":"B","t":"近代密码学发展阶段"},{"k":"C","t":"现代密码学发展阶段"},{"k":"D","t":"当代密码学发展阶段"}],"answer":"A","src":"NISP一级模拟题","srcNum":31,"id":"n1_031","analyze":"Enigma密码机，按照密码学发展历史阶段划分，这个阶段属于古典密码阶段。","expand":"","tags":["NISP一级","单选题"]},{"stem":"TCP/IP是目前互联网使用的最基本的协议，也是互联网构成的基础协议。TCP/IP架构包括（）","options":[{"k":"A","t":"链路层、传输层、会话层、应用层"},{"k":"B","t":"网络层、传输层、表示层、应用层"},{"k":"C","t":"链路层、网络层、传输层、应用层"},{"k":"D","t":"物理层、链路层、网络层、应用层"}],"answer":"C","src":"NISP一级模拟题","srcNum":32,"id":"n1_032","analyze":"TCP/IP体系架构包括链路层、网络层、传输层、应用层四层。","expand":"","tags":["NISP一级","单选题"]},{"stem":"某移动智能终端支持通过指纹识别解锁系统的功能，与传统的基于口令的鉴别技术相比，关于此种鉴别技术说法不正确的是（）。","options":[{"k":"A","t":"此类系统一般由用户指纹信息采集和指纹信息识别两部分组成"},{"k":"B","t":"指纹信息是每个人独有的，指纹识别系统不存在安全威胁问题"},{"k":"C","t":"所选择的特征（指纹）便于收集、测量和比较"},{"k":"D","t":"每个人所拥有的指纹都是独一无二的"}],"answer":"B","src":"NISP一级模拟题","srcNum":33,"id":"n1_033","analyze":"指纹识别系统也会存在安全问题。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下哪个属于移动互联网安全威胁（）","options":[{"k":"A","t":"业务层面：非法业务访问、违法数据访问、拒绝服务攻击、垃圾信息的泛滥、不良信息的传播、个人隐私和敏感信息的泄露、内容版权盗用和不合理的使用。"},{"k":"B","t":"网络层面：接入网非法窃听、用户身份仿冒、服务器滥用占用带宽、破坏数据和信息完整性、非授权定位等。"},{"k":"C","t":"终端层面：病毒、木马、蠕虫、网络钓鱼、身份伪冒、DDOS攻击、窃取隐私、非授权使用资源、远程控制等。"},{"k":"D","t":"以上都是"}],"answer":"D","src":"NISP一级模拟题","srcNum":34,"id":"n1_034","analyze":"互联网安全威胁包括业务层面、网络层面、终端层面。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下不属于状态检测防火墙的优点的是（）。","options":[{"k":"A","t":"状态检测能够与跟踪网络会话有效地结合起来，并应用会话信息决定过滤规则。能够提供基于无连接协议的应用(如DNS等)及基于端口动态分配协议(如RPC)的应用的安全支持。"},{"k":"B","t":"具有记录有关通过的每个包的详细信息的能力，各数据包状态的所有信息都可以被记录，包括应用程序对包的请求、连接持续时间、内部和外部系统所做的连接请求等。"},{"k":"C","t":"处理速度快，在处理速度上具有一定的优势，由于所有的包过滤防火墙的操作都是在网络层上进行的，且在一般情况下仅仅检查数据包头，即处理速度很快，对网络性能影响也较小。"},{"k":"D","t":"安全性较高，状态防火墙结合网络配置和安全规定做出接纳、拒绝、身份认证、报警或给该通信加密等处理动作。一旦某个访问违反安全规定，就会拒绝该访问，并报告有关状态作日志记录。"}],"answer":"C","src":"NISP一级模拟题","srcNum":35,"id":"n1_035" 份的依据，不同的系统使用不同的方式表示实体的身份，同一个实体可以有多个不同的身份。鉴别是将标识和实体联系在一起的过程。鉴别是信息系统的第一道安全防线，也为其他安全服务提供支撑。","expand":"","tags":["NISP一级","单选题"]},{"stem":"我国的（ ）主要规定了关于数据电文、电子签名与认证及相关的法律责任。","options":[{"k":"A","t":"《中华人民共和国宪法》"},{"k":"B","t":"《中华人民共和国网络空间安全法》"},{"k":"C","t":"《中华人民共和国电子签名法》"},{"k":"D","t":"《商用密码管理条例》"}],"answer":"C","src":"NISP一级模拟题","srcNum":48,"id":"n1_048","analyze":"《中华人民共和国电子签名法》由中华人民共和国第十届全国人民代表大会常务委员会第十一次会议于2004年8月28日通过，自2005年4月1日起施行。共计5章，三十六条。主要内容是对电子签名的法律效力、适用范围和作为证据的真实性提出要求。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下属于防火墙的典型技术的是（）。","options":[{"k":"A","t":"静态包过滤"},{"k":"B","t":"代理防火墙与NAT"},{"k":"C","t":"状态检测技术"},{"k":"D","t":"以上都是"}],"answer":"D","src":"NISP一级模拟题","srcNum":49,"id":"n1_049","analyze":"防火墙的典型技术有：静态包过滤、代理防火墙与NAT、状态检测技术。","expand":"","tags":["NISP一级","单选题"]},{"stem":"在某信息系统的设计中，用户登录过程是这样的：（1）用户通过HTTP协议访问信息系统；（2）用户在登录页面输入用户名和口令；（3）信息系统在服务器端检查用户名和密码的正确性，如果正确，则鉴别完成。可以看出，这个鉴别过程属于（）。","options":[{"k":"A","t":"单向鉴别"},{"k":"B","t":"双向鉴别"},{"k":"C","t":"第三方鉴别"},{"k":"D","t":"三向鉴别"}],"answer":"A","src":"NISP一级模拟题","srcNum":50,"id":"n1_050","analyze":"根据题意属于单向鉴别","expand":"","tags":["NISP一级","单选题"]},{"stem":"堡垒主机是运维管理中广泛使用的一个安全设备，用于（）。","options":[{"k":"A","t":"对入侵行为进行检测并进行响应"},{"k":"B","t":"在公用网络上建立虚拟的专用网络"},{"k":"C","t":"解决远程维护操作安全问题"},{"k":"D","t":"对恶意代码进行过滤"}],"answer":"C","src":"NISP一级模拟题","srcNum":51,"id":"n1_051","analyze":"堡垒主机是运维管理中广泛使用的一个安全设备，用于解决远程维护操作安全问题。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下关于可信计算说法错误的是（）。","options":[{"k":"A","t":"可信的主要目的是要建立起主动防御的信息安全保障体系"},{"k":"B","t":"可信计算机安全评价标准(TCSEC)中第一次提出了可信计算机和可信计算基的概念"},{"k":"C","t":"可信的整体框架包含终端可信、终端应用可信、操作系统可信、网络互联可信、互联网交易等应用系统可信"},{"k":"D","t":"可信计算平台出现后会取代传统的安全防护体系和方法"}],"answer":"D","src":"NISP一级模拟题","srcNum":52,"id":"n1_052","analyze":"可信计算平台出现后不会取代传统的安全防护体系和方法。","expand":"","tags":["NISP一级","单选题"]},{"stem":"SSH协议是在（）与（）之间的加密隧道应用协议。","options":[{"k":"A","t":"网络层传输层"},{"k":"B","t":"传输层应用层"},{"k":"C","t":"数据链路层网络层"},{"k":"D","t":"网络层应用层"}],"answer":"B","src":"NISP一级模拟题","src "},{"k":"B","t":"W.Diffie和M.E.Hellman公布了一种密钥一致性算法"},{"k":"C","t":"转轮机的出现"},{"k":"D","t":"一些学者提出了公开密钥体制"}],"answer":"A","src":"NISP一级模拟题","srcNum":172,"id":"n1_172","analyze":"1949年香农(Shannon)发表了划时代论文“保密系统的通信理论”，奠定了密码学的理论基础。密码学由此进入了近代密码阶段，开始成为一门科学。","expand":"","tags":["NISP一级","单选题"]},{"stem":"我们经常使用Ping命令检查网络通不通，Ping命令属于（）协议，位于 TCP/IP协议的（）。","options":[{"k":"A","t":"ICMP传输层"},{"k":"B","t":"IGMP网络层"},{"k":"C","t":"ICMP网络层"},{"k":"D","t":"IGMP应用层"}],"answer":"C","src":"NISP一级模拟题","srcNum":173,"id":"n1_173","analyze":"Ping命令属于ICMP协议，位于 TCP/IP协议的网络层。","expand":"","tags":["NISP一级","单选题"]},{"stem":"在信息系统中，（）是在为系统资源提供最大限度共享的基础上对用户的访问权进行管理，防止对信息的非授权篡改和滥用。","options":[{"k":"A","t":"身份认证"},{"k":"B","t":"访问控制"},{"k":"C","t":"安全审计"},{"k":"D","t":"数字签名"}],"answer":"B","src":"NISP一级模拟题","srcNum":174,"id":"n1_174","analyze":"在信息系统中，访问控制是在为系统资源提供最大限度共享的基础上对用户的访问权进行管理，防止对信息的非授权篡改和滥用。","expand":"","tags":["NISP一级","单选题"]},{"stem":"小蓝用的小绿的密钥加密明文，将密文发送给小绿。小绿再用自己的私钥解密，恢复出明文。以下说法正确的是（）。","options":[{"k":"A","t":"采用了对称密码体制"},{"k":"B","t":"采用了公钥密码体制"},{"k":"C","t":"采用了复合密码体制"},{"k":"D","t":"采用了单钥密码体制"}],"answer":"B","src":"NISP一级模拟题","srcNum":175,"id":"n1_175","analyze":"题干中采取了公钥加密私钥解密的公钥密码体制。","expand":"","tags":["NISP一级","单选题"]},{"stem":"邮件炸弹攻击原理是（ ）","options":[{"k":"A","t":"对受害者服务器发起拒绝服务攻击，使受害者无法接收邮件"},{"k":"B","t":"窃取受害者邮箱密码"},{"k":"C","t":"消耗受害者的邮箱空间"},{"k":"D","t":"攻击受害者电脑，向电脑内植入木马"}],"answer":"C","src":"NISP一级模拟题","srcNum":176,"id":"n1_176","analyze":"邮件炸弹是通过向接收者的邮件地址发送大量的电子邮件，消耗接收者的邮箱空间，最终因空间不足而无法接收新的邮件，导致其他用户发送的电子邮件被丢失或退回。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下哪个不是关于防火墙的企业部署方式（）","options":[{"k":"A","t":"单防火墙(无DMZ)部署方式"},{"k":"B","t":"防火墙Route-路由模式"},{"k":"C","t":"单防火墙(DMZ)部署方式"},{"k":"D","t":"双(多)防火墙部署方式"}],"answer":"B","src":"NISP一级模拟题","srcNum":177,"id":"n1_177","analyze":"防火墙的企业部署方式有：单防火墙(无DMZ)部署方式、单防火墙(DMZ)部署方式、双(多)防火墙部署方式。","expand":"","tags":["NISP一级","单选题"]},{"stem":"有一些情况要求由双方均信任的第三方来确认用户和服务器的身份。这个属于哪种鉴别类型（）","options":[{"k":"A","t":"单项鉴别"},{"k":"B","t":"双向鉴别"},{"k":"C","t":"第三方鉴别"},{"k":"D","t":"以上都不是"}],"answer":"C","src":"NISP一级模拟题","srcNum":178,"id":"n1_178","analyze":"有一些情况要求由双方均信任的第三方进行鉴别，以确认用户和服务器的身份。属于第三方鉴别。","expand":"","tags":["NISP一级","单选题"]},{"stem":"状态检测防火墙对数据包的抽取包括（）。","options":[{"k":"A","t":"源地址、源端口号、目的地址、目的端口号、使用协议"},{"k":"B","t":"当前的会话状态、顺序号、应答标记、防火墙的执行动作"},{"k":"C","t":"最新报文的寿命"},{"k":"D","t":"以上都是"}],"answer":"D","src":"NISP一级模拟题","srcNum":179,"id":"n1_179","analyze":"状态检测防火墙对数据包的数据抽取不仅仅包括数据包的源地址、源端口号、目的地址、目的端口号、使用协议等五元组，还包括会话当前的状态属性、顺序号、应答标记、防火墙的执行动作及最新报文的寿命等信息。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下不属于防火墙的作用的是（）。","options":[{"k":"A","t":"隔离两个不同安全要求的网络。"},{"k":"B","t":"根据定义的控制策略，检查并控制这个两个安全域之间所有流量。"},{"k":"C","t":"进出网络边界的数据进行保护，防止恶意入侵、恶意代码的传播等。"},{"k":"D","t":"保障外部网络数据的安全。"}],"answer":"D","src":"NISP一级模拟题","srcNum":180,"id":"n1_180","analyze":"防火墙保障的内部网络数据的安全。","expand":"","tags":["NISP一级","单选题"]},{"stem":"（）是无线通信技术与网络技术相结合的产物是通过无线信道来实现网络设备之间的通信，是目前应用最为广泛的一种短程无线传输技术。","options":[{"k":"A","t":"远程网（LHN）"},{"k":"B","t":"局域网（LAN）"},{"k":"C","t":"无线局域网（WLAN）"},{"k":"D","t":"广域网（WAN）"}],"answer":"C","src":"NISP一级模拟题","srcNum":181,"id":"n1_181","analyze":"无线局域网(WLAN)是无线通信技术与网络技术相结合的产物，是通过无线信道来实现网络设备之间的通信，是目前应用最为广泛的一种短程无线传输技术。","expand":"","tags":["NISP一级","单选题"]},{"stem":"密码学是一门古老又现代的学科。几千年前，它作为神秘性和艺术性的字谜呈现，而现代密码学，作为数学、计算机、电子、通信、网络等领域的一门交叉学科，广泛应用于军事、商业和现代社会人们生产、生活的方方面面。古代密码学的形成于发展在（）。","options":[{"k":"A","t":"1949~1975"},{"k":"B","t":"1940年以前"},{"k":"C","t":"1949年以前"},{"k":"D","t":"1946年以前"}],"answer":"C","src":"NISP一级模拟题","srcNum":182,"id":"n1_182","analyze":"密码学的发展历史，古典密码学（1949年之前）、近代密码学（1949~1975）、现代密码学（1976年以后）。","expand":"","tags":["NISP一级","单选题"]},{"stem":"正确的选择防火墙能够更加有效的防护网络安全，在选择防火墙类型时基本原则包括（）。","options":[{"k":"A","t":"大企业根据部署位置选择防火墙"},{"k":"B","t":"中小企业根据网络规模选择防火墙"},{"k":"C","t":"考查厂商的服务"},{"k":"D","t":"以上都是"}],"answer":"D","src":"NISP一级模拟题","srcNum":183,"id":"n1_183","analyze":"选择防火墙类型时基本原则有大企业根据部署位置选择防火墙；中小企业根据网络规模选择防火墙；考查厂商的服务。","expand":"","tags":["NISP一级","单选题"]},{"stem":"密码学中运用（）算法，加密和解密使用不同秘钥。","options":[{"k":"A","t":"对称加密"},{"k":"B","t":"哈希"},{"k":"C","t":"公钥加密"},{"k":"D","t":"随机加密"}],"answer":"C","src":"NISP一级模拟题","srcNum":184,"id":"n1_184","analyze":"公钥加密算法加密解密使用不同的密钥。","expand":"","tags":["NISP一级","单选题"]},{"stem":"下面不属于第二百八十七条 之一 【非法利用信息网络罪】的是（）","options":[{"k":"A","t":"设立用于实施诈骗、传授犯罪方法、制作或者销售违禁物品、管制物品等违法犯罪活动的网站、通讯群组的"},{"k":"B","t":"向他人出售或者提供公民个人信息，情节严重的"},{"k":"C","t":"发布有关制作或者销售毒品、枪支、淫秽物品等违禁物品、管制物品或者其他违法犯罪信息的"},{"k":"D","t":"为实施诈骗等违法犯罪活动发布信息的"}],"answer":"B","src":"NISP一级模拟题","srcNum":185,"id":"n1_185","analyze":"第二百五十三条之一：【侵犯公民个人信息罪】违反国家有关规定，向他人出售或者提供公民个人信息，情节严重的，处三年以下有期徒刑或者拘役，并处或者单处罚金;情节特别严重的，处三年以上七年以下有期徒刑，并处罚金。","expand":"","tags":["NISP一级","单选题"]},{"stem":"数据传输可分为有线传输和无线传输，以下不属于有线传输的是（）。","options":[{"k":"A","t":"光纤"},{"k":"B","t":"双绞线"},{"k":"C","t":"无线电波"},{"k":"D","t":"同轴电缆"}],"answer":"C","src":"NISP一级模拟题","srcNum":186,"id":"n1_186","analyze":"无线电波属于无线传输。","expand":"","tags":["NISP一级","单选题"]},{"stem":"漏洞扫描技术是一类重要的网络安全技术。它和防火墙、入侵检测系统互相配合，能够有效提高网络的安全性。对于漏洞扫描的原理：1、返回响应；2、发送探测数据包；3、读取漏洞信息；4、特征匹配分析。正确的顺序为（）。","options":[{"k":"A","t":"1->3->2->4"},{"k":"B","t":"3->4->2->1"},{"k":"C","t":"1->2->3->4"},{"k":"D","t":"3->2->1->4"}],"answer":"D","src":"NISP一级模拟题","srcNum":187,"id":"n1_187","analyze":"漏洞扫描的原理：1、读取漏洞信息；2、发送探测数据包；3、返回响应；4、特征匹配分析。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下哪个不符合数据采集阶段的安全要求（）","options":[{"k":"A","t":"定义采集数据的目的和用途，明确数据采集源和采集数据范围"},{"k":"B","t":"遵循合规原则，确保数据采集的合法性，正当性和必要性"},{"k":"C","t":"遵循数据最大化原则，采集满足业务所需的所有数据"},{"k":"D","t":"遵循质量保障原则，制定数据质量保障的策略、规程和要求"}],"answer":"C","src":"NISP一级模拟题","srcNum":188,"id":"n1_188","analyze":"在数据采集阶段，安全要求为：定义采集数据的目的和用途，明确数据采集源和采集数据范围；遵循合规原则，确保数据采集的合法性，正当性和必要性；遵循数据最小化原则，只采集满足业务所需的最少数据；遵循质量保障原则，制定数据质量保障的策略、规程和要求；遵循确保安全原则，对采集的数据进行分类分级标识，并对不同类和级别的数据实施相应的安全管理策略和保障措施，对数据采集环境、设施和技术采取必要的安全管控措施。","expand":"","tags":["NISP一级","单选题"]},{"stem":"我们经常从网站上下载软件，为了确保系统安全，以下哪个处理措施最正确( )","options":[{"k":"A","t":"下载完成自动安装"},{"k":"B","t":"先做系统备份，安装后有异常直接恢复系统"},{"k":"C","t":"下载后直接安装使用"},{"k":"D","t":"下载后先使用杀毒软件进行病毒查杀再安装使用"}],"answer":"D","src":"NISP一级模拟题","srcNum":189,"id":"n1_189","analyze":"安装前先使用杀毒软件进行病毒查杀可降低安全风险","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下防范即时通信安全威胁做法错误的是（ ）","options":[{"k":"A","t":"聊天时不发送个人敏感信息"},{"k":"B","t":"进行转账等操作时通过电话等可靠渠道二次确认"},{"k":"C","t":"不随意点击群里的链接"},{"k":"D","t":"在朋友圈发布自己在工作单位的自拍照"}],"answer":"D","src":"NISP一级模拟题","srcNum":190,"id":"n1_190","analyze":"随意发布自己在工作单位的自拍照会有敏感信息泄露等风险","expand":"","tags":["NISP一级","单选题"]},{"stem":"按网络的作用范围可将计算机网络分为广域网、城域网、局域网，下列说法不正确的是（）。","options":[{"k":"A","t":"Internet是目前最大的广域网。"},{"k":"B","t":"城域网的一个重要用途是用作骨干网。"},{"k":"C","t":"城域网通常跨接很大的物理范围，能连接多个城市、国家。"},{"k":"D","t":"在计算机网络和工业业务发展初期，各企业管理信息系统和访问信息系统的用户基本都处在局域网内。"}],"answer":"C","src":"NISP一级模拟题","srcNum":191,"id":"n1_191","analyze":"城域网的作用范围达不到国家。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下可能会造成信息泄露的是（ ）","options":[{"k":"A","t":"将含有机密信息的文件锁在柜中"},{"k":"B","t":"复制和打印的资料及时拿走"},{"k":"C","t":"在微博等社交媒体谈论公司信息"},{"k":"D","t":"离开时，锁定电脑屏幕"}],"answer":"C","src":"NISP一级模拟题","srcNum":192,"id":"n1_192","analyze":"在社交媒体谈论公司信息可能会被别有用心的人看到，造成信息泄露","expand":"","tags":["NISP一级","单选题"]},{"stem":"世界上第一个计算机网络是（）。","options":[{"k":"A","t":"ARPANET"},{"k":"B","t":"INTERNET"},{"k":"C","t":"CHINANET"},{"k":"D","t":"CERNET"}],"answer":"A","src":"NISP一级模拟题","srcNum":193,"id":"n1_193","analyze":"世界上第一个计算机网络是ARPANET。","expand":"","tags":["NISP一级","单选题"]},{"stem":"密码学作为信息安全的关键技术，其安全目标主要包括三个非常重要的方面：保密性、完整性和可用性。（ ）是确保信息仅被合法用户访问，而不被泄露给非授权的用户、实体或过程，或供其利用的特性。","options":[{"k":"A","t":"保密性"},{"k":"B","t":"完整性"},{"k":"C","t":"可用性"},{"k":"D","t":"以上都不是"}],"answer":"A","src":"NISP一级模拟题","srcNum":194,"id":"n1_194","analyze":"保密性是确保信息仅被合法用户访问，而不被泄露给非授权的用户、实体或过程，或供其利用的特性","expand":"","tags":["NISP一级","单选题"]},{"stem":"在安全设置的账户策略中开启密码必须符合复杂性要求，设置密码长度最小值为2，那么在实际使用中，用户可设置的密码最小长度是（ ）","options":[{"k":"A","t":"6"},{"k":"B","t":"3"},{"k":"C","t":"2"},{"k":"D","t":"8"}],"answer":"B","src":"NISP一级模拟题","srcNum":195,"id":"n1_195","analyze":"密码长度最小值为2，所以密码长度设置范围为2到14个字符，但因为开启了密码必须符合复杂性要求所以密码必须包含大小写字母、数字、特殊字符其中的三项","expand":"","tags":["NISP一级","单选题"]},{"stem":"某单位系统管理员对组织内核心资源的访问制定访问策略，针对每个用户指明能够访问的资源，对于不在指定资源列表中的对象不允许访问。该访问控制策略属于（）。","options":[{"k":"A","t":"自主访问控制"},{"k":"B","t":"强制访问控制"},{"k":"C","t":"基于角色的访问控制"},{"k":"D","t":"基于任务的访问控制"}],"answer":"A","src":"NISP一级模拟题","srcNum":196,"id":"n1_196","analyze":"“针对每个用户指明能够访问的资源”属于自主访问控制。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下不属于主机检测系统的优点的是（）。","options":[{"k":"A","t":"分析网络报文"},{"k":"B","t":"监视所有网络"},{"k":"C","t":"仅能保护安装了产品的主机"},{"k":"D","t":"能够检测到攻击行为的后果"}],"answer":"C","src":"NISP一级模拟题","srcNum":197,"id":"n1_197","analyze":"C选项是主机检测系统的缺点","expand":"","tags":["NISP一级","单选题"]},{"stem":"为保障信息系统的安全性，信息系统还需具备不可否认性，其中不可否认性指（）","options":[{"k":"A","t":"信息在传输、交换、存储和处理过程保持非修改、非破坏和非丢失的特性"},{"k":"B","t":"对流通在网络系统中的信息传播及具体内容能够实现有效控制的特性"},{"k":"C","t":"通信双方在信息交互过程中，所有参与者都不可能否认或抵赖本人所做的操作"},{"k":"D","t":"信息按给定要求不泄漏给非授权的个人、实体或过程"}],"answer":"C","src":"NISP一级模拟题","srcNum":198,"id":"n1_198","analyze":"不可否认性：证明要求保护的事件或动作及其发起实体的行为。在法律上，不可否认意味着交易的一方不能拒绝已经接收到交易，另一方也不能拒绝已经发送的交易。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下关于序列密码说法不正确的是（）。","options":[{"k":"A","t":"序列密码是单独地加密每个明文位"},{"k":"B","t":"序列密码的加密和解密使用相同的函数"},{"k":"C","t":"由于序列密码小而快，所以它们非常合适计算资源有限的应用"},{"k":"D","t":"现实生活中序列密码的使用比分组密码更为广泛，例如Internet安全领域"}],"answer":"D","src":"NISP一级模拟题","srcNum":199,"id":"n1_199","analyze":"分组密码比序列密码更广泛。","expand":"","tags":["NISP一级","单选题"]},{"stem":"（）是使信息在客体间流动的一种实体。（）是一种信息实体，或者是从其它主体或客体接收信息的实体。通常（）是指人、进程或设备等。通常数据块、存储页、文件、目录、程序等都属于（）。","options":[{"k":"A","t":"主体客体主体客体"},{"k":"B","t":"主体主体客体客体"},{"k":"C","t":"主体客体客体主体"},{"k":"D","t":"客体主体客体主体"}],"answer":"A","src":"NISP一级模拟题","srcNum":200,"id":"n1_200","analyze":"主体是使信息在客体间流动的一种实体。通常主体是指人、进程或设备等。客体是一种信息实体，或者是从其它主体或客体接收信息的实体。通常数据块、存储页、文件、目录、程序等都属于客体。","expand":"","tags":["NISP一级","单选题"]},{"stem":"在TCP/IP协议中，IGMP协议指的是（），位于TCP/IP协议的（）。","options":[{"k":"A","t":"Internet组管理协议传输层"},{"k":"B","t":"Internet组管理协议网络层"},{"k":"C","t":"Internet控制报文协议网络层"},{"k":"D","t":"Internet控制报文协议传输层"}],"answer":"B","src":"NISP一级模拟题","srcNum":201,"id":"n1_201","analyze":"在TCP/IP协议中，IGMP协议指的是Internet 组管理协议，位于TCP/IP协议的网络层。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下不属于无线传输带来的不安全因素（）。","options":[{"k":"A","t":"通信内容容易被窃听"},{"k":"B","t":"通信内容可以被更改"},{"k":"C","t":"通信线路被截断"},{"k":"D","t":"通信双方的身份肯被假冒"}],"answer":"C","src":"NISP一级模拟题","srcNum":202,"id":"n1_202","analyze":"无线通信网络带来一些不安全因素，如通信内容容易被窃听、通信内容可以被更改和通信双方身份可能被假冒。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下不属于网闸的局限性的是（）。","options":[{"k":"A","t":"非实时连接"},{"k":"B","t":"实时连接"},{"k":"C","t":"需要专有硬件"},{"k":"D","t":"对应用的支持有限"}],"answer":"B","src":"NISP一级模拟题","srcNum":203,"id":"n1_203","analyze":"网闸是非实时连接的。","expand":"","tags":["NISP一级","单选题"]},{"stem":"https是很多网站采用的网页访问协议，以下关于https与http相比的优势说法正确的是（ ）","options":[{"k":"A","t":"https访问速度比http快"},{"k":"B","t":"https安全性比http高"},{"k":"C","t":"https对服务器资源的占用小于http"},{"k":"D","t":"https性能比http要好"}],"answer":"B","src":"NISP一级模拟题","srcNum":204,"id":"n1_204","analyze":"https是基于HTTP协议，通过SSL或TLS提供加密处理数据、验证对方身份以及数据完整性保护，安全性方面要优于http","expand":"","tags":["NISP一级","单选题"]},{"stem":"从信息系统安全角度处理信息安全问题，设备安全已然成为人们关注的重点，以下属于设备安全的要求的是（）。","options":[{"k":"A","t":"稳定性"},{"k":"B","t":"可靠性"},{"k":"C","t":"可用性"},{"k":"D","t":"以上都是"}],"answer":"D","src":"NISP一级模拟题","srcNum":205,"id":"n1_205","analyze":"对设备安全的要求包括稳定性、可靠性、可用性等。","expand":"","tags":["NISP一级","单选题"]},{"stem":"网络安全法第三十五条规定关键信息基础设施的运营者采购网络产品和服务，可能影响国家安全的，应当通过国家（）会同国务院有关部门组织的国家安全审查。","options":[{"k":"A","t":"公安部"},{"k":"B","t":"国家安全部"},{"k":"C","t":"网信部门"},{"k":"D","t":"国家保密局"}],"answer":"C","src":"NISP一级模拟题","srcNum":206,"id":"n1_206","analyze":"网络安全法","expand":"","tags":["NISP一级","单选题"]},{"stem":"依据信息安全基本属性定义，下面数据的完整性体现为（）","options":[{"k":"A","t":"被泄露给非授权用户、实体或过程"},{"k":"B","t":"不能够否认所发送的数据"},{"k":"C","t":"被授权实体访问并按需求使用"},{"k":"D","t":"未经授权不能进行更改"}],"answer":"D","src":"NISP一级模拟题","srcNum":207,"id":"n1_207","analyze":"完整性是保证信息系统中的数据处于完整的状态，确保信息没有遭受篡改和破坏。","expand":"","tags":["NISP一级","单选题"]},{"stem":"为保证安全，在使用浏览器浏览网页时，以下那条是正确的 ( )","options":[{"k":"A","t":"所有网站都可以浏览"},{"k":"B","t":"只浏览证实为安全，合法的网站"},{"k":"C","t":"只要不是有反动言论的网站都可以浏览"},{"k":"D","t":"只要不是盗版软件下载网站都可以浏览"}],"answer":"B","src":"NISP一级模拟题","srcNum":208,"id":"n1_208","analyze":"并不是只有盗版软件下载网站和拥有反动言论的网站会有安全风险","expand":"","tags":["NISP一级","单选题"]},{"stem":"下列哪项是正确使用邮箱的方式（ ）","options":[{"k":"A","t":"为工作邮箱和个人邮箱设置不同的密码"},{"k":"B","t":"为工作邮箱设置易于记忆的密码，例如123456"},{"k":"C","t":"使用工作邮箱发送和工作无关的邮件给同事"},{"k":"D","t":"关闭邮箱的SSL支持选项"}],"answer":"A","src":"NISP一级模拟题","srcNum":209,"id":"n1_209","analyze":"设置不同的密码可以防止一个密码泄露影响两个邮箱安全","expand":"","tags":["NISP一级","单选题"]},{"stem":"统一威胁管理系统是集防火墙、防病毒、入侵检测、上网行为管理等多种网络安全功能于一体的网络安全设备。下列哪个是它的优势（）。","options":[{"k":"A","t":"模块化管理，比较容易使用"},{"k":"B","t":"功能集成带来的风险集中"},{"k":"C","t":"资源整合带来的高成本"},{"k":"D","t":"以上都是"}],"answer":"A","src":"NISP一级模拟题","srcNum":210,"id":"n1_210","analyze":"统一威胁管理系统（UTM）的优势：资源整合带来的低成本、模块化管理，比较容易使用、配置工作量小，能够提高安全管理人员的工作效率。","expand":"","tags":["NISP一级","单选题"]},{"stem":"在一个给定的网络中，客户C需要访问服务器S的服务，客户C必须被服务器S鉴别，同时客户C也需要鉴别服务器S，那么这种鉴别属于哪种类型的鉴别（）","options":[{"k":"A","t":"单项鉴别"},{"k":"B","t":"双向鉴别"},{"k":"C","t":"第三方鉴别"},{"k":"D","t":"以上都不是"}],"answer":"B","src":"NISP一级模拟题","srcNum":211,"id":"n1_211","analyze":"在一个给定的网络中，客户C需要访问服务器S的服务，客户C必须被服务器S鉴别，客户C也需要鉴别服务器S，则称为双向鉴别。","expand":"","tags":["NISP一级","单选题"]},{"stem":"关于访问控制列表，不正确的说法是（）。","options":[{"k":"A","t":"是以文件为中心建立访问权限表"},{"k":"B","t":"查询特定主体访问客体时不需要遍历查询所有客体的ACL"},{"k":"C","t":"判断对特定客体的授权访问，可访问的主体和访问权限等"},{"k":"D","t":"访问控制列表(ACL)是一种基于包过滤的访问控制技术"}],"answer":"B","src":"NISP一级模拟题","srcNum":212,"id":"n1_212","analyze":"查询特定主体访问客体时需要遍历查询所有客体的ACL","expand":"","tags":["NISP一级","单选题"]},{"stem":"影响密码系统安全性的基本因素不包括（）","options":[{"k":"A","t":"密码算法复杂度"},{"k":"B","t":"密钥随机性"},{"k":"C","t":"密码复杂度"},{"k":"D","t":"密钥长度"}],"answer":"C","src":"NISP一级模拟题","srcNum":213,"id":"n1_213","analyze":"影响密码系统安全性的基本因素包括：密码算法复杂度、密钥机密性和密钥长度等。","expand":"","tags":["NISP一级","单选题"]},{"stem":"小刘是某公司新入职的员工，公司要求他注册一个公司网站的账号，小刘使用一个安全一点的密码，请问以下选项中哪个密码是最安全（）。","options":[{"k":"A","t":"与用户名相同的密码"},{"k":"B","t":"自己的姓名和出生日期"},{"k":"C","t":"一个单词"},{"k":"D","t":"数字、字母和特殊符号混合且自己容易记住"}],"answer":"D","src":"NISP一级模拟题","srcNum":214,"id":"n1_214","analyze":"D选项更安全。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下关于包过滤技术的缺点说法错误的是（）。","options":[{"k":"A","t":"过滤规则集合复杂，配置困难。"},{"k":"B","t":"能防止地址欺骗，不能防止外部客户与内部主机直接连接。"},{"k":"C","t":"对于网络服务较多、结构较为复杂的网络，包过滤的规则可能很多，配置起来复杂，而且对于配置结果不易检查验证配置的正确性。"},{"k":"D","t":"由于过滤判别的只有网络层和传输层的有限信息，所以无法满足对应用层信息进行过滤的安全要求。"}],"answer":"B","src":"NISP一级模拟题","srcNum":215,"id":"n1_215","analyze":"包过滤技术不能防止地址欺骗。","expand":"","tags":["NISP一级","单选题"]},{"stem":"强制访问控制(MAC)是主体和客体都有一个固定的安全属性，系统通过比较客体和主体的安全属性，根据已经确定的访问控制规则限制来决定主体是否可访问客体。关于强制访问控制模型，下面说法错误的是（）","options":[{"k":"A","t":"强制访问控制规则强制执行的，系统中的主体和客体均无权更改。"},{"k":"B","t":"强制访问控制比自主访问控制具有更高的安全性，不能有效防范特洛伊木马。"},{"k":"C","t":"强制访问控制可以防止在用户无意或不负责任的操作时泄露机密信息，适用于专用或安全性要求较高的系统。"},{"k":"D","t":"强制访问控制在用户共享数据方面不灵活。"}],"answer":"B","src":"NISP一级模拟题","srcNum":216,"id":"n1_216","analyze":"强制访问控制比自主访问控制具有更高的安全性，能有效防范特洛伊木马。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下关于防火墙和网闸的说法错误的是（）。","options":[{"k":"A","t":"防火墙是实现物理隔离的。"},{"k":"B","t":"网闸是是实现物理隔离或协议隔离。"},{"k":"C","t":"通过防火墙进行数据交换，会话双方是实时连接的。"},{"k":"D","t":"通过网闸进行数据交换，会话双方是非实时连接的。"}],"answer":"A","src":"NISP一级模拟题","srcNum":217,"id":"n1_217","analyze":"防火墙是实现逻辑隔离的。","expand":"","tags":["NISP一级","单选题"]},{"stem":"下面哪些不属于即时通信存在的安全风险 ( )","options":[{"k":"A","t":"恶意代码传播"},{"k":"B","t":"网络欺诈"},{"k":"C","t":"即时通信系统自身安全问题"},{"k":"D","t":"操作系统漏洞利用"}],"answer":"D","src":"NISP一级模拟题","srcNum":218,"id":"n1_218","analyze":"即时通信应用系统所面临的安全问题包括：即时通信应用信息系统自身安全风险、利用即时通信传播恶意代码、利用即时通信破坏防御系统、网络欺诈及非法信息","expand":"","tags":["NISP一级","单选题"]},{"stem":"广域网也称远程网，通常跨接很大的物理范围，所覆盖的范围从几十公里到几千公里。以下选项中，属于广域网的是（）。","options":[{"k":"A","t":"宿舍网"},{"k":"B","t":"校园网"},{"k":"C","t":"公司网"},{"k":"D","t":"国家网"}],"answer":"D","src":"NISP一级模拟题","srcNum":219,"id":"n1_219","analyze":"国家网属于广域网。","expand":"","tags":["NISP一级","单选题"]},{"stem":"关于对称加密和非对称加密，下列说法正确的是（）","options":[{"k":"A","t":"非对称加密体系要求通信双方事先传递密钥才能完成保密通信，并且密钥管理方便，可实现防止假冒和抵赖"},{"k":"B","t":"非对称加密指加密和解密使用不同密钥的加密算法，也称为公私钥加密。"},{"k":"C","t":"对称加密算法比非对称加密算法快，在保护通信安全方面，对称加密算法具有非对称密码难以企及的优势。"},{"k":"D","t":"非对称加密算法的特点是计算量小、加密速度快、加密效率高。"}],"answer":"B","src":"NISP一级模拟题","srcNum":220,"id":"n1_220","analyze":"A.非对称加密体系不要求通信双方事先传递密钥。C.在保护通信安全方面，非对称加密算法却具有对称密码难以企及的优势。D.对称加密算法的特点是算法公开、计算量小、加密速度快、加密效率高。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下哪个属于工业控制系统（）","options":[{"k":"A","t":"数据采集与监控系统（SCADA）"},{"k":"B","t":"分布式控制系统（DCS）"},{"k":"C","t":"可编辑逻辑控制器（PLC）"},{"k":"D","t":"以上都是"}],"answer":"D","src":"NISP一级模拟题","srcNum":221,"id":"n1_221","analyze":"数据采集与监控系统（SCADA）、分布式控制系统（DCS）、可编辑逻辑控制器（PLC）都属于工业控制系统。","expand":"","tags":["NISP一级","单选题"]},{"stem":"自主访问模型（DAC）通常使用（）来实现访问控制功能","options":[{"k":"A","t":"访问控制矩阵"},{"k":"B","t":"访问控制能力表"},{"k":"C","t":"访问控制主体"},{"k":"D","t":"访问控制客体"}],"answer":"B","src":"NISP一级模拟题","srcNum":222,"id":"n1_222","analyze":"DAC通常使用访问控制表(ACL)或能力表(CL)来实现访问控制功能","expand":"","tags":["NISP一级","单选题"]},{"stem":"在ISO 的OSI安全体系结构中，以下哪一个安全机制可以提供抗抵赖安全服务（）。","options":[{"k":"A","t":"加密信息"},{"k":"B","t":"数字签名"},{"k":"C","t":"访问控制"},{"k":"D","t":"路由控制"}],"answer":"B","src":"NISP一级模拟题","srcNum":223,"id":"n1_223","analyze":"数字签名可以提供抗抵赖、鉴别和完整性。","expand":"","tags":["NISP一级","单选题"]},{"stem":"网卡是网络接口卡(NIC)的简称，它是计算机或其它网络设备所附带的适配器，用于与其他计算机或网络设备进行通信。工作在OSI七层模型中的（）","options":[{"k":"A","t":"物理层"},{"k":"B","t":"数据链路层"},{"k":"C","t":"网络层"},{"k":"D","t":"传输层"}],"answer":"B","src":"NISP一级模拟题","srcNum":224,"id":"n1_224","analyze":"在OSI七层模型中，网卡工作在第二层，即数据链路层。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下属于代理防火墙的优点的是（）。","options":[{"k":"A","t":"可避免内外网主机的直接连接，从可以隐藏内部IP地址，而更好的保护内部计算机。"},{"k":"B","t":"以与认证、授权等安全手段方便地集成，面向用户授权。"},{"k":"C","t":"为用户提供透明的加密机制。"},{"k":"D","t":"以上都是"}],"answer":"D","src":"NISP一级模拟题","srcNum":225,"id":"n1_225","analyze":"代理防火墙的优点：可避免内外网主机的直接连接，从可以隐藏内部IP地址，而更好的保护内部计算机；以与认证、授权等安全手段方便地集成，面向用户授权；为用户提供透明的加密机制。","expand":"","tags":["NISP一级","单选 :"外网——交换机——内网主机——防火墙"},{"k":"C","t":"外网——内网主机——交换机——防火墙"},{"k":"D","t":"外网——防火墙——交换机——内网主机"}],"answer":"D","src":"NISP一级模拟题","srcNum":358,"id":"n1_358","analyze":"防火墙一般部署在内网和外网边界。","expand":"","tags":["NISP一级","单选题"]},{"stem":"防火墙是网络信息系统建设中常采用的一类产品，它在内外网隔离方面的作用是（）。","options":[{"k":"A","t":"既能物理隔离，又能逻辑隔离"},{"k":"B","t":"能物理隔离，不能逻辑隔离"},{"k":"C","t":"不能物理隔离，能逻辑隔离"},{"k":"D","t":"不能物理隔离，也不能逻辑隔离"}],"answer":"C","src":"NISP一级模拟题","srcNum":359,"id":"n1_359","analyze":"防火墙能实现逻辑隔离，不能物理隔离。","expand":"","tags":["NISP一级","单选题"]},{"stem":"目前广泛应用于浏览器与服务器之间身份认证和加密数据传输的协议是（）。","options":[{"k":"A","t":"SSH协议"},{"k":"B","t":"SMTP协议"},{"k":"C","t":"SSL协议"},{"k":"D","t":"HTTP协议"}],"answer":"C","src":"NISP一级模拟题","srcNum":360,"id":"n1_360","analyze":"目前广泛应用于浏览器与服务器之间身份认证和加密数据传输的协议是SSL协议。","expand":"","tags":["NISP一级","单选题"]},{"stem":"关于移动互联网安全风险，下列属于开放信道带来的安全风险的是（）","options":[{"k":"A","t":"通信内容可能被窃听，篡改、通信用户身份可能被假冒等安全风险。"},{"k":"B","t":"业务流程缺乏安全风险分析，使得用户的个人利益受到损害。"},{"k":"C","t":"智能终端功能不断的多样化，使得安全风险不断累积，为用户带来了越来越多的安全风险。"},{"k":"D","t":"对不良信息没有严格审核，产生了一些不良的影响，包括色情、虚假、夸大甚至非法言论。"}],"answer":"A","src":"NISP一级模拟题","srcNum":361,"id":"n1_361","analyze":"开封信道会带来的安全风险有：通信内容可能被窃听，篡改、通信用户身份可能被假冒等安全风险。","expand":"","tags":["NISP一级","单选题"]},{"stem":"通过扫描发现系统漏洞后，可通过以下哪种方式来弥补漏洞( )","options":[{"k":"A","t":"安装系统补丁"},{"k":"B","t":"重装系统"},{"k":"C","t":"卸载所有软件"},{"k":"D","t":"利用杀毒软件进行杀毒"}],"answer":"A","src":"NISP一级模拟题","srcNum":362,"id":"n1_362","analyze":"安装系统补丁，就是通过安装相应的补丁软件，补上系统中的漏洞","expand":"","tags":["NISP一级","单选题"]},{"stem":"大数据的生命周期包括（）","options":[{"k":"A","t":"数据采集、数据存储、数据处理、数据分发、数据删除"},{"k":"B","t":"数据采集、数据存储、数据处理、数据加密、数据删除"},{"k":"C","t":"数据采集、数据加密、数据处理、数据分发、数据删除"},{"k":"D","t":"数据采集、数据存储、数据处理、数据分发、数据加密"}],"answer":"A","src":"NISP一级模拟题","srcNum":363,"id":"n1_363","analyze":"大数据的生命周期包括数据采集、数据存储、数据处理、数据分发、数据删除等","expand":"","tags":["NISP一级","单选题"]},{"stem":"对于实际使用的密码系统而言，由于至少存在一种破译方法，即暴力攻击法，因此都不能满足无条件安全性，只能达到计算安全性。下面哪个密码系统没有达到实际安全（）","options":[{"k":"A","t":"破译该密码系统的实际计算量(包括计算时间或费用)巨大。"},{"k":"B","t":"破译该密码系统所需要的计算时间超过被加密信息的生命周期。"},{"k":"C","t":"破译该密码系统的费用超过被加密信息本身的价值。"},{"k":"D","t":"破译该密码系统实际计算量和开销不大。"}],"answer":"D","src":"NISP一级模拟题","srcNum":364,"id":"n1_364","analyze":"密码系统要达到实际安全，就要满足以下准则：（1）破译该密码系统的实际计算量(包括计算时间或费用)巨大，以至于在实际中是无法实现的。（2）破译该密码系统所需要的计算时间超过被加密信息的生命周期。例如，战争中发起战斗攻击的作战命令只需要在战斗打响前保密。（3）破译该密码系统的费用超过被加密信息本身的价值。如果一个密码系统能够满足以上准则之一，就可以认为是实际安全的。","expand":"","tags":["NISP一级","单选题"]},{"stem":"下列选项中对防止垃圾邮件没有作用的是（ ）","options":[{"k":"A","t":"不随意公开邮箱地址"},{"k":"B","t":"使用好邮件管理、黑白名单功能"},{"k":"C","t":"定期备份邮件"},{"k":"D","t":"使用专业的反垃圾邮件软件"}],"answer":"C","src":"NISP一级模拟题","srcNum":365,"id":"n1_365","analyze":"定期备份邮件能防止重要邮件丢失但不能防止垃圾邮件","expand":"","tags":["NISP一级","单选题"]},{"stem":"下列关于垃圾邮件的说法正确的是（ ）","options":[{"k":"A","t":"垃圾邮件是未经用户许可而发送到用户邮件地址的电子邮件"},{"k":"B","t":"邮件内容中包含垃圾字眼的就是垃圾邮件"},{"k":"C","t":"收件人事先预定的广告、电子刊物等具有宣传性质的电子邮件属于垃圾邮件"},{"k":"D","t":"和工作无关的邮件就是垃圾邮件"}],"answer":"A","src":"NISP一级模拟题","srcNum":366,"id":"n1_366","analyze":"垃圾邮件是未经用户许可而发送到用户邮件地址的电子邮件，通常情况下是各类广告、欺骗信息如赚钱、色情、赌博等。","expand":"","tags":["NISP一级","单选题"]},{"stem":"如果将未经处理的信息发布在朋友圈、微博、论坛等社交媒体中可能造成（ ）","options":[{"k":"A","t":"信息泄露"},{"k":"B","t":"信息丢失"},{"k":"C","t":"信息篡改"},{"k":"D","t":"信息拦截"}],"answer":"A","src":"NISP一级模拟题","srcNum":367,"id":"n1_367","analyze":"攻击者可能通过搜索引擎，报纸、杂志、文库等各类媒体，微博、论坛、社交网站等各类社交媒体收集到你的信息，造成信息泄露","expand":"","tags":["NISP一级","单选题"]},{"stem":"当你收到一份邮件时，比较安全的处理办法是（ ）","options":[{"k":"A","t":"确定发件人是否可信，然后使用杀毒软件对附件进行查杀后在查看"},{"k":"B","t":"直接打开附件"},{"k":"C","t":"只要邮件是认识的人发来的，那它就是安全的"},{"k":"D","t":"按照邮件中的要求填写个人详细信息"}],"answer":"A","src":"NISP一级模拟题","srcNum":368,"id":"n1_368","analyze":"确定发件人是否可信后使用杀毒软件对附件进行查杀后在查看可有效的降低安全风险","expand":"","tags":["NISP一级","单选题"]},{"stem":"一个信息管理系统通常会对用户进行分组并实施访问控制。下列选项中，对访问控制的作用的理解错误的是（）。","options":[{"k":"A","t":"对经过身份鉴别后的合法用户提供所有服务"},{"k":"B","t":"在用户对系统资源提供最大限度共享的基础上，对用户的访问权进行管理"},{"k":"C","t":"拒绝非法用户的非授权访问请求"},{"k":"D","t":"防止对信息的非授权篡改和滥用"}],"answer":"A","src":"NISP一级模拟题","srcNum":369,"id":"n1_369","analyze":"访问控制的核心：允许合法用户的授权访问，防止非 用于连接设备、网络及进行相互协商、转换的部件就是网络互联设备，以下不属于网络互联设备的是（）。","options":[{"k":"A","t":"中继器"},{"k":"B","t":"网卡"},{"k":"C","t":"集线器"},{"k":"D","t":"防火墙"}],"answer":"D","src":"NISP一级模拟题","srcNum":376,"id":"n1_376","analyze":"常见的互联设备有：网卡、中继器、集线器、网桥、交换机、路由器、网关。","expand":"","tags":["NISP一级","单选题"]},{"stem":"我们在配置电子邮件客户端时，从安全的角度来看，哪种说法最合适 ( )","options":[{"k":"A","t":"启用电子邮件客户端软件对SSL的支持选项，可以对邮件进行加密和签名"},{"k":"B","t":"不启用电子邮件客户端软件对SSL的支持选项，影响性能"},{"k":"C","t":"不启用电子邮件客户端软件对SSL的支持选项，因为启用后没有区别，浪费时间"},{"k":"D","t":"看情况，一般不需要启用SSL支持选项"}],"answer":"A","src":"NISP一级模拟题","srcNum":377,"id":"n1_377","analyze":"未经加密的邮件很容易被攻击者获取，应该启用电子邮件客户端软件对SSL的支持选项","expand":"","tags":["NISP一级","单选题"]},{"stem":"门禁卡的作用不包括以下哪项（）。","options":[{"k":"A","t":"身份鉴别"},{"k":"B","t":"访问控制"},{"k":"C","t":"定位追踪"},{"k":"D","t":"出入凭证"}],"answer":"C","src":"NISP一级模拟题","srcNum":378,"id":"n1_378","analyze":"门禁卡的作用不包括定位追踪。","expand":"","tags":["NISP一级","单选题"]},{"stem":"以下关于移动互联网安全防护的说法不正确的是（）","options":[{"k":"A","t":"设备/环境安全：设备环境不重要，能运行就可以。"},{"k":"B","t":"业务应用安全：业务管理信息安全和控制信息安全。"},{"k":"C","t":"技术系统安全：信息完整性，保密性，不可否认性。"},{"k":"D","t":"个人隐私保护：不传播非法、违背社会公德、侵犯公民隐私的信息。"}],"answer":"A","src":"NISP一级模拟题","srcNum":379,"id":"n1_379","analyze":"设备/环境安全：设备环境符合标准要求，防攻击防入侵。","expand":"","tags":["NISP一级","单选题"]},{"stem":"集线器的主要功能是对接收到的信号进行再生整形放大，以扩大网络的传输距离，同时把所有节点集中在以它为中心的节点上。下面关于集线器的描述正确的是（）。","options":[{"k":"A","t":"集线器不能延伸网络可操作的距离"},{"k":"B","t":"集线器不能过滤网络流量"},{"k":"C","t":"集线器不能成为中心节点"},{"k":"D","t":"集线器不能放大变弱的信号"}],"answer":"B","src":"NISP一级模拟题","srcNum":380,"id":"n1_380","analyze":"集线器不能过滤网络流量。","expand":"","tags":["NISP一级","单选题"]},{"stem":"分组密码算法是十分重要的密码算法，以下描述错误的是（）。","options":[{"k":"A","t":"分组密码算法要求输入明文按组分成固定长度的块"},{"k":"B","t":"分组密码算法也称为序列密码算法"},{"k":"C","t":"分组密码算法每次计算得到固定长度的密文输出块"},{"k":"D","t":"常见的DES、IDEA算法都属于分组密码算法"}],"answer":"B","src":"NISP一级模拟题","srcNum":381,"id":"n1_381","analyze":"分组密码是在加密过程中将明文进行分组后在进行加密，序列密码又叫流密码对每一个字节进行加密。","expand":"","tags":["NISP一级","单选题"]},{"stem":"邮件炸弹攻击是（ ）","options":[{"k":"A","t":"破坏受害者的邮箱服 const KEY = 'nisp-l1-quiz-v1';

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    return {
      seen: s.seen || {},
      wrong: s.wrong || {},
      removed: s.removed || {},
      answerCount: s.answerCount || 0,
      correctCount: s.correctCount || 0,
      session: s.session || null,
      sessionTs: Number(s.sessionTs) || 0
    };
  } catch (e) {
    return { seen: {}, wrong: {}, removed: {}, answerCount: 0, correctCount: 0, session: null, sessionTs: 0 };
  }
}
let S = load();
let lastMode = 'random';
function save() {
  localStorage.setItem(KEY, JSON.stringify(S));
  if (window.QuizSync) window.QuizSync.schedule();
}

/* ---- 跨设备进度同步（旁路模块：任何网络失败都退回本地，绝不影响答题） ----
 * 每次 push 前先 pull 校准，保证「响应丢失重试」不会重复计数，并能识别云端 reset。

var QuizSync = (function () {

  var SB_URL = 'https://monwlglwpwwbejrifwmj.supabase.co';

  var RPC_PULL = SB_URL + '/rest/v1/rpc/quiz_pull';
  var RPC_PUSH = SB_URL + '/rest/v1/rpc/quiz_push';
  var DEBOUNCE_MS = 1500;
  var RETRY_DELAYS = [2000, 5000, 10000];

  var owner = '';
  var key = '';
  var mode = 'local';          // 'cloud' | 'local'
  var status = 'local';        // 'synced' | 'syncing' | 'local'
  var lastSynced = { seen: {}, wrong: {}, answerCount: 0, correctCount: 0, sessionTs: 0 };
  var queue = null;            // 串行请求队列
  var timer = null;
  var pending = false;
  var stateEl = null;
  var hasBaseline = false;     // 是否已与云端建立过同步基线（首次 pull 不做 reset 判定）
  var sessionChanged = false;  // 本次 merge 是否采纳了云端会话（供 init 决定切到哪个视图）

  function cloneSet(src) {
    var out = {};
    if (src && typeof src === 'object') {
      Object.keys(src).forEach(function (id) { if (src[id]) out[id] = true; });
    }
    return out;
  }

  function setStatus(next) {
    status = next;
    if (!stateEl) stateEl = document.getElementById('syncState');
    if (!stateEl) return;
    var text = '云同步：';
    if (next === 'synced') text += '已同步';
    else if (next === 'syncing') text += '同步中';
    else text += '仅本机';
    if (next === 'local' && mode === 'local') text += ' · 请退出后重新登录一次以启用';
    stateEl.textContent = text;
  }

  // 只落盘，不再触发同步调度（避免 pull/push 回写时自激循环）
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  function refreshUI() {
    try { if (typeof renderHome === 'function') renderHome(); } catch (e) {}
  }

  function baseline() {
    lastSynced = {
      seen: cloneSet(S.seen),
      wrong: cloneSet(S.wrong),
      answerCount: Number(S.answerCount) || 0,
      correctCount: Number(S.correctCount) || 0,
      sessionTs: Number(S.sessionTs) || 0
    };
  }

  function readAuth() {
    try {
      var s = JSON.parse(localStorage.getItem('xinmo_access') || 'null');
      if (!s || typeof s !== 'object') return null;
      var u = typeof s.u === 'string' ? s.u.trim().toLowerCase() : '';
      var k = typeof s.k === 'string' ? s.k : '';
      if (!u || u.length > 64 || !k || k.length < 16) return null;   // 老会话没有 k：降级为仅本机
      // 一级题库用带后缀的 owner，与 NISP 二级题库的云端进度隔离，互不覆盖。
      // 函数限制 owner ≤ 64 字符，故先给后缀留位再截断。
      var suffix = '#n1';
      var owner = u.slice(0, 64 - suffix.length) + suffix;
      return { u: owner, k: k };
    } catch (e) { return null; }
  }

  function request(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SB_KEY,
        Authorization: 'Bearer ' + SB_KEY
      },
      body: JSON.stringify(body),
      cache: 'no-store'
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
  }

  // 失败最多重试 3 次，退避 2s / 5s / 10s（由调用方传入「一次完整尝试」）
  function retrying(fn) {
    var attempt = 0;
    function run() {
      return fn().catch(function (err) {
        if (attempt >= RETRY_DELAYS.length) throw err;
        var delay = RETRY_DELAYS[attempt];
        attempt += 1;
        return new Promise(function (resolve) {
          setTimeout(resolve, delay);
        }).then(run);
      });
    }
    return run();
  }

  /**
   * 把云端快照合并进 S。
   * data 为 null 表示云端还没有该账号记录（把本地当前状态作为基线）。
   * 若「本地已同步的计数 > 云端计数」，只可能是云端被 p_reset 清过 —— 此时全量以云端为准；
   * 首次与云端交互（hasBaseline 为 false）不做该判定，避免误删本地未推送进度。
   */
  function mergeCloud(data, applySession) {
    sessionChanged = false;
    if (!data) {
      // 云端还没有该账号记录：基线留空，这样首次 push 会把本地全部进度当作增量上传
      lastSynced = { seen: {}, wrong: {}, answerCount: 0, correctCount: 0, sessionTs: 0 };
      hasBaseline = true;
      return;
    }
    var cloudSeen = data.seen || {};
    var cloudWrong = data.wrong || {};
    var cloudAnswer = Number(data.answerCount) || 0;
    var cloudCorrect = Number(data.correctCount) || 0;
    var wasReset = hasBaseline && (Number(lastSynced.answerCount) || 0) > cloudAnswer;

    if (wasReset) {
      // 云端被重置：本地旧进度整体作废，全量以云端为准
      S.removed = {};
      S.seen = {};
      Object.keys(cloudSeen).forEach(function (id) { if (cloudSeen[id]) S.seen[id] = true; });
      S.wrong = {};
      Object.keys(cloudWrong).forEach(function (id) { if (cloudWrong[id]) S.wrong[id] = true; });
      S.answerCount = cloudAnswer;
      S.correctCount = cloudCorrect;
    } else {
      // seen 只增不减：直接并集
      Object.keys(cloudSeen).forEach(function (id) { if (cloudSeen[id]) S.seen[id] = true; });
      // wrong 以云端为准（别处已清空的错题不会被并集加回来），
      // 但保留「本地新增且尚未推送」的错题，避免丢本地进度
      var pendingWrong = {};
      Object.keys(S.wrong).forEach(function (id) {
        if (S.wrong[id] && !lastSynced.wrong[id]) pendingWrong[id] = true;
      });
      var mergedWrong = {};
      // 本地刚删除（尚未推送）的错题不要从云端合并回来（删除意图持久化在 S.removed）
      Object.keys(cloudWrong).forEach(function (id) {
        if (cloudWrong[id] && !(S.removed || {})[id]) mergedWrong[id] = true;
      });
      Object.keys(pendingWrong).forEach(function (id) { mergedWrong[id] = true; });
      S.wrong = mergedWrong;
      // 计数取两端较大值：本地尚未推送的增量随后由 push 的 delta 补上
      S.answerCount = Math.max(Number(S.answerCount) || 0, cloudAnswer);
      S.correctCount = Math.max(Number(S.correctCount) || 0, cloudCorrect);
    }

    // 练习会话（session）合并：LWW，只有云端时间戳更新才采纳（数据来自云端快照）。
    // 且只在 applySession 为 true（页面初始化时的 pull）生效 —— push 前的校准绝不能把
    // 用户正在做的题换掉。
    if (applySession === true) {
      var cloudSessionTs = Number(data.sessionTs || 0);
      var localSessionTs = Number(S.sessionTs || 0);
      if (cloudSessionTs > localSessionTs) {
        S.session = data.session || null;
        S.sessionTs = cloudSessionTs;
        sessionChanged = true;
      } else if (hasBaseline && Number(lastSynced.sessionTs || 0) > 0 &&
                 cloudSessionTs === 0 && data.session == null && localSessionTs > 0) {
        // 只有「确实同步过、且云端曾经有过会话、现在被清零」才认定是另一台设备 resetAll：
        // 首次启用（hasBaseline=false 或 lastSynced.sessionTs===0）一律不清本地会话
        S.session = null;
        S.sessionTs = 0;
        sessionChanged = true;
      }
    }

    // 同步基线取「云端快照」：push 的 delta 始终等于「本地 - 云端」，
    // 本地尚未推送的增量才不会被 baseline 吃掉
    lastSynced = {
      seen: cloneSet(cloudSeen),
      wrong: cloneSet(cloudWrong),
      answerCount: cloudAnswer,
      correctCount: cloudCorrect,
      sessionTs: Number(data.sessionTs) || 0
    };
    hasBaseline = true;
    persist();
    refreshUI();
  }

  // 单次拉取（不含重试、不改状态位）；applySession 控制是否允许用云端会话覆盖本地
  function pullOnce(applySession) {
    return request(RPC_PULL, { p_owner: owner, p_key: key }).then(function (data) {
      mergeCloud(data, applySession === true);
    });
  }

  // 页面加载 / 手动拉取：带重试与状态位；默认允许采纳云端会话
  function pull(applySession) {
    if (mode !== 'cloud') return Promise.resolve();
    setStatus('syncing');
    return retrying(function () { return pullOnce(applySession !== false); }).then(function () {
      setStatus('synced');
    }).catch(function () {
      setStatus('local');
    });
  }

  // 静默拉取：不改状态位、不弹提示；失败则 reject，调用方据此放弃本次 push。
  // 注意：push 前的校准绝不采纳云端会话（applySession=false），避免打断正在答题的用户。
  function pullSilent() {
    if (mode !== 'cloud') return Promise.reject(new Error('local-mode'));
    return pullOnce(false);
  }

  // 用当前 baseline 计算增量并单次推送（不含重试）
  function pushOnce(options) {
    var opt = options || {};
    var seen = S.seen || {};
    var wrong = S.wrong || {};
    var seenAdd = {};
    var wrongAdd = {};
    // 待删除的错题 id 来自持久化的 S.removed（刷新后仍在）；为空时传 []，绝不传 null
    var wrongRemove = Object.keys(S.removed || {});

    Object.keys(seen).forEach(function (id) { if (seen[id] && !lastSynced.seen[id]) seenAdd[id] = true; });
    Object.keys(wrong).forEach(function (id) { if (wrong[id] && !lastSynced.wrong[id]) wrongAdd[id] = true; });

    // 只上传未推送的增量，避免多设备重复计数
    var dAnswer = Math.max(0, (Number(S.answerCount) || 0) - (Number(lastSynced.answerCount) || 0));
    var dCorrect = Math.max(0, (Number(S.correctCount) || 0) - (Number(lastSynced.correctCount) || 0));

    var body = {
      p_owner: owner,
      p_key: key,
      p_seen_add: seenAdd,
      p_wrong_add: wrongAdd,
      p_wrong_remove: wrongRemove,
      p_delta_answer: dAnswer,
      p_delta_correct: dCorrect,
      p_reset: opt.reset === true,
      p_session: S.session || null,
      p_session_ts: Number(S.sessionTs) || 0
    };

    return request(RPC_PUSH, body).then(function (data) {
      if (data) {
        var cloudSeen = data.seen || {};
        var cloudWrong = data.wrong || {};
        Object.keys(cloudSeen).forEach(function (id) { if (cloudSeen[id]) S.seen[id] = true; });
        // 本次 push 已把所有本地增量送达云端，wrong 直接以云端为准（reset / 别处清空能生效）
        var nextWrong = {};
        Object.keys(cloudWrong).forEach(function (id) { if (cloudWrong[id]) nextWrong[id] = true; });
        S.wrong = nextWrong;
        S.answerCount = Number(data.answerCount) || 0;
        S.correctCount = Number(data.correctCount) || 0;
      }
      S.removed = {};          // 删除意图已被云端接受，落盘清空
      hasBaseline = true;
      baseline();
      persist();
      refreshUI();
    });
  }

  /**
   * 对外同步入口：每次尝试都「先静默 pull 校准 baseline → 再重算 delta 推送」。
   * 即使上一次请求已被服务端提交、只是响应丢失，重试时 delta 也会自动归零，天然幂等。
   * pullSilent 失败则整次放弃（绝不带过期 baseline 硬推），只把状态置为「仅本机」。
   */
  function syncNow(options) {
    if (mode !== 'cloud') return Promise.resolve();
    var opt = options || {};
    setStatus('syncing');
    return retrying(function () {
      return pullSilent().then(function () { return pushOnce(opt); });
    }).then(function () {
      setStatus('synced');
    }).catch(function () {
      setStatus('local');
    });
  }

  function enqueue(task) {
    if (!queue) queue = Promise.resolve();
    queue = queue.then(function () {
      if (mode !== 'cloud') return null;
      return task().catch(function () { return null; });
    });
    return queue;
  }

  function cancelTimer() {
    if (timer) { clearTimeout(timer); timer = null; }
    pending = false;
  }

  function schedule() {
    if (mode !== 'cloud') return;
    pending = true;
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      timer = null;
      if (!pending) return;
      pending = false;
      enqueue(function () { return syncNow(); });
    }, DEBOUNCE_MS);
  }

  function flush() {
    if (mode !== 'cloud') return;
    if (!pending) return;
    cancelTimer();
    enqueue(function () { return syncNow(); });
  }

  // resetWrong：把当前错题 id 并入持久化的 S.removed，再清空 S.wrong（刷新后删除意图仍在）
  function resetWrong() {
    if (mode !== 'cloud') return;
    cancelTimer();
    if (Object.keys(S.wrong || {}).length) {
      S.removed = Object.assign({}, S.removed, S.wrong);
      S.wrong = {};
      persist();
    }
    enqueue(function () { return syncNow(); });
  }

  // resetAll：整库重置（全量覆盖，无需先 pull；重复执行结果相同，天然幂等）
  function resetRemote() {
    if (mode !== 'cloud') return;
    cancelTimer();
    enqueue(function () {
      setStatus('syncing');
      return retrying(function () { return pushOnce({ reset: true }); }).then(function () {
        setStatus('synced');
      }).catch(function () {
        setStatus('local');
      });
    });
  }

  function init() {
    stateEl = document.getElementById('syncState');
    var auth = readAuth();
    if (!auth) {
      mode = 'local';
      setStatus('local');
      return;
    }
    owner = auth.u;
    key = auth.k;
    mode = 'cloud';
    baseline();
    setStatus('syncing');
    enqueue(function () {
      return pull(true).then(function () {
        if (!sessionChanged) return;
        sessionChanged = false;
        // 云端会话更新：直接切到对应视图；session 为 null 表示另一台设备 resetAll 了
        if (S.session) {
          lastMode = S.session.mode || 'random';
          renderQuiz();   // i >= ids.length 时内部会走 renderDone（结果页）
        } else {
          renderHome();
          show('homeView');
        }
      });
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') flush();
    });
    window.addEventListener('pagehide', function () { flush(); });
  }

  init();

  return {
    schedule: schedule,
    flush: flush,
    resetWrong: resetWrong,
    resetRemote: resetRemote,
    pull: pull,
    push: syncNow,
    status: function () { return status; },
    mode: function () { return mode; },
    sessionChanged: function () { return sessionChanged; }
  };
})();

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('zh-CN');
const wrongIds = () => Object.keys(S.wrong);
const seenCount = () => Object.keys(S.seen).length;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function show(view) {
  ['homeView', 'quizView', 'doneView'].forEach(v => $(v).classList.toggle('hidden', v !== view));
}

function renderHome() {
  $('sTotal').textContent = fmt(DATA.length);
  $('sSeen').textContent = fmt(seenCount());
  $('sWrong').textContent = fmt(wrongIds().length);
  $('sRate').textContent = S.answerCount ? Math.round(S.correctCount / S.answerCount * 100) + '%' : '—';
  const left = DATA.length - seenCount();
  $('startRandomLabel').textContent = left > 0 ? '开始随机练习' : '开始新一轮练习';
  $('startRandomMeta').textContent = left > 0 ? `剩余 ${fmt(left)} 题未练` : '题库已全部练过';
  const w = wrongIds().length;
  $('wrongMeta').textContent = w ? `${fmt(w)} 题待巩固` : '暂无错题';
  $('startWrong').disabled = w === 0;
  $('homeTip').textContent = S.session && S.session.i < S.session.ids.length
    ? '有一轮练习尚未完成，点击上方按钮可继续。'
    : '';
}

function newSession(mode) {
  let ids;
  if (mode === 'wrong') {
    ids = shuffle(wrongIds());
  } else {
    ids = shuffle(DATA.map(q => q.id).filter(id => !S.seen[id]));
    if (!ids.length) ids = shuffle(DATA.map(q => q.id));
  }
  S.session = { mode, ids, i: 0, right: 0, bad: 0, answered: false, selected: null };
  S.sessionTs = Date.now();   // 只有会话真变化才 bump，避免无变化的 save 覆盖另一台设备
  save();
  renderQuiz();
}

function renderQuiz() {
  const sess = S.session;
  if (!sess || sess.i >= sess.ids.length) { renderDone(); return; }
  const q = byId[sess.ids[sess.i]];
  if (!q) { sess.i++; save(); return renderQuiz(); }
  show('quizView');
  $('modeBadge').textContent = sess.mode === 'wrong' ? '错题重练' : '随机练习';
  $('modeBadge').className = 'badge' + (sess.mode === 'wrong' ? ' mode-wrong' : '');
  $('qCounter').textContent = `${sess.i + 1} / ${sess.ids.length}`;
  $('qScore').textContent = sess.i ? `本轮 ✓${sess.right}  ✗${sess.bad}` : '';
  $('progressBar').style.width = (sess.i / sess.ids.length * 100) + '%';
  $('qSource').textContent = `${q.src} · 原第 ${q.srcNum} 题`;
  $('qStem').textContent = q.stem;

  // 选项按题库原始 A/B/C/D 顺序显示，不再随机重排：
  // 答案字母与精讲解析中的字母引用均以原顺序为准，避免「正确答案 B」
  // 与屏幕上 B 选项内容不一致。题目顺序仍保持随机抽取。
  const box = $('options');
  box.innerHTML = '';
  q.options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.dataset.k = o.k;
    b.innerHTML = `<span class="opt-key">${o.k}</span><span>${escapeHtml(o.t)}</span>`;
    b.onclick = () => pick(o.k);
    box.appendChild(b);
  });

  $('nextBtn').disabled = !sess.answered;
  $('nextBtn').textContent = sess.i === sess.ids.length - 1 ? '查看结果' : '下一题';
  $('hint').textContent = '键盘 A–D 或 1–4 选答案，回车下一题';
  $('feedback').className = 'feedback';
  $('feedback').textContent = '';
  $('explain').classList.add('hidden');
  $('explain').innerHTML = '';
  if (sess.answered) paintAnswer(sess.selected, q);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function paintAnswer(selected, q) {
  const sess = S.session;
  const buttons = [...$('options').children];
  buttons.forEach(b => {
    b.classList.add('locked');
    b.onclick = null;
    const k = b.dataset.k;
    if (k === q.answer) b.classList.add('right');
    if (k === selected && selected !== q.answer) b.classList.add('wrong');
  });
  const fb = $('feedback');
  const ansText = q.options.find(o => o.k === q.answer).t;
  if (selected === q.answer) {
    fb.className = 'feedback ok';
    fb.textContent = '回答正确';
    $('explain').classList.add('hidden');
    $('explain').innerHTML = '';
  } else {
    if (selected) {
      fb.className = 'feedback no';
      fb.innerHTML = `回答错误　正确答案 <span class="ans">${q.answer}. ${escapeHtml(ansText)}</span>`;
    } else {
      fb.className = 'feedback no';
      fb.innerHTML = `本题未作答　正确答案 <span class="ans">${q.answer}. ${escapeHtml(ansText)}</span>`;
    }
    showExplain(q);
  }
  $('nextBtn').disabled = false;
}

function showExplain(q) {
  const el = $('explain');
  const ansText = q.options.find(o => o.k === q.answer).t;
  const tags = (q.tags || []).join(' · ');
  el.innerHTML =
    `<div class="ex-head"><span class="ex-badge">精讲</span>` +
    `<span class="ex-ans">正确答案 ${q.answer}. ${escapeHtml(ansText)}</span></div>` +
    `<div class="ex-row"><b>解析</b><span>${escapeHtml(q.analyze || '暂无解析')}</span></div>` +
    `<div class="ex-row extend"><b>延伸</b><span>${escapeHtml(q.expand || '暂无延伸')}</span></div>` +
    (tags ? `<div class="ex-tags">知识点：${escapeHtml(tags)}</div>` : '');
  el.classList.remove('hidden');
}

function pick(k) {
  const sess = S.session;
  if (!sess || sess.answered) return;
  const q = byId[sess.ids[sess.i]];
  sess.answered = true;
  sess.selected = k;
  S.answerCount++;
  if (k === q.answer) {
    sess.right++;
    S.correctCount++;
    if (sess.mode === 'wrong') delete S.wrong[q.id];
  } else {
    sess.bad++;
    S.wrong[q.id] = (S.wrong[q.id] || 0) + 1;
  }
  S.seen[q.id] = true;
  S.sessionTs = Date.now();   // 会话状态（已答 / 选项 / 对错）变了
  save();
  paintAnswer(k, q);
  $('qScore').textContent = `本轮 ✓${sess.right}  ✗${sess.bad}`;
}

function nextQuestion() {
  const sess = S.session;
  if (!sess) return renderHome();
  if (!sess.answered) return;
  sess.i++;
  sess.answered = false;
  sess.selected = null;
  S.sessionTs = Date.now();   // 推进到下一题
  save();
  if (sess.i >= sess.ids.length) renderDone(); else renderQuiz();
}

function renderDone() {
  const sess = S.session || { right: 0, bad: 0, ids: [], i: 0, mode: 'random' };
  lastMode = sess.mode;
  const total = sess.right + sess.bad;
  show('doneView');
  $('doneTitle').textContent = sess.mode === 'wrong' ? '错题重练完成' : '本轮练习完成';
  const left = DATA.length - seenCount();
  $('doneText').textContent = sess.mode === 'wrong'
    ? `还剩 ${fmt(wrongIds().length)} 道错题，答对的题已从错题本移除。`
    : (left > 0 ? `题库还剩 ${fmt(left)} 道未练，继续随机抽题吧。` : '整本题库都练过一轮了，可以开始新一轮。');
  $('doneRight').textContent = fmt(sess.right);
  $('doneWrong').textContent = fmt(sess.bad);
  $('doneRate').textContent = total ? Math.round(sess.right / total * 100) + '%' : '—';
  const again = $('againBtn');
  again.innerHTML = sess.mode === 'wrong'
    ? `<span>再练一轮错题</span><small>${fmt(wrongIds().length)} 题</small>`
    : `<span>继续随机练习</span><small>剩余 ${fmt(left)} 题</small>`;
  again.disabled = sess.mode === 'wrong' && wrongIds().length === 0;
  S.sessionTs = Date.now();   // 让服务端 LWW 接受这次 null（否则另一台设备会停在最后一题）
  S.session = null;
  save();
}

// 事件绑定
$('startRandom').onclick = () => newSession('random');
$('startWrong').onclick = () => newSession('wrong');
$('nextBtn').onclick = nextQuestion;
$('againBtn').onclick = () => newSession(lastMode);
$('doneHome').onclick = () => { renderHome(); show('homeView'); };
$('homeBtn').onclick = () => { renderHome(); show('homeView'); };
$('resetWrong').onclick = () => {
  if (!wrongIds().length) return;
  if (confirm('确定清空错题本吗？已练记录与统计不会清除。')) {
    // 删除意图先持久化到 S.removed，否则刷新后会被云端并集加回来
    S.removed = Object.assign({}, S.removed, S.wrong);
    S.wrong = {};
    save();
    renderHome();
    if (window.QuizSync) window.QuizSync.resetWrong();
  }
};
$('resetAll').onclick = () => {
  if (confirm('确定重置全部进度吗？已练记录、错题本、正确率都会清空。')) {
    localStorage.removeItem(KEY);
    S = { seen: {}, wrong: {}, removed: {}, answerCount: 0, correctCount: 0, session: null, sessionTs: 0 };
    renderHome();
    show('homeView');
    if (window.QuizSync) window.QuizSync.resetRemote();
  }
};

document.addEventListener('keydown', e => {
  if ($('quizView').classList.contains('hidden')) return;
  const sess = S.session;
  if (!sess) return;
  const key = e.key.toUpperCase();
  if (!sess.answered) {
    const q = byId[sess.ids[sess.i]];
    const idx = 'ABCD'.indexOf(key);
    const alt = '1234'.indexOf(e.key);
    const byLetter = idx >= 0 ? q.options.find(o => o.k === 'ABCD'[idx]) : null;
    const byNumber = alt >= 0 ? q.options[alt] : null;
    if (byLetter) pick(byLetter.k);
    else if (byNumber) pick(byNumber.k);
    else return;
    e.preventDefault();
  } else if (e.key === 'Enter' || e.key === ' ' || key === 'N') {
    nextQuestion();
    e.preventDefault();
  }
});

// 启动
if (S.session && S.session.i < S.session.ids.length && byId[S.session.ids[S.session.i]]) {
  renderQuiz();
} else {
  S.sessionTs = Date.now();   // 让服务端 LWW 接受这次 null（否则另一台设备会停在最后一题）
  S.session = null;
  save();
  renderHome();
  show('homeView');
}
</script>
